  q: ルールを公開すると、最適化が遊びを壊すか
  why: オンチェーンではルールもコードも公開される。完全な情報は最適解の発見を早め、遊びを作業や自動化に変え得る。
  labels: {support: 最適化が遊びを壊した・歪めた, counter: 最適化そのものを遊びにできた}
  cases:
