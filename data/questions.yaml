- id: q-acq-paid-stay
  topic: acquisition
  q: お金の誘因で集めた人は残るか
  why: トークン・ポイント・エアドロップ期待・紹介報酬は最初の流入を最も速く作れるが、ボットと多重アカウントを呼ぶ。誘因が終わったときに何が残るかが分からなければ、獲得の成否を判断できない。
  labels: {support: 誘因の終了・縮小後も一定の集団が残った, counter: 誘因が終わると大きく縮んだ}
  answer: >-
    確認できた事例では、誘因で起きた急増は誘因の終了・縮小後に数分の一以下に縮み、運営自身がボット・多重アカウントを認めた例が多い（Hamster Kombat、Pixels、Conquest.eth、Sunflower Farmers）。
    残った例は、入口を絞って作り直した Sunflower Land（2026 年まで継続、運営は累計 60 万超の農場）と、報酬対象を絞った後に日次 4 万超で「安定」とした Pixels で、どちらもピークよりずっと小さい集団だった。
    残った人が誘因で来た人と同じ人かは、どの事例でも示されていない。
  cases:
    - {game: sunflower-land, stance: support, note: "ボットで止まった後、ホワイトリストと 1 Discord＝1 アドレスで再開し、開発は 2026 年まで続いた（運営は累計 60 万超の農場と述べる）。", s: [src-sunflower-land-code-beta-2022, src-sunflower-land-docs-about]}
    - {game: pixels, stance: support, note: "報酬対象を絞った後の急落を経て、2025-06 に日次 4 万超で「安定」と自社ブログが伝えた。", s: [src-pixels-post-stabilized]}
    - {game: hamster-kombat, stance: counter, note: "配布前に 230 万超を BAN し、配布後の月間利用者は 1 億超から 2025-02 に 1,168 万とされた。", s: [src-hamster-kombat-decrypt-purge, src-hamster-kombat-decrypt-alltime-low, src-hamster-kombat-bitpinas-s2]}
    - {game: pixels, stance: counter, note: "1 週間で 75 万アカウントの BAN を発表し、報酬対象を絞った Chapter 2 の直後に日次ウォレットは約 7 割減った。", s: [src-pixels-ct-bots, src-pixels-bg-ch2-drop]}
    - {game: stepn, stance: counter, note: "第三者集計の MAU は 2022-05 の 70 万超から 2022-12 に 4.5 万弱へ減った。", s: [src-stepn-decrypt-2023]}
    - {game: pirate-nation, stance: counter, note: "ポイント・トークン配布期の後、日次アクティブウォレットはピーク 10 万超から約 1 万へ減り、2025-09 に終了した。", s: [src-pn-bcg-kill]}
    - {game: defi-kingdoms, stance: counter, note: "高 APR の流動性マイニングで集めた TVL は 2022-01 の約 9.0 億ドルから 2022-06 に約 4,400 万ドルへ 95% 減った（価格効果を含む）。", s: [src-defi-kingdoms-llama]}
    - {game: conquest-eth, stance: counter, note: "過去最多のトークンを配った Faction 版で複数アカウントが多発し、2025-1 版のイベントログは開始直後に集中した後ほぼゼロになった。", s: [src-conquest-future-2026, src-conquest-gnosis-logs]}
    - {game: loot-survivor, stance: context, note: "LS2 は約 8 万アドレスに計約 50 万回の無料ゲームを用意したが、2026-10 の直近 7 日のアクティブアドレスは 411（growthepie）。配布先のうち何割が遊んだかは示されていない。", s: [src-ls-docs-token, src-ls-growthepie]}
  insights: [ins-acq-paid-surge, ins-acq-invite-throttle, ins-reward-metrics-misread]
  open: "誘因で入ったコホートを誘因の終了後まで人単位で追い、ボットと人間を分けて残存率を示した公開データはない。"
