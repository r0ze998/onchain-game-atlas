- id: q-acq-first-100
  topic: acquisition
  q: 最初の 100 人をどこから連れてくるか
  why: 試合が成立し経済が回るには最低限の人数が要る。最初の 100 人の出どころは、その後の指標が何を測るか（遊びの需要か、報酬か、手元の資産の利得か）まで決める。
  labels: {support: 既存の集まりや少人数の招待で最初の集団を作れた, counter: 集め方の効果を確認できない・集まった人が遊ばなかった}
  answer: >-
    acquisition 節のある 52 件のうち 35 件で、最初の利用者は既存の集まり（前作・同じチームの保有者、トークン・NFT の保有者、研究者、チェーンの利用者）から借りられた。100 人規模の具体例は、
    Sky Strife（2 週間で 100 人の目標を 2 日目に達成し最終 355 人、運営発表）、Dark Forest v0.3（Ethereum・ZK のコミュニティへの招待鍵で約 300 人）、Primodium（WASD の参加を伴い 6 日間で 300 人超）、
    Words3（自前のコミュニティと X で Base 版 124 人、自己申告）、Freysa（参加費が積み上がる懸賞で 195 人、経路は不明）。一方、Topology はパズルで 50 人を選んだが遊んだのは約 13 人、Etherization は開始した 28 アドレスの半数がデプロイ者の資金に連なっていた。
    どの事例も人数はアカウント・アドレス単位で、最初の 100 人のうち何人が残ったかは示されていない。
  cases:
    - {game: sky-strife, stance: support, note: "2 週間の公開プレイテストで 100 ユニークユーザーを目標にし、2 日目に達成、最終的に 355 人（運営発表。単位は不明）。1 日 3 回の無料試合を運営が用意し、ggQuest などのコミュニティが大会を開いた。", s: [src-sky-strife-orbs-blog, src-sky-strife-playtest]}
    - {game: dark-forest, stance: support, note: "v0.3 は Ethereum と ZK のコミュニティに招待鍵を配る半非公開ベータとして約 300 人で始まり、v0.4 は約 600 人だった。", s: [src-df-v3-rules, src-df-v4-recap]}
    - {game: primodium, stance: support, note: "WASD が公式ウォレットで参加し、プレイヤーの記事は v0.7.1 が 6 日間で 300 人超を集めたと書いた。", s: [src-primodium-wasd]}
    - {game: words3, stance: support, note: "チームは Base 版のユニークプレイヤーを 124 人とし、利用者の 8 割超が初めて OP 系チェーンへブリッジしたと申告した（自己申告で、124 はアドレス数とみられる）。", s: [src-words3-rpgf3]}
