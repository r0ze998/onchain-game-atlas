id: fomo3d
name: Fomo3D
name_ja: フォモ・スリーディー
aliases: [FoMo3D, "FOMO3D Long", "FoMo3D Long Official", F3D, exitscam.me]
kind: game
depth: deep
updated: "2026-10-24"
links:
  website: https://exitscam.me/
  discord: https://discord.gg/DbapvnH
ids:
  defillama: fomo3d
chains: [Ethereum mainnet]
team: "Team JUST（匿名。コントラクトのヘッダには Inventor / Justo / Sumpunk / Mantso と「© Jekyll Island Inc. 2018」。PoWH3D（P3D）と同じチーム）"
summary: >-
  2018 年 7 月に Ethereum 上で始まった、最後に「キー」を買った者が賞金プールの 48% を得るタイマー型のゲーム。キー購入ごとに残り時間が 30 秒延び（上限 24 時間）、
  購入額の一部は既存のキー保有者に配当として即時に分配される。公式自ら「出口詐欺（exit scam）のシミュレーション」「強欲の社会実験」と称した。
  第 1 ラウンドは 2018-08-22、ブロックを高額ガスの無意味な取引で埋めて他者の購入を締め出す「ブロック詰め（block stuffing）」によって 10,469 ETH で決着し、
  第 2 ラウンドも同じ手口で終わったと分析されている。公開された決定的ルールの上で、ゲームの外側（ブロック生成とガス市場）が勝敗を決めた代表例。
selection_reason: >-
  m-last-buyer（最終購入者総取り）と配当の組み合わせを、改変不能なコントラクトで大規模に実行した事例であり、
  (1) オンチェーンのルールが「完全に公開されている」ことが攻撃者に最適化の余地を与えたこと、(2) 乱数・人間判定（isHuman）の脆弱性と模倣品の連鎖、
  (3) ラウンドを重ねるごとの急激な縮小、を一次資料（コントラクト、トランザクション、セキュリティ分析、論文）で追えるから。
  ゲームとして面白かったかではなく、オンチェーンでの「終わり方」の設計に関する反証として重要。
categories:
  - {id: onchain-rules, role: primary, reason: "キー価格、タイマー延長、配当、ラウンド終了と賞金分配がすべてコントラクト内で実行される"}
  - {id: p2e, role: secondary, reason: "参加者の資金を参加者に再分配する賭博・ポンジ型の資金循環（運営は手数料を得る）。Play-to-Earn の前史として、報酬の原資が後続参加者だけである構造の典型"}
  - {id: infra, role: secondary, reason: "決着がブロックのガス上限・ガス価格オークション・採掘者の取引選択に依存した"}
status:
  value: dormant
  as_of: "2026-10"
  note: >-
    コントラクト（FoMo3D Long）は Ethereum 上に残り、参照日時点で残高約 1,094 ETH、取引数 246,135 件を Etherscan で確認した。
    第 3 ラウンド（2018-10 には賞金プール約 103 ETH）以後の公式な活動は確認できなかった。公式サイト exitscam.me は宣伝ページとして残るが、ラウンド情報は表示されていない。
  s: [src-fomo3d-etherscan-contract, src-fomo3d-secbit-solution, src-fomo3d-exitscam-site]
dates:
  launched: {date: "2018-07-06", s: [src-fomo3d-etherscan-deploy], note: "FoMo3D Long のデプロイ日（UTC）。プレイ開始は activate() 後で、正確な開始時刻は未確認"}

architecture:
  onchain:
    level: all
    detail: >-
      キーの購入（価格曲線は F3DKeysCalcLong）、タイマー（初期 1 時間、1 キーごとに 30 秒延長、最大 24 時間）、チーム別の手数料配分（配当・P3D・紹介料・コミュニティ 2%・エアドロップ 1%）、
      ラウンド終了時の分配（勝者 48%、コミュニティ 2%、残りを配当・P3D・次ラウンドへ）、エアドロップ抽選、出金がすべてコントラクトで実行される。
      ラウンドの終了は時間切れ後に誰かが取引を送ったときに endRound が走る形で実装され、時間切れそのものはブロックのタイムスタンプで判定される。
    s: [src-fomo3d-source, src-fomo3d-ethresearch]
  offchain:
    - {item: "公式 Web UI（exitscam.me）と紹介リンク・名前登録（PlayerBook コントラクトと連携）", s: [src-fomo3d-exitscam-site, src-fomo3d-source]}
    - {item: "取引の順序はチェーン外のガス価格オークションと採掘者の選択で決まり、これが第 1・第 2 ラウンドの決着を左右した", s: [src-fomo3d-solmaz, src-fomo3d-sok-frontrunning]}
    - {item: "ラウンド前の準備期間の長さ（rndGap_）を返す外部設定コントラクト F3DexternalSettings はソースが公開されておらず、第三者がオンチェーンの値から再構成した", s: [src-fomo3d-source]}
  admin:
    level: limited
    detail: >-
      activate() はハードコードされた 5 つのアドレス（Team JUST）だけが一度だけ呼べ、別の FoMo3D コントラクトとの相互リンクも初期設定で行う。
      本調査で読んだソースには、運営が賞金プールを引き出す関数や一時停止は見当たらず、運営も「資金を管理できない」と主張した。
      ただし外部設定コントラクトのソースは非公開で、その振る舞いは第三者がオンチェーンの返り値から推定したものにとどまる。
    s: [src-fomo3d-source, src-fomo3d-financemagnates]
  open_source:
    level: partial
    detail: >-
      本体 FoMo3Dlong は Etherscan で検証済み（Exact Match、Solidity 0.4.24）。本調査では Etherscan のソースタブを直接読めず、公式ソースを集約したとする第三者リポジトリ（reedhong/fomo3d_clone）で読んだ。
      F3DexternalSettings はソース非公開。Hackernoon の編集注は 2018-08-02 時点でコードが完全には検証されていないと記す。
    url: "https://etherscan.io/address/0xA62142888ABa8370742bE823c1782D17A0389Da1#code"
    s: [src-fomo3d-etherscan-contract, src-fomo3d-source, src-fomo3d-hackernoon-attrition]
  extensibility:
    level: none
    detail: >-
      ゲームのルールを第三者が拡張する仕組みはない。実際に起きた「拡張」は、コードを複製した模倣ゲーム（Last Winner 等）と、
      エアドロップ抽選を予測して当たるときだけ購入する攻撃コントラクト、ブロック詰め用コントラクトだった。
    s: [src-fomo3d-secbit-odaily, src-fomo3d-secbit-solution, src-fomo3d-solmaz]

compare:
  gameplay: {t: "ETH でキーを買うとタイマーが 30 秒延び（最大 24 時間）、自分が「最後の購入者」になる。時間切れの時点の最後の購入者がプールの 48% を得る。保有キーに応じて後続の購入から配当が入り、購入時に選ぶ 4 チームで配分比率が変わる。", k: fact, s: [src-fomo3d-source, src-fomo3d-financemagnates]}
  necessity: {t: "運営が資金を持ち逃げできないこと（「出口詐欺」をコードで不可能にすること）が唯一の差別化であり、その点でチェーンは必然だった。ただし決着はコントラクトの外側（ブロック内の取引選択）で決まり、改変不能性は公平な終了を保証しなかった。", k: analysis, s: [src-fomo3d-financemagnates, src-fomo3d-sok-frontrunning]}
  information: {t: "残り時間・プール・最後の購入者・コントラクトの状態がすべて公開されており、攻撃者は getCurrentRoundInfo() で状態を読んでから自分の取引の成否を決められた。エアドロップの乱数もブロック情報と送信者アドレスから計算でき予測可能だった。", k: fact, s: [src-fomo3d-secbit-solution, src-fomo3d-source]}
  persistence: {t: "コントラクトは停止機能なしで残り続け、運営がいなくても出金や新ラウンドの開始は取引を送れば可能。参照日時点でも約 1,094 ETH が残っている。", k: fact, s: [src-fomo3d-etherscan-contract, src-fomo3d-source]}
  extensibility: {t: "公式の拡張手段はない。コードの複製による模倣品が多数作られた。", k: fact, s: [src-fomo3d-inside, src-fomo3d-secbit-odaily]}
  money_flow: {t: "資金の原資は参加者の ETH のみ。購入額は配当（キー保有者）、賞金プール、P3D 保有者、紹介者、コミュニティ（2%）、エアドロップ（1%）に分かれ、ラウンド終了時にプールの 48% が勝者へ。新規購入が止まれば配当も止まる。", k: fact, s: [src-fomo3d-source, src-fomo3d-ethresearch]}
  entry_barrier: {t: "Ethereum ウォレット、ETH、ガス代が必要。最初の 100 ETH が集まるまでは 1 人あたり 1 ETH までに制限する反クジラ規則があった。勝つためには、ガス市場とブロック生成の理解が事実上必要だった。", k: fact, s: [src-fomo3d-source, src-fomo3d-solmaz]}

concepts: [m-last-buyer, c-onchain-rules, c-onchain-state, c-onchain-randomness, e-entry-fee-prize, m-seasons, m-bot-automation]
proposed_concepts:
  - {id: c-block-stuffing, name: ブロック詰め・取引抑圧, desc: "高いガス価格の取引でブロックの容量を埋め、他者の取引が一定時間取り込まれないようにする。期限付きの状態を持つコントラクトの決着を操作する。"}
  - {id: e-dividend-ponzi, name: 後続参加者による配当, desc: "新規参加者の支払いを既存参加者に配当として即時分配する。成長が止まると配当も止まる。"}

article:
  what:
    - {t: "プレイヤーは ETH で「キー」を買う。キーは売却できるトークンではなく、賞金プールの取り分と配当の権利を表す。購入のたびにタイマーが延び、価格は少しずつ上がる。", k: fact, s: [src-fomo3d-exitscam-site, src-fomo3d-survey-2019]}
    - {t: "残り時間が 0 になったときに最後に買った人がプールの 48% を得る。公式サイトは最後の購入者の名前の横に「is EXIT SCAMMING」と表示した。", k: fact, s: [src-fomo3d-source, src-fomo3d-financemagnates]}
    - {t: "購入時に 4 つのチームのいずれかを選び、それによって購入額のうち配当に回る割合と、ラウンド終了時の残りの配分（次ラウンド繰越・P3D）が変わる。", k: fact, s: [src-fomo3d-source]}
    - {t: "0.1 ETH 以上の購入はエアドロップ抽選の対象となり、当たると小さなエアドロップ用プールの一部を得る。", k: fact, s: [src-fomo3d-source]}
    - {t: "運営は自らを「強欲についての心理的社会実験」と呼んだ。", k: claim, who: "Team JUST", s: [src-fomo3d-financemagnates, src-fomo3d-vice]}
  loop:
    - {t: "以下はコントラクトのソースと当時の報道からの再構成（筆者は実プレイしていない）。exitscam.me でウォレットを接続し、チームを選び、キーを何個買うか決めて購入トランザクションを送る。", k: fact, s: [src-fomo3d-source, src-fomo3d-exitscam-site]}
    - {t: "購入が取り込まれると、そのプレイヤーが「最後の購入者」になり、タイマーが 1 キーあたり 30 秒延びる（24 時間を超えない）。以後、他の誰かの購入から配当が自分の残高に積み上がる。", k: fact, s: [src-fomo3d-source]}
    - {t: "プールが大きくなると、残り時間がわずかになった時点で多数の購入が集中し、タイマーは何度も延長される。この消耗戦を Hackernoon の分析は「War of Attrition」と呼んだ。", k: fact, s: [src-fomo3d-hackernoon-attrition, src-fomo3d-survey-ponzi-snippet]}
    - {t: "時間切れ後、次の取引（誰の購入でもよい）がラウンドを終了させ、勝者・保有者への分配が行われ、新ラウンドが始まる。勝者は withdraw() で賞金を引き出す。", k: fact, s: [src-fomo3d-source, src-fomo3d-etherscan-win-tx]}
  before_after:
    - {t: "消耗戦（War of Attrition）やドル・オークションのような「最後まで払い続けた者が勝つ」構造はゲーム理論上よく知られていたが、Fomo3D はそれを運営が資金に手を出せないコントラクトで、実際の ETH を賭けて実行した（Hackernoon の分析は消耗戦として説明し、脚注でドル・オークションに言及する）。", k: analysis, s: [src-fomo3d-hackernoon-attrition]}
    - {t: "同じチームの PoWH3D（P3D）が「手数料を保有者に配当する」型を先に作り、Fomo3D はその配当にタイマーと最終購入者の賞金を加え、購入の一部を P3D 保有者に流した。", k: fact, s: [src-fomo3d-financemagnates, src-fomo3d-source]}
    - {t: "それまで「終わらないのではないか」と議論されていたタイマーが、第 1 ラウンドではゲーム内の購入競争ではなく、ブロックの空間そのものを買い占める手段で止められた。", k: fact, s: [src-fomo3d-sok-frontrunning, src-fomo3d-solmaz]}
  onchain_tradeoffs:
    - {t: "改変不能なコントラクトにより、運営による持ち逃げは起きにくくなった（運営もそれを主張した）。", k: claim, who: "Team JUST", s: [src-fomo3d-financemagnates], q: "We have no control of the funds or balance, and it's run entirely without human intervention based on the code!"}
    - {t: "一方、タイマーの判定がブロックのタイムスタンプで行われるため、一定時間ブロックに他者の購入を入れさせなければ勝てる。攻撃者は約 175 秒（ブロック 6191896〜6191909）にわたりブロックをほぼ満杯にした。", k: fact, s: [src-fomo3d-solmaz]}
    - {t: "SoK 論文はこれを「suppression attack（抑圧攻撃）」と分類し、攻撃者の取引の実行結果自体は重要でなく、空ブロックが続いても攻撃者には同じだったと指摘した。", k: fact, s: [src-fomo3d-sok-frontrunning]}
    - {t: "エアドロップの乱数は block.timestamp・difficulty・coinbase・gaslimit・number と msg.sender から計算され、同じ計算を事前に行うコントラクトで当たるときだけ購入する攻撃が可能だった。extcodesize による人間判定は、コンストラクタ内からの呼び出しで回避できた。", k: fact, s: [src-fomo3d-source, src-fomo3d-secbit-solution, src-fomo3d-ethresearch]}
    - {t: "ガス上限・ガス価格オークションという基盤側の性質が、ゲームの決着に直結した。", k: analysis, s: [src-fomo3d-solmaz, src-fomo3d-sok-frontrunning]}
  roles:
    - {t: "参加者はキー購入者、配当目当ての早期保有者、紹介者（10% 前後の紹介料）、P3D 保有者に分かれる。", k: fact, s: [src-fomo3d-source]}
    - {t: "Team JUST はコントラクトを起動し、コミュニティ分（2%）と P3D 側の流れを受ける。第 1 ラウンド後には勝者を祝福するツイートをした。", k: fact, s: [src-fomo3d-source, src-fomo3d-tnw]}
    - {t: "勝者・攻撃者は人間の手作業ではなく、ブロック詰め用のコントラクトとエアドロップ予測コントラクトを用いた。自動化された主体が勝敗を決めるゲームであり、ボット（エージェント）の参加を前提にした設計ではなかった。", k: fact, s: [src-fomo3d-solmaz, src-fomo3d-secbit-solution]}
    - {t: "採掘者は高いガス価格の取引を優先することで、攻撃者の取引を選び、事実上の決着者になった。Justin Drake は、プールが十分に大きくなれば採掘者が勝者を選ぶと事前に警告していた。", k: claim, who: "Justin Drake（ethresear.ch）", s: [src-fomo3d-ethresearch]}
  trajectory:
    - {t: "2018-07-06 に FoMo3D Long がデプロイされた。2018-07-21 には ethresear.ch で「Fomo3D は Ethereum を破壊するか」が議論され、プールは 17,000 ETH 超と書かれた。", k: fact, s: [src-fomo3d-etherscan-deploy, src-fomo3d-ethresearch]}
    - {t: "SECBIT によれば参加は 2018-07-20〜21 に頂点を迎え、第 1 ラウンドの投入額は 40,000 ETH 超、参加は 18,000 超だった。", k: claim, who: "SECBIT Labs", s: [src-fomo3d-secbit-solution, src-fomo3d-secbit-odaily]}
    - {t: "2018-08-22、第 1 ラウンドがブロック詰めで終わり、勝者 0xa169…bf85 は 07:04:12 UTC（ブロック 6191962）に 10,469.66 ETH を引き出した。", k: fact, s: [src-fomo3d-etherscan-win-tx, src-fomo3d-solmaz]}
    - {t: "第 2 ラウンドは 33 日続き、2018-09-24 に 0x18a0 が 3,264.668 ETH を獲得した。SECBIT は手口が第 1 ラウンドとまったく同じだと分析した。Solmaz の表も第 2・第 3 ラウンドそれぞれにブロック詰め用コントラクトのアドレスを挙げている。", k: claim, who: "SECBIT Labs / Onur Solmaz", s: [src-fomo3d-secbit-odaily, src-fomo3d-solmaz]}
    - {t: "第 3 ラウンドのプールは 2018-10-09 時点で約 103 ETH にとどまり（SECBIT）、Solmaz の表では第 3 ラウンドの賞金は 376 ETH、ラウンドを終わらせた取引はブロック 6507774 だった。このブロックのタイムスタンプは 2018-10-13 14:12:45 UTC（検証役が RPC で確認）。", k: fact, s: [src-fomo3d-secbit-solution, src-fomo3d-solmaz, src-fomo3d-rpc-blocks]}
  retention_evidence:
    - {t: "ラウンドごとの勝者賞金は 10,469 ETH → 3,264 ETH → 376 ETH と急減した。", k: fact, s: [src-fomo3d-solmaz, src-fomo3d-etherscan-win-tx]}
    - {t: "SECBIT は 2018-09 以降、類似ゲームがほぼ姿を消し、多くの類似コントラクトが休止したと述べた。", k: claim, who: "SECBIT Labs", s: [src-fomo3d-secbit-odaily]}
    - {t: "INSIDE は中国語圏の資料を引き、参加者のうち利益を得たのは 3 割弱と伝えたが、算定方法は示されていない。", k: claim, who: "INSIDE（中国語圏の出典を引用）", s: [src-fomo3d-inside]}
    - {t: "一意の参加アドレス数、ラウンド間の再参加率、プレイヤーごとの損益分布の一次集計は見つからなかった（dune 等は遮断）。", k: unknown}
  extensions:
    - {t: "INSIDE によれば英語圏・台湾・中国で多数の模倣品が現れ、多くは数百 ETH で失速した。SNOW Dividends は約 900 ETH まで伸びた後、不具合のある複製の公開を経て運営がサイトを閉じた。", k: claim, who: "INSIDE", s: [src-fomo3d-inside]}
    - {t: "Last Winner は Fomo3D を改変してラウンド時間を短くした模倣品で、SECBIT と AnChain.ai は 2018-08-17 にハッカー集団 BAPT-LW20 によるエアドロップ悪用を公表し、同集団がそのラウンドで計 12,948 ETH を得たと述べた。", k: claim, who: "SECBIT Labs", s: [src-fomo3d-secbit-odaily]}
    - {t: "Team JUST 自身もラウンドの短い版（Quick / SOON）を 2018-07-28 に出した。", k: fact, s: [src-fomo3d-inside, src-fomo3d-exitscam-site]}
    - {t: "SoK 論文の調査対象には FomoWar など同系統のゲームが並ぶ。", k: fact, s: [src-fomo3d-sok-frontrunning]}
  constraints:
    - {t: "時間切れの判定がブロックのタイムスタンプに依存し、その間に取引が取り込まれるかは攻撃者と採掘者が左右できる。プールが大きいほど、ブロックを買い占めるコスト（Solmaz の試算で 1 ブロック約 4 ETH）を払う価値が上がる。", k: fact, s: [src-fomo3d-solmaz]}
    - {t: "公開された状態を読むコントラクトから攻撃できるため、人間判定（extcodesize）は防御にならなかった。SECBIT は tx.origin == msg.sender の利用や、情報取得関数への制限、勝者を確率的に決めることを提案した。", k: fact, s: [src-fomo3d-secbit-solution]}
    - {t: "原資が後続参加者だけなので、新規流入が止まると配当も賞金も細る。ラウンドの縮小はこの構造と、決着方法への不信の両方で説明され得る。", k: analysis, s: [src-fomo3d-secbit-odaily]}
    - {t: "金融・賭博規制、ポンジとしての法的評価については本調査で一次資料を確認していない。", k: unknown}
  principles:
    - {t: "時間切れで決まる勝敗はブロック空間の競売になる: 「最後の取引から一定時間で決着」という規則は、プールの価値がブロック数個分のガス代を上回った瞬間に、ゲーム内の選択ではなく取引の取り込み順の争いに変わる。適用条件は賞金が小さいか、時間窓がブロック詰めのコストに比べ十分長いこと。", k: analysis, s: [src-fomo3d-solmaz, src-fomo3d-sok-frontrunning]}
    - {t: "完全公開の状態と決定的乱数は、条件付き実行を許す: 攻撃コントラクトが同じブロック内で状態や乱数を計算し、自分に有利なときだけ実行（不利なら revert）できる。対策は将来のブロックハッシュへのコミット（コミット・リビール）や確率的な決着。", k: analysis, s: [src-fomo3d-secbit-solution, src-fomo3d-source]}
    - {t: "運営の不正を不可能にすることと、ゲームの公平性は別物: 持ち逃げを防ぐ改変不能性は、ゲームの外側（採掘者・ガス市場）による決着を防がない。オンチェーンのルールを「公正」と呼ぶ前に、順序付けの権限が誰にあるかを設計に含める必要がある。", k: analysis, s: [src-fomo3d-financemagnates, src-fomo3d-sok-frontrunning]}
  counter_evidence:
    - {t: "勝者がブロック詰めを行ったという解釈は Solmaz と SECBIT の分析が支持し、SoK 論文はそれら（と匿名ブログ）を引用して分類しているため、3 者は完全に独立した裏付けではない。勝者本人の説明はない。Vice によれば運営の Discord 告知も「ブロックチェーンを詰まらせて他の参加者を締め出した」と述べる一方、開発者（Inventor）は「他の人間のプレイヤーがいない瞬間を見つけた」とも語っており、直前に人間の購入意欲が細っていたことが攻撃の成立条件だった可能性はある。", k: analysis, s: [src-fomo3d-vice, src-fomo3d-solmaz, src-fomo3d-sok-frontrunning]}
    - {t: "TNW が伝えた批判は「採掘者がブロックを検閲した」というもので、攻撃者の取引ではなく採掘者の行動とする見方もあった。ただし BTC-Echo は、該当ブロックが SparPool・BitClubPool・Nanopool・Ethermine など複数のプールによって採掘されたと記しており、単一の採掘者による検閲という説明とは合いにくい。", k: claim, who: "TNW が紹介した批判者 / BTC-Echo", s: [src-fomo3d-tnw, src-fomo3d-btcecho]}
    - {t: "Justin Drake は「採掘者が勝者になる」と予想したが、確認できた資料では勝者は高額ガスで多数のプールに取引を取り込ませた参加者であり、採掘者自身が勝ったという証拠は見つからなかった。採掘者の裁量よりもガス価格オークションが決着を左右した。", k: analysis, s: [src-fomo3d-ethresearch, src-fomo3d-btcecho, src-fomo3d-solmaz]}
    - {t: "ラウンドの急縮小を攻撃のせいだけにはできない。INSIDE は第 1 ラウンド中（7 月末の短期版公開後）に、多くの参加者が倍以上の利益は難しいと気付いて売りが出て、P3D 側の ETH 残高が約 8 万から約 5.5 万 ETH に減ったと記しており、ポンジ型の構造自体が成長の天井を持っていた。", k: claim, who: "INSIDE", s: [src-fomo3d-inside]}
    - {t: "ethresear.ch の議論では、プールが拡大し続けると Ethereum の流動性を吸い上げるという懸念が出た（同じスレッドで DaveyZ は分配規則を根拠に反論）。実際にはプールは第 1 ラウンドの約 2 万 ETH 台が頂点で、以後のラウンドは縮小しており、懸念は現実化しなかったと見られる。", k: analysis, s: [src-fomo3d-ethresearch, src-fomo3d-vice, src-fomo3d-solmaz]}

acquisition:
  audience: [players]
  summary: {t: "最初の参加者の土台は同じ Team JUST の PoWH3D（P3D）の保有者・紹介者で、購入額の一部が P3D 側へ流れる設計と 10% の紹介料が既存の参加者に勧誘の動機を与えた。そこへ、プールが膨らむ公開タイマーそのものの話題性（ethresear.ch・報道）が 2018-07 下旬の急増を重ねたと見られる。", k: analysis, s: [src-fomo3d-source, src-fomo3d-financemagnates, src-fomo3d-ethresearch, src-fomo3d-btcecho-0724]}
  steps:
    - {phase: pre, t: "Team JUST は先に PoWH3D（P3D、コード上は Hourglass）を運営しており、P3D には紹介者（masternode）の経由で入った購入者の配当手数料の一部を紹介者に回す仕組みがあった。Fomo3D はキー購入額の一部と、紹介者のいない購入の紹介料分を P3D 保有者に流す設計で始まった。", k: fact, s: [src-fomo3d-source, src-fomo3d-financemagnates]}
    - {phase: launch, date: "2018-07-06", t: "FoMo3D Long をデプロイ。最初の 100 ETH が集まるまでは 1 人あたり累計 1 ETH までしか買えない反クジラ規則があり、初期の少数の大口が独占しないようにしていた。", k: fact, s: [src-fomo3d-etherscan-deploy, src-fomo3d-source]}
    - {phase: growth, date: "2018-07-21", t: "ethresear.ch で「Fomo3D は Ethereum を破壊するか」が議論され、プールは 17,000 ETH 超とされた。SECBIT によれば参加は 2018-07-20〜21 に頂点を迎えた。", k: fact, s: [src-fomo3d-ethresearch, src-fomo3d-secbit-solution]}
    - {phase: growth, date: "2018-07-24", t: "BTC-Echo は直近 24 時間のアクティブユーザーを 5,200 超、取引額を 2,700 ETH と報じ（同じ 24 時間の CryptoKitties は 22.17 ETH）、Finance Magnates はプールを 21,515 ETH と報じた。Hackernoon の消耗戦の分析（07-23）も同時期に出ている。", k: fact, s: [src-fomo3d-btcecho-0724, src-fomo3d-financemagnates, src-fomo3d-hackernoon-attrition]}
    - {phase: growth, date: "2018-07-28", t: "Team JUST は短期版（Quick / SOON）を公開し、INSIDE によれば 10 分で 9,800 ETH が流入した。長期版の参加者に別の入口を用意した形になる。", k: claim, who: "INSIDE", s: [src-fomo3d-inside, src-fomo3d-exitscam-site]}
    - {phase: growth, date: "2018-08-22", t: "第 1 ラウンドがブロック詰めで決着し、Vice・TNW などが勝者と賞金を報じた。報道の山は流入の山（7 月下旬）より後で、以後のラウンドは縮小した。", k: fact, s: [src-fomo3d-vice, src-fomo3d-tnw, src-fomo3d-solmaz]}
  channels:
    - {id: existing-community, t: "同じチームの P3D 保有者が、購入額の一部（チームにより 0〜10%）と紹介者なし購入の紹介料分を受け取る立場にあり、P3D の利用者が最初の参加者・宣伝者になる動機を持っていた。", k: fact, s: [src-fomo3d-source, src-fomo3d-financemagnates]}
    - {id: referral, t: "購入額の 10% が紹介者に入るが、紹介者が PlayerBook で名前を登録（0.01 ETH）していなければその分は P3D へ回る。紹介リンクを配る人は少額を払って登録した参加者に限られた。", k: fact, s: [src-fomo3d-source]}
    - {id: viral-mechanic, t: "購入ごとに 30 秒延びる公開タイマーと膨らむプール、既存保有者への即時配当という仕組みそのものが話題を生み、残り時間の消耗戦を観戦・議論の対象にした。", k: analysis, s: [src-fomo3d-hackernoon-attrition, src-fomo3d-ethresearch]}
    - {id: prize-competition, t: "最後の購入者がプールの 48% を得る賞金そのものが参加理由になった。賞金の原資は参加者自身の購入額である。", k: fact, s: [src-fomo3d-source]}
    - {id: crypto-social, t: "2018-07-21 に ethresear.ch で Ethereum 全体への影響が議論され、Justin Drake らが参加した。", k: fact, s: [src-fomo3d-ethresearch]}
    - {id: press, t: "2018-07-23〜24 に Hackernoon・Finance Magnates・BTC-Echo が「公然のねずみ講」「最も成功している dApp」として取り上げた。", k: fact, s: [src-fomo3d-hackernoon-attrition, src-fomo3d-financemagnates, src-fomo3d-btcecho-0724]}
  cost:
    - {t: "獲得の原資はすべて参加者の ETH で、紹介料（10%）・配当・エアドロップ（1%）・賞金は後から入った人の購入額から支払われる。運営が外部資金で報酬を出した形跡はない。", k: fact, s: [src-fomo3d-source]}
    - {t: "運営はコミュニティ分（購入時 2%、ラウンド終了時 2%）を受け取り、P3D 側の流れも同じチームの製品に向かう。広告費・VC 資金の有無は確認できなかった。", k: fact, s: [src-fomo3d-source]}
  after:
    - {t: "ラウンドごとの勝者賞金は 10,469 ETH → 3,264 ETH → 376 ETH と急減し、第 3 ラウンド（2018-10）以後の公式な活動は確認できない。", k: fact, s: [src-fomo3d-solmaz, src-fomo3d-etherscan-win-tx, src-fomo3d-secbit-solution]}
    - {t: "示されていない指標: 一意の参加アドレス数、ラウンドをまたいだ再参加率、紹介経由の購入の割合は一次集計が見つからない（Etherscan の累計取引数 246,135 件のみ）。", k: fact, s: [src-fomo3d-etherscan-contract]}
  counter:
    - {t: "急増の時期（07-20〜21）は ethresear.ch の議論と重なるが、どちらが先かは日単位では判別できない。報道（07-23 以降）は頂点の後であり、報道が最初の流入を生んだとは言いにくい。", k: analysis, s: [src-fomo3d-ethresearch, src-fomo3d-secbit-solution, src-fomo3d-financemagnates]}
    - {t: "BTC-Echo の 5,200 は「アクティブユーザー」とされるがアドレス単位の可能性が高く、紹介料目当ての自己紹介アカウントや攻撃コントラクトを含み得る。SECBIT の 18,000 超の「参加」も一意アドレスか取引数か不明で、人数の根拠としては弱い。", k: analysis, s: [src-fomo3d-btcecho-0724, src-fomo3d-secbit-solution]}
    - {t: "紹介制度の効果は直接測れない。紹介料は名前登録者にしか入らないため、紹介経由の購入の比率は PlayerBook とイベントログを集計しなければ分からず、本調査では行っていない。", k: unknown}
  lessons:
    - {t: "【有料登録の紹介リンク＋既存トークンへの還流】紹介料を名前登録（少額の支払い）した参加者だけに払い、紹介のない購入分を前作のトークン保有者に回すと、前作の保有者全員が新作の勧誘者になる。効く条件: 前作に配当目当ての保有者層があり、新作の流入がそのまま彼らの収入になる。破綻条件: 流入が鈍ると紹介料も配当も同時に止まり、勧誘の動機が一斉に消える（Fomo3D ではラウンドごとに規模が約 3 分の 1 以下に縮んだ）。", k: analysis}
    - {t: "【参加初期の上限】最初の一定額（100 ETH）までは 1 人の購入額に上限を置く規則は、開始直後に少数の大口が配当の最上位を独占するのを防ぎ、初期の小口参加者を増やす狙いを持つ。効く条件: アドレスを多数作るコストが上限による損失より高い。破綻条件: 上限はアドレス単位なので、複数アドレスを使えば回避できる。", k: analysis, s: [src-fomo3d-source]}
  metrics: [m-fomo3d-r1-prize, m-fomo3d-r2-prize, m-fomo3d-r3-prize, m-fomo3d-r1-participations, m-fomo3d-pot-0721, m-fomo3d-pot-0724, m-fomo3d-active-0724, m-fomo3d-volume-0724, m-fomo3d-tx-count]
  unknowns:
    - "中国語圏の SNS・チャットでの拡散の時期と規模（INSIDE 以外の一次資料。台湾の暗号資産メディアが 2018-07-21 前後に中国の SNS で拡散したと報じたことは検索要約でのみ確認）"
    - "紹介経由の購入の比率、P3D 保有者のうち Fomo3D に参加した割合"
    - "Team JUST の Discord の規模と、そこでの告知の内容（Discord は取得不可）"

