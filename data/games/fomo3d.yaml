  - {to: dark-forest, type: contrasts-with, basis: analytic, note: "Dark Forest は秘匿情報とラウンド運営者による管理で終わり方を制御したのに対し、Fomo3D は完全公開・管理者なしで終了条件を基盤に委ねた"}
  - {to: freysa, type: similar-to, basis: analytic, note: "参加費が上昇しながらプールが膨らみ、最後の勝者が総取りする賞金ゲームという資金構造が共通"}

unknowns:
  - "第 1 ラウンドの一意参加アドレス数と、キー購入の総額のオンチェーン集計（SECBIT の数字の定義）。"
  - "第 3 ラウンド（2018-10-13 終了）以後に新ラウンドが始まったか、その規模。"
  - "Etherscan で検証済みのソースと、本調査で読んだ第三者リポジトリ（reedhong/fomo3d_clone）が一致するか（検証役もバイトコードとの照合はしていない）。"
  - "コントラクトに残る約 1,094 ETH の内訳（未引き出しの配当、終わっていないラウンドのプール等）。"
  - "F3DexternalSettings の実際のロジック（ソース非公開）。"
  - "Team JUST が受け取った総額（コミュニティ 2% 分と P3D 経由の流れ）。"
  - "Péter Szilágyi によるエアドロップ不具合の公表（2018-07-23 とされる）の一次資料（reddit は取得不可）。"
  - "勝者が第 1・第 2 ラウンドで同一人物・同一集団か（SECBIT は手口の同一性のみを主張）。"
contradictions:
  - {t: "第 1 ラウンドの決着の扱い: Solmaz はブロック 6191909 でラウンド終了とし、Vice はブロック 6191962 を賞金の取引とする。Etherscan では 6191962 は勝者の withdraw() であり、終了と引き出しの違いと見られる。", s: [src-fomo3d-solmaz, src-fomo3d-vice, src-fomo3d-etherscan-win-tx]}
  - {t: "ブロック詰めの開始: Vice はブロック 6191903 から独占が始まったとし、SoK 論文はタイマー残り約 3 分で 1 キーを買ってから高ガスの取引を送ったと記す。Solmaz は最後の購入から約 175 秒の停滞とする。", s: [src-fomo3d-vice, src-fomo3d-sok-frontrunning, src-fomo3d-solmaz]}
  - {t: "攻撃費用: Solmaz は 1 ブロック約 4 ETH、Vice が引いた開発者は準備に 40〜50 ETH と推定。対象範囲が異なる可能性がある。", s: [src-fomo3d-solmaz, src-fomo3d-vice]}
  - {t: "ドル換算: SoK 論文は約 210 万ドル、TNW は約 280 万ドル、Vice は約 300 万ドルとする（換算時点の違い）。", s: [src-fomo3d-sok-frontrunning, src-fomo3d-tnw, src-fomo3d-vice]}
  - {t: "初期タイマー: コードは rndInit_ = 1 時間、2024 年の解説記事（Jeremy Clark）は 5 分と書く（同記事は実在の勝者を仮名「Mallory」で呼ぶ説明的な語り口）。", s: [src-fomo3d-source, src-fomo3d-yacn]}
  - {t: "第 3 ラウンドの規模: SECBIT は 2018-10-09 時点のプールを約 103 ETH とし、Solmaz は 4 日後（10-13）に終わった第 3 ラウンドの賞金を 376 ETH とする。賞金がプールの 48% なら終了時のプールは約 780 ETH で、4 日で 7 倍以上に増えたことになる。いずれかの数字の定義（「pool」が何を指すか）が異なる可能性がある（検証役による計算）。", s: [src-fomo3d-secbit-solution, src-fomo3d-solmaz]}

