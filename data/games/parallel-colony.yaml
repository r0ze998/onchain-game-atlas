  - {to: daydreams, type: similar-to, basis: analytic, note: "エージェントがウォレットを持ちオンチェーンで行動するという構想が共通（Wayfinder）"}
  - {to: freysa, type: contrasts-with, basis: analytic, note: "Freysa はチェーンを決済に限定して使い続けた。Colony は公開版でチェーン要素を前面から外した"}

contradictions:
  - {t: "Solana の X 投稿（2024-12、検索要約のみ）はアルファを 2025 年 Q1 と予告したが、Seeker 限定アルファの開始は 2025-09-22 だった。", s: [src-colony-solana-x-2024, src-colony-egamers-alpha]}
  - {t: "第三者のゲーム DB は「Holders of Parallel’s Avatar NFTs can use their Avatars in Colony」と記し、チェーンに Ethereum と Solana を挙げる一方、PRIME の獲得・消費は現行のゲーム文書に書かれていないとする。公式ページと公式ガイドの本文には NFT・アバター連携の記述がない。", s: [src-colony-bgfun, src-colony-official, src-colony-guide]}

