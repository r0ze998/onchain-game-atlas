  - {id: ev-colony-announce, date: "2024-03", type: announce, title: "Colony のホワイトペーパーと Solana 展開を発表", detail: "アバターが専用ウォレットで自律取引、PRIME で支払い、2025 年までは公開しない見込み", s: [src-colony-bcg-2024]}
  - {id: ev-colony-wayfinder, date: "2024-03-14", type: paper, title: "Wayfinder ホワイトペーパー（Colony の中核インフラと記載）", s: [src-colony-wayfinder-paper]}
  - {id: ev-colony-alpha, date: "2025-09-22", type: testnet, title: "Solana Seeker 限定のアーリーアルファ", detail: "10 ドルのクレート販売。約 1 年の限定テストの後とされる", s: [src-colony-egamers-alpha, src-colony-bcg-launch]}
  - {id: ev-colony-global, date: "2026-09", type: launch, title: "「Colony: Survival」を iOS/Android で世界公開", detail: "基本無料。公開面でチェーン要素が目立たない", s: [src-colony-bcg-launch, src-colony-mobilegamer, src-colony-official]}

