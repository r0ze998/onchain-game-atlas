  - {to: daydreams, type: similar-to, basis: analytic, note: "エージェントがウォレットを持ちオンチェーンで行動するという構想が共通（Wayfinder）"}
  - {to: freysa, type: contrasts-with, basis: analytic, note: "Freysa はチェーンを決済に限定して使い続けた。Colony は公開版でチェーン要素を前面から外した"}

