id: parallel-colony
name: "Colony（Parallel Colony / Colony: Survival）"
aliases: ["Parallel Colony", "Colony: Survival"]
kind: game
depth: index
updated: "2026-10-24"
links:
  website: https://parallel.life/colony
  x: https://x.com/ParallelColony
  discord: https://discord.gg/paralleltcg
chains: [Solana（2024 年の構想と 2025-09 の Seeker 限定アルファ）]
team: "Parallel Studios（Echelon Prime Foundation のエコシステム）"
summary: >-
  Parallel Studios が 2024-03 に発表した、AI アバターが自分の Solana ウォレットを持って自律的に取引・クラフトする「AI サバイバルシミュレーション」。
  構想では、Parallel の Avatar NFT から生まれるアバターが LLM で動き、PRIME トークンで作成・行動し、エージェント用インフラ Wayfinder が中核とされた。
  2025-09 に Solana Seeker 端末限定のアーリーアルファを経て、2026-09 に iOS/Android の基本無料ゲーム「Colony: Survival」として世界公開されたが、
  参照日時点の公式ページと公式ゲームガイドの本文はブロックチェーン・ウォレット・PRIME・NFT に触れず、会話できる AI 入植者と生成 3D 装備を前面に出している（サイト共通のフッターには OpenSea の Parallel コレクションへのリンクが残る）。チェーン要素が製品から除去されたのか、表に出していないだけなのかは確認できていない。
selection_reason: >-
  「AI エージェントがオンチェーンで自律的に取引する」構想を大手 Web3 ゲーム会社が掲げ、その後の製品で公開面からチェーン要素が消えた例であり、
  AI ゲームにチェーンが必要かという問いへの直接の反証候補として重要。状態の変化は報道と公式ページで確認でき、ゲーム内部にチェーン要素が残るかは未確認である点も明示する。
categories:
  - {id: ai, role: primary, reason: "LLM で動く入植者・アバター、自然言語での指示、生成 3D アイテム"}
  - {id: assets, role: secondary, reason: "構想段階ではアバター NFT・Solana 上の取引・PRIME 支払いを前提にしていた"}
status:
  value: pivoted
  as_of: "2026-10"
  note: >-
    2026-09-03 にモバイルの基本無料ゲームとして世界公開され、遊べる状態（active）。pivoted とした根拠は、確認できたゲーム設計の変化
    （2024 年の「アバターが専用ウォレットで人間の直接操作なしに取引する」構想 → 人間が拠点を建て AI 入植者に助言する 4X）と、公開面からチェーン要素が消えたこと。
    チェーン要素が製品から除去されたことは確認していない。報道も「目立たなくなった」と書くにとどまり、第三者のゲーム DB は Avatar NFT 保有者が Colony でアバターを使えると記す（一次資料で未確認）。
  s: [src-colony-official, src-colony-bcg-launch, src-colony-bcg-2024]
dates:
  announced: {date: "2024-03", s: [src-colony-bcg-2024, src-colony-wayfinder-paper], note: "ホワイトペーパーと Solana での展開を発表（Wayfinder 論文の作成日は 2024-03-14）"}
  launched: {date: "2026-09-03", s: [src-colony-bcg-launch, src-colony-mobilegamer], note: "iOS/Android で世界公開（BlockchainGamer.biz は 9/3、MobileGamer.biz は 9/4 付で「silent launch」と記載）。2025-09-22 から Seeker 限定のアーリーアルファ"}

architecture:
  onchain:
    level: unknown
    detail: >-
      2024 年の構想では、アバター NFT とゲーム内取引を Solana に置き、各アバターが専用ウォレットを制御して自律的に取引するとされた。
      2025-09 のアルファは Solana Seeker 端末限定で、報道は「deep blockchain simulation experience」と形容したが、具体的なオンチェーン処理は書かれていない。2026-09 公開版の公式ページはチェーンに言及せず、
      報道は「ブロックチェーン基盤や PRIME は公開ストアの説明では目立たない」と述べるにとどまる。現行版で何がオンチェーンかは確認できなかった。
    s: [src-colony-bcg-2024, src-colony-egamers-alpha, src-colony-bcg-launch, src-colony-official]
  offchain:
    - {item: "AI 入植者との自然言語の会話、Dilemmas の自由記述への応答（サブスクリプション次第）、Fabricator による 3D 装備生成（Atlas Studio）", s: [src-colony-official]}
    - {item: "構想上のエージェント基盤 Wayfinder（エージェントが共有する知識グラフ「wayfinding paths」、LLM インターフェース）", s: [src-colony-wayfinder-paper]}
  admin:
    level: unknown
    detail: "コントラクトやサーバーの管理権限について確認できる資料はなかった。"
  open_source:
    level: unknown
    detail: "ゲームのコードの公開は確認できなかった。"
  extensibility:
    level: unknown
    detail: "Wayfinder は第三者の dApp やチェーンへエージェントを導く汎用ツールと構想されたが、Colony のゲーム内で第三者が拡張できるかは確認できなかった。"
    s: [src-colony-wayfinder-paper]

compare:
  gameplay: {t: "現行版は荒廃した地球で拠点を建て、資源を集め、装備を作り、PvE のレーン戦と PvP の世界地図で戦う 4X。AI 入植者に自然言語で助言・指示し、その判断に影響を与える。", k: fact, s: [src-colony-official]}
  necessity: {t: "当初はアバターが自分のウォレットで取引することが売りで、チェーンが体験の中心に置かれていた。現行版はチェーンに触れずに AI 機能を前面に出しており、AI 体験にチェーンが不要と運営が判断した可能性がある（運営の説明は未確認）。", k: analysis, s: [src-colony-bcg-2024, src-colony-official, src-colony-bcg-launch]}
  information: {t: "未確認。", k: unknown}
  persistence: {t: "現行版は運営サーバーに依存するモバイルゲーム。構想段階の資産（アバター NFT 等）が現行版でどう扱われるかは未確認。", k: analysis, s: [src-colony-official]}
  extensibility: {t: "未確認。", k: unknown}
  money_flow: {t: "構想段階は PRIME で AI アバターの作成やゲーム内取引の費用を払うとされた。2025 アルファは 10 ドルのクレート販売、現行版は基本無料＋アプリ内課金・サブスクリプション・Fabricator 用通貨 Weave。", k: fact, s: [src-colony-bcg-2024, src-colony-egamers-alpha, src-colony-official]}
  entry_barrier: {t: "アルファは約 500 ドルの Solana Seeker 端末が必須だった。現行版は iOS/Android で無料ダウンロードでき、NFT やウォレットは不要と報じられた。", k: fact, s: [src-colony-egamers-alpha, src-colony-bcg-launch]}

concepts: [c-ai-agent-player, c-nft-asset, m-production-chain, m-pvp-territory]

article:
  counter_evidence:
    - {t: "「AI エージェントが自律的にオンチェーン取引するゲーム」として発表されたが、2 年半後の世界公開版の公式ページと公式ゲームガイド（gameplay・FAQ）の本文はブロックチェーン・ウォレット・PRIME・NFT に言及しない。報道も、公開版ではこれらが目立たず、NFT やウォレットなしで始められると書く（PANews は製品ホームページから「quietly removed」と表現）。", k: fact, s: [src-colony-official, src-colony-guide, src-colony-bcg-launch, src-colony-panews]}
    - {t: "少なくとも入口の体験では、AI を中心にしたゲームでチェーンが必須要素にならなかった例と読める。ただし内部での利用や NFT 保有者向けの機能が残っている可能性があり、「チェーンが不要だった」ことの証明ではない。", k: analysis}
    - {t: "ただし、公開面で言及しないことはゲーム内部でチェーンを使っていないことを意味しない。運営がチェーン要素の扱いを説明した一次資料は見つからなかった。", k: unknown}
    - {t: "当初の「アバターが人間の直接操作なしに行動する」構想に対し、現行版では人間が入植者に話しかけ、ジレンマに答え、拠点を建てる。人間の意思決定は外されず、AI は会話相手・助言の受け手に位置付け直された。", k: fact, s: [src-colony-bcg-2024, src-colony-official]}

acquisition:
  audience: [holders, players]
  summary: {t: "最初のプレイヤー層として運営が想定したのは、Parallel の既存の Avatar NFT 保有者と、Solana Seeker 端末の保有者だった。2025-09 のアルファは Seeker 保有者に限って開放され、その後 2026-09 に NFT もウォレットも要らない基本無料のモバイル版で一般層へ広げたが、各段階のプレイヤー数は公表されていない。", k: analysis, s: [src-colony-bcg-2024, src-colony-bcg-tcg-2025, src-colony-egamers-alpha, src-colony-bcg-launch]}
  steps:
    - {phase: pre, date: "2024-03", t: "Colony を発表。AI アバターは当初、既に発行済みの Parallel の Avatars（11,001 体の PFP コレクション）を基にし、PRIME で作成・行動の費用を払い、公開は 2025 年までない見込みとされた。", k: fact, s: [src-colony-bcg-2024]}
    - {phase: pre, date: "2024-03-18", t: "Decrypt は、発表後に PRIME が史上最高値 28.00 ドルに達したと報じ、無料版も用意するが無料版では PRIME 報酬を得られず所持品も保持できないこと、公開アルファを 2024 年 Q4〜2025 年 Q1 に予定していることを伝えた。", k: fact, s: [src-colony-decrypt-2024]}
    - {phase: pre, date: "2024-12", t: "Solana の X 投稿（検索要約のみ）は、AI エージェントが Solana 上で自律的に取引するとしてアルファを 2025 年 Q1 と予告した。", k: claim, who: "Solana（X 投稿、検索要約のみ）", s: [src-colony-solana-x-2024]}
    - {phase: pre, date: "2025-09", t: "Parallel Studios は Solana Seeker 端末の保有者を主要なテスト対象にし、Avatar NFT の保有者もこの版をモバイルか PC で遊べるとした（BlockchainGamer.biz の報道）。", k: claim, who: "Parallel Studios（BlockchainGamer.biz の報道）", s: [src-colony-bcg-tcg-2025]}
    - {phase: launch, date: "2025-09-22", t: "Seeker 端末（約 500 ドル）の保有者に限定したアーリーアルファをこの日に開始すると報じられた（記事は開始当日付けの予告）。公式サイトで無料登録を受け付け、1 個 10 ドルのクレート（ペット・スキン等、限定コンテンツの抽選付き）を販売するとされた。", k: fact, s: [src-colony-egamers-alpha]}
    - {phase: growth, date: "2026-09-03", t: "約 1 年の限定テストの後、「Colony: Survival」として App Store と Google Play で世界公開した。報道は NFT の購入やウォレットの操作なしに始められると書き、MobileGamer.biz は「silent launch」で、マーケティングの本格化はこれからと書いた。", k: fact, s: [src-colony-bcg-launch, src-colony-mobilegamer]}
  channels:
    - {id: existing-community, t: "既存の Parallel Avatar NFT（11,001 体）を AI アバターの土台にし、保有者もアルファ版を遊べるとした。保有者が実際に何人参加したかは不明。", k: claim, who: "Parallel Studios（報道経由）", s: [src-colony-bcg-2024, src-colony-bcg-tcg-2025]}
    - {id: platform-distribution, t: "アルファを Solana Seeker 端末の保有者に限定して配り、世界公開では App Store と Google Play を使った。", k: fact, s: [src-colony-egamers-alpha, src-colony-bcg-launch]}
    - {id: invite-gating, t: "約 500 ドルの Seeker 端末の保有をアルファ参加の条件にし、公式サイトでの無料登録を受け付けた（その後の段階的な開放の経過は資料で確認できない）。", k: fact, s: [src-colony-egamers-alpha]}
  cost:
    - {t: "アルファでは 10 ドルのクレートを参加者に販売しており、獲得の原資を参加者が一部払う形だった。世界公開版は基本無料でアプリ内課金・サブスクリプションで収益化する。集客に使った広告費やトークン報酬の額は確認できなかった。", k: fact, s: [src-colony-egamers-alpha, src-colony-official]}
  after:
    - {t: "アルファ・世界公開版ともにプレイヤー数・継続率・売上は公表資料で確認できなかった。", k: unknown}
  counter:
    - {t: "2024-03 の発表直後に PRIME が史上最高値を付けており、発表への反応はプレイヤーとしての関心ではなく、トークン価格への期待だった可能性がある。", k: analysis, s: [src-colony-decrypt-2024]}
    - {t: "Seeker 限定のアルファは、端末保有者という狭い層に絞ることで、需要を測るより Solana Mobile との提携の宣伝になっていた可能性がある。参加者数が公表されていないため、限定の効果は検証できない。", k: analysis, s: [src-colony-egamers-alpha, src-colony-bcg-tcg-2025]}
    - {t: "世界公開版は NFT・ウォレット不要で、公式ページもチェーン要素に触れない。一般層の獲得は Web3 の既存コミュニティではなく通常のモバイル配信に頼っており、初期の保有者層とは別の集団になった可能性がある。", k: analysis, s: [src-colony-bcg-launch, src-colony-official]}
    - {t: "アルファの対象になった Seeker 保有者には別の動機があった。Seeker は 2025-08 に世界出荷が始まり、Solana Mobile は端末上の活動（Seeker Season 1）のスナップショットを取って SKR トークンを端末保有者と開発者にエアドロップした（2026-01）。Seeker 限定アルファの参加者には、ゲームへの関心ではなく端末上の活動実績を積む目的の人が含まれていた可能性がある。", k: analysis, s: [src-colony-decrypt-skr, src-colony-egamers-alpha]}
  lessons:
    - {t: "端末やトークンの保有者に限ったアルファから一般モバイル公開へ: 高価な端末や NFT の保有を条件にすると、少数の熱心な層でテストできる。効く条件は限定期間の学びを一般版に生かせ、保有者に固有の特典が残ること。破綻条件は一般版でチェーン要素を外した場合で、最初の保有者層に提供した価値と一般層の体験が切り離される。", k: analysis}
  metrics: []
  unknowns:
    - "Seeker 限定アルファの登録者数・参加者数、Avatar NFT 保有者の参加数。"
    - "世界公開版のダウンロード数・継続率、集客に使った広告やトークン報酬。"

