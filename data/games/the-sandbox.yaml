  note: "2025-08 の再編報道で、Borget は SAND・LAND・NFT コレクションは「変わらない」と述べた。以後の運営状況は本調査で確認していない。"
  s: [src-tsb-cointelegraph-2025]
dates:
  launched: {date: "2021-11-29", s: [src-tsb-wikipedia], note: "Alpha 段階の公開テスト（〜2021-12-20）。正式版の公開日は未確認"}

architecture:
  onchain:
    level: assets-only
    detail: "2020 年ホワイトペーパーでは、ASSETS を ERC-1155 / ERC-721、LAND を 408×408 の区画として発行し、売買を SAND で行う。資産作成はブラウザから AWS 上のサーバーを経由して S3 と IPFS に保存し、ハッシュをコントラクトに渡す構成。ゲーム体験の実行はチェーン外。"
    s: [src-tsb-whitepaper]
  offchain:
    - {item: "自社サーバー（AWS、Node.js）、S3 と IPFS への資産保存", s: [src-tsb-whitepaper]}
    - {item: "Game Maker で作った体験の実行とプレイヤー接続（ログイン基準の利用者集計）", s: [src-tsb-coindesk-2022]}
  admin:
    level: unknown
    detail: "ホワイトペーパーは DAO による統治へ段階的に移行すると述べるが、コントラクトの管理権限の現状は本調査で確認していない。"
    s: [src-tsb-whitepaper]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: official-api
    detail: "利用者は VoxEdit で ASSETS を作りマーケットで売り、Game Maker で LAND 上に体験を作れる。ルール拡張は運営のツールの範囲内。"
    s: [src-tsb-whitepaper]

compare:
  gameplay: {t: "LAND 上に置かれた体験（ミニゲーム、IP コラボの展示等）をアバターで遊ぶ。制作者は VoxEdit と Game Maker で資産と体験を作る。", k: fact, s: [src-tsb-whitepaper]}
  necessity: {t: "資産の所有と二次流通、土地の希少性による資金調達にはトークンが使われたが、ゲームの実行はサーバー側で、同じ体験は従来型のサーバーでも作れる。", k: analysis, s: [src-tsb-whitepaper]}
  information: {t: "未確認", k: unknown}
  persistence: {t: "資産のトークンは残るが、体験の実行は運営サーバーに依存する構成（2020 年ホワイトペーパー時点）。", k: analysis, s: [src-tsb-whitepaper]}
  extensibility: {t: "公式ツールによる UGC（VoxEdit / Game Maker）。", k: fact, s: [src-tsb-whitepaper]}
  money_flow: {t: "ホワイトペーパーは SAND 建て取引の 5% を手数料とし、ステーキングプールと財団に配分すると記載。LAND 販売が初期収入で、2021-11 に 9300 万ドルの Series B を調達した。", k: fact, s: [src-tsb-whitepaper, src-tsb-wikipedia]}
  entry_barrier: {t: "未確認（ログインのみで遊べるか、ウォレットが必須かは時期により異なる可能性）。", k: unknown}

concepts: [m-land, c-nft-asset, c-fungible-ingame-token, e-p2e, e-royalty-creator]

article:
  counter_evidence:
    - {t: "2022-10 に DappRadar の「24 時間にコントラクトと取引したウォレット」は 522（過去最高は約 4,503）。CEO の Arthur Madrid は、この指標はユーザー間取引と一次販売しか反映しないとし、1 日に 1 回以上接続した人を DAU と定義すると反論した。Wikipedia（Bloomberg 2022-10-23 を出典）によれば、同社は当時約 20 万の月間アクティブを主張し、Animoca Brands の Yat Siu は約 500 という日次の数字は利用の実態を表さないと述べた（CoinDesk には MAU の数値はない）。オンチェーン指標と運営指標の乖離は Decentraland と同じ構造である。", k: fact, s: [src-tsb-coindesk-2022, src-tsb-wikipedia]}
    - {t: "2025-08 の再編では、共同創業者 2 名が執行職から退き、The Big Whale は「少なくとも従業員の 50%」の削減と報じた（会社は人数を明かしていない。総従業員数は記事に記載なし）。会社は理由として AI による効率化を挙げた。", k: claim, who: "Sébastien Borget（Cointelegraph の記事内）", s: [src-tsb-cointelegraph-2025], q: "allows us to accelerate our deployment of content, features, and LiveOps while maintaining a leaner, more agile team"}

acquisition:
  audience: [holders, creators, players]
  summary: {t: "最初の参加者は、遊べる版がない段階で LAND の先行販売（2019-12〜）を買った暗号資産の保有者・ブランド・他の NFT ゲームの運営と、Foundation の助成で集めた制作者だった。プレイヤーとしての最初の大きな流入は 2021-11 の Alpha で、参加枠は LAND 所有者への抽選とコンテストで配り、SAND 報酬を付けた。", k: analysis, s: [src-tsb-decrypt-2020-presale, src-tsb-whitepaper, src-tsb-forklog-alpha]}
  steps:
    - {phase: pre, date: "2012", t: "前身のモバイル版 The Sandbox シリーズは 2012 年からの累計で 4000 万ダウンロード、最新作 The Sandbox Evolution は MAU 120 万（ピーク 260 万）とホワイトペーパーは述べる。", k: claim, who: "The Sandbox（2020 年ホワイトペーパー）", s: [src-tsb-whitepaper]}
    - {phase: pre, date: "2019-12", t: "最初の LAND 先行販売で 3,000 超の区画が約 4 時間で売れた。", k: fact, s: [src-tsb-decrypt-2020-presale]}
    - {phase: pre, date: "2020-02", t: "2 回目の先行販売は 6,192 区画で、Animoca Brands によれば開始数時間で 800 ETH を売り上げた。初期の LAND 購入者として Shaun the Sheep のブランド、Old Skull Games、Dapp.com、CryptoKitties、My Crypto Heroes が挙げられた。ゲーム自体は 2020 年後半の公開予定だった。", k: fact, s: [src-tsb-decrypt-2020-presale]}
    - {phase: pre, t: "2020 年ホワイトペーパーの時点で、Foundation は 15 超のゲーム企画に資金を出し、2020-12 の公開に先立って 100 人のアーティストに NFT 制作の助成をしたと述べる。", k: claim, who: "The Sandbox（2020 年ホワイトペーパー）", s: [src-tsb-whitepaper]}
    - {phase: launch, date: "2021-11-29", t: "Alpha（〜2021-12-20）を公開した。報酬付きの体験に入れる Alpha Pass は 5,000 枚で、うち 1,000 枚を LAND 所有者の抽選、2,250 枚を 3 週間のコンテストの参加者に配り、達成者は最大 1,000 SAND と限定 NFT を得られた。Alpha のハブと 3 つの体験はパスなしでも入れた（公式ツイート）。", k: fact, s: [src-tsb-forklog-alpha]}
    - {phase: growth, date: "2021-12", t: "Alpha 期間の利用者は 20 万超とされる（定義不明）。同じ 2021-11 に Series B で 9300 万ドルを調達した。", k: fact, s: [src-tsb-wikipedia]}
  channels:
    - {id: invite-gating, t: "Alpha の報酬付き参加を 5,000 枚の Alpha Pass に限り、LAND 所有者の抽選とコンテストで配った（残る経路は記事に記載なし）。", k: fact, s: [src-tsb-forklog-alpha]}
    - {id: token-incentive, t: "Alpha Pass 保有者は課題の達成で最大 1,000 SAND と限定 NFT を得られた。", k: fact, s: [src-tsb-forklog-alpha]}
    - {id: builder-grants, t: "Foundation が 15 超のゲーム企画と 100 人のアーティストに助成し、公開前のコンテンツと制作者を確保したと運営は述べる。", k: claim, who: "The Sandbox（2020 年ホワイトペーパー）", s: [src-tsb-whitepaper]}
    - {id: ip-brand, t: "先行販売の段階から Shaun the Sheep のブランドや CryptoKitties など既存ブランド・NFT プロジェクトが LAND を買い、その名前が販売の告知に使われた。", k: fact, s: [src-tsb-decrypt-2020-presale]}
  cost:
    - {t: "先行販売の LAND 購入者が ETH で払い（2 回目だけで数時間に 800 ETH）、2021-11 には Series B で 9300 万ドルを調達した。親会社 Animoca Brands による Pixowl 買収（2018-08）が転換の起点。", k: fact, s: [src-tsb-decrypt-2020-presale, src-tsb-wikipedia]}
    - {t: "Alpha の報酬（1 人最大 1,000 SAND × 5,000 枚）と Foundation の助成は運営側が SAND と資金で負担した。ホワイトペーパーは SAND 建て取引手数料の 50% を Foundation に配分すると記載する。", k: fact, s: [src-tsb-forklog-alpha, src-tsb-whitepaper]}
  after:
    - {t: "2022-10 時点で、コントラクトと取引したウォレットは 24 時間で 522（DappRadar）。会社は約 20 万 MAU を主張した（定義不明）。Alpha 期間の 20 万超と同水準の主張だが、継続率は示されていない。", k: fact, s: [src-tsb-coindesk-2022, src-tsb-wikipedia]}
    - {t: "示されていない指標: 先行販売の購入者数、モバイル版のプレイヤーが Web3 版に移った数、Alpha 参加者のうち次のシーズンにも遊んだ割合。", k: unknown}
  counter:
    - {t: "4000 万ダウンロードのモバイル版プレイヤーが Web3 版の初期利用者になったことを示す資料は見つからなかった。初期の参加者は LAND の投資家と制作者で、既存 IP の利用者基盤が移ったとは言えない。", k: analysis, s: [src-tsb-whitepaper, src-tsb-decrypt-2020-presale]}
    - {t: "Alpha の 20 万超は、SAND 報酬の付いた期間限定イベントであり、大型調達と暗号資産相場の高値の時期と重なる。報酬目当ての一時流入と区別する資料はない。", k: analysis, s: [src-tsb-forklog-alpha, src-tsb-wikipedia]}
  lessons:
    - {t: "参加枠を土地所有者に優先配分する（LAND 所有者向け抽選）: 先行購入者に使い道を与え、土地の需要を支えられるが、ゲームを遊びたい人ではなく保有者に枠が回るため、プレイヤー層の検証にはならない。", k: analysis}
    - {t: "限定パス＋トークン報酬の期間限定シーズン: 参加者数の山は作れるが、報酬を外したときの継続を同時に測らないと、獲得の成否を判断できない。報酬額が参加枠ごとに固定なら費用は上限を決められる。", k: analysis}
  metrics: [m-tsb-franchise-downloads, m-tsb-presale-2019-12, m-tsb-presale-2020-02, m-tsb-alpha-passes, m-tsb-alpha-users, m-tsb-seriesb-2021, m-tsb-dappradar-2022-10, m-tsb-mau-claim-2022]
  unknowns: ["LAND 先行販売の購入者数（ウォレット数）と、そのうち実際に体験を公開した人の数", "Foundation の助成総額と、助成を受けたゲームの公開状況", "Alpha Pass の残り 1,750 枚の配布経路"]

