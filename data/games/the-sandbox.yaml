  coingecko: the-sandbox
chains: [Ethereum mainnet]
team: "The Sandbox（旧 Pixowl。2018-08 に Animoca Brands が買収。共同創業者 Arthur Madrid / Sébastien Borget）"
summary: >-
  2012 年のモバイル用ボクセル制作ゲームを、Animoca Brands による買収後にブロックチェーン付きの 3D 版として作り直した仮想世界プラットフォーム。
  166,464 区画の LAND（ERC-721）、制作物 ASSETS（ERC-1155）、通貨 SAND（ERC-20）を発行し、VoxEdit と Game Maker で作った体験を LAND 上に置く。
  既存のゲーム IP をトークン経済に転換した代表例で、2021 年に大型調達と土地販売を行い、2025 年には人員削減と経営体制の変更が報じられた。
selection_reason: >-
  既存のゲーム会社・IP が Web3 へ転換した例であり、土地販売を中心とした資金調達、ゲームロジックはサーバー側に置いたまま資産だけをトークン化する構成、
  そして 2022 年の利用者数論争で Decentraland と同じ指標の問題に直面した点を比較できるため。
categories:
  - {id: assets, role: primary, reason: "LAND（ERC-721）、ASSETS（ERC-1155）、SAND（ERC-20）。ゲーム体験はサーバー側"}
  - {id: p2e, role: secondary, reason: "Alpha Season 等で報酬を配り、制作者が SAND で収益化する設計を掲げた"}
status:
  value: active
