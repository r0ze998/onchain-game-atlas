    - {phase: pre, date: "2023-08-07", t: "Realms の公式 X が大口の暗号資産インフルエンサー（@blknoiz06）の投稿への返信で、テストネットで今すぐ遊べること、上位 3 名が 1 ゲームごとに LORDS を受け取ることを宣伝した。同時期、テストネット限定でガス代と 1 回分の通貨を持つ使い捨ての「Arcade Account」を配った。", k: fact, s: [src-ls-x-realms-2023-08, src-ls-hist-commits, src-ls-lootherald-2023], q: "It's an immutable arcade machine, available to playtest now - on Starknet."}
    - {phase: pre, date: "2023-09-05", t: "Realms の公式 X は Starknet 上の LORDS 保有者が 1.9 万人いるとし、Loot Survivor が LORDS を使う最初の mainnet ゲームになると告知した。既存トークン保有者を最初の有料プレイヤー候補として名指しした形。", k: claim, who: "Realms.World（@LootRealms）", s: [src-ls-x-realms-2023-09], q: "'Loot Survivor' will be the first game on mainnet to utilise Lords."}
