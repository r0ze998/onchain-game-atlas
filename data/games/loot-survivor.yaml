  - {t: "公開時期: Golden Token 文書は 2023-10-31 を最初のリリースとし、コミット履歴も同日に mainnet 構成をマージしているが、Starknet 公式ブログ（2023-11-07）は「テストネットで遊べる」と書く。", s: [src-ls-docs-golden-token, src-ls-hist-commits, src-ls-starknet-blog-2023]}
  - {t: "賞金の比率: コミュニティ記事（2023-10-20）は参加料の半分が上位者へ、残りを DAO とクライアント提供者で分けると書くが、2023-11-09 時点のコードは経過週数 12 以下で上位 3 名に 100%（48/32/20%）、13〜24 週で上位 72%・クライアント 28%、25 週以降で上位 56%・クライアント 24%・DAO 20% の段階制（3 位スコアが 200 未満の間は全額 DAO）。記事時点（2023-10-20）のコードも段階はブロック数基準で上位 100%→80%→64% であり、どの版も「半分」とは一致しない。", s: [src-ls-lootherald-2023, src-ls-hist-v1-lib, src-ls-hist-commits]}
  - {t: "LS2 の経済の可変性: SURVIVOR 文書はチケット収入の 80% 買付を「immutable code」が自動で行うと書く一方、Dungeon Tickets 文書は財庫と veLORDS の分配比率（Distribution Ratios）や発行パラメータを SURVIVOR 保有者がガバナンスで変更できると書く。", s: [src-ls-docs-token, src-ls-docs-tickets]}
  - {t: "Dojo のバージョン: Death Mountain の README は Dojo 1.5.1、Scarb.toml は v1.6.0、公式技術文書は 1.6.2 と記す（時点の違いの可能性）。", s: [src-ls-dm-repo, src-ls-docs-architecture]}
  - {t: "相性の名称: LS1 の README は Blade/Bludgeon/Magic、LS2 の文書は Magical/Brute/Hunter の 3 すくみと書く（版による変更の可能性）。", s: [src-ls-repo-pg, src-ls-docs-index]}

