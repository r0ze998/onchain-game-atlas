  channels:
    - {id: existing-community, t: "Realms / BibliothecaDAO の公式 X と LORDS 保有者に向けて告知し、LS1.5 のローンチ・トーナメントでは Realms を含む Starknet の 8 集合、LS2 では Loot・Realms・Dope Wars など Loot 系集合の保有者を無料ゲームの対象にした。", k: fact, s: [src-ls-x-realms-2023-09, src-ls-deploy-mainnet-15, src-ls-docs-eligible]}
    - {id: crypto-social, t: "Realms の公式 X が大口インフルエンサーの投稿に返信して、テストネットのプレイテストと LORDS の賞金を宣伝した。", k: fact, s: [src-ls-x-realms-2023-08]}
    - {id: prize-competition, t: "LS1 から上位 3 名に以後の参加料の一部を自動分配し、mainnet 初版と LS1.5 はトーナメントとして開始した。", k: fact, s: [src-ls-hist-v1-lib, src-ls-deploy-mainnet-15, src-ls-docs-golden-token]}
    - {id: free-mint, t: "テストネット限定の Arcade Account（ガス代と 1 回分の通貨付き）、NFT 保有者への無料ゲーム（LS1.5 のトーナメント、LS2 の約 50 万回）を配った。", k: fact, s: [src-ls-lootherald-2023, src-ls-deploy-mainnet-15, src-ls-docs-airdrop]}
    - {id: token-incentive, t: "LS2 で SURVIVOR をレベル到達に応じて配り、序盤の週は 4 倍にした。", k: fact, s: [src-ls-docs-tokenomics]}
    - {id: platform-distribution, t: "Starknet 公式ブログでの紹介と、Starkware・Cartridge が出資した 10 万 STRK の懸賞。", k: fact, s: [src-ls-starknet-blog-2023, src-ls-docs-wanted]}
  cost:
    - {t: "LS1/1.5 の賞金はプレイヤーの参加料が原資で、後から遊ぶ人の参加料が上位者に払われる（3 位のスコアが閾値未満の間は DAO または Provable Games へ）。", k: fact, s: [src-ls-hist-v1-lib, src-ls-code-lib15]}
    - {t: "LS1.5 の無料ゲームと 1 週間の無料 VRF は運営側の参加料・VRF 代の放棄で賄われ、LS2 の無料ゲーム約 50 万回（ガス込み）の負担者・総額は公表されていない。", k: fact, s: [src-ls-deploy-mainnet-15, src-ls-docs-token]}
    - {t: "Wanted Beast の 10 万 STRK は Starkware と Cartridge が拠出した。SURVIVOR は総量 1000 万の 75% がコミュニティ枠で、報酬はトークン放出で賄われる。", k: fact, s: [src-ls-docs-wanted, src-ls-docs-tokenomics]}
  after:
    - {t: "SURVIVOR 配分表は LS1 の Beast 2,306 体と LS1.5 の上位 1,000 人を記載し、旧版に一定の参加者層があったことを示すが、一意プレイヤー数は公表されていない。", k: fact, s: [src-ls-docs-tokenomics]}
    - {t: "約 8 万アドレスに配った無料ゲームに対し、2026-10 の直近 7 日のアクティブアドレスは 411（growthepie）。配布先のうち何割が遊び、残ったかは示されていない。", k: fact, s: [src-ls-docs-token, src-ls-growthepie]}
    - {t: "継続率、版をまたぐ再参加率、配布で来た人と参加料を払った人の比率は公表されていない。", k: unknown}
  counter:
    - {t: "初期プレイヤーが「既存コミュニティから来た」ことを示す直接のデータ（参加者のうち LORDS / Realms 保有者の割合）はない。1.9 万人という LORDS 保有者数も運営の投稿で、プレイヤー数ではない。", k: analysis, s: [src-ls-x-realms-2023-09]}
    - {t: "LS2 の活動は SURVIVOR 報酬（序盤 4 倍）・10 万 STRK の懸賞・無料ゲームと同時期で、ゲーム性による定着とトークン目当ての一時流入を公表データでは分けられない。", k: analysis, s: [src-ls-docs-tokenomics, src-ls-docs-wanted, src-ls-growthepie]}
    - {t: "Starknet 公式ブログは 2023-11-07 時点で「テストネットで遊べる」と書いており、mainnet 初版（プレリリース・トーナメント）の規模は小さかった可能性がある。", k: analysis, s: [src-ls-starknet-blog-2023, src-ls-hist-commits]}
  lessons:
    - {t: "集合単位のローンチ・トーナメント（LS1.5）: 同じチェーン上の複数 NFT 集合の保有者に無料ゲームを割り当て、集合ごとの最高スコアを競わせると、各集合のコミュニティが自分たちで告知する動機を持つ。効く条件は集合の保有をコントラクトで確認でき、無料回数に集合ごとの上限（LS1.5 は 1,600 回）を設けること。破綻条件は大量保有者が無料回数を独占する場合や、無料期間後に有料で続ける理由（賞金・トークン）が弱い場合。", k: analysis}
    - {t: "保有者エアドロップの対象を親コミュニティの外へ広げる（LS2）: Loot 系だけでなく BAYC・Pudgy Penguins などの保有者に無料回数を配ると、新しい層に試してもらえる。効く条件は 1 回が数分で終わり無料回数でも面白さが分かること、アドレス上限（50 回）があること。破綻条件は配布先が数万アドレスでも週次アクティブが数百にとどまる場合で、配布の規模は定着の指標にならない。", k: analysis}
  metrics: [m-ls-lords-holders-2023, m-ls-golden-token-v1, m-ls-15-launch-games, m-ls-free-games-airdrop, m-ls-wanted-bounty, m-ls-ls1-beasts, m-ls-growthepie-7d-addr]
  unknowns:
    - "テストネット期間（2023-04〜10）の参加者数と、mainnet 初版（2023-10-31〜11-08）のプレイ数。"
    - "LS1.5 のローンチ・トーナメントで各集合が実際に何回の無料ゲームを使い、どの集合が勝ったか。"
    - "LS2 の無料ゲーム約 50 万回のうち実際に使われた回数、配布の費用負担者。"
    - "Discord の参加者数の推移と、Realms / Loot の保有者が最初のプレイヤーに占めた割合。"

