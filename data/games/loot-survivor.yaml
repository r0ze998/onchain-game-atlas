    - {phase: launch, date: "2023-11-07", t: "Starknet 公式ブログが Loot Survivor と Influence を「フルオンチェーンゲーム」として紹介した（チェーン運営側による露出）。", k: fact, s: [src-ls-starknet-blog-2023]}
    - {phase: growth, date: "2024-09", t: "LS1.5 の mainnet 展開スクリプトは 30 日間のローンチ・トーナメントを設定し、Starknet 上の 8 つの NFT 集合（Bloberts、Influence、Ducks、Everai、Pixel Banners、Realms、Focus Tree、Syndicate）の保有者に 1 NFT あたり 1〜6 回の無料ゲーム（集合ごとに上限 1,600 回）を与え、VRF 代も最初の 1 週間無料にした。", k: fact, s: [src-ls-deploy-mainnet-15, src-ls-code-lib15]}
    - {phase: growth, date: "2025-08-18", t: "LS2 の無料ゲーム配布のスナップショット。6 チェーン 55 集合（Loot・Realms・Dope Wars 等の Loot 系に加え BAYC・Pudgy Penguins・Moonbirds など一般の NFT 集合、Discord ロール 1 件）の保有者に、1 アドレス最大 50 回、計約 50 万回を配った。", k: fact, s: [src-ls-docs-airdrop, src-ls-docs-eligible, src-ls-docs-token]}
