id: pirate-nation
name: Pirate Nation
name_ja: パイレーツ・ネイション
aliases: ["Proof of Play", "Apex", "Boss Chain"]
kind: game
depth: index
updated: "2026-10-24"
links:
  github: https://github.com/proofofplay/piratenation-contracts
ids:
  coingecko: pirate-token
chains: [Polygon（初期）, Arbitrum Nova, "Apex（Arbitrum L3）", "Boss Chain（Arbitrum L3）", Ethereum mainnet（PFP NFT）, Abstract（Arcade 版）]
team: "Proof of Play（CEO Amitt Mahajan、FarmVille の共同制作者）"
summary: >-
  Proof of Play のボクセル調・海賊 RPG。300 以上のコントラクトにゲームロジックの多くを載せ、プレイヤーの手数料を運営が肩代わりするため Polygon → Arbitrum Nova → 自前の Arbitrum L3（Apex、続いて Boss Chain）へと移った。
  ピーク時に日次 10 万超のアクティブウォレット・1 日 100 万件超のトランザクションに達したと報じられたが、約 1 万まで減った 2025-08 に終了を告知し、2025-09-18 にゲームを、09-25 に 2 本の L3 を停止した。
  2026-08 に会社自体の終了と、Unity クライアント・コントラクト・内部ツールのオープンソース化、アートの CC0 化が報じられた（コントラクトのリポジトリ自体は 2025-09-18 に公開済み）。
selection_reason: >-
  「専用チェーンを持ち、ガスを運営が負担する大規模オンチェーン RPG」の規模・費用・終了の経緯が数値付きで報じられた事例で、ゲーム専用チェーンの固定費が終了判断に直結したことを示す。
  また、戦闘結果を運営のバリデーター権限で書き込む設計は「オンチェーン」の範囲を見極める比較対象になるため。
categories:
  - {id: onchain-rules, role: primary, reason: "クエスト・クラフト・装備・取引などの多くを 300 超のコントラクトで実行（戦闘結果は運営の検証役が書き込む）"}
  - {id: infra, role: secondary, reason: "Arbitrum Nova から自前の L3（Apex, Boss）へ移行し、運営費が終了理由になった"}
  - {id: p2e, role: secondary, reason: "2024-06 にプレイして稼ぐシーズン経由で PIRATE トークンを発行"}
status:
  value: ended
  as_of: "2026-10"
  note: "オンチェーン版は 2025-09-18 に停止、Apex と Boss は 2025-09-25 に停止。PvE の一部は Abstract 上の Proof of Play Arcade に残ると 2025-09 に報じられた。2026-08-04 に Proof of Play が X で事業終了を告知し、Pirate Nation Foundation が PIRATE トークンの支援を続けると報じられた。"
  s: [src-pn-bcg-shutdown-date, src-pn-bcg-kill, src-pn-bcg-company-end, src-pn-pop-x]
dates:
  launched: {date: "2022-12", s: [src-pn-decrypt-nova], note: "Decrypt は 2022-12 開始と記載。BlockchainGamer.biz は「2023 年から稼働」、The Block は 2024-08 時点で「約 3 か月前」に開始と記載（contradictions 参照）"}
  ended: {date: "2025-09-18", s: [src-pn-bcg-shutdown-date], note: "オンチェーン版の停止日。L3 は 09-25"}

architecture:
  onchain:
    level: partial-rules
    detail: >-
      GameRegistry に登録されたコンポーネント／システム型のコントラクト群（ロール制御）で、クエスト・クラフト・装備・取引・ショップ・ダンジョン等を実行。
      ダンジョン戦闘や PvP の結果は BATTLE_VALIDATOR_ROLE／PVP_VALIDATOR_ROLE を持つ運営側エンドポイントが、検証データの IPFS URL とともにまとめて書き込む。
    s: [src-pn-contracts]
  offchain:
    - {item: "戦闘の検証役（バリデーター・エンドポイント）", s: [src-pn-contracts]}
    - {item: "アートは IPFS（2023 年時点）", s: [src-pn-decrypt-nova]}
    - {item: "trusted forwarder（PopForwarder）による手数料肩代わり", s: [src-pn-contracts, src-pn-decrypt-nova]}
  admin:
    level: significant
    detail: "MANAGER_ROLE によるアカウントの BAN、PAUSER_ROLE による停止、GAME_LOGIC_CONTRACT_ROLE を与えたコントラクトだけが状態を書き換えられる許可制、アップグレード可能なコントラクト群。"
    s: [src-pn-contracts]
  open_source:
    level: full
    detail: "終了後にコントラクト（piratenation-contracts、2025-09-18 公開、MIT）、Unity クライアント（アーカイブ版）、内部ツールを GitHub で公開し、アートを CC0 にした。"
    url: "https://github.com/proofofplay"
    s: [src-pn-contracts, src-pn-github-org, src-pn-bcg-company-end]
  extensibility:
    level: none
    detail: "ゲームロジックの書き換えは GAME_LOGIC_CONTRACT_ROLE を運営が付与したコントラクトに限られ、第三者の許可不要拡張は確認できなかった。"
    s: [src-pn-contracts]

compare:
  gameplay: {t: "海賊キャラクター（NFT）を育て、クエスト・ダンジョン・PvP・クラフトで資源と装備を集めるブラウザ RPG。", k: fact, s: [src-pn-decrypt-nova, src-pn-contracts]}
  necessity: {t: "Decrypt は CEO への取材をもとに「ほぼ完全にオンチェーン（アートのみ IPFS）」と記したが、コード上は戦闘結果を運営の検証役が書き込み、ロジック追加も運営の許可制だった。結果として、終了時にゲームを第三者が継続する経路はなかった。", k: analysis, s: [src-pn-decrypt-nova, src-pn-contracts]}
  information: {t: "未確認（戦闘の詳細データは IPFS に置かれ、結果のみチェーンに記録される形）。", k: unknown}
  persistence: {t: "運営が 2 本の L3 を停止したため、ゲーム状態はチェーンごと失われた。プレイヤーは停止前にトークンを引き出し、ゲーム内資産を「Plunder Certificate」に変換して将来の PIRATE 配布と交換する措置が取られた。", k: fact, s: [src-pn-bcg-kill, src-pn-bcg-shutdown-date]}
  extensibility: {t: "第三者による許可不要拡張の仕組みはなかった。", k: fact, s: [src-pn-contracts]}
  money_flow: {t: "運営がガスを負担（Polygon 期は 1 日 3000〜4000 ドル、CEO 発言）し、終了時のチェーンとゲームの運営費は月 15 万ドルと報じられた。資金は 2023 年の 3300 万ドルのシード（a16z crypto・Greenoaks 共同主導）。運営の収益構成（NFT 販売・トークン等の内訳）は検証した出典では確認できなかった。", k: fact, s: [src-pn-decrypt-nova, src-pn-bcg-shutdown-date, src-pn-theblock-boss]}
  entry_barrier: {t: "無料で遊べ（The Block）、手数料は運営が肩代わりした（Decrypt、Polygon 期の CEO 発言）。", k: fact, s: [src-pn-theblock-boss, src-pn-decrypt-nova]}

concepts: [c-own-chain, c-gas-abstraction, c-onchain-state, c-nft-asset, e-p2e, c-onchain-randomness, c-cc0]

metrics:
  - {id: m-pn-polygon-gas, type: other, value_text: "1 日 3000〜4000 ドル", unit: USD/day, period: "2023-03 以前（Polygon 期）", definition: "運営が肩代わりしていたガス代（CEO 発言）", nature: reported, s: [src-pn-decrypt-nova]}
  - {id: m-pn-apex-tx, type: transactions, value: 2500000, value_text: "約 250 万件／日", unit: tx/day, period: "2024-08", definition: "Apex チェーンの 1 日あたりトランザクション数（The Block が Proof of Play の声明として記載）", nature: reported, s: [src-pn-theblock-boss]}
  - {id: m-pn-peak-dauw, type: dau, value: 100000, value_text: "10 万超（ピーク）→ 約 1 万（2025-08）", unit: wallets, period: "ピーク時期不明〜2025-08", definition: "日次アクティブ・ユニークウォレット（DAUW）。BlockchainGamer.biz が運営の説明として記載", nature: reported, s: [src-pn-bcg-kill, src-pn-bcg-shutdown-date]}
  - {id: m-pn-opcost, type: other, value: 150000, value_text: "月 15 万ドル", unit: USD/month, period: "2025-08", definition: "2 本の L3 とゲームの運営費（運営発表）", nature: reported, s: [src-pn-bcg-shutdown-date]}
  - {id: m-pn-seed, type: funding, value: 33000000, unit: USD, period: "2023", definition: "シードラウンド（a16z crypto・Greenoaks 共同主導）", nature: reported, s: [src-pn-theblock-boss, src-pn-bcg-company-end]}
  - {id: m-pn-booty-partners, type: other, value: 60, value_text: "提携 Discord コミュニティ 60（12・16・32 の 3 回）", unit: communities, period: "2024-05 頃（BOOTY シーズン）", definition: "BOOTY ポイントの対抗戦に参加した提携コミュニティ数（分析ブログの記載）", nature: reported, s: [src-pn-tpan-booty]}

acquisition:
  audience: [players, holders]
  summary: {t: "最初の参加者は 2022-12 からの招待制ベータに入った暗号資産利用者で（創設時 NFT の Founder's Pirates 保有者の割合は不明）、FarmVille の共同制作者が率いる a16z 出資のスタジオという報道上の看板があった。2023-09 から無料キャラクターでの参加を招待・待機リスト付きで開き、2024 年はトークン配布前のポイント（BOOTY）と紹介・提携コミュニティ・SNS 課題で人を集め、ガス代を運営が負担することで取引数を大きく伸ばした。", k: analysis, s: [src-pn-gamesbeat-seed, src-pn-decrypt-seed, src-pn-tpan-booty, src-pn-decrypt-nova]}
  steps:
    - {phase: pre, date: "2022-12", t: "2022-12 にベータとして公開し、以後毎週更新を出した。2023-09 時点でも GamesBeat は「招待制のオンチェーン海賊 RPG」と書いている。", k: fact, s: [src-pn-gamesbeat-seed, src-pn-decrypt-nova]}
    - {phase: pre, date: "2023-03-30", t: "Polygon 期はプレイヤーの手数料を運営が肩代わりし（1 日 3,000〜4,000 ドル）、ウォレット署名なしでゲーム内の取得ができた。一部のプレイヤーは先に Ethereum 本体で NFT を買ってから遊び始めたと CEO は述べた。", k: claim, who: "Amitt Mahajan (CEO)", s: [src-pn-decrypt-nova]}
    - {phase: launch, date: "2023-09-21", t: "3,300 万ドルのシード（a16z crypto・Greenoaks 共同主導）の発表と同時に、NFT を持たなくても無料キャラクターで遊べる free-to-play を「コミュニティ招待」ベースで開放し始めた。Fortune は無料だが待機リストがあると書いた。", k: fact, s: [src-pn-decrypt-seed, src-pn-fortune-seed, src-pn-gamesbeat-seed]}
    - {phase: growth, date: "2024-05", t: "トークン配布前のポイント BOOTY を配るシーズンで、Founder's Pirates 保有数に応じた倍率、連続ログインの倍率、ゲーム内進行、紹介（紹介相手が Command Rank 2 に達したときのみ）、X・Discord の課題、提携 Discord サーバー 60 個（3 回に分けて発表）の対抗戦を組み合わせた。Apex チェーンの取引数は 1 日 100 万件に近づいていたという。", k: claim, who: "Web3 with TPan（分析ブログ）", s: [src-pn-tpan-booty]}
    - {phase: growth, date: "2024-06", t: "PIRATE トークンを play-to-earn シーズン経由で 2024-06 に発行し、その後のイベントでも PIRATE の配分を得られるようにした。", k: fact, s: [src-pn-bcg-kill]}
    - {phase: growth, date: "2024-08", t: "Apex の取引は 1 日約 250 万件に達し、容量上限のため 2 本目のチェーン Boss Chain を追加した。", k: claim, who: "Proof of Play（The Block 経由）", s: [src-pn-theblock-boss]}
  channels:
    - {id: invite-gating, t: "2022-12 からのベータは招待制で、2023-09 の free-to-play も「コミュニティ招待」と待機リストで段階的に開いた。", k: fact, s: [src-pn-gamesbeat-seed, src-pn-decrypt-seed, src-pn-fortune-seed]}
    - {id: existing-community, t: "創設時の NFT コレクション Founder's Pirates の保有者が BOOTY の倍率など最も厚い優遇を受け、提携先の 60 の Discord コミュニティを対抗戦形式で巻き込んだ。", k: claim, who: "Web3 with TPan", s: [src-pn-tpan-booty, src-pn-decrypt-seed]}
    - {id: free-mint, t: "無料キャラクター（Starter Pirate）は運営の API 権限で 1 アカウント 1 体だけ発行され、譲渡不可（soulbound）だった。", k: fact, s: [src-pn-contracts, src-pn-decrypt-seed]}
    - {id: token-incentive, t: "BOOTY ポイントのシーズンを経て PIRATE トークンを配り、以後もイベントで PIRATE の配分を与えた。", k: fact, s: [src-pn-tpan-booty, src-pn-bcg-kill]}
    - {id: referral, t: "紹介相手が Command Rank 2 に達したときだけ BOOTY が付く紹介制度（上限 4 万）を置いた。", k: claim, who: "Web3 with TPan", s: [src-pn-tpan-booty]}
    - {id: crypto-social, t: "X の「いいね」・リツイート、Discord のプロフィール変更や名前への「Pirate」追加などの課題に BOOTY を付けた。", k: claim, who: "Web3 with TPan", s: [src-pn-tpan-booty]}
    - {id: press, t: "シード調達は「FarmVille の共同制作者」の新作として Decrypt・Fortune・GamesBeat・The Block に取り上げられた。", k: fact, s: [src-pn-decrypt-seed, src-pn-fortune-seed, src-pn-gamesbeat-seed, src-pn-theblock-boss]}
  cost:
    - {t: "参加の障壁を下げる費用は運営が負担した。Polygon 期のガス肩代わりは 1 日 3,000〜4,000 ドル、終了時の 2 本の L3 とゲームの運営費は月 15 万ドルとされ、原資は 3,300 万ドルのシードだった。報酬は PIRATE トークンの放出で払われた。", k: fact, s: [src-pn-decrypt-nova, src-pn-bcg-shutdown-date, src-pn-theblock-boss, src-pn-bcg-kill]}
  after:
    - {t: "日次アクティブウォレットはピーク時の 10 万超から 2025-08 には約 1 万に減り、運営は「継続投資を正当化できるだけの利用者を集められなかった」として 2025-09 に終了した。", k: claim, who: "Proof of Play（BlockchainGamer.biz 経由）", s: [src-pn-bcg-kill, src-pn-bcg-shutdown-date], q: "the game has not attracted enough of an audience to justify continued investment and operation"}
  counter:
    - {t: "1 日数百万件の取引は、ガス代が運営負担でポイント（BOOTY）が行動量に応じて付く環境での数字で、人間の活動量や人数を表さない。ピーク DAUW の時期がポイント・トークン配布期と一致するかは確認できなかった。", k: analysis, s: [src-pn-tpan-booty, src-pn-theblock-boss, src-pn-bcg-kill]}
    - {t: "free-to-play の開放は待機リストと招待付きで、最初の利用者の多くは NFT 保有者と暗号資産利用者だった。運営費を賄うほどの層には広がらなかったことを、運営自身の終了理由が示している。", k: analysis, s: [src-pn-fortune-seed, src-pn-bcg-kill]}
  lessons:
    - {t: "紹介の成立条件を相手の進行度に置く（Command Rank 2 到達で初めて点が付く）と、紹介だけのための使い捨てアカウントの採算を下げられる。効く条件は進行に時間か操作が必要なこと。破綻条件はガス無料・自動化可能な環境で、進行自体がボットで安く達成できる場合。", k: analysis}
    - {t: "ガス代を運営が全額負担すると参加障壁は消えるが、取引数・ウォレット数はポイント目的の行動で膨らみ、その費用（専用チェーンの固定費）は利用者数ではなく取引量に比例して増える。運営費が月 15 万ドルに達した時点で利用者が約 1 万では続かなかった。", k: analysis}
  metrics: [m-pn-polygon-gas, m-pn-seed, m-pn-booty-partners, m-pn-apex-tx, m-pn-peak-dauw, m-pn-opcost]
  unknowns:
    - "Founder's Pirates の販売時期・価格・購入者数と、ベータ参加者に占める保有者の割合"
    - "招待・待機リストの規模と、free-to-play 開放後の新規登録数"
    - "BOOTY シーズンの正確な期間と参加ウォレット数、紹介経由の割合"

