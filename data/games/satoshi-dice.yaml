  - {id: m-satoshidice-buyback, type: other, value: 45500, value_text: "45,500 BTC（約 380 万ドル）", unit: BTC, period: "2013-07", definition: "全株式の買い戻し総額（1 株 0.0035 BTC。SEC 命令）", nature: reported, s: [src-satoshidice-sec-order]}
  - {id: m-satoshidice-sale, type: other, value: 126315, value_text: "126,315 BTC（約 1150 万ドル）", unit: BTC, period: "2013-07", definition: "匿名の買い手への売却額として報じられた額", nature: reported, s: [src-satoshidice-habr-2013]}
  - {id: m-satoshidice-bets, type: transactions, value: 5300000, value_text: "530 万件の賭け（うち 390 万件超が当たり）", unit: bets, period: "2013-07 時点の累計", definition: "記事が伝えたサイト上の累計の賭け数", nature: reported, s: [src-satoshidice-habr-2013]}
  - {id: m-satoshidice-house-edge, type: other, value: 1.9, unit: "%", period: "Bitcoin Wiki 記載時点", definition: "各アドレスのハウスエッジ", nature: reported, s: [src-satoshidice-bitcoinwiki]}

events:
  - {id: ev-satoshidice-launch, date: "2012-04", type: launch, title: "SatoshiDice 開始", s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki]}
  - {id: ev-satoshidice-ipo, date: "2012-08", type: funding, title: "MPEx で株式 S.DICE の売り出し開始（〜2013-02）", s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki]}
  - {id: ev-satoshidice-us-block, date: "2013-05", type: spec-change, title: "米国からの利用を遮断", s: [src-satoshidice-bitcoinwiki]}
  - {id: ev-satoshidice-btc082, date: "2013-05-29", type: other, title: "Bitcoin 0.8.2 が極小出力を非標準化", s: [src-satoshidice-btc082]}
  - {id: ev-satoshidice-sale, date: "2013-07", type: other, title: "126,315 BTC で売却、株式を買い戻し", s: [src-satoshidice-sec-order, src-satoshidice-habr-2013]}
  - {id: ev-satoshidice-sec, date: "2014-06-03", type: incident, title: "SEC が Voorhees の無登録株式売り出しについて命令", detail: "SatoshiDICE と FeedZeBirds の株式を BTC で売った件", s: [src-satoshidice-sec-order]}

relations:
  - {to: huntercoin, type: contrasts-with, basis: analytic, note: "SatoshiDice は判定をサーバーで行いチェーンを送金路として使った。Huntercoin は判定をコンセンサスに入れた"}
  - {to: fomo3d, type: similar-to, basis: analytic, note: "オンチェーンの賭博が取引量の大きな部分を占め、基盤側の議論を呼んだ系譜"}
  - {to: c-commit-reveal, type: similar-to, basis: analytic, note: "運営の秘密値を後から公開して判定を検証可能にする仕組みは、一方向のコミット・リビールに近い（事前にハッシュを公開していたかは未確認）"}

unknowns:
  - "Bitcoin 全取引に占める割合の、定義と期間を明示した独立計測（Voorhees の「50% 超」の一次投稿は取得できず）。"
  - "運営の秘密値のハッシュを事前に公開していたか（コミット・リビールとして成立していたか）。"
  - "2013-07 の売却後の運営主体と現在の状態。"
  - "サーバーのソースコードの公開有無。"
contradictions:
  - {t: "取引比率: Bitcoin Wiki は公開直後に「他の全用途を合わせたより多くの取引」と記し、arXiv サーベイは「半分超」と要約する。一方、99bitcoins（検索要約のみ）は 2013-06 について 1 日約 1.24 万件の賭けと約 4.84 万件の全取引から 25%〜50% 超の幅で推計しており、1 回の賭けを何取引と数えるかで比率が大きく変わる。", s: [src-satoshidice-bitcoinwiki, src-satoshidice-survey-2019, src-satoshidice-99bitcoins]}
  - {t: "創設者: SEC 命令は Voorhees がサイトを立ち上げたとし、Bitcoin Wiki は bitcointalk ユーザー FireDuck が作り Voorhees が告知したと記す。", s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki]}

