id: satoshi-dice
name: SatoshiDice
name_ja: サトシダイス
aliases: [Satoshi Dice, SatoshiDICE, S.DICE]
kind: game
depth: index
updated: "2026-10-24"
chains: [Bitcoin]
team: "Erik Voorhees ら共同所有者（2012-04〜2013-07）。2013-07 に匿名の買い手へ売却。開発は bitcointalk の FireDuck とする記述もある"
summary: >-
  2012 年 4 月に始まった Bitcoin 上のサイコロ賭博。プレイヤーは倍率ごとに決まった固定アドレスへ BTC を送るだけで賭けが成立し、
  運営のサーバーが「賭けの取引ハッシュ＋運営の秘密値」のハッシュで勝敗を決め、当たれば配当、外れでもごく少額を返す取引を送り返した。
  1 回の賭けが最低 2 件のオンチェーン取引になる設計で、一時は Bitcoin の取引の過半を占めたと主張され、少額出力（dust）とブロック容量をめぐる議論の当事者になった。
selection_reason: >-
  チェーンを「判定の場」ではなく「賭けの送受信路」として使った最初期の大規模なオンチェーン・ゲームであり、ゲームが基盤の取引量・手数料設計に与える負荷という問題の起点だから。
  判定は運営サーバーにあり、後の「ルールのオンチェーン実行」とは対照的な例でもある。
categories:
  - {id: infra, role: primary, reason: "1 回の賭けが複数の取引になり、Bitcoin の取引量・少額出力・ブロック容量の議論を引き起こした"}
  - {id: assets, role: secondary, reason: "賭け金と配当は BTC そのもの。運営会社の株式も MPEx で取引された（ゲーム資産ではなく事業持分）"}
status:
  value: unknown
  as_of: "2026-10"
  note: "2013-07 に売却。2014 年にはオフチェーンのセッション型の賭けが追加されたと Bitcoin Wiki は記す。現在の運営状況は本調査で確認していない。"
  s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki]
dates:
  launched: {date: "2012-04", s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki], note: "SEC の命令は 2012-04 にサイトを立ち上げたと記載。Bitcoin Wiki は bitcointalk での告知を 2012-04-24 とする"}

architecture:
  onchain:
    level: assets-only
    detail: >-
      チェーン上にあるのは賭け（固定アドレスへの送金）と配当・返金の取引だけ。勝敗の判定は運営のサーバーが、賭け取引のハッシュと運営の秘密値から計算し、
      秘密値を後から公開することで検証可能にした（「Provably Fair」の先駆とされる）。判定ロジックの実行はチェーン外。
    s: [src-satoshidice-bitcoinwiki]
  offchain:
    - {item: "勝敗判定、配当取引の作成と送信は運営サーバー", s: [src-satoshidice-bitcoinwiki]}
    - {item: "2014 年以降のセッション型の賭けはオフチェーン（ゼロ承認取引の二重支払いリスク等への対応とされる）", s: [src-satoshidice-bitcoinwiki, src-satoshidice-uibk-thesis]}
  admin:
    level: significant
    detail: "運営が秘密値・資金・判定を持つ中央集権型。米国からの利用は 2013-05 に遮断された。"
    s: [src-satoshidice-bitcoinwiki]
  open_source:
    level: unknown
    detail: "サーバーのソース公開は確認できなかった。"
    s: []
  extensibility:
    level: none
    detail: "固定アドレスに送金するだけなので、どのウォレットからでも参加できたが、ルールの拡張はできない。"
    s: [src-satoshidice-bitcoinwiki]

compare:
  gameplay: {t: "倍率（当たり確率）ごとに異なる固定アドレスへ BTC を送ると、運営が 0〜65535 の数を決め、選んだ閾値より小さければ倍率に応じた配当が送り返される。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  necessity: {t: "Bitcoin は支払い手段と、賭けと結果の記録としてのみ使われ、判定はサーバー。チェーンなしでも同じ賭博は成立し、チェーンの寄与は「入出金の手軽さ」と事後検証の公開性にとどまる。", k: analysis, s: [src-satoshidice-bitcoinwiki]}
  information: {t: "賭けと配当の取引は公開。判定に使う秘密値は事前には非公開で、後から公開して検証可能にした。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  persistence: {t: "運営が止まれば賭けは成立しない（送った BTC が返ってこない）。", k: analysis, s: [src-satoshidice-bitcoinwiki]}
  extensibility: {t: "第三者による拡張の手段はない。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  money_flow: {t: "プレイヤーの賭け金が原資で、ハウスエッジは 1.9%。各賭けの手数料は採掘者へ。運営会社は株式を MPEx で売り出して 50,600 BTC を調達し、2013-07 に 1 株 0.0035 BTC、計 45,500 BTC で買い戻した。", k: fact, s: [src-satoshidice-bitcoinwiki, src-satoshidice-sec-order]}
  entry_barrier: {t: "任意の Bitcoin ウォレットから送金するだけで、サイトへの登録もクライアントも不要。各賭けに取引手数料がかかる。", k: fact, s: [src-satoshidice-bitcoinwiki]}

concepts: [c-onchain-randomness, c-commit-reveal, e-entry-fee-prize]

article:
  constraints:
    - {t: "1 回の賭けが賭けと結果の 2 取引以上になり、外れでもごく少額を返すため、少額出力が大量に生まれた。Bitcoin Wiki は、これを手数料による DoS 対策を迂回する攻撃とみなす立場と、手数料モデルが想定通りに働かなかった証拠とみなす立場の両方を記す。", k: fact, s: [src-satoshidice-bitcoinwiki], q: "spams the p2p network and blockchain with useless data"}
    - {t: "Bitcoin 0.8.2（2013-05-29）は最低中継手数料の 0.543 倍（0.00005430 BTC）未満の出力を非標準とした。リリースノートは SatoshiDice に言及していないが、外れ時の極小返金のような出力は中継されにくくなった。", k: fact, s: [src-satoshidice-btc082]}
  principles:
    - {t: "ゲーム行為を基盤の取引に 1 対 1 で載せると、ゲームの人気がそのまま基盤の負荷になり、基盤側の規則変更（少額出力の非標準化など）でゲーム設計が制約される。チェーンを共有する限り、他の利用者との外部性の調整が避けられない。", k: analysis, s: [src-satoshidice-bitcoinwiki, src-satoshidice-btc082]}
  counter_evidence:
    - {t: "「全取引の過半」という数字は Voorhees 自身の主張や二次資料で、定義（件数か金額か、累計か期間か）がまちまち。連邦準備制度の論文は、データのある期間について小額取引の大半が同サービス関連だったと述べるにとどまる。", k: analysis, s: [src-satoshidice-fed-2014, src-satoshidice-survey-2019]}

acquisition:
  audience: [players]
  summary: {t: "最初のプレイヤーは、すでに Bitcoin とウォレットを持っていた bitcointalk フォーラムの利用者で、2012-04-24 の運営者自身の告知スレッドから来た。登録もクライアントも不要で、告知に並んだ固定アドレスに送金するだけで賭けられたことが、参加の手間をほぼゼロにした。", k: analysis, s: [src-satoshidice-btt-ann, src-satoshidice-bitcoinwiki]}
  steps:
    - {phase: pre, t: "Bitcoin Wiki によれば、仕組みは bitcointalk ユーザー FireDuck が作り、別の運営者（Voorhees）に売却された。SEC 命令は Voorhees がサイトを立ち上げたと記しており、どちらが「最初」かは資料で異なる。", k: fact, s: [src-satoshidice-bitcoinwiki, src-satoshidice-sec-order]}
    - {phase: launch, date: "2012-04-24", t: "evoorhees（Voorhees）が bitcointalk に「SatoshiDICE.com - Verified rolls, up to 65,000x winning」を投稿。同日中に複数のフォーラム利用者が少額で賭けて当たりを報告し、別の利用者は秘密値の日付切り替えを運営が操作し得ると指摘して、運営もそれを認めた。", k: fact, s: [src-satoshidice-btt-ann], q: "To play, you just send coins to any of the listed addresses based on the odds you want."}
    - {phase: launch, date: "2012-04-24", t: "公開直後の賭け上限は低く、65,000 倍の賭けの上限は約 0.0013 BTC だった。運営は上限は運営の資金量で決まり、資金が増えれば上げると返信した。", k: fact, s: [src-satoshidice-btt-ann]}
    - {phase: growth, date: "2012-05-04", t: "Voorhees は Bitcoin の取引数が過去最高を記録し、その急増の大半が SatoshiDice によるものだと同じフォーラムに投稿した（件数や割合の数値は示していない）。", k: claim, who: "Erik Voorhees（運営）", s: [src-satoshidice-btt-txrecord], q: "the vast majority of the huge spike in the past couple days was SatoshiDice.com"}
    - {phase: growth, date: "2012-05-09", t: "フォーラム利用者 payb.tc が SatoshiDice をマーチンゲール法で自動的に賭ける PHP ボットを公開した。送金だけで賭けられる設計のため、第三者が自動化スクリプトを書けた。", k: fact, s: [src-satoshidice-btt-martingale], q: "i went and wrote this script yesterday for playing satoshidice martingale-style."}
    - {phase: growth, date: "2012-08-20", t: "Voorhees は bitcointalk に MPEx 上の配当付き株式 S.DICE のスレッドを立て、2013-02 までに 50,600 BTC を調達した。賭けの利用者とは別に、配当を受け取る出資者の層ができた。", k: fact, s: [src-satoshidice-btt-ipo, src-satoshidice-sec-order]}
    - {phase: growth, date: "2013-05", t: "米国からの利用を遮断した。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  channels:
    - {id: crypto-social, t: "運営者本人が bitcointalk に告知スレッドを立て、利用者の当たり報告や公平性の指摘も同じスレッドで行われた。", k: fact, s: [src-satoshidice-btt-ann]}
    - {id: existing-community, t: "対象は、すでに BTC を持ち任意のウォレットから送金できた 2012 年の Bitcoin 利用者だった。", k: analysis, s: [src-satoshidice-btt-ann, src-satoshidice-bitcoinwiki]}
    - {id: composability, t: "固定アドレスに送金するだけの仕組みなので、第三者がマーチンゲール法の自動賭けボットを書いて公開した。", k: fact, s: [src-satoshidice-btt-martingale]}
  cost:
    - {t: "賭けの配当はプレイヤーの賭け金でまかなわれ、ハウスエッジは 1.9%。公開直後の賭け上限は運営の資金量に縛られていた。", k: fact, s: [src-satoshidice-bitcoinwiki, src-satoshidice-btt-ann]}
    - {t: "2012-08〜2013-02 に MPEx の株式売り出しで 50,600 BTC を調達した。使途の内訳は確認していない。広告費・アフィリエイト報酬の支出は確認できなかった。", k: fact, s: [src-satoshidice-sec-order]}
  after:
    - {t: "2013-07 の売却時点で、累計 530 万件の賭けと報じられた。人数・継続率は公表されていない。", k: fact, s: [src-satoshidice-habr-2013]}
    - {t: "2013-05 の米国遮断、2013-05-29 の Bitcoin 0.8.2 による極小出力の非標準化と、規制と基盤の規則変更がともに利用の条件を変えた。", k: fact, s: [src-satoshidice-bitcoinwiki, src-satoshidice-btc082]}
  counter:
    - {t: "取引数の多さは利用者の多さを意味しない。1 回の賭けが 2 取引以上になり、公開 2 週間でマーチンゲールボットが公開されていたので、取引数の一部は少数の利用者の自動化による可能性がある。", k: analysis, s: [src-satoshidice-btt-martingale, src-satoshidice-bitcoinwiki]}
    - {t: "告知スレッドの冒頭投稿は 2012-11-13 に最終編集されており、「world's most popular Bitcoin betting site」などの現在の文言が公開日のものとは限らない。", k: fact, s: [src-satoshidice-btt-ann]}
    - {t: "2012 年の Bitcoin は取引の総数がまだ小さかったので、少数の利用者でも比率は大きく見えた。「全取引の過半」は、集客の大きさよりも、母数が小さかったことを示している可能性がある。", k: analysis, s: [src-satoshidice-fed-2014, src-satoshidice-survey-2019]}
  lessons:
    - {t: "送金即参加: 既存の支払い路（固定アドレスへの送金）をそのまま参加手段にすると、登録・ダウンロード・説明なしで既存のコイン保有者が遊べる。効く条件は、対象がすでにウォレットと資産を持つ集団であること。破綻条件は、基盤側の規則（少額出力の非標準化、手数料）や規制（地域遮断）で、その支払い路が使えなくなること。", k: analysis}
    - {t: "検証可能性を集客の材料にする: 告知スレッドで公平性の穴を指摘させて運営が認めると、初期の不信をフォーラム上の公開議論で減らせる。この対応が効いたのは、フォーラムの利用者が技術的に検証できたからである。一般の利用者が相手では同じ効果は期待しにくい。", k: analysis}
  metrics: [m-satoshidice-bets, m-satoshidice-ipo-raise]
  unknowns:
    - "公開初週・初月のプレイヤー数（一意のアドレス数）。"
    - "広告（フォーラムのバナー、他サイトへの出稿）やアフィリエイトの有無と費用。"
    - "FireDuck から Voorhees への引き継ぎの日付と条件（Reddit の元投稿は取得できず）。"

