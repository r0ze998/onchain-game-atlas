id: satoshi-dice
name: SatoshiDice
name_ja: サトシダイス
aliases: [Satoshi Dice, SatoshiDICE, S.DICE]
kind: game
depth: index
updated: "2026-10-23"
chains: [Bitcoin]
team: "Erik Voorhees ら共同所有者（2012-04〜2013-07）。2013-07 に匿名の買い手へ売却。開発は bitcointalk の FireDuck とする記述もある"
summary: >-
  2012 年 4 月に始まった Bitcoin 上のサイコロ賭博。プレイヤーは倍率ごとに決まった固定アドレスへ BTC を送るだけで賭けが成立し、
  運営のサーバーが「賭けの取引ハッシュ＋運営の秘密値」のハッシュで勝敗を決め、当たれば配当、外れでもごく少額を返す取引を送り返した。
  1 回の賭けが最低 2 件のオンチェーン取引になる設計で、一時は Bitcoin の取引の過半を占めたと主張され、少額出力（dust）とブロック容量をめぐる議論の当事者になった。
selection_reason: >-
  チェーンを「判定の場」ではなく「賭けの送受信路」として使った最初期の大規模なオンチェーン・ゲームであり、ゲームが基盤の取引量・手数料設計に与える負荷という問題の起点だから。
  判定は運営サーバーにあり、後の「ルールのオンチェーン実行」とは対照的な例でもある。
categories:
  - {id: infra, role: primary, reason: "1 回の賭けが複数の取引になり、Bitcoin の取引量・少額出力・ブロック容量の議論を引き起こした"}
  - {id: assets, role: secondary, reason: "賭け金と配当は BTC そのもの。運営会社の株式も MPEx で取引された（ゲーム資産ではなく事業持分）"}
status:
  value: unknown
  as_of: "2026-10"
  note: "2013-07 に売却。2014 年にはオフチェーンのセッション型の賭けが追加されたと Bitcoin Wiki は記す。現在の運営状況は本調査で確認していない。"
  s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki]
dates:
  launched: {date: "2012-04", s: [src-satoshidice-sec-order, src-satoshidice-bitcoinwiki], note: "SEC の命令は 2012-04 にサイトを立ち上げたと記載。Bitcoin Wiki は bitcointalk での告知を 2012-04-24 とする"}

architecture:
  onchain:
    level: assets-only
    detail: >-
      チェーン上にあるのは賭け（固定アドレスへの送金）と配当・返金の取引だけ。勝敗の判定は運営のサーバーが、賭け取引のハッシュと運営の秘密値から計算し、
      秘密値を後から公開することで検証可能にした（「Provably Fair」の先駆とされる）。判定ロジックの実行はチェーン外。
    s: [src-satoshidice-bitcoinwiki]
  offchain:
    - {item: "勝敗判定、配当取引の作成と送信は運営サーバー", s: [src-satoshidice-bitcoinwiki]}
    - {item: "2014 年以降のセッション型の賭けはオフチェーン（ゼロ承認取引の二重支払いリスク等への対応とされる）", s: [src-satoshidice-bitcoinwiki, src-satoshidice-uibk-thesis]}
  admin:
    level: significant
    detail: "運営が秘密値・資金・判定を持つ中央集権型。米国からの利用は 2013-05 に遮断された。"
    s: [src-satoshidice-bitcoinwiki]
  open_source:
    level: unknown
    detail: "サーバーのソース公開は確認できなかった。"
    s: []
  extensibility:
    level: none
    detail: "固定アドレスに送金するだけなので、どのウォレットからでも参加できたが、ルールの拡張はできない。"
    s: [src-satoshidice-bitcoinwiki]

compare:
  gameplay: {t: "倍率（当たり確率）ごとに異なる固定アドレスへ BTC を送ると、運営が 0〜65535 の数を決め、選んだ閾値より小さければ倍率に応じた配当が送り返される。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  necessity: {t: "Bitcoin は支払い手段と、賭けと結果の記録としてのみ使われ、判定はサーバー。チェーンなしでも同じ賭博は成立し、チェーンの寄与は「入出金の手軽さ」と事後検証の公開性にとどまる。", k: analysis, s: [src-satoshidice-bitcoinwiki]}
  information: {t: "賭けと配当の取引は公開。判定に使う秘密値は事前には非公開で、後から公開して検証可能にした。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  persistence: {t: "運営が止まれば賭けは成立しない（送った BTC が返ってこない）。", k: analysis, s: [src-satoshidice-bitcoinwiki]}
  extensibility: {t: "第三者による拡張の手段はない。", k: fact, s: [src-satoshidice-bitcoinwiki]}
  money_flow: {t: "プレイヤーの賭け金が原資で、ハウスエッジは 1.9%。各賭けの手数料は採掘者へ。運営会社は株式を MPEx で売り出して 50,600 BTC を調達し、2013-07 に 1 株 0.0035 BTC、計 45,500 BTC で買い戻した。", k: fact, s: [src-satoshidice-bitcoinwiki, src-satoshidice-sec-order]}
  entry_barrier: {t: "任意の Bitcoin ウォレットから送金するだけで、サイトへの登録もクライアントも不要。各賭けに取引手数料がかかる。", k: fact, s: [src-satoshidice-bitcoinwiki]}

concepts: [c-onchain-randomness, c-commit-reveal, e-entry-fee-prize]

article:
  constraints:
    - {t: "1 回の賭けが賭けと結果の 2 取引以上になり、外れでもごく少額を返すため、少額出力が大量に生まれた。Bitcoin Wiki は、これを手数料による DoS 対策を迂回する攻撃とみなす立場と、手数料モデルが想定通りに働かなかった証拠とみなす立場の両方を記す。", k: fact, s: [src-satoshidice-bitcoinwiki], q: "spams the p2p network and blockchain with useless data"}
    - {t: "Bitcoin 0.8.2（2013-05-29）は最低中継手数料の 0.543 倍（0.00005430 BTC）未満の出力を非標準とした。リリースノートは SatoshiDice に言及していないが、外れ時の極小返金のような出力は中継されにくくなった。", k: fact, s: [src-satoshidice-btc082]}
  principles:
    - {t: "ゲーム行為を基盤の取引に 1 対 1 で載せると、ゲームの人気がそのまま基盤の負荷になり、基盤側の規則変更（少額出力の非標準化など）でゲーム設計が制約される。チェーンを共有する限り、他の利用者との外部性の調整が避けられない。", k: analysis, s: [src-satoshidice-bitcoinwiki, src-satoshidice-btc082]}
  counter_evidence:
    - {t: "「全取引の過半」という数字は Voorhees 自身の主張や二次資料で、定義（件数か金額か、累計か期間か）がまちまち。連邦準備制度の論文は、データのある期間について小額取引の大半が同サービス関連だったと述べるにとどまる。", k: analysis, s: [src-satoshidice-fed-2014, src-satoshidice-survey-2019]}

