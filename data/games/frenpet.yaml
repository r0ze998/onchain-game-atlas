chains: [Base]
team: "@cadu_veloso と @surfcoderepeat による 2 人の自己資金チーム（運営記載）"
summary: >-
  Base 上の放置型ペット育成ゲーム。ペット（NFT）を作り、3 日以内に餌を与え続けないと休眠・死亡し、30 分ごとに他のペットを「bonk」（攻撃）して得点を奪い、
  得点を ETH 報酬と交換できる。ETH 報酬の原資は $FP トークンの売買にかかる税で、得点を換金すると得点とペットの成長はリセットされる。
  2023-09 に公開、2023-11 に Diamond（EIP-2535）で全面的に書き直した V2 を公開した。
selection_reason: >-
  ゲームの状態と PvP をコントラクトに置き、報酬をトークンの取引税から払う「取引量に依存する経済」の小規模な実例であり、
  公開状態上の攻撃対象選び・ボットによる自動化・アップグレード可能な Diamond と「審査付きの第三者 Facet」という拡張方針を、
  完全な許可不要拡張（MUD 等）と対比できるから。
categories:
  - {id: p2e, role: primary, reason: "得点をトークン取引税由来の ETH と交換でき、$FP の購入・ステーク・燃焼がゲーム進行と結びつく"}
  - {id: onchain-rules, role: secondary, reason: "餌やり・攻撃・得点移動・休眠・死亡と NFT の焼却などがコントラクトで処理される（Diamond）"}
status:
  value: active
  as_of: "2026-10"
  note: >-
    参照日時点で公式サイトとドキュメントが稼働し、ドキュメントは無料で始められる現行の仕組み（1 日 10 トランザクションまで運営負担）を説明している。
    検証役が Base の公開 RPC で V2 Diamond（0x0e22…443c）のイベントログを標本調査したところ、参照日の直近 300 ブロック（約 10 分）に 324 件のログがあり、コントラクトは稼働している。
    ただしログ数はプレイヤー数ではなく、ボットの比率も不明。（調査役が根拠にした Super Fren Pet のページは、参照日には同ペットが DEAD・ステーク 0・キーパーがオフラインと表示しており、活動の根拠にならない。）
  s: [src-frenpet-docs-overview, src-frenpet-onchain]
dates:
  launched: {date: "2023-09", s: [src-frenpet-hello], note: "公式ブログ「Hello Frens」（2023-09-01）で公開を告知"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      V2 は EIP-2535 Diamond（Base 上の 1 アドレス）に機能を集約し、ペット NFT、$FP（ERC-20）、pGOLD（譲渡不可のポイント）を別コントラクトで持つ。
      攻撃の勝率は攻撃側 AP ÷（攻撃側 AP＋防御側 DP）で、得点の移動上限（0.5%）などがドキュメントに規定されている。各ペットの DNA は鋳造時に乱数で決まりオンチェーンに保存される。
    s: [src-frenpet-docs-contracts, src-frenpet-docs-pvp, src-frenpet-v2]
  offchain:
    - {item: "ログイン（メール・X・Apple ID など）と自動作成されるウォレット、スマートアカウントのガス肩代わり（1 日 10 トランザクションまで）", s: [src-frenpet-docs-overview]}
    - {item: "フロントエンドのデータは公開 API で提供。bonk とルーレットは FrenPet の署名付きログインを要し、第三者のボットはそれらを自動化しないと Super Fren Pet は書く", s: [src-frenpet-v2, src-frenpet-superfrenpet]}
    - {item: "pGOLD の配分アルゴリズムは予告なく変更され得ると運営は明記", s: [src-frenpet-next-steps]}
  admin:
    level: significant
    detail: >-
      V2 は「中央集権性が増すが、機能の反復とバグ修正のため」アップグレード可能な Diamond にしたと運営は明言。第三者が作る Facet は運営がホワイトリストに入れて統合し、
      その Facet は契約のストレージとすべての論理にアクセスできる。運営は Uniswap v3 のプールをブロックする権利を留保している。
    s: [src-frenpet-v2, src-frenpet-docs-rewards]
  open_source:
    level: unknown
    detail: "ドキュメントのリポジトリ（surfer77）は公開されているが、ゲームコントラクトのソースコードの公開は確認できなかった。Diamond は louper.dev で facet を参照できる。"
    s: [src-frenpet-docs-contracts]
  extensibility:
    level: official-api
    detail: >-
      公開 API と「審査付きの Facet 追加」。運営は Facet を作りたい開発者にまず相談するよう求めている。第三者のオンチェーン活用例として、取引手数料で 1 匹のペットを共同育成する
      Super Fren Pet（$SFP）があり、キーパーボットがステーキングと餌やりを自動化する設計だが、参照日（2026-10-23）のページではペット（#84373、約 11 日前に誕生）は DEAD、ステーク 0、キーパーはオフラインと表示されていた。
    s: [src-frenpet-v2, src-frenpet-superfrenpet]

compare:
  gameplay: {t: "ペットを鋳造し、3 日ごとに餌（攻撃 10 回で 1 つ得るきのこ、または有料）を与え、30 分ごと（パス保持者は 10 分）に 1 時間攻撃されていないペットを攻撃して得点を奪う。毎日のルーレット、ガチャで AP/DP を上げ、モンスター収集・進化・サイコロゲームもある。", k: fact, s: [src-frenpet-docs-gameplay, src-frenpet-docs-pvp]}
  necessity: {t: "得点を ETH と交換できる報酬プールを運営の管理外のコントラクトで自動分配する点にオンチェーン化の意味がある。ゲーム性（たまごっち型の育成と非同期 PvP）自体はオンチェーンを必要としない。", k: analysis, s: [src-frenpet-docs-rewards]}
  information: {t: "全ペットの得点・状態は公開で、リーダーボードから攻撃対象を選ぶ。攻撃されたペットは 1 時間攻撃対象にならない。", k: fact, s: [src-frenpet-docs-pvp]}
  persistence: {t: "ペットは餌を与えないと休眠し、休眠中のペットは得点を失いやすく、死亡したペットは誰でも焼却でき、焼却した人は星を得る。V1 から V2 への移行では全ペットがエアドロップで引き継がれた。", k: fact, s: [src-frenpet-docs-gameplay, src-frenpet-docs-pvp, src-frenpet-v2]}
  extensibility: {t: "公開 API と、運営審査を経た第三者 Facet の統合（許可制）。", k: fact, s: [src-frenpet-v2]}
  money_flow: {t: "$FP の売買に 4% の税（ドキュメント時点）がかかり、ETH に替えて 2% をプレイヤー報酬、1% を開発者、1% を流動性に回す。報酬は全ペットの得点に占める割合で請求でき、請求すると得点がリセットされる。きのこ購入の $FP は 100% 燃焼、ステークした $FP は 30 日かけて全額返却される。", k: fact, s: [src-frenpet-docs-rewards, src-frenpet-docs-fp, src-frenpet-docs-stake]}
  entry_barrier: {t: "現行はメール等のログインで自動作成ウォレットにより無料で始められ、1 日 10 トランザクションまで運営がガスを負担。それ以上は ETH の入金が必要。V2 公開時は招待制で、鋳造に $FP が必要だった。", k: fact, s: [src-frenpet-docs-overview, src-frenpet-v2]}

concepts: [c-nft-asset, c-fungible-ingame-token, c-gas-abstraction, e-p2e, e-sink-faucet, m-bot-automation, m-permadeath, m-farming-idle]

article:
  principles:
    - {t: "取引税を報酬原資にする: ゲーム内報酬をトークンの売買税から払うと、運営が報酬を発行しなくて済む。適用条件は、トークンに継続的な取引量があること。破綻条件は取引量が落ちた場合で、報酬原資も比例して細り、得点を換金するとペットがリセットされる設計では、換金の時期をめぐる駆け引きが報酬プールの縮小時に一斉換金へ傾き得る。", k: analysis, s: [src-frenpet-docs-rewards, src-frenpet-v2]}
  counter_evidence:
    - {t: "第三者拡張の唯一の確認例である Super Fren Pet は、参照日に誕生から約 11 日でペットが DEAD、ステーク 0、キーパーがオフラインと自ら表示している。公開 API と許可制 Facet という拡張方針の下で、持続的な第三者のオンチェーン拡張が育った証拠は見つからなかった。", k: fact, s: [src-frenpet-superfrenpet]}
    - {t: "運営は V2 告知時点で、取引量の 2% の収入は自分たちを支えるには安定していないと書いた。取引税モデルは開発者の持続性も取引量に依存させる。", k: claim, who: "Fren Pet 運営", s: [src-frenpet-v2], q: "so far it hasn't been consistent to sustain ourselves"}

metrics:
  - {id: m-frenpet-fp-holders-2023-11, type: wallets, value: 7220, value_text: "7,220", unit: wallets, period: "2023-11-21 頃", definition: "BaseScan 上の $FP 保有アドレス数（Foresight News の記事が引用）", nature: measured, s: [src-frenpet-foresight], note: "トークン保有者数であってプレイヤー数ではない。同記事は総供給約 803 万枚（燃焼で約 2 割減）とも記す"}

acquisition:
  audience: [players]
  summary: {t: "2023-09 の公開後 2 か月ほどは目立たず、最初の拡大は 2023-11 の V2（招待制・1 人 3 つの招待コード・生涯 10% の紹介報酬）と、Coinbase Wallet・Base 公式アカウントによる言及が重なった時期に起きたと中国語圏の暗号資産メディアは伝える。報道は friend.tech の「後継」になれるかという文脈で取り上げており、最初の層は Base 上の暗号資産利用者だったと見られるが、出どころの内訳は確認できない。同時期に $FP の価格が短期間で数倍〜十数倍になった。", k: analysis, s: [src-frenpet-v2, src-frenpet-techflow, src-frenpet-foresight]}
  steps:
    - {phase: launch, date: "2023-09-01", t: "公式ブログで公開を告知した（本文はアプリのダウンロードを促す 1 文のみ）。", k: fact, s: [src-frenpet-hello]}
    - {phase: growth, date: "2023-11-09", t: "V2 を公開し、V1 の全ペットを V2 にエアドロップしたうえで、新規参加を招待制（新規ユーザー 1 人に招待コード 3 つ）にした。紹介した相手がアプリ内で使った $FP の 10% を生涯受け取れる紹介制度、TikTok ログイン、次の鋳造者から 100 $FP が返る鋳造リベートも入れた。", k: fact, s: [src-frenpet-v2], q: "FrenPet v2 is invite only for now, each new user gets 3 invite codes to share"}
    - {phase: growth, date: "2023-11-18", t: "TechFlow は、公開から 2 か月以上ほとんど注目されなかった Fren Pet が、11/18 の Coinbase Wallet の X 投稿で急に注目を集め、$FP の価格が 0.1 から 1.4 へ 10 倍超になったと書いた（投稿自体は未確認）。", k: claim, who: "TechFlow（深潮）", s: [src-frenpet-techflow]}
    - {phase: growth, date: "2023-11-21", t: "Foresight News の記事は、Base 公式と Coinbase Wallet 公式の X アカウントの「關注」（注目・言及。原文「Base 官推和 Coinbase Wallet 官推的關注」）、招待による「社交裂変」（紹介による拡散）、遊びやすさを急伸の理由に挙げ、NFT 収集家 Pranksy の参加で順位表 2 位になったこと、BaseScan 上の $FP 保有アドレス 7,220 を伝えた。", k: claim, who: "Foresight News（Karen）", s: [src-frenpet-foresight]}
    - {phase: growth, date: "2023-12", t: "12/1 に譲渡不可ポイント pGOLD と Season 1（3 か月で 1,000 万 pGOLD を毎週配布）を告知し、12/12 には Bankless が始め方の解説記事を出した（招待コードが必要、Base へ ETH をブリッジ）。", k: fact, s: [src-frenpet-next-steps, src-frenpet-bankless]}
  channels:
    - {id: invite-gating, t: "V2 は招待制で、各新規ユーザーに招待コードを 3 つ配り、既存ユーザーが新規ユーザーを連れてくる形でしか入れなかった。", k: fact, s: [src-frenpet-v2, src-frenpet-bankless]}
    - {id: referral, t: "紹介した相手がアプリ内で使う $FP の 10% を、相手の取引のたびに紹介者のウォレットへ直接送る生涯型の紹介報酬。", k: fact, s: [src-frenpet-v2, src-frenpet-bankless]}
    - {id: crypto-social, t: "Coinbase Wallet と Base の公式 X アカウントによる言及が急伸のきっかけで、NFT 収集家 Pranksy の参加と順位表 2 位入りも話題になったと中国語圏の報道は伝える（公式アカウントの投稿の本文は確認できず、掲載・特集のような配信面の施策だった証拠もない）。", k: claim, who: "TechFlow / Foresight News", s: [src-frenpet-techflow, src-frenpet-foresight]}
    - {id: token-incentive, t: "得点を $FP 取引税由来の ETH と交換でき、Season 1 では譲渡不可の pGOLD を配った。", k: fact, s: [src-frenpet-docs-rewards, src-frenpet-next-steps]}
    - {id: press, t: "Bankless が 2023-12 に始め方の解説記事を出した。", k: fact, s: [src-frenpet-bankless]}
  cost:
    - {t: "ETH 報酬の原資は $FP 売買の税（現行ドキュメントでは Uniswap で 4%、うち 2% をプレイヤー報酬。2023-11 の Foresight News は BaseSwap で 5%、うちプレイヤー 2% と記す）で、紹介報酬は紹介された人がゲーム内で使った $FP の 10%（残り 90% は燃焼）から出る。ETH 報酬は新規発行ではなく取引税の再分配だが、Season 1 の pGOLD は運営が新たに配るポイントである。", k: fact, s: [src-frenpet-docs-rewards, src-frenpet-v2, src-frenpet-bankless]}
    - {t: "運営は 2 人の自己資金チームで、VC 資金による広告は確認できない。現行は 1 日 10 トランザクションまでガスを運営が負担している。", k: claim, who: "Fren Pet 運営", s: [src-frenpet-next-steps, src-frenpet-docs-overview]}
  after:
    - {t: "参照日時点でもコントラクトは稼働しているが、プレイヤー数・継続率は公開されていない。運営は V2 告知時点で、取引量の 2% の収入では自分たちを支えるのに安定していないと書いていた。", k: claim, who: "Fren Pet 運営", s: [src-frenpet-onchain, src-frenpet-v2]}
  counter:
    - {t: "急伸は $FP の価格高騰（TechFlow は 0.1→1.4、初期流動性からは約 7,000 倍と記す。The Defiant の記事は検索要約のみの確認だが、11/17 の約 0.05 ドルから 11/20 の最高 1.9 ドルまで週末で 38 倍超とする）と同時期で、参加の誘因がゲームよりトークンの値上がりだった可能性がある。招待・紹介制度の効果と価格上昇の効果は分けられない。", k: analysis, s: [src-frenpet-techflow, src-frenpet-defiant]}
    - {t: "Coinbase Wallet・Base 公式の言及がきっかけだったという説明は中国語圏の二次報道によるもので、元の投稿と、それによる流入の規模は確認できていない。", k: analysis, s: [src-frenpet-techflow, src-frenpet-foresight]}
    - {t: "$FP 保有アドレス 7,220 はトークン保有者数であり、プレイヤー数ではない。ボット・多重ペット保有の規模も分からない。", k: analysis, s: [src-frenpet-foresight]}
  lessons:
    - {t: "招待コード 3 つ＋紹介者への生涯 10%: 新規参加を既存ユーザー経由に限り、紹介者に相手の支出の一部を払うと、既存ユーザーが勧誘の担い手になる。効く条件は紹介報酬の原資が新規ユーザーの実支出（ここでは $FP の消費）から出ること。破綻条件は報酬トークンの価格が下がる場合で、紹介の動機もトークン価格に連動して弱まる。", k: analysis}
  metrics: [m-frenpet-fp-holders-2023-11]
  unknowns:
    - "Coinbase Wallet の 2023-11-18 の投稿の本文と、それが公式な施策（掲載・特集）だったか"
    - "招待制の期間と、招待経由で入った人数"
    - "初期プレイヤーの出どころ（friend.tech 利用者との重なり等）"

