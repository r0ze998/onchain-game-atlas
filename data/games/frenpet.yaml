relations:
  - {to: axie-infinity, type: similar-to, basis: analytic, note: "育成＋対戦で得点を報酬に換える P2E。Fren Pet は報酬を新規発行でなく取引税から払う"}
  - {to: cryptokitties, type: similar-to, basis: analytic, note: "ペット NFT の育成・収集。Fren Pet は死と休眠という維持コストを加えた"}
  - {to: dark-forest, type: contrasts-with, basis: analytic, note: "自動化を公認した Dark Forest に対し、Fren Pet は bonk に署名付きログインを要求し、第三者ボットの自動化範囲を限定した（Super Fren Pet の記述による）"}

