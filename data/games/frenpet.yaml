  - "フロントランニング（攻撃可能になったペットの奪い合い、$FP 取引での先回り）の実例。調査依頼にあったが一次資料・オンチェーン分析を確認できなかった。"
  - "コントラクトのソースコード公開の有無、Diamond の所有者権限の範囲（第三者監査記事は Medium で遮断され未読）。"
