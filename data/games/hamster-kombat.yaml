  cost:
    - {t: "獲得の原資は将来のトークンで、総供給 1,000 億 HMSTR のうち 750 億をコミュニティに割り当て、600 億を Season 1 後に配った。現金の広告費の有無と規模は確認できない。", k: fact, s: [src-hamster-kombat-ct-131m]}
