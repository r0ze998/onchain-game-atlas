acquisition:
  audience: [players]
  summary: {t: "最初のユーザーは Telegram の利用者そのもので、先行した Notcoin の大型エアドロップ（2024-05）で「タップでトークンがもらえる」期待が広がった直後に、紹介リンクでしか解放できないカード・日替わりコンボ・SNS フォロー課題を通じて利用者自身が勧誘役になり、Telegram 創業者の言及が拡大を後押しした。報酬はすべて将来の HMSTR エアドロップへの期待だった。", k: analysis, s: [src-hamster-kombat-theblock-founders, src-hamster-kombat-decrypt-friends, src-hamster-kombat-sherwood, src-hamster-kombat-decrypt-durov]}
  steps:
    - {phase: pre, t: "匿名の創業者は、2013 年から暗号資産業界にいるとし、Notcoin の成功と 2010 年代のソーシャルゲームに着想を得たと述べた。", k: claim, who: "Hamster Kombat 創業者（匿名）", s: [src-hamster-kombat-theblock-founders, src-hamster-kombat-forklog-founders], q: "We were inspired by the success of Notcoin and the popularity of social media games in the 2010s."}
    - {phase: launch, date: "2024-03", t: "Sherwood News（Garbage Day）は、2024-03 の公開時に Telegram の全利用者に向けた参加呼びかけがあったと書く（誰が行ったかの記載はない）。", k: claim, who: "Sherwood News (Ryan Broderick, Adam Bumas)", s: [src-hamster-kombat-sherwood]}
    - {phase: growth, date: "2024-05-24", t: "YouTube チャンネルを開設し、Cointelegraph によれば 6/28 までに 3,020 万人超の登録者、5/24〜6/26 に 4.7 億回超の再生を得た。Telegram チャンネルの登録者は 4,680 万人超だった。", k: claim, who: "Cointelegraph（運営の主張・画面写真に基づく）", s: [src-hamster-kombat-ct-guinness]}
    - {phase: growth, date: "2024-06", t: "一部のアップグレードカードは自分の紹介リンクから友人を始めさせないと解放できず、新しいカードでは累計 9 人の招待が必要になった。カードは 500 万コインの「日替わりコンボ」に使われ、記者はこれを「プレイヤーに自分たちのマーケティングをさせる」設計と評した。", k: fact, s: [src-hamster-kombat-decrypt-friends]}
    - {phase: growth, date: "2024-06", t: "Telegram グループへの参加、YouTube 動画の視聴、X のフォロー、友人の招待にコインが付き、X は 3 か月で 1,000 万フォロワー、YouTube は 6 月に 2,000 万人超の登録者を得たと Sherwood は集計した。", k: claim, who: "Sherwood News", s: [src-hamster-kombat-sherwood]}
    - {phase: growth, date: "2024-07-02", t: "Telegram はミニアプリを画面下部のバーに畳める機能を出し、ミニアプリの利用者を 5 億人超とした。", k: claim, who: "Telegram / Pavel Durov", s: [src-hamster-kombat-decrypt-minibar]}
    - {phase: growth, date: "2024-07-04", t: "Telegram 創業者 Pavel Durov が自身のチャンネルで Hamster Kombat を「世界で最も急成長しているデジタルサービス」と呼び、約 3 か月で 2.39 億人が登録し、1 日 400〜500 万人が新たに加わっていると述べた。", k: claim, who: "Pavel Durov (Telegram)", s: [src-hamster-kombat-decrypt-durov]}
    - {phase: growth, date: "2024-07-11", t: "創業者は配布前にボットアカウントを掃除し、「ボットと紹介の不正は罰する」と述べた。", k: claim, who: "Hamster Kombat 創業者（匿名）", s: [src-hamster-kombat-theblock-founders], q: "Using bots and referral cheating will be punished."}
    - {phase: growth, date: "2024-09-26", t: "230 万超のチーターを BAN したうえで、約 1.31 億アカウントに HMSTR を TON 上で配布した。", k: fact, s: [src-hamster-kombat-decrypt-purge, src-hamster-kombat-ct-131m]}
