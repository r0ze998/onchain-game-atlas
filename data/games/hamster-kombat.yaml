  after:
    - {t: "配布後、Telegram の統計で月間利用者は 9 月下旬の 1 億超から 11 月初めの 4,400 万未満に減り、2025-02 には 1,168 万とされた。運営代表者は 2024-11 に月間 3,000 万超を保っていると述べた。", k: claim, who: "Decrypt / BitPinas / 運営代表者", s: [src-hamster-kombat-decrypt-alltime-low, src-hamster-kombat-bitpinas-s2, src-hamster-kombat-forklog-reengage]}
  counter:
    - {t: "登録者数は人数を表さない。Cointelegraph はボット・重複アカウントを除いていない数字だと注記し、Sherwood は Telegram の利用者を実質すべて利用者に数えていると指摘した。配布前に 230 万超が BAN され、1 人が 400 超のアカウントを 1 つの Binance アドレスにつないだ例も公表された。", k: claim, who: "Cointelegraph / Sherwood News / Decrypt", s: [src-hamster-kombat-ct-guinness, src-hamster-kombat-sherwood, src-hamster-kombat-decrypt-purge]}
    - {t: "YouTube の急成長自体が報酬付き課題による「ゲーム化された非真正な行動」で、同じ文言のコメントが並んでいたと Sherwood は指摘した。SNS 指標の伸びは関心の広がりではなく、報酬で買われたフォローである可能性がある。", k: claim, who: "Sherwood News", s: [src-hamster-kombat-sherwood]}
    - {t: "拡大は Notcoin の配布（2024-05、約 10 億ドル相当）の直後で、同時期に多数の類似タップゲームも伸びており、Hamster Kombat 固有の設計の効果と「Telegram タップゲーム＋エアドロップ」という流行全体の効果を分けられない。", k: analysis, s: [src-hamster-kombat-theblock-founders, src-hamster-kombat-decrypt-durov]}
