ids:
chains: [Ethereum mainnet（初期）, StarkEx（2021-07〜）, Solana（2025-10〜、カード）, Base（ETH 残高）]
team: "Sorare SAS（フランス。Nicolas Julia / Adrien Montfort）"
summary: >-
  実在の選手のライセンスカードを NFT として発行し、実際の試合データ（Opta 等）から運営が計算するスコアで競うファンタジースポーツ。
  2019 年公開、2021 年に 6.8 億ドルを調達し、サッカーから NBA・MLB へ広げた。チェーンは Ethereum → StarkEx → Solana（カード）と移った。
  英国では無免許の賭博提供として起訴され（2024）、フランスでは換金可能なデジタル資産を使うゲームの法制度（JONUM）の対象になった。
selection_reason: >-
  ルールの入力が現実世界のデータ（試合結果）で、スコア計算を運営が行う「外部データ依存型」の代表例。
  ライセンス・規制（賭博該当性）・チェーン移転が設計の自由度をどう縛るかを、規制当局の一次資料と報道で確認できるため。
categories:
  - {id: assets, role: primary, reason: "ライセンス選手カードを NFT として発行・取引。スコア計算と報酬はチェーン外"}
  - {id: p2e, role: secondary, reason: "大会の報酬としてカードや ETH 等を配り、規制当局は賭博該当性を問題にした"}
  - {id: infra, role: secondary, reason: "StarkEx（L2）から Solana（圧縮 NFT）へ移行"}
status:
