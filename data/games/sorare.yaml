  s: [src-sorare-cointelegraph-2025, src-sorare-ukgc]
dates:
  launched: {date: "2019", s: [src-sorare-wikipedia]}

architecture:
  onchain:
    level: assets-only
    detail: "選手カード（希少度・通し番号・シーズン等のメタデータ）を NFT として発行・取引する。スコアは第三者データ提供者（Opta 等）の試合統計を運営定義の行列で処理して計算し、チェーン外で行われる。"
    s: [src-sorare-wikipedia, src-sorare-cointelegraph-2025]
  offchain:
    - {item: "試合データの取得とスコア計算（Opta 等、運営定義のスコア行列）", s: [src-sorare-wikipedia]}
    - {item: "大会・ランキング・報酬配布の運営", s: [src-sorare-wikipedia]}
  admin:
    level: significant
    detail: "カードの発行・スコア規則・報酬・チェーン移行（StarkEx→Solana、ETH 残高→Base）は運営が決定した。"
    s: [src-sorare-wikipedia, src-sorare-cointelegraph-2025]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: unknown
    detail: "Solana 移行の理由として運営は Phantom 等の外部ウォレットとの接続を挙げた（検索要約）。第三者ゲームでの利用実例は未確認。"

compare:
  gameplay: {t: "保有カードから 5 人等のラインナップを組み、実在の試合での成績から計算されるスコアで他プレイヤーと競う。", k: fact, s: [src-sorare-wikipedia]}
  necessity: {t: "スコアの入力（試合結果）も計算も運営に依存するため、チェーンが担うのはカードの所有と二次流通だけである。ライセンスの性質上、運営なしで続く構成ではない。", k: analysis, s: [src-sorare-wikipedia]}
  information: {t: "未確認", k: unknown}
  persistence: {t: "NFT は残るが、スコア計算・大会・ライセンス契約は運営に依存する。", k: analysis, s: [src-sorare-wikipedia]}
  extensibility: {t: "未確認", k: unknown}
  money_flow: {t: "カード販売（一次・二次）と大会報酬。2021-09 に Series B で 6.8 億ドル（評価額 43 億ドル）を調達した。", k: fact, s: [src-sorare-wikipedia]}
  entry_barrier: {t: "未確認（無料カードでの参加範囲は時期により異なる可能性）。", k: unknown}

concepts: [m-collectible-cards, c-nft-asset, c-own-chain, e-entry-fee-prize]

article:
  counter_evidence:
    - {t: "英国賭博委員会は 2024-09-26 に、免許なしで賭博の機会を提供したとして Sorare を起訴した。公判は 2026-06-15 予定から 2027-06-07 へ延期されている。換金可能な資産を報酬にする設計は、ゲームの外側の法的分類によって制約される。", k: fact, s: [src-sorare-ukgc]}
    - {t: "Sorare NFT のフロア価格は 2022-04 初旬の 91.25 ドルから 2025-10-12 の 2.21 ドルへ下がった（DappRadar、Cointelegraph の引用）。一方で 1 日の NFT 売買件数は 5000〜30000 件で 2022 年並みとされ、価格の下落と取引件数の維持が並存している。", k: fact, s: [src-sorare-cointelegraph-2025]}

