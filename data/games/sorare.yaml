  as_of: "2025-10"
  note: "2025-10 に 10 超のゲームとカードを Solana へ移すと発表し、同月末に完了予定と報じられた（Cointelegraph 2025-10-15。完了は未確認）。英国賭博委員会の訴訟は 2026-05 時点で公判が 2027-06-07 に延期されている。"
  s: [src-sorare-cointelegraph-2025, src-sorare-ukgc]
dates:
  launched: {date: "2019", s: [src-sorare-wikipedia]}

architecture:
  onchain:
    level: assets-only
    detail: "選手カード（希少度・通し番号・シーズン等のメタデータ）を NFT として発行・取引する。スコアは第三者データ提供者（Opta 等）の試合統計を運営定義の行列で処理して計算し、チェーン外で行われる。"
    s: [src-sorare-wikipedia, src-sorare-cointelegraph-2025]
  offchain:
    - {item: "試合データの取得とスコア計算（Opta 等、運営定義のスコア行列）", s: [src-sorare-wikipedia]}
    - {item: "大会・ランキング・報酬配布の運営", s: [src-sorare-wikipedia]}
  admin:
    level: significant
    detail: "カードの発行・スコア規則・報酬・チェーン移行（StarkEx→Solana、ETH 残高→Base）は運営が決定した。"
    s: [src-sorare-wikipedia, src-sorare-cointelegraph-2025]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: unknown
    detail: "Solana 移行の理由として運営は Phantom 等の外部ウォレットとの接続を挙げた（検索要約）。第三者ゲームでの利用実例は未確認。"

compare:
  gameplay: {t: "保有カードから 5 人等のラインナップを組み、実在の試合での成績から計算されるスコアで他プレイヤーと競う。", k: fact, s: [src-sorare-wikipedia]}
  necessity: {t: "スコアの入力（試合結果）も計算も運営に依存するため、チェーンが担うのはカードの所有と二次流通だけである。ライセンスの性質上、運営なしで続く構成ではない。", k: analysis, s: [src-sorare-wikipedia]}
  information: {t: "未確認", k: unknown}
  persistence: {t: "NFT は残るが、スコア計算・大会・ライセンス契約は運営に依存する。", k: analysis, s: [src-sorare-wikipedia]}
  extensibility: {t: "未確認", k: unknown}
  money_flow: {t: "カード販売（一次・二次）と大会報酬。2021-09 に Series B で 6.8 億ドル（評価額 43 億ドル）を調達した。", k: fact, s: [src-sorare-wikipedia]}
  entry_barrier: {t: "未確認（無料カードでの参加範囲は時期により異なる可能性）。", k: unknown}

concepts: [m-collectible-cards, c-nft-asset, c-own-chain, e-entry-fee-prize]

article:
  counter_evidence:
    - {t: "英国賭博委員会は 2024-09-26 に、運営免許なしで賭博の機会を提供した（Gambling Act 2005 第 33 条 (1)(4)・第 36 条 (3)(3A)）として Sorare を起訴した（告知は法人名を明記せず「Sorare」「Sorare.com」とする）。審理は Birmingham Magistrates' Court で、2025-07-01 更新で公判が 2026-06-15 に設定され、2026-05-18 更新で 2027-06-07 へ延期された（理由の記載なし）。起訴は有罪の認定ではない。換金可能な資産を報酬にする設計は、ゲームの外側の法的分類によって制約される。", k: fact, s: [src-sorare-ukgc]}
    - {t: "Sorare NFT のフロア価格は 2022-04 初旬の 91.25 ドルから 2025-10-12 の 2.21 ドルへ下がった（DappRadar、Cointelegraph の引用）。一方で 1 日の NFT 売買件数は 5000〜30000 件で 2022 年並みとされ、価格の下落と取引件数の維持が並存している。", k: fact, s: [src-sorare-cointelegraph-2025]}

acquisition:
  audience: [players, holders]
  summary: {t: "最初の利用者は、2019-03 のベータから集まったサッカーファンとデジタル収集品の愛好者の小さな集団（2019-12 の正式公開時の有料利用者は約 500 人とされる）で、Discord で運営と直接やり取りしていた。拡大はクラブのライセンスを増やしながら 2020 年に緩やかに進み、2021-02 のカード決済の導入と大型調達、NFT 相場の熱狂期に一気に起きた。", k: analysis, s: [src-sorare-cryptoast-2020, src-sorare-intel-2021, src-sorare-partech-2021]}
  steps:
    - {phase: pre, date: "2019-03", t: "2019-03 にプラットフォーム（ベータ）を公開した。Cryptoast は、コレクターとサッカー選手・ファンのコミュニティの中で成長を続けていると書いた。", k: fact, s: [src-sorare-cryptoast-2020, src-sorare-intel-2021]}
    - {phase: pre, date: "2019-05", t: "Xavier Niel らが参加する 55 万ユーロのプレシード調達を発表した（Cryptoast は Kima Ventures からの 50 万ユーロのシードと記載）。", k: fact, s: [src-sorare-wikipedia, src-sorare-cryptoast-2020]}
    - {phase: launch, date: "2019-12", t: "正式公開。第三者ニュースレターは、正式公開後の有料利用者（カードを 1 枚以上持つ人）の出発点を 500 人とする（算出方法の記載なし）。Cryptoast は 2019-12 の月間売上を 3 万ドルとし、共同創業者 Nicolas Julia はポッドキャストで「オープンベータの最初の月」の売上を 3 万と述べた。", k: claim, who: "Sorare Intelligence（有料利用者数）/ Cryptoast・Nicolas Julia（売上）", s: [src-sorare-intel-2021, src-sorare-cryptoast-2020, src-sorare-omr-2021]}
    - {phase: growth, date: "2020-06", t: "月間売上は 2020-06 に 35 万ドルへ伸び、2020-07 時点で欧州・米国・アジアの 90 超のクラブと提携していた。2020-04 には基盤を Loom から Ethereum へ移した（同じ第三者記事の別の箇所は 2020-05 とする）。", k: fact, s: [src-sorare-cryptoast-2020, src-sorare-intel-2021]}
    - {phase: growth, date: "2021-02", t: "Benchmark 主導で 4000 万ユーロのシリーズ A を発表した。2021-01 の月間カード販売額は 350 万ユーロ超（120 か国）、130 超のクラブがカードを出しており、過去 12 か月にわたり前月比 52% で成長したと述べた。第三者分析は 2021-02〜09 の段階の出来事として、クレジットカードでカードを買える Ramp の統合を挙げる（統合の正確な月は記載なし）。", k: claim, who: "Partech（出資者の発表）/ Sorare Intelligence", s: [src-sorare-partech-2021, src-sorare-intel-2021], q: "Sorare can count on one of the most vibrant communities of early adopters we've ever seen."}
    - {phase: growth, date: "2021-11", t: "正式公開以降、有料利用者は 500 から 5.5 万へ増え、うち 2021-02 の 5,000 未満から 2021-09 の 3 万へ増えたと第三者分析は数えた。", k: claim, who: "Sorare Intelligence（第三者のニュースレター）", s: [src-sorare-intel-2021]}
  channels:
    - {id: ip-brand, t: "公式ライセンスを受けたクラブの選手カードを売り、提携クラブを 2020-07 の 90 超から 2021-02 の 130 超へ増やした。", k: fact, s: [src-sorare-cryptoast-2020, src-sorare-partech-2021]}
    - {id: community-server, t: "プレイヤー・アンバサダー・運営が Discord で直接やり取りする形で運営された。", k: claim, who: "Sorare Intelligence", s: [src-sorare-intel-2021]}
    - {id: free-mint, t: "新規登録者には売買できない無料の Common カード（11〜12 枚）を配り、すぐにリーグに参加できるようにした（2021 年時点の説明。開始時期は未確認）。", k: fact, s: [src-sorare-decrypt-guide-2021, src-sorare-intel-2021]}
    - {id: referral, t: "紹介者と被紹介者が、被紹介者の一次市場での 5 回の購入後にそれぞれカードを 1 枚得る紹介制度があった（導入時期は未確認）。", k: claim, who: "Sorare Intelligence", s: [src-sorare-intel-2021]}
  cost:
    - {t: "獲得の原資は主に利用者自身のカード購入（一次販売）と VC 資金だった。2019 年のプレシード 55 万ユーロ、2020-07 の 400 万ドル、2021-02 の 4000 万ユーロ、2021-09 の 6.8 億ドルと調達を重ねた。無料の Common カードは売買できず、配布は運営の負担で換金価値を生まない。", k: fact, s: [src-sorare-wikipedia, src-sorare-cryptoast-2020, src-sorare-partech-2021, src-sorare-decrypt-guide-2021]}
  after:
    - {t: "2023-01 の月間一意購入者は 3 競技合計で 5 万超（The First Mint）、2025-10 に会社は利用者 500 万人と述べた（定義不明）。フロア価格は 2022-04 の 91.25 ドルから 2025-10 の 2.21 ドルへ下がった。", k: fact, s: [src-sorare-firstmint-2023, src-sorare-cointelegraph-2025]}
    - {t: "共同創業者は、初期に高いエンゲージメントと低い解約（churn）を見て手応えを得たと述べたが、数値は示していない。", k: claim, who: "Nicolas Julia（OMR Podcast の記事）", s: [src-sorare-omr-2021], q: "high user engagement and low churn"}
    - {t: "示されていない指標: 無料カードで始めた人が有料カードを買う割合、有料利用者の年ごとの継続率。", k: unknown}
  counter:
    - {t: "2021-02 以降の急伸は、カード決済の導入・大型調達・NFT 相場の最初の熱狂が同時期に起きたため、どれが効いたかを分けられない（第三者分析も 5000 万ドルの調達が NFT 業界の最初の熱狂と同時だったと書く）。", k: analysis, s: [src-sorare-intel-2021, src-sorare-partech-2021]}
    - {t: "有料利用者 500→5.5 万の定義は同じ記事内で「カードを 1 枚以上持つ人」と「1 枚以上買った人」が混在する。無料 Common カードは売買できないが、紹介報酬や贈与で得たカードの保有者を含むかどうかで出発点の 500 人の意味が変わり、獲得の規模を比較する根拠としては弱い。", k: analysis, s: [src-sorare-intel-2021]}
    - {t: "初期の成長数値（前月比 52% 成長、有料利用者 500→5.5 万）は出資者の発表と第三者のニュースレターによるもので、独立に計測された値ではない。", k: analysis, s: [src-sorare-partech-2021, src-sorare-intel-2021]}
  lessons:
    - {t: "クラブ単位のライセンスを積み上げる: 公式の選手名・写真が既存のファンを呼ぶが、ライセンスの更新と規制（英国の賭博該当性の訴追）に事業が依存し、ライセンスが切れればカードの意味も変わる。", k: analysis}
    - {t: "売買不可の無料カードで始めさせる二層構造: 新規参加の摩擦を下げつつ、配布しても換金圧力が生まれない。ただし有料カードとの格差が大きいと、無料層が競技で勝てず離れる。", k: analysis}
  metrics: [m-sorare-sales-2019-12, m-sorare-sales-2020-06, m-sorare-sales-2021-01, m-sorare-paying-users-2021, m-sorare-seriesa-2021, m-sorare-buyers-2023-01, m-sorare-users-2025]
  unknowns: ["2019 年のベータ参加者の出どころ（どのコミュニティから来たか）を示す一次資料", "無料 Common カードの配布と紹介制度の導入時期", "初期の Discord 参加者数"]

