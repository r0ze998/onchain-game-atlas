  onchain:
    level: none
    detail: "ブロックチェーン以前の暗号プロトコル。2 者がメッセージ交換のみで配札・追加ドロー・公開・事後検証を行う。"
    s: [src-mp-tm125]
  offchain:
    - {item: "各プレイヤーが自分のコンピュータで暗号化・復号を行う。相手のコンピュータは信頼しない前提", s: [src-mp-tm125]}
  admin:
    level: none-known
