    level: none
    detail: "著者は 3 人以上への一般化を「読者に委ねる」と記した。"
    s: [src-mp-tm125]

compare:
  gameplay: {t: "通常のポーカーと同じ規則で、カードの代わりにメッセージだけを使う。配札、山札からの追加ドロー、手札の一部公開、終了後の検証が要件。", k: fact, s: [src-mp-tm125]}
  necessity: {t: "論文の問いは「信頼できる仲介者なしに秘匿情報ゲームが成り立つか」であり、チェーンは関与しない。オンチェーンゲームにとっては、秘匿情報の扱いが台帳以前の暗号問題であることを示す先行例。", k: analysis, s: [src-mp-tm125]}
  information: {t: "各自の手札は相手に知られず、山札の中身も分からない。ゲーム終了時に双方が鍵を公開し、相手が本当にその手札を配られていたかを確認する。", k: fact, s: [src-mp-tm125]}
  persistence: {t: "該当なし（研究プロトコル）。", k: unknown}
  extensibility: {t: "多人数化は「読者に委ねる」とされ、後に Goldwasser–Micali（1982）が部分情報も漏らさない版を示した。多人数版（Yung 1984）や ZK 証明を使う道具箱（Schindelhauer 1998）などの後続研究がある。", k: fact, s: [src-mp-tm125, src-mp-gm82, src-mp-wikipedia]}
  money_flow: {t: "該当なし（賭け金の扱いは論じていない）。", k: fact, s: [src-mp-tm125]}
  entry_barrier: {t: "両者がコンピュータを持ち、可換暗号（例: 大きな n を法とするべき乗）を計算できることを前提とする。", k: fact, s: [src-mp-tm125]}

concepts: [c-commit-reveal, c-zk-hidden-info]
proposed_concepts:
  - {id: c-commutative-shuffle, name: 可換暗号による秘匿シャッフル（Mental Poker）, desc: "各参加者が自分の鍵で山札を暗号化・シャッフルし、可換性を使って順に鍵を外すことで、ディーラーなしに秘匿された配札を行う。終了時に鍵を公開して検証する。"}

article:
  principles:
    - {t: "「錠前を重ねる」配札: 可換な暗号化（E_A(E_B(M)) = E_B(E_A(M))）があれば、各自が自分の錠をかけ外しするだけで、相手に知られない手札を配れる。適用条件は暗号が鍵の推定と別鍵での偽装（性質 4・5）に対して強いこと。破綻条件はカードの表現に暗号化で保存される性質（例: 平方剰余性）がある場合で、部分情報が漏れ、配札の公平性が崩れる。", k: analysis, s: [src-mp-tm125, src-mp-gm82]}
    - {t: "事後検証による抑止: 途中は秘匿し、終了時に全鍵を公開して不正の有無を検証する構成は、オンチェーンのコミット・リビールと同型である。適用条件はゲーム終了まで参加者が鍵を保持し公開する動機があること。破綻条件は負けそうな側が鍵を公開せず離脱する場合で、論文はこの離脱問題を扱っていない。", k: analysis, s: [src-mp-tm125]}
  counter_evidence:
    - {t: "論文自身が「公平な配札は不可能」と証明したうえで実用的プロトコルを示しており、その安全性は計算量的仮定に依存する（情報理論的には相手の手札は決まっている）と著者は結論でヒントを出している。", k: fact, s: [src-mp-tm125]}
    - {t: "Goldwasser と Micali（1982）は、Mental Poker では「カードの正確な値の計算が困難」なだけでは不十分で、部分情報も敵に渡らないことを示す必要があると論じ、SRA は可換暗号による「エレガントな解」を示したが部分情報が漏れないことを証明できず、実装上の問題がいくつか Lipton の「How to Cheat at Mental Poker」（1981）で指摘されたと記した。弱点の具体的内容は Lipton の本文を未確認のため、GM 論文の記述として扱う。", k: fact, s: [src-mp-gm82]}

acquisition: {applies: false, note: "1979 年の暗号プロトコルの技術報告であり、利用者獲得の対象ではない。公開デモや実装への利用者募集の記録も見つからなかった。後続研究（Goldwasser–Micali 1982 等）への広がりは compare.extensibility と events を参照"}

