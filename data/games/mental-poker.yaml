id: mental-poker
name: Mental Poker
name_ja: メンタル・ポーカー
aliases: ["SRA protocol", "Shamir–Rivest–Adleman Mental Poker"]
kind: research
depth: index
updated: "2026-10-24"
links:
  website: https://people.csail.mit.edu/rivest/pubs.html#SRA81
chains: []
team: "Adi Shamir, Ronald L. Rivest, Leonard M. Adleman（MIT Laboratory for Computer Science）。問題提起は Robert W. Floyd"
summary: >-
  「信用できない 2 人が、カードなしで（電話越しに）公平なポーカーを遊べるか」を問い、(1) 情報理論的には不可能であることの証明と、
  (2) 可換な暗号化を使って実際に公平な配札ができるプロトコルの両方を示した 1979 年の技術報告（1981 年に書籍収録）。
  各自が秘密鍵でカードを暗号化・シャッフルし、ゲーム終了時に鍵を公開して不正がなかったことを相互に検証する。
  信頼できる第三者（ディーラー・運営サーバー）なしに秘匿情報ゲームを行うという、後のオンチェーン秘匿ゲームと同じ問題の起点の一つ。
selection_reason: >-
  オンチェーンゲームの「公開台帳で秘匿情報をどう扱うか」という問題は新しくなく、1979 年の時点で暗号プロトコルとして定式化されていた。
  また、提案された具体的な暗号関数が部分情報を漏らすことが後に指摘されたことは、「計算的に安全」と「部分情報も漏れない」の差が
  ゲームの公平性を左右することを示す反例としても重要。
categories:
  - {id: zk, role: primary, reason: "秘匿情報ゲームを第三者なしに行う暗号プロトコル。ZK 証明そのものではないが、後の秘匿ゲーム研究の出発点"}
