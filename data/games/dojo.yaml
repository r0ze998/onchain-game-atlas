id: dojo
name: Dojo
aliases: [Dojo Engine, dojoengine]
kind: engine
depth: index
updated: "2026-10-23"
chains: [Starknet（mainnet / Sepolia）, Katana によるアプリチェーン・ローカル開発]
team: "dojoengine（Tarrence van As / Cartridge が創始。主要コミット作者に Tarrence、Ammar、glihm、Larko、Loaf など）"
summary: >-
  Cairo で書く Starknet 向けのオンチェーンゲーム・フレームワーク。ゲーム状態を ECS（モデル＝コンポーネント、システム＝コントラクト）として 1 つの World コントラクトに登録し、
  sozo（ビルド・移行）、Katana（高速シーケンサ）、Torii（インデクサ）で開発から運用までを揃える。
  2023-01 に Cartridge の Tarrence van As が開始し、Eternum（S0・S1）・Roll Your Own・PixeLAW などがこの上に作られた（Loot Survivor が Dojo 製かは本調査で未確認）。
selection_reason: >-
  Starknet 系のフルオンチェーンゲームの大半が依存した基盤であり、MUD と並ぶオンチェーン ECS の代表例。
  World の名前空間・所有者・writer 権限とアップグレード機能が、どこまで「許可不要の拡張」と「運営の管理権限」を両立させたかを確認できる。
  旗艦ゲームの Eternum が 2026 年に Dojo から離れた事実も、エンジン依存のリスクを示す反例として重要。
categories:
  - {id: infra, role: primary, reason: "ECS フレームワーク、シーケンサ（Katana）、インデクサ（Torii）、ツールチェーン（sozo）を提供"}
  - {id: aw, role: secondary, reason: "名前空間を誰でも登録でき、同じ World に第三者がモデル・システムを追加できる設計を「Autonomous Worlds」の文脈で打ち出した"}
  - {id: onchain-rules, role: secondary, reason: "ゲームルールを Cairo のシステムとしてオンチェーンで実行することを前提にする"}
status:
  value: active
  as_of: "2026-10"
  note: "dojo リポジトリの最終コミットは 2026-05-06（sozo v1.8.7 のリリース準備。v* 形式の最新タグは v1.8.0、2025-10-31）。dojo 本体のコミット数は 2023 年 1,264、2024 年 938、2025 年 513、2026 年 12 と急減している。Katana・Torii は別リポジトリに分離され、Katana は 2026-07 まで更新が続く（2026 年 275 コミット）。"
  s: [src-dojo-repo, src-dojo-katana-repo]
dates:
  announced: {date: "2023-07-13", s: [src-dojo-starknet-blog], note: "Starknet 公式ブログの紹介記事。GitHub 上の開始はそれ以前（2023-01）"}
  launched: {date: "2023-07-24", s: [src-dojo-repo], note: "v0.1.0 タグ。v1.0.0 は 2024-11-10"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      World コントラクトがモデル（状態のスキーマ）・コントラクト（システム）・イベント・名前空間を資源として登録し、資源ごとに owner / writer の権限を管理する。
      ゲームのルールは各システム（Cairo コントラクト）が実行し、状態は World のストレージに置かれる。
    s: [src-dojo-world-contract, src-dojo-starknet-blog]
  offchain:
    - {item: "Torii: World のイベントを索引し GraphQL / gRPC で配信するインデクサ（クライアントの読み取り経路）", s: [src-dojo-starknet-blog]}
    - {item: "Katana: ローカル開発やアプリチェーン用の高速シーケンサ（2025-04 に dojo リポジトリから分離）", s: [src-dojo-katana-repo, src-dojo-repo]}
    - {item: "sozo: ビルド・デプロイ・移行計画のツールチェーン", s: [src-dojo-starknet-blog]}
  admin:
    level: significant
    detail: >-
      World では名前空間・資源の owner が upgrade_contract / upgrade_model で実装を差し替え、grant_writer で書き込み権限を与えられる。
      これはエンジンの仕様であり、各ゲームが所有権を放棄しない限り運営はルールを変更できる。コア契約は Nethermind（2024-02）と OpenZeppelin（2024-11）の監査を受けたと README は記す。
    s: [src-dojo-world-contract, src-dojo-repo]
  open_source:
    level: full
    detail: "Apache-2.0。dojo、katana、torii などが dojoengine 組織で公開。"
    url: "https://github.com/dojoengine/dojo"
    s: [src-dojo-repo, src-dojo-katana-repo]
  extensibility:
    level: permissionless-onchain
    detail: >-
      register_namespace は未登録なら誰でも呼べ、呼び出し者がその名前空間の owner になる。第三者は既存 World に自分の名前空間でモデル・システムを追加し、
      他名前空間のモデルを読める。他名前空間への書き込みは owner の grant_writer が必要。PixeLAW のアプリ登録はこの上に作られた。
    s: [src-dojo-world-contract, src-dojo-pixelaw-core]

compare:
  gameplay: {t: "エンジンでありゲームではない。Eternum（文明・戦争 MMO、S0・S1）、Roll Your Own（取引ゲーム）、PixeLAW（ピクセル AW）などが作られた。", k: fact, s: [src-dojo-starknet-blog, src-dojo-eternum-history, src-dojo-pixelaw-core]}
  necessity: {t: "ECS による状態の構造化と Torii による自動索引は、オンチェーンゲームのクライアント同期の手間を減らす。証明可能性（Cairo / STARK）を掲げるが、実運用の多くは Katana のアプリチェーンや Slot のように単一シーケンサで動いた例もあり、検証可能性の度合いはデプロイ先に依存する。", k: analysis, s: [src-dojo-repo, src-dojo-eternum-history]}
  information: {t: "World の状態とイベントは公開。秘匿情報の仕組みはエンジンの標準機能としては確認できなかった。", k: unknown}
  persistence: {t: "World はチェーン上に残るが、名前空間 owner がアップグレード権限を持ち続ける限り、ルールの不変性はゲームごとの運用次第。", k: analysis, s: [src-dojo-world-contract]}
  extensibility: {t: "名前空間の登録は許可不要で、第三者が同じ World にモデル・システムを追加できる。書き込みは owner の許可制。", k: fact, s: [src-dojo-world-contract]}
  money_flow: {t: "エンジン自体にトークンはない。StarkWare は Influence 等への投資・助成で Starknet ゲームを支援し、Dojo の game jam は STRK と USD の賞金を出したと検索結果で確認（本文未読）。Dojo 開発の資金源は確認できなかった。", k: unknown}
  entry_barrier: {t: "開発者は Cairo・Scarb・sozo を学ぶ必要があり、1.x 系でも破壊的変更（例: 1.7 → 1.8）への追随が求められる（PixeLAW の移行ガイドで確認）。", k: fact, s: [src-dojo-pixelaw-core]}

concepts: [c-ecs-engine, c-onchain-state, c-onchain-rules, c-permissionless-extension, c-own-chain, c-autonomous-world, c-gas-abstraction]

article:
  constraints:
    - {t: "旗艦ゲームの離脱: Eternum は 2026-08〜09 に Cartridge を外し、sozo を自前のネイティブ・デプロイヤに置き換え、ネイティブ Cairo（world-native）と自前の Madara シーケンサに移った。現行の contracts/l3 配下の Scarb.toml に dojo 依存は見当たらない。", k: fact, s: [src-dojo-eternum-history]}
    - {t: "Eternum の離脱理由についてエンジン側・Eternum 側の公式説明は確認できなかった。Cartridge（アカウント・Slot）の撤去と同時期であり、Dojo 固有の問題が理由かは分からない。", k: unknown}
    - {t: "Katana と Torii は 2025-04 に dojo 本体の依存から外され、別リポジトリで開発されている。エンジンは複数の独立した構成要素の組み合わせになった。", k: fact, s: [src-dojo-repo, src-dojo-katana-repo]}
  counter_evidence:
    - {t: "「active」の判定への反証: dojo 本体リポジトリは 2026 年に 12 コミットしかなく、2026-05-06 以降更新がない。開発の中心が katana・torii 等の別リポジトリへ移ったとも、エンジン本体が保守段階に入ったとも読める。", k: analysis, s: [src-dojo-repo, src-dojo-katana-repo]}
    - {t: "「許可不要で拡張できる World」という設計に対し、確認できた主要ゲーム（Eternum・PixeLAW）では、第三者による世界ルールの追加はほぼ見られず、PixeLAW でも例示アプリは中核メンバーの作が大半だった。エンジンの拡張性は、実際の第三者拡張の多さを保証しない。", k: analysis, s: [src-dojo-pixelaw-core, src-dojo-eternum-history]}

