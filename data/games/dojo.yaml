  - {t: "開始時期: ChainCatcher は 2023-02 に作られたと記載、GitHub の初回コミットは 2023-01-08。", s: [src-dojo-chaincatcher, src-dojo-repo]}
  - {t: "Starknet 公式ブログ（2023-07）は Influence を Dojo で作られたゲームとして挙げるが、Influence の公式 SDK は独自の Dispatcher コントラクトを使い Dojo への言及がない。", s: [src-dojo-starknet-blog, src-influence-sdk]}

