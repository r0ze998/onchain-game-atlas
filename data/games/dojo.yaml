id: dojo
name: Dojo
aliases: [Dojo Engine, dojoengine]
kind: engine
depth: index
updated: "2026-10-24"
links:
  website: https://dojoengine.org/
  docs: https://book.dojoengine.org/
  x: https://x.com/ohayo_dojo
  discord: https://discord.gg/dojoengine
  github: https://github.com/dojoengine/dojo
chains: [Starknet（mainnet / Sepolia）, Katana によるアプリチェーン・ローカル開発]
team: "dojoengine（Tarrence van As / Cartridge が創始。主要コミット作者に Tarrence、Ammar、glihm、Larko、Loaf など）"
summary: >-
  Cairo で書く Starknet 向けのオンチェーンゲーム・フレームワーク。ゲーム状態を ECS（モデル＝コンポーネント、システム＝コントラクト）として 1 つの World コントラクトに登録し、
  sozo（ビルド・移行）、Katana（高速シーケンサ）、Torii（インデクサ）で開発から運用までを揃える。
  2023-01 に Cartridge の Tarrence van As が開始し、Eternum（S0・S1）・Roll Your Own・PixeLAW などがこの上に作られた（Loot Survivor が Dojo 製かは本調査で未確認）。
selection_reason: >-
  Starknet 系のフルオンチェーンゲームの大半が依存した基盤であり、MUD と並ぶオンチェーン ECS の代表例。
  World の名前空間・所有者・writer 権限とアップグレード機能が、どこまで「許可不要の拡張」と「運営の管理権限」を両立させたかを確認できる。
  旗艦ゲームの Eternum が 2026 年に Dojo から離れた事実も、エンジン依存のリスクを示す反例として重要。
categories:
  - {id: infra, role: primary, reason: "ECS フレームワーク、シーケンサ（Katana）、インデクサ（Torii）、ツールチェーン（sozo）を提供"}
  - {id: aw, role: secondary, reason: "名前空間を誰でも登録でき、同じ World に第三者がモデル・システムを追加できる設計を「Autonomous Worlds」の文脈で打ち出した"}
  - {id: onchain-rules, role: secondary, reason: "ゲームルールを Cairo のシステムとしてオンチェーンで実行することを前提にする"}
status:
  value: active
  as_of: "2026-10"
  note: "dojo リポジトリの最終コミットは 2026-05-06（sozo v1.8.7 のリリース準備。v* 形式の最新タグは v1.8.0、2025-10-31）。dojo 本体のコミット数は 2023 年 1,264、2024 年 938、2025 年 513、2026 年 12 と急減している。Katana・Torii は別リポジトリに分離され、Katana は 2026-07 まで更新が続く（2026 年 275 コミット）。"
  s: [src-dojo-repo, src-dojo-katana-repo]
dates:
  announced: {date: "2023-07-13", s: [src-dojo-starknet-blog], note: "Starknet 公式ブログの紹介記事。GitHub 上の開始はそれ以前（2023-01）"}
  launched: {date: "2023-07-24", s: [src-dojo-repo], note: "v0.1.0 タグ。v1.0.0 は 2024-11-10"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      World コントラクトがモデル（状態のスキーマ）・コントラクト（システム）・イベント・名前空間を資源として登録し、資源ごとに owner / writer の権限を管理する。
      ゲームのルールは各システム（Cairo コントラクト）が実行し、状態は World のストレージに置かれる。
    s: [src-dojo-world-contract, src-dojo-starknet-blog]
  offchain:
    - {item: "Torii: World のイベントを索引し GraphQL / gRPC で配信するインデクサ（クライアントの読み取り経路）", s: [src-dojo-starknet-blog]}
    - {item: "Katana: ローカル開発やアプリチェーン用の高速シーケンサ（2025-04 に dojo リポジトリから分離）", s: [src-dojo-katana-repo, src-dojo-repo]}
    - {item: "sozo: ビルド・デプロイ・移行計画のツールチェーン", s: [src-dojo-starknet-blog]}
  admin:
    level: significant
    detail: >-
      World では名前空間・資源の owner が upgrade_contract / upgrade_model で実装を差し替え、grant_writer で書き込み権限を与えられる。
      これはエンジンの仕様であり、各ゲームが所有権を放棄しない限り運営はルールを変更できる。コア契約は Nethermind（2024-02）と OpenZeppelin（2024-11）の監査を受けたと README は記す。
    s: [src-dojo-world-contract, src-dojo-repo]
  open_source:
    level: full
    detail: "Apache-2.0。dojo、katana、torii などが dojoengine 組織で公開。"
    url: "https://github.com/dojoengine/dojo"
    s: [src-dojo-repo, src-dojo-katana-repo]
  extensibility:
    level: permissionless-onchain
    detail: >-
      register_namespace は未登録なら誰でも呼べ、呼び出し者がその名前空間の owner になる。第三者は既存 World に自分の名前空間でモデル・システムを追加し、
      他名前空間のモデルを読める。他名前空間への書き込みは owner の grant_writer が必要。PixeLAW のアプリ登録はこの上に作られた。
    s: [src-dojo-world-contract, src-dojo-pixelaw-core]

compare:
  gameplay: {t: "エンジンでありゲームではない。Eternum（文明・戦争 MMO、S0・S1）、Roll Your Own（取引ゲーム）、PixeLAW（ピクセル AW）などが作られた。", k: fact, s: [src-dojo-starknet-blog, src-dojo-eternum-history, src-dojo-pixelaw-core]}
  necessity: {t: "ECS による状態の構造化と Torii による自動索引は、オンチェーンゲームのクライアント同期の手間を減らす。証明可能性（Cairo / STARK）を掲げるが、実運用の多くは Katana のアプリチェーンや Slot のように単一シーケンサで動いた例もあり、検証可能性の度合いはデプロイ先に依存する。", k: analysis, s: [src-dojo-repo, src-dojo-eternum-history]}
  information: {t: "World の状態とイベントは公開。秘匿情報の仕組みはエンジンの標準機能としては確認できなかった。", k: unknown}
  persistence: {t: "World はチェーン上に残るが、名前空間 owner がアップグレード権限を持ち続ける限り、ルールの不変性はゲームごとの運用次第。", k: analysis, s: [src-dojo-world-contract]}
  extensibility: {t: "名前空間の登録は許可不要で、第三者が同じ World にモデル・システムを追加できる。書き込みは owner の許可制。", k: fact, s: [src-dojo-world-contract]}
  money_flow: {t: "エンジン自体にトークンはない。StarkWare は Influence 等への投資・助成で Starknet ゲームを支援し、Dojo の game jam は STRK と USD の賞金を出したと検索結果で確認（本文未読）。Dojo 開発の資金源は確認できなかった。", k: unknown}
  entry_barrier: {t: "開発者は Cairo・Scarb・sozo を学ぶ必要があり、1.x 系でも破壊的変更（例: 1.7 → 1.8）への追随が求められる（PixeLAW の移行ガイドで確認）。", k: fact, s: [src-dojo-pixelaw-core]}

concepts: [c-ecs-engine, c-onchain-state, c-onchain-rules, c-permissionless-extension, c-own-chain, c-autonomous-world, c-gas-abstraction]

article:
  constraints:
    - {t: "旗艦ゲームの離脱: Eternum は 2026-08〜09 に Cartridge を外し、sozo を自前のネイティブ・デプロイヤに置き換え、ネイティブ Cairo（world-native）と自前の Madara シーケンサに移った。現行の contracts/l3 配下の Scarb.toml に dojo 依存は見当たらない。", k: fact, s: [src-dojo-eternum-history]}
    - {t: "Eternum の離脱理由についてエンジン側・Eternum 側の公式説明は確認できなかった。Cartridge（アカウント・Slot）の撤去と同時期であり、Dojo 固有の問題が理由かは分からない。", k: unknown}
    - {t: "Katana と Torii は 2025-04 に dojo 本体の依存から外され、別リポジトリで開発されている。エンジンは複数の独立した構成要素の組み合わせになった。", k: fact, s: [src-dojo-repo, src-dojo-katana-repo]}
  counter_evidence:
    - {t: "「active」の判定への反証: dojo 本体リポジトリは 2026 年に 12 コミットしかなく、2026-05-06 以降更新がない。開発の中心が katana・torii 等の別リポジトリへ移ったとも、エンジン本体が保守段階に入ったとも読める。", k: analysis, s: [src-dojo-repo, src-dojo-katana-repo]}
    - {t: "「許可不要で拡張できる World」という設計に対し、確認できた主要ゲーム（Eternum・PixeLAW）では、第三者による世界ルールの追加はほぼ見られず、PixeLAW でも例示アプリは中核メンバーの作が大半だった。エンジンの拡張性は、実際の第三者拡張の多さを保証しない。", k: analysis, s: [src-dojo-pixelaw-core, src-dojo-eternum-history]}

acquisition:
  audience: [developers]
  summary: {t: "最初の開発者は Loot 派生から来た 2 つのチーム、つまり Dope Wars 出身の Tarrence van As が率いる Cartridge と、Realms（BibliothecaDAO）の Loaf らで、Dojo は彼ら自身のゲーム（Roll Your Own、Eternum）を作る道具として始まった。外部の開発者は 2023-09 以降の賞金付きゲームジャム、Starknet 公式ブログでの紹介、2024 年の常駐プログラムと助成で集められた。", k: analysis, s: [src-dojo-cartridge-interview, src-dojo-early-authors, src-dojo-jam1, src-dojo-starknet-blog]}
  steps:
    - {phase: pre, date: "2023-01-08", t: "Tarrence van As（Cartridge、元 Dope Wars コア貢献者）が「dojo init」でリポジトリを開始した。", k: fact, s: [src-dojo-repo, src-dojo-cartridge-interview]}
    - {phase: pre, date: "2023-02-24", t: "Realms の Loaf が最初のコミット（開発コンテナ設定）を入れた。2023-01〜07 の main のコミット作者は延べ 37 名（別名の重複を含み得る）で、月ごとの作者数は 1（1 月）から 19（6 月）に増えた。うち Tarrence が 360 件、次いで Ammar Arif が 92 件。", k: fact, s: [src-dojo-early-authors]}
    - {phase: pre, date: "2023-03-02", t: "Realms チームは取材で Dojo を「Cairo 1.0 と Rust で書かれる近日公開のエンジン」と呼び、提携していると述べた。", k: claim, who: "Realms / BibliothecaDAO（Nurstar の取材）", s: [src-dojo-nurstar-realms]}
    - {phase: pre, date: "2023-04-06", t: "Tarrence は、Web3 ゲームには大量の道具が必要だと気づき Dojo に多くの資源を投じていること、標準ツールで Starknet に開発チームを呼び込む「触媒」になるつもりだと述べ、自社ゲーム RYO の開発開始を明かした。", k: claim, who: "Tarrence van As（Cartridge、Nurstar の取材）", s: [src-dojo-cartridge-interview], q: "By creating standardized tooling and infrastructure for Starknet Gaming teams, we intend to be a catalyst for the space"}
    - {phase: launch, date: "2023-07-13", t: "Starknet 公式ブログが Dojo を紹介し、Influence・Realms・CafeCosmos・Dope Wars を挙げて Discord への参加を案内した。v0.1.0 のタグは 2023-07-24。", k: fact, s: [src-dojo-starknet-blog, src-dojo-repo]}
    - {phase: growth, date: "2023-09-01", t: "最初の Dojo Game Jam（72 時間、オンライン、優勝 5,000 ドル）を開催し、8 作品が提出された。主催者欄には Cartridge と Realms の関係者（tarrencev、lordofafew 等）が並ぶ。", k: fact, s: [src-dojo-jam1]}
    - {phase: growth, date: "2023-12-15", t: "Holiday Game Jam #3 は一般プール 3 万 STRK＋1.6 万ドルに、Realms・Dope Wars・Briq・PixeLAW 等のスポンサートラックを加え、25 作品が提出された。", k: fact, s: [src-dojo-jam3]}
    - {phase: growth, date: "2024-04", t: "Game Jam #4 の 1・2 位（zKlash、Blob Arena）は、その後 Realms DAO の「L3 Round」（1 ゲームあたり 10 万 LORDS）の投票で上位に入っていた。ジャムが Realms 生態系の資金への入口になった。", k: fact, s: [src-dojo-lootherald-jam4]}
    - {phase: growth, date: "2024-08-05", t: "Cartridge が 750 万ドルのシリーズ A（BITKRAFT 主導、StarkWare 等参加）と Dojo 1.0 を発表し、30 人の開発者が 8 週間ニューヨークに滞在する Dojo Sensei Residency と、最大 2.5 万 USDC の Starknet Seed Grant を開発者向けの施策として挙げた。", k: fact, s: [src-dojo-series-a], q: "an eight-week intensive where 30 builders take to New York City to push the frontiers of fully onchain games"}
  channels:
    - {id: existing-community, t: "最初の貢献者は Dope Wars 出身の Cartridge と Realms（BibliothecaDAO）で、両者とも自分たちのゲームを Dojo で作った。", k: fact, s: [src-dojo-cartridge-interview, src-dojo-early-authors, src-dojo-nurstar-realms]}
    - {id: hackathon, t: "2023-09 から itch.io で 72 時間のゲームジャムを繰り返し、2023-11 には Devconnect（イスタンブール）で Dojo Ninja School を開いた。", k: fact, s: [src-dojo-jam1, src-dojo-jam3, src-dojo-awresearch-2023]}
    - {id: builder-grants, t: "ジャム入賞作が Realms DAO の L3 Round（1 ゲーム 10 万 LORDS）の候補になり、2024 年には常駐プログラムと Starknet Seed Grant（最大 2.5 万 USDC）が案内された。", k: fact, s: [src-dojo-lootherald-jam4, src-dojo-series-a]}
    - {id: platform-distribution, t: "Starknet 公式ブログが 2023-07 と 2024-08 に Dojo と対応ゲームを紹介した。", k: fact, s: [src-dojo-starknet-blog, src-dojo-starknet-lessons]}
    - {id: community-server, t: "ジャムの参加者は Dojo の Discord でチームメイトを探すよう案内された。", k: fact, s: [src-dojo-jam1]}
  cost:
    - {t: "初期開発は Cartridge が自社の資源を投じて進めたと Tarrence は述べる。", k: claim, who: "Tarrence van As（Nurstar の取材）", s: [src-dojo-cartridge-interview]}
    - {t: "ジャムの賞金は Starknet・Cartridge と各トラックのスポンサー（Realms、Dope Wars、Briq、IOSG、AW House 等）が出し、Holiday Jam #3 の一般プールは 3 万 STRK＋1.6 万ドルだった。", k: fact, s: [src-dojo-jam3]}
    - {t: "Cartridge は 2024-08 に 750 万ドルを調達した（StarkWare も参加）。", k: fact, s: [src-dojo-series-a]}
  after:
    - {t: "2024-08 の Starknet 公式ブログは Dojo 製として Dope Wars・Loot Survivor・Paved・Blobert Arena・Eternum・Force Prime Heroes・Starkane を挙げた。", k: fact, s: [src-dojo-starknet-lessons]}
    - {t: "一方で dojo 本体のコミット数は 2023 年 1,264 → 2025 年 513 → 2026 年 12 と減り、旗艦の Eternum は 2026-08〜09 に Dojo から離れた。ジャムや常駐で来た開発者のうち何人が mainnet まで残ったかは公表されていない。", k: fact, s: [src-dojo-repo, src-dojo-eternum-history]}
  counter:
    - {t: "初期の「開発者獲得」の多くは、エンジンを作ったチーム自身とその隣接チーム（Cartridge、Realms）の内部利用で、外部の開発者がエンジンの魅力で集まったことを示す数値は乏しい。最初のジャムの提出は 8 作品、Game Jam #4 の itch.io ページの提出は 3 件にとどまる。", k: analysis, s: [src-dojo-early-authors, src-dojo-jam1, src-dojo-jam4]}
    - {t: "ジャム参加者は賞金（数千〜数万ドル相当）と STRK を目当てにした可能性があり、提出数は継続的な開発者数を示さない。", k: analysis, s: [src-dojo-jam3]}
  lessons:
    - {t: "自社ゲームと並行してエンジンを作り、隣接チームを共同開発者にする: 最初のユーザーを外で探さず、エンジンを必要とする自社タイトル（RYO）と提携先の大型タイトル（Eternum）に使わせると、実戦の要求で道具が育ち、事例が初期の宣伝になる。効く条件は提携先が実際に本番運用まで進むこと。破綻条件は旗艦が離脱する場合で、Eternum の離脱（2026）は「自社と提携先に依存した採用」の脆さを示す。", k: analysis}
    - {t: "ジャムの入賞作を生態系の資金に接続する: 72 時間のジャムの入賞作を DAO の助成ラウンド（Realms の L3 Round）や助成プログラムに送ると、短期参加者が継続開発者に変わる経路ができる。効く条件は助成元が複数あり審査が速いこと。破綻条件は賞金だけが目的の参加が多く、ジャム後に開発が止まる場合。", k: analysis}
  unknowns:
    - "ジャムごとの参加者数（itch.io の join 数）と、入賞チームのうち mainnet に到達した数。"
    - "Dojo Sensei Residency の参加チームと成果。Starknet Seed Grant のうち Dojo 製ゲームへの交付数。"
    - "Game Jam #2 の提出数と入賞作（AW Research は賞金 1 万ドルとのみ記載）。"

