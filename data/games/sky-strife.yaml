unknowns:
  - "autonomous mode 告知の正確な日付（告知ページに日付表記がない）。"
  - "mainnet シーズン（Season 1〜3）の参加者数、試合数、継続率、シーズンパス販売数と売上。"
  - "Sky Strife のルート名前空間の所有権が放棄・移譲されたか（Sky Key とは別の上位権限）。"
  - "Redstone 停止前に Sky Strife の World が他チェーンへ移行されたか。停止後に kooshaba が運営を続けたか。"
  - "第三者がオンチェーンの参加資格システムや報酬システムを実際に登録した例。Night Market の賭け市場の規模。"
  - "ボット・多重アカウントの規模と、報酬が作成費を上回る区間での自作自演の有無。"
  - "Season 0.1〜0.3 および mainnet Season 1〜3 の正確な期間（Season 0.1 の予定日のみ二次資料で確認）。"
  - "Redstone 停止日（2026-05-15）が予定どおり実行されたかの一次記録（参照日に redstone.xyz が残高請求ページのみで、RPC が名前解決できないことから停止済みと推定）。"
contradictions:
  - {t: "報酬曲線の算定期間: 公式 Wiki は「直近 2 日の試合数」で報酬が変わると書くが、公開コードの WINDOW 定数は 604800 秒（1 週間）。ただし LibSkyPool は実行時に SkyPoolConfig テーブルの window 値を読むため、定数は初期値にすぎず、本番 World の値は設定で変わり得た（本番値は未確認）。", s: [src-sky-strife-wiki-rewards, src-sky-strife-repo]}
  - {t: "コアロジックの変更可能性: Wiki は Sky Key 保持者はコアの戦闘・経済ロジックを変えられないとするが、MUD の仕様では名前空間所有者がシステムを差し替えられ、運営は 2023 年に MatchSystem を差し替えた（Sky Key とルート名前空間所有権が別物である可能性）。", s: [src-sky-strife-wiki-skykey, src-sky-strife-mud-access, src-sky-strife-patching]}

