id: sky-strife
name: Sky Strife
name_ja: スカイ・ストライフ
aliases: [MUDWar]
kind: game
depth: deep
updated: "2026-10-23"
chains: [Redstone Holesky testnet, Redstone Garnet testnet, Redstone mainnet (chain 690)]
team: "Lattice の社内ゲームスタジオ（中心開発者 kooshaba）。2024 年の autonomous mode 移行時に kooshaba 率いる独立スタジオとして分離すると告知"
summary: >-
  Lattice が自社フレームワーク MUD と自社 L2 の Redstone 上で作った、2〜4 人対戦のフルオンチェーン RTS。
  15 秒ごとに全ユニットが行動権を得る「半リアルタイム」の試合を、移動・攻撃・購入・占領のすべてをトランザクションとして処理し、
  固定供給 1 億枚の ERC-20「🔮（Orb）」で試合の作成と報酬を回す経済を載せた。
  テストネットのシーズン、2024-05 の Redstone mainnet 公開、3 シーズン後の「autonomous mode」（シーズン廃止・管理鍵 Sky Key の移譲）を経て、
  2026-04 に Lattice の解散と Redstone の停止が告知された。
selection_reason: >-
  「フルオンチェーン＋短時間対戦」を実運用まで持ち込んだ数少ない例であり、試合の作成をプレイヤーに委ねるトークン経済、
  MUD World の名前空間・アクセス制御を使った拡張点（試合ごとの参加資格システム、プラグイン、ヘッドレスクライアント）、
  管理鍵（Sky Key）の範囲を明文化して移譲するという「自律化」の手順が、一次資料とコードで追える。
  同時に、ゲームが乗るチェーン自体の停止で世界が失われ得ることを示す反例でもある。
categories:
  - {id: onchain-rules, role: primary, reason: "ユニットの移動・攻撃・購入・建物の占領・試合の勝敗と報酬分配がすべて MUD のシステム（コントラクト）で判定される"}
  - {id: aw, role: secondary, reason: "README が「最終的に Autonomous World になること」を目標に掲げ、Sky Key の移譲と autonomous mode を実施した"}
  - {id: infra, role: secondary, reason: "MUD v2 と Redstone の実地試験台として開発され、ガス問題・インデクサ・状態の分割など MUD 側の改良を引き出した"}
  - {id: p2e, role: secondary, reason: "勝者が ERC-20 の 🔮 を得て、それで次の試合を作る報酬経済を持つ（換金を主目的とした設計ではない）"}
status:
  value: ended
  as_of: "2026-10"
  note: >-
    2024 年に autonomous mode へ移行し、Lattice によるシーズン運営は終了（kooshaba が Sky Key を引き継ぎ保守すると告知）。
    2026-04 に Lattice は解散と Redstone の 2026-05-15 停止を告知し、参照日時点の redstone.xyz は残高請求ページのみを表示している。
    Sky Strife の World は Redstone mainnet（chain 690）上にあったため、チェーン停止で状態は失われたと判断した（判断であり、Sky Strife の終了を明言した一次資料はない。
    Winding Down 告知は Sky Strife の今後に触れず、kooshaba への謝辞と「遊んだゲーム」の列挙にのみ名前が出る）。別チェーンへの移行の有無は確認できなかった（unknowns 参照）。
    play.skystrife.xyz と skystrife.xyz は参照日時点でも応答したが、配信中のクライアントは既定で chain 690 と rpc.redstonechain.com を参照しており、
    参照日（2026-10-23）に rpc.redstonechain.com は名前解決できず、indexer.mud.redstonechain.com は HTTP 530 を返した（検証役が実測）。
  s: [src-sky-strife-autonomous, src-sky-strife-winding-down, src-sky-strife-redstone-claim, src-sky-strife-repo, src-sky-strife-play-client]
dates:
  announced: {date: "2023-11", s: [src-sky-strife-season0], note: "Redstone テストネットでの Season 0 を告知。それ以前にも 2022-08 から MUDWar として社内外プレイテストがあった"}
  launched: {date: "2024-05-01", s: [src-sky-strife-mainnet-blog, src-sky-strife-redstone-live], note: "Redstone mainnet 公開日に合わせて mainnet シーズンを開始"}
  ended: {date: "2026-05-15", s: [src-sky-strife-winding-down], note: "ゲームの終了告知ではなく、載っていた Redstone の停止日（告知上の予定日時 23:59 UTC）"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      MUD World（Redstone 上の 1 つの World コントラクト）に、試合の進行（LobbySystem・MoveSystem・BuildSystem）、
      試合作成と報酬（MatchSystem・LibSkyPool）、シーズンパス、マップ・ヒーローの設定などのシステムが登録されている。
      ターン（15 秒）・金の収入・戦闘結果・勝者の順位と 🔮 の分配はコントラクト内で計算され、2024-01 には戦闘履歴もオンチェーンに保存するよう変更した。
      🔮 は固定供給 1 億の ERC-20 で、Sky Pool（World のアドレス）に保持され、試合の作成と報酬支払い以外では引き出せないと公式 Wiki は説明する。
    s: [src-sky-strife-repo, src-sky-strife-contracts-readme, src-sky-strife-wiki-orbs, src-sky-strife-wiki-skypool, src-sky-strife-wiki-rules]
  offchain:
    - {item: "描画・入力・状態の同期を行うブラウザクライアント（Phaser）と MUD インデクサ。2023 年の障害時は「クライアントへのアクセスを止めただけで、コントラクトはずっと動いていた」と運営は書いている", s: [src-sky-strife-repo, src-sky-strife-patching]}
    - {item: "公式の試合スケジューラ・マッチメイキングサーバー・Discord ボット・分析ワーカー・ボット用ヘッドレスクライアント（いずれもリポジトリに同梱）", s: [src-sky-strife-repo]}
    - {item: "乱数は使わず（コード上で確認した範囲）、試合の公平性は同時進行の 15 秒ターンと順序に依存する。トランザクション順序は Redstone のシーケンサが決める", s: [src-sky-strife-repo, src-sky-strife-season0]}
    - {item: "マップ（レベル）は Tiled で作り、スクリプトでチェーン上にアップロードする。アップロードとローテーション採用は Sky Key 保持者のみ", s: [src-sky-strife-repo]}
  admin:
    level: significant
    detail: >-
      Sky Key（ERC-721 の 1 トークン）の保持者が「事実上 World の所有者」と公式 Wiki は書き、マップ・ヒーロー・建物・ユニット・地形・報酬曲線・シーズン・シーズンパスを変更でき、
      コアの戦闘ロジックと経済ロジックは変更できないとしている。コード上も skyKeyHolderOnly で守られた関数（マップのアップロードとローテーション、ヒーロー設定、シーズンパス作成、
      Sky Pool からの無料試合作成、World の ETH 残高の引き出し）がある。
      ただし MUD の仕様では、システムは名前空間の所有者が差し替えられ、Sky Strife のシステムはルート名前空間に登録されているため、
      「コアロジックは変えられない」という説明はルート名前空間の所有権の扱いに依存する（2023 年のプレイテストでは実際に MatchSystem をホットスワップした）。
      ルート名前空間の所有権が放棄されたかは確認できなかった。
    s: [src-sky-strife-wiki-skykey, src-sky-strife-repo, src-sky-strife-patching, src-sky-strife-mud-access]
  open_source:
    level: full
    detail: >-
      latticexyz/skystrife-public にクライアント・コントラクト・アート・マップ・ヘッドレスクライアント・マッチメイキングサーバー・SQL クエリを MIT ライセンスで公開。
      社内リポジトリから定期的に移す方式（release_open_source.sh）で、公開履歴は 2024-01-08〜2024-07-23 の 26 コミット。
    url: "https://github.com/latticexyz/skystrife-public"
    s: [src-sky-strife-repo, src-sky-strife-wiki-contribute]
  extensibility:
    level: permissionless-onchain
    detail: >-
      MUD World なので誰でも空いている名前空間にテーブルとシステムを登録し、公開システムを呼べる。Sky Strife 固有の拡張点として、試合作成者が
      参加資格判定用のシステム（IAllowSystem.isAllowed を実装した任意の MUD システム）を指定でき、参加時に World がそれを呼ぶ。
      クライアント側にはプラグイン機構（Preact で UI、内部 API に全アクセス）があり、ヘッドレスクライアントでボットも書ける。
      実例として公式ブログは、コミュニティによるダッシュボード（1kx、Yeomen.ai）・カスタムプラグイン（Yeomen.ai）・リーグとトーナメント（World Sky League など）・
      マップ制作コンテスト（上位 2 作が公式ローテーション入り）・Night Market 上の賭け市場を挙げる。
      ただしこれらの多くはオフチェーンのツールやイベントで、第三者がオンチェーンの参加資格システムを実際に登録した例は確認できなかった。
    s: [src-sky-strife-repo, src-sky-strife-mainnet-blog, src-sky-strife-autonomous, src-sky-strife-mud-v2-ready]

compare:
  gameplay: {t: "浮島のマップで 2〜4 人が城から兵を買い、金鉱などの建物を占領して金を稼ぎ、相手の城をすべて落とせば勝ち。15 秒ごとに全ユニットが移動・攻撃の行動権を得る、ターン制とリアルタイムの中間の形式。", k: fact, s: [src-sky-strife-season0, src-sky-strife-wiki-rules, src-sky-strife-site]}
  necessity: {t: "運営は「楽しい・安い・オンチェーン」の三つを同時に満たす実験と位置づけ、試合作成を 🔮 でプレイヤーに委ねる経済と、第三者が試合ルールの外側（参加資格・賭け・リーグ）を作れることにオンチェーン化の意味を求めた。対戦そのものは 15 秒ターンでサーバー型 RTS より制約が大きく、オンチェーンでなければ遊べない遊びかは示されていない。", k: analysis, s: [src-sky-strife-mainnet-blog, src-sky-strife-orbs-blog]}
  information: {t: "全状態が公開で、相手の兵・金・行動はすべて見える（秘匿情報はない）。クライアントのプラグインは相手の金額など UI に出ない情報も読み出せる（公式例 opponentGold / playerDetails）。", k: fact, s: [src-sky-strife-repo, src-sky-strife-plugins-readme]}
  persistence: {t: "コードは公開で、誰でも自前のチェーンに World を再展開できる。一方、実際の World・🔮・試合履歴は Redstone mainnet にあり、2026-05-15 の Redstone 停止告知で、チェーン上の世界の永続性は L2 運営者の存続に依存することが示された。", k: fact, s: [src-sky-strife-repo, src-sky-strife-winding-down]}
  extensibility: {t: "MUD の名前空間による許可不要の拡張、試合ごとの参加資格システム指定、クライアントプラグイン、ヘッドレスクライアントによるボットが可能。コミュニティの実例はダッシュボード・プラグイン・大会・賭け市場など。", k: fact, s: [src-sky-strife-repo, src-sky-strife-mainnet-blog, src-sky-strife-autonomous]}
  money_flow: {t: "試合作成に 100 🔮 を Sky Pool に払い、勝者側は順位に応じて直近の試合数で変わる 50〜150 🔮 を Sky Pool から受け取る。作成者が入場料を設定すれば入場料の総額が順位と作成者に配分される。シーズンパス（ETH、ダッチオークション）の売上は World の ETH 残高に入り、Sky Key 保持者が引き出せる。", k: fact, s: [src-sky-strife-wiki-orbs, src-sky-strife-wiki-rewards, src-sky-strife-repo, src-sky-strife-mainnet-blog]}
  entry_barrier: {t: "テストネット期はブリッジした Holesky ETH が必要で、mainnet では Redstone 上の ETH が必要。ブラウザ内のバーナーウォレットでも遊べた。無料の公式試合は時間帯限定で、autonomous mode 移行後は廃止され、試合作成には 🔮 が必要になった。", k: fact, s: [src-sky-strife-mainnet-blog, src-sky-strife-patching, src-sky-strife-autonomous, src-sky-strife-playtest]}

concepts: [c-onchain-rules, c-onchain-state, c-ecs-engine, c-own-chain, c-permissionless-extension, c-client-plugins, c-autonomous-world, c-fungible-ingame-token, c-gas-abstraction, m-seasons, m-bot-automation, e-entry-fee-prize, e-sink-faucet]
proposed_concepts:
  - {id: c-admin-key-handover, name: 管理鍵の範囲明文化と移譲（autonomous mode）, desc: "運営が持つ管理権限を 1 つの鍵（トークン）に集約し、変更できる範囲・できない範囲を公開した上で、別主体やコミュニティへ移す。"}
  - {id: c-player-created-matches, name: トークンを払ってプレイヤーが試合を作る経済, desc: "運営が試合を配る代わりに、固定供給トークンで誰でも試合（インスタンス）を作れ、報酬はプールから払われる。"}

article:
  what:
    - {t: "プレイヤーは 2〜4 人用の小さな浮島マップに城を持って現れ、最初の金（Wiki 記載時点で 1000 ゴールド）で城からユニットを買い、金鉱や建物を占領して毎ターンの収入を増やし、相手の城をすべて破壊すれば勝つ。", k: fact, s: [src-sky-strife-wiki-rules, src-sky-strife-site]}
    - {t: "時間は 15 秒ごとの「ターン」で刻まれ、ターンが始まるたびに全ユニットが移動・攻撃の行動権を得て、全プレイヤーが支配する鉱山の数に応じて金を得る。ターン内では各自が好きな順で即時に操作でき、運営はこれを「リアルタイムとターン制の中間」と説明した。", k: fact, s: [src-sky-strife-wiki-rules, src-sky-strife-season0]}
    - {t: "試合の外側には 🔮（Orb）という ERC-20 の経済がある。試合を作るには 100 🔮 が必要で、勝つと順位に応じて 🔮 を得て次の試合を作れる。供給は開始時に 1 億枚を Sky Pool に鋳造したきりで、追加発行はない。", k: fact, s: [src-sky-strife-wiki-orbs, src-sky-strife-season0], q: "No more orbs will ever be minted. There is a 100M fixed supply."}
    - {t: "シーズン制の期間は、ダッチオークションで売るシーズンパスがプライベート試合・限定マップとヒーロー・入場料付き試合の設定権を与えた。autonomous mode 以後はこれらが全員に開放された。", k: fact, s: [src-sky-strife-mainnet-blog, src-sky-strife-autonomous]}
  loop:
    - {t: "以下は公式 Wiki・ブログ・コントラクトからの再構成（筆者は実プレイしていない）。プレイヤーはロビーで公開試合に参加するか、100 🔮 を払って（Sky Key 保持者は無料）マップを選び試合を作る。作成時に入場料・順位別の配分率・参加資格システムを指定できる（シーズンパス保持者向け機能）。", k: fact, s: [src-sky-strife-repo, src-sky-strife-wiki-orbs]}
    - {t: "参加者がヒーローを選んで登録し、全員が準備完了になると試合が始まる。PlayerRegisterSystem は参加資格システムが指定されていればそれを呼び出して許可を確かめる。", k: fact, s: [src-sky-strife-repo]}
    - {t: "試合中は 15 秒ごとに行動権と金が配られ、ユニットの購入（BuildSystem）、移動と攻撃（MoveSystem）、建物の占領を繰り返す。ユニットを倒すと相手の価値の一部が金として入る。試合は運営の説明で約 15 分程度。", k: fact, s: [src-sky-strife-contracts-readme, src-sky-strife-wiki-rules, src-sky-strife-mud-zero-to-v2]}
    - {t: "最後の城が残った時点で順位が確定し、エスクローから順位別の 🔮 報酬と入場料の配分が支払われる。得た 🔮 で次の試合を作るか、他人の作った試合に参加する、という循環が想定されていた。", k: fact, s: [src-sky-strife-repo, src-sky-strife-orbs-blog]}
  before_after:
    - {t: "Lattice は、Dark Forest 以降のオンチェーンゲームが構造体・マッピング・個別イベントと専用インデクサを手作りしていたことを開発の障害と見て MUD を作り、Sky Strife をその実証として開発した（前身の MUDWar は MUD v1 時代の 2022-08 に最初のプレイテスト）。", k: claim, who: "Lattice", s: [src-sky-strife-mud-zero-to-v2, src-sky-strife-playtest]}
    - {t: "開発当初は「安い・楽しく速い・フルオンチェーン」の三つから二つしか選べないと感じ、安さは後回しにしたが、Redstone（Plasma 型の代替 DA を使う OP Stack チェーン）で三つ目を満たせたと運営は述べる。", k: claim, who: "Lattice", s: [src-sky-strife-mainnet-blog], q: "At the time, it felt like we had to choose two and forget the third."}
    - {t: "短時間の試合が多数並行する Sky Strife の必要から、MUD は複合キーで状態を区切り、クライアントとインデクサが関係する試合だけを読み込めるようにした（状態の分割）。", k: claim, who: "Lattice", s: [src-sky-strife-mud-zero-to-v2]}
    - {t: "運営が試合を配る経済から、プレイヤーが 🔮 で試合を組む「自己調整的な経済」への移行を狙った点が、ラウンド制で運営が宇宙を展開した Dark Forest との違いである。", k: analysis, s: [src-sky-strife-orbs-blog]}
  onchain_tradeoffs:
    - {t: "生まれた遊び: 試合の作成・入場料・参加資格がコントラクト上の機能なので、ギルドやコミュニティが運営の許可なく大会やリーグを開催し、Night Market 上では試合への賭け市場が作られたと運営は書く。", k: claim, who: "Lattice", s: [src-sky-strife-autonomous, src-sky-strife-mainnet-blog]}
    - {t: "増えた不便: 2023 年のプレイテストでは、MUD の KeysInTable モジュールの配列肥大で 1 トランザクションが最大 4500 万ガスに達し、MetaMask の 3000 万ガス上限を超えて試合の参加・開始・終了ができなくなり、2 日強の停止に至った。", k: fact, s: [src-sky-strife-patching]}
    - {t: "増えた不便: 実時間性は 15 秒ターンという粒度に制限され、各行動は 2 秒以内に確定するトランザクションとして扱われる。運営自身が「ブロックチェーン上でゲームを作る制約のため」と説明している。", k: claim, who: "Lattice", s: [src-sky-strife-season0]}
    - {t: "増えた不便: 永続的な World の修正は「状態を消さずにシステムを差し替える」作業になり、当時の MUD には公式ツールがなかったため臨時スクリプトで MatchSystem をホットスワップし、壊れた試合を管理者関数で破棄して 🔮 を返還した。", k: fact, s: [src-sky-strife-patching]}
    - {t: "運営は「ガス最適化には寛容で、開発速度と読みやすいコードを優先した」と書いており、オンチェーン化のコストを安いチェーン（Redstone）で吸収する前提で設計されていた。", k: claim, who: "Lattice (Vera)", s: [src-sky-strife-patching], q: "In general, our attitude towards gas optimization on Sky Strife has been lax."}
  roles:
    - {t: "運営（Lattice）: 開発、World の展開と修正、シーズン運営、無料試合の定期作成（初回プレイテストでは 1 日 3 回）、シーズンパス販売、マップの選定を担った。Sky Key を保持し、autonomous mode で kooshaba に移譲した。", k: fact, s: [src-sky-strife-playtest, src-sky-strife-orbs-blog, src-sky-strife-wiki-skykey, src-sky-strife-autonomous]}
    - {t: "プレイヤー: 試合への参加に加え、🔮 を使った試合の作成者（マッチプロモーター）としての役割が期待された。初回の 2 週間プレイテストでは 307 試合のうち 178 試合がユーザー作成だったと運営は報告した。", k: claim, who: "Lattice", s: [src-sky-strife-orbs-blog], q: "over half the matches (178 out of 307) were user-created and coordinated"}
    - {t: "コミュニティ組織: [WE]・GGQuest・WASD・1kx・Yeomen.ai・Paladins DAO・AW Research などがリーグ、大会、マップ制作コンテスト、ダッシュボード、プラグインを作った。", k: claim, who: "Lattice", s: [src-sky-strife-mainnet-blog]}
    - {t: "エージェント・ボット: 公式リポジトリにヘッドレスクライアントとボット生成スクリプト（createBotPlayer、findAndFillMatches 等）があり、プログラムからの参加は技術的に想定されていた。ボットの規模や AI エージェントの参加実績は確認できなかった。", k: fact, s: [src-sky-strife-repo]}
  trajectory:
    - {t: "2022-08 に前身 MUDWar の最初のプレイテスト（最大 64 人・中央の王冠争奪）。その後 4 人の殲滅戦・小さなマップへ縮小し、MUD v2 に移植。2023 年初めから毎週金曜のプレイテストを行い、2023 年に 2 週間の公開プレイテストを実施した。", k: fact, s: [src-sky-strife-playtest]}
    - {t: "2023-11-27〜12-15 に Redstone Holesky テストネットで Season 0（初の永続的プレイテスト、最初の 3 日間はシーズンパス無料）。テストネットのシーズンは Season 0・0.1・0.2・0.3 の 4 回。", k: fact, s: [src-sky-strife-season0, src-sky-strife-mainnet-blog, src-sky-strife-bcg-news]}
    - {t: "Season 0 告知は Season 1（mainnet）を「2024 年初め」と予告していたが、実際の mainnet 開始は 2024-05-01 だった。Season 0.1 は 2024-01-08〜01-30 に Redstone Holesky で行う予定と、コミュニティ（WASD）の記事の転載が伝える（二次資料・予定日）。公開リポジトリには Season 0.2（2024-02-06）・0.3（2024-03-19）のコミットがある。", k: fact, s: [src-sky-strife-season0, src-sky-strife-grenade-jan2024, src-sky-strife-repo]}
    - {t: "2024-05-01、Redstone mainnet の一般公開と同日に mainnet でのシーズンを開始。公開リポジトリには 2024-06-10 に Season 2、2024-07-10 に Season 3 のコミットがある。", k: fact, s: [src-sky-strife-redstone-live, src-sky-strife-repo]}
    - {t: "Redstone で 3 シーズンを経た後、運営は autonomous mode への移行を告知: 全機能の全員開放、1 時間開始されない試合は誰でも取り消し可能、無料の日次試合とシーズン・シーズンパスの廃止、Sky Key の kooshaba への移譲、独立スタジオとしての分離。告知ページに日付表記はなく、Season 3 のコミット（2024-07-10）より後で、Wayback Machine の最古の保存（2024-09-07）より前、としか特定できなかった。", k: fact, s: [src-sky-strife-autonomous, src-sky-strife-repo, src-sky-strife-wayback-autonomous]}
    - {t: "2026-04、Lattice は「持続可能な事業にできなかった」として解散と Redstone の 2026-05-15 停止を告知。停止後は EOA の ETH/WETH のみ L1 の引き出しコントラクトで回収でき、コントラクト内の資金は回収できないとした。", k: claim, who: "Lattice (ludens, alvarius)", s: [src-sky-strife-winding-down], q: "Ultimately, we never managed to turn any of it into a sustainable business."}
  retention_evidence:
    - {t: "示されている指標: 初回の 2 週間プレイテストで 355 人のユニークプレイヤー、307 試合、そのうち 178 試合がユーザー作成。大半が 2 試合以上遊んだとし、目標の 100 人を 2 日目に達成したと運営は述べた。", k: claim, who: "Lattice", s: [src-sky-strife-orbs-blog]}
    - {t: "障害（2 日強の停止）の後、試合作成が停止前の水準に戻るまで時間がかかったと運営は書いており、継続性がインフラの安定に敏感だったことを示す。", k: claim, who: "Lattice (Vera)", s: [src-sky-strife-patching]}
    - {t: "示されていない指標: mainnet シーズンの参加者数・試合数・継続率・シーズンパス販売数は、公式ブログでは画像のグラフ以外に数値として確認できなかった。リポジトリには継続率を集計する SQL（RetentionOverview.sql）があるが結果は公開されていない。", k: unknown}
    - {t: "autonomous mode 以後（無料試合の廃止後）にどれだけ試合が作られ続けたかを示す資料は見つからなかった。", k: unknown}
  extensions:
    - {t: "コミュニティ主導の大会: FaultProofBen が NFT 賞品の大会、ggQuest が賞金 1000 ドルの大会を初回プレイテストで開催。後に GGQuest・WASD・[WE] が World Sky League を運営し、GGQuest・Paladins DAO・AW Research も大会を開いた。", k: claim, who: "Lattice", s: [src-sky-strife-orbs-blog, src-sky-strife-mainnet-blog]}
    - {t: "コンテンツ: [WE] のマップ制作コンテストの上位 2 作が公式マップローテーションに採用された。マップのオンチェーン登録自体は Sky Key 保持者が行う。", k: fact, s: [src-sky-strife-mainnet-blog, src-sky-strife-repo]}
    - {t: "ツール: 1kx と Yeomen.ai がダッシュボード、Yeomen.ai がカスタムプラグインを作成。Night Market 上で試合の賭け市場が形成されたと運営は述べる。", k: claim, who: "Lattice", s: [src-sky-strife-mainnet-blog, src-sky-strife-autonomous]}
    - {t: "コードの派生: evmts/skystrife-tevm は skystrife-public のフォークで、Tevm による楽観的更新の概念実証（1 コミット）。", k: fact, s: [src-sky-strife-tevm]}
    - {t: "MUD v2 告知は「Sky Strife と Biomes では、特定のプレイヤーを倒す・ユニットを破壊するなどの独自のインセンティブシステムを世界の中に作れる」と書くが、Sky Strife で第三者が実際にオンチェーンの報酬・参加資格システムを登録した具体例は確認できなかった。", k: claim, who: "Lattice", s: [src-sky-strife-mud-v2-ready]}
  constraints:
    - {t: "管理鍵: Sky Key は報酬曲線・マップ・ユニット性能・シーズン設定を変えられ、World の ETH を引き出せる。Wiki は鍵の最終形を「作業中」とし、将来確定させるとしていた。", k: fact, s: [src-sky-strife-wiki-skykey, src-sky-strife-repo], q: "For all intents and purposes, whomever holds the Sky Key is the “owner” of the Sky Strife world."}
    - {t: "チェーン依存: World・🔮・試合履歴は Redstone 上にあり、L2 の停止とともに失われる。コードが公開でも、状態（誰がいくら 🔮 を持つか）を別チェーンに移す手段は MUD の移行ツールが後から作られたが、Sky Strife に使われたかは不明。", k: fact, s: [src-sky-strife-winding-down]}
    - {t: "1 日あたりの試合作成数に 2000 の上限（MATCHES_PER_DAY_HARD_CAP）があり、報酬は直近の試合数が増えるほど 150 から 50 🔮 へ下がる。Wiki はこれを「投機的な行動を防ぐため」と説明する。", k: fact, s: [src-sky-strife-repo, src-sky-strife-wiki-rewards]}
    - {t: "報酬曲線が作成コスト 100 🔮 を上回る区間（150 🔮）では、試合を作って自分（や仲間の複数アカウント）で勝てば 🔮 が増える。1 回の試合で配られる報酬の配分は順位別比率に依存し、多重アカウントへの対策はコード上確認できなかった。", k: analysis, s: [src-sky-strife-repo]}
    - {t: "15 秒ターンと 2〜4 人の小規模試合という形式は、チェーンの確定時間に合わせた妥協であり、より大規模・高頻度の対戦に拡大できるかは示されていない。", k: analysis, s: [src-sky-strife-season0]}
  principles:
    - {t: "固定供給トークンで「試合を作る権利」を配る: 試合（インスタンス）の生成コストをトークンで払い、報酬をプールから払うと、運営の試合配布を減らしつつ、勝者が次の試合の主催者になる循環を作れる。適用条件は報酬が直近の試合数で減衰し、作成コストと報酬の差で無限増殖しないこと。破綻条件は、報酬がコストを上回る区間で多重アカウントの自作自演が採算に乗る場合や、プレイヤー数が少なく試合が埋まらない場合（autonomous mode で無料試合を止めると新規参加者の入口が細る）。", k: analysis, s: [src-sky-strife-orbs-blog, src-sky-strife-repo, src-sky-strife-wiki-rewards]}
    - {t: "インスタンスごとの参加資格フック: 試合作成者が任意のオンチェーンシステム（isAllowed）を参加条件として指定できるようにすると、トークン保有・ギルド所属・大会の予選通過などの規則を運営の改修なしに第三者が作れる。適用条件は MUD のように別名前空間のシステムを安全に呼び出せる基盤があること。破綻条件は、フックが常に失敗する・ガスを浪費する悪意ある実装で試合が詰まる場合で、Sky Strife では 1 時間開始しない試合を誰でも取り消せる規則で後始末した。", k: analysis, s: [src-sky-strife-repo, src-sky-strife-autonomous]}
    - {t: "管理権限を 1 つの鍵に集約し範囲を公開する: 運営権限をトークン化した鍵にまとめ、変えられる項目（バランス・マップ・報酬曲線）と変えられない項目（コアロジック）を明文化すると、運営交代（Lattice→kooshaba）を鍵の移転で行える。適用条件は、鍵以外の上位権限（ルート名前空間の所有権・アップグレード権）も同時に整理されていること。破綻条件は、明文化された範囲の外にチェーン運営者や名前空間所有者の権限が残る場合で、Sky Strife ではチェーン停止という鍵の外のリスクで世界が終わった。", k: analysis, s: [src-sky-strife-wiki-skykey, src-sky-strife-autonomous, src-sky-strife-winding-down]}
    - {t: "ゲームを基盤の負荷試験にする: フレームワークとチェーンの開発元が自社ゲームを本番で運用すると、ガス上限・インデクサ・状態分割などの欠陥が早く見つかり基盤側が改善される（KeysInTable 問題、状態分割、トランザクション遅延）。適用条件は基盤とゲームが同じ組織にあること。破綻条件は、ゲームが基盤の宣伝・検証手段と位置づけられる結果、基盤側の事業判断（資金・方針）でゲームの継続が決まること。", k: analysis, s: [src-sky-strife-patching, src-sky-strife-autonomous, src-sky-strife-winding-down]}
  counter_evidence:
    - {t: "「プレイヤーが試合を作る自己調整経済」の成功を示す数字は初回 2 週間のプレイテスト（355 人）のものに限られ、mainnet 期の定着を示す公開データは見つからない。autonomous mode の告知自体が「無料試合が出るまで何時間も待った」不満に触れており、試合の供給は最後まで課題だった可能性がある。", k: claim, who: "Lattice", s: [src-sky-strife-orbs-blog, src-sky-strife-autonomous]}
    - {t: "第三者拡張の実例として挙がるもの（大会、ダッシュボード、プラグイン、賭け市場）は、多くがオフチェーンのツールや人手の運営で、従来のゲームでも外部ツールや大会として実現できる種類のものである。オンチェーンの許可不要拡張でなければ成立しなかった例は、この調査では特定できなかった。", k: analysis, s: [src-sky-strife-mainnet-blog]}
    - {t: "Sky Key の説明（コアロジックは変えられない）と、2023 年に運営がシステムをホットスワップした事実・MUD の名前空間所有者がシステムを差し替えられる仕様は緊張関係にある。「自律」の実態は運営主体の自制と権限設定に依存していた。", k: analysis, s: [src-sky-strife-wiki-skykey, src-sky-strife-patching, src-sky-strife-mud-access]}
    - {t: "終了の直接要因は、ゲーム単体の不人気ではなく、運営母体 Lattice の資金枯渇と Redstone の停止である（Lattice の説明）。ゲームの設計を評価する材料と、基盤事業の失敗を区別する必要がある。", k: claim, who: "Lattice (ludens, alvarius)", s: [src-sky-strife-winding-down]}
    - {t: "公開リポジトリの最終コミットは 2024-07-23 で autonomous mode 告知より前にあたり、autonomous mode 以後に稼働していた設定・コードが公開されたかは確認できない。open_source を full とする評価は 2024-07 時点のスナップショットに対するもので、Sky Key 移譲後の World の実態を外部から再現できる保証にはならない。", k: analysis, s: [src-sky-strife-repo, src-sky-strife-wayback-autonomous]}
    - {t: "Lattice の Winding Down 告知は、MUD 用の移行ツールで DUST の World を状態ごと別チェーンへ移したと書く。技術的には Sky Strife も移行し得たため、「チェーン停止で世界が失われた」は基盤の宿命ではなく、移行を行う主体（kooshaba / Lattice）がいなかった、あるいは選ばなかった結果である可能性がある（移行の有無自体は未確認）。", k: analysis, s: [src-sky-strife-winding-down]}
    - {t: "Lattice は DUST での経験を「プレイヤーが通貨・市場・都市・新聞を作った」と述べており、自律世界の創発は Sky Strife のような試合型 RTS よりも、持続するサンドボックス型の世界で強く現れたと運営自身が見ている可能性がある。", k: claim, who: "Lattice (ludens, alvarius)", s: [src-sky-strife-winding-down]}

