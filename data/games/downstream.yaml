  - "2024-05 の Redstone hackathon で Downstream 上に作られた成果物の有無と数。"
  - "開発が 2024-07 以降ほぼ止まった理由と、Playmint による Downstream の公式な終了告知の有無。"
  - "Redstone 停止前に世界の状態を保存・移行したか。"
  - "Cartridge による Playmint 買収の一次資料と、Downstream への影響。"
