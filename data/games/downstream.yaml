  - "運営（owner）が本番で registerRule / autorizeStateMutation を公開後に実行したか（Redstone 停止でチェーン履歴を参照できなかった）。"
  - "外部 3 作がメインネット（Redstone）上に実際に展開・稼働していたか。"
contradictions:
  - {t: "CEO の寄稿は「digital physics は不変」「（自社を含め）誰もが許可なくコードを追加できる」、GamesTX は Amor の見解として「開発者に god mode はなく誰でも同じ権限で拡張できる」と記す（後者は記者の地の文で直接引用ではない）。一方コントラクトでは owner のみが registerRule と autorizeStateMutation を実行できる。", s: [src-downstream-amor-column, src-downstream-gamestx, src-downstream-game-contract]}
  - {t: "Redstone 停止の告知日: Lattice の X 投稿は 2026-04-14 17:20 UTC、L2BEAT のマイルストーンと ChainCatcher・TechFlow の記事は 2026-04-15（アジア時間での報道日とみられる）。", s: [src-downstream-lattice-x, src-downstream-l2beat-redstone, src-downstream-chaincatcher-lattice]}
  - {t: "ゾーン価格: 公式ガイドは 0.001 ETH、Zones721 の既定値は 1 ETH（owner が setMintPrice で変更可能なため、本番設定が 0.001 ETH だった可能性が高い）。", s: [src-downstream-redstone-guide, src-downstream-zones721]}
  - {t: "ライセンス: 2025 年追加の License ファイルは MIT だが、Rule コントラクトの SPDX 表記は UNLICENSED のまま。", s: [src-downstream-repo, src-downstream-plugin-rule]}

acquisition:
  audience: [developers, players]
  summary: {t: "最初の利用者はプレイヤーではなく、許可リストに登録した数十のウォレット（Playmint 社員と招待した外部の作り手）と、投資家・提携先の開発チーム（1kx・Tonk・RockawayX）だった。公開は自社チェーンを持たず Lattice の Redstone の開発者プレビューと Worlds Expo・Composability Day に乗る形で、一般プレイヤーの獲得を示す数値は見つからない。", k: analysis, s: [src-downstream-allowlist, src-downstream-rpgf3-metadata, src-downstream-advanced-tutorials, src-downstream-race-to-mainnet]}
  steps:
    - {phase: pre, date: "2023-05-30", t: "ゲーム展開時に渡すウォレットの許可リストに載ったアカウントだけが最初のユニット（Seeker）を 1 回生成できる仕組みを入れ、最初は 16 アドレス、2023-07 に「TFB」のウォレット、2023-09 に Tonk のアドレスなどを追加して 52 アドレスまで広げた。", k: fact, s: [src-downstream-allowlist]}
    - {phase: pre, date: "2023-10", t: "2023-10-01 に「技術テスト」のため許可リストを無効化するコミット（main 以外のブランチで「do not merge」と注記）があり、2023-10-24 に許可リストなしで動かせるようにし、2023-10-27 に既定の許可リストを空にした。Optimism RetroPGF 3 の申請で Playmint は、十数組のオンチェーン開発者が 1 週間の技術テストに参加し、Downstream を許可なく拡張できることを示したと述べた。", k: claim, who: "Playmint", s: [src-downstream-allowlist, src-downstream-rpgf3-metadata], q: "More than a dozen onchain builders took part in a week-long technical test that demonstrated they could permissionlessy extend downstream."}
    - {phase: pre, date: "2024-01-30", t: "CEO の David Amor はインタビューで、公開は 2024 年ではないと思う、まだプレアルファで、遊ばせてくれと押し寄せる人はいないと語った。", k: claim, who: "David Amor (Playmint CEO)", s: [src-downstream-bcg-amor-2024]}
    - {phase: pre, date: "2024-02", t: "1kx（Playmint のシード投資家）が 2 日間の社内ハッカソンで Hexcraft を作り、2024-02〜03 に Tonk・Hexcraft・RockawayX の Labyrinth が公式リポジトリの複合マップに取り込まれた。", k: fact, s: [src-downstream-1kx-hexcraft, src-downstream-commits, src-downstream-seed]}
    - {phase: launch, date: "2024-04", t: "Lattice は Redstone mainnet の 4 週間の開発者プレビューを告知した記事で、Playmint の Downstream を「5 月に Redstone に来る」作品の一つに挙げ、2024-05 の Redstone 公開時の初期タイトルとして公開された（プレビュー期間中に展開したかは記事に書かれていない）。", k: fact, s: [src-downstream-race-to-mainnet, src-downstream-decrypt-redstone, src-downstream-bcg-redstone]}
    - {phase: growth, date: "2024-05", t: "Redstone の Composability Day でハッカソンへの参加を呼びかけ、ビルダーガイド・Discord の Office Hours（木・金の 2 時間）・難度別の作例案を示した。クライアントには 2024-05-09 に「hackathon」の告知が固定され、2024-05-14 に外された。", k: fact, s: [src-downstream-composability-wiki, src-downstream-commits]}
  channels:
    - {id: invite-gating, t: "最初のユニットを生成できるウォレットを許可リストで限定し、社員・招待者から 52 アドレスまで段階的に広げた後、技術テストを経て撤廃した。", k: fact, s: [src-downstream-allowlist]}
    - {id: existing-community, t: "Autonomous Worlds の作り手の集まり（ハッカソン・会議・AW イベントでの講演）と、投資家 1kx など資本関係のある相手から最初の拡張者を得た。", k: claim, who: "Playmint", s: [src-downstream-rpgf3-metadata, src-downstream-1kx-hexcraft, src-downstream-seed]}
    - {id: content-research, t: "CEO の寄稿や講演で「誰でも許可なくコントラクトを足せる世界」という構想を発信した。", k: fact, s: [src-downstream-amor-column, src-downstream-rpgf3-metadata]}
    - {id: hackathon, t: "1kx の 2 日間の社内ハッカソン（Hexcraft）と、Redstone の Composability Day のハッカソンを開発者獲得の場にした。", k: fact, s: [src-downstream-1kx-hexcraft, src-downstream-composability-wiki]}
    - {id: platform-distribution, t: "Lattice の Redstone の開発者プレビュー告知と公開時の初期タイトル紹介（Worlds Expo と同じ 2024-05 前半）に載った（チェーン側の施策）。Worlds Expo で Downstream が特集された日は確認できない。", k: fact, s: [src-downstream-race-to-mainnet, src-downstream-decrypt-redstone]}
    - {id: community-server, t: "Discord を開発者の窓口にし、Office Hours を開いた。2024-04 には README に Discord のリンクを加えた。", k: fact, s: [src-downstream-composability-wiki, src-downstream-commits]}
  cost:
    - {t: "開発と初期運営の原資はベンチャー資金で、Playmint は 2022 年に Bitkraft 主導・1kx 等参加の 400 万ドルのシードを調達した（Downstream 以前の作品も対象）。RetroPGF 3 の申請の資金源欄は空だった。", k: fact, s: [src-downstream-seed, src-downstream-rpgf3-metadata]}
    - {t: "プレイヤーはゾーン（区画 NFT）を 0.001 ETH（ガイド記載時点）で買えた。賞金・トークン報酬による獲得施策は確認できなかった。", k: fact, s: [src-downstream-redstone-guide]}
  after:
    - {t: "外部の作例リポジトリは 2023-09〜2024-03 の短期間で止まり、本体の開発も 2024-07 以降ほぼ止まった。プレイヤー数・ゾーン販売数はどこにも公表されていない。", k: fact, s: [src-downstream-tonk-repo, src-downstream-rockawayx-repo, src-downstream-hexcraft-repo, src-downstream-commits]}
    - {t: "CEO は「100 人が遊んでくれれば満足」と語っており、目標そのものが小さかった。", k: claim, who: "David Amor (Playmint CEO)", s: [src-downstream-gamestx, src-downstream-bcg-amor-2024]}
  counter:
    - {t: "「十数組が許可なく拡張できた」という技術テストは許可リストを一時的に外した招待制のテストで、参加者は Playmint が声をかけた開発者だった可能性が高い。一般の開発者が自発的に集まった証拠にはならない。", k: analysis, s: [src-downstream-allowlist, src-downstream-rpgf3-metadata]}
    - {t: "RetroPGF 3 の申請で Playmint が影響の指標として挙げたのは CEO の X 投稿の閲覧数（1 万 3800）だけで、プレイヤー数・参加開発者数は示されていない。「十数組」は数え方も参加者名もない自己申告で、技術テストを外部開発者の獲得の成果として扱う根拠は弱い。", k: analysis, s: [src-downstream-rpgf3-metadata]}
    - {t: "確認できる外部の作り手（1kx・Tonk・RockawayX）は投資家・業界の開発チームで、獲得施策の成果というより人脈・資本関係による参加と読める。", k: analysis, s: [src-downstream-seed, src-downstream-advanced-tutorials]}
    - {t: "2024-05 の露出は Redstone 公開と多数のゲームの同時公開に依存しており、2024-01 の時点で CEO は 2024 年の公開を否定していた。Redstone の日程に合わせて準備途中で出した可能性がある。", k: analysis, s: [src-downstream-bcg-amor-2024, src-downstream-race-to-mainnet]}
  lessons:
    - {t: "許可リストで作り手を先に集める: 一般公開前に、ユニット生成をウォレット単位で許可して社員・投資家・招待した開発チームだけに開き、技術テストの期間だけ制限を外すと、拡張の仕組みを少人数で検証できる。効く条件は招待した作り手が自分の作例を公開し、それが後の参加者の手本になること。破綻条件は作り手が投資家・提携先に偏り、テスト後に作例の保守が止まること（Tonk・RockawayX の作例は数か月で停止）。", k: analysis}
    - {t: "他社チェーンの公開イベントに乗る: 自前の集客力が小さい作品でも、L2 の公開時の特集・開発者プレビュー・ハッカソンに参加すると一時的な露出を得られる。破綻条件は露出がチェーン側の日程で決まり、作品の準備や定着策が追いつかないこと、そしてチェーン停止で世界ごと失われること。", k: analysis}
  metrics: [m-downstream-allowlist-size]
  unknowns:
    - "許可リストの「TFB」が何の集団か、技術テストの参加者の名前と実施期間。"
    - "Redstone 公開後のプレイヤー数・ゾーン購入者数と、Composability Day の成果物。"

