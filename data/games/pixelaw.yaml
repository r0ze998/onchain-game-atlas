acquisition:
  audience: [developers, players]
  summary: {t: "最初の参加者は Starknet・Dojo のオンチェーンゲーム／AW 界隈の開発者で、ETHGlobal Paris の受賞を起点に、Discord と X の音声配信、創設者の Substack、非公開テスト、Dojo のゲームジャムの懸賞部門で集めた。遊ぶ人の獲得は Devconnect でのデモ招待以上の施策が確認できず、公開世界の利用者数は不明。", k: analysis, s: [src-pixelaw-ethglobal, src-pixelaw-starknet-roundup76, src-pixelaw-shora-vision, src-pixelaw-shora-easiest, src-pixelaw-itch-jam]}
  steps:
    - {phase: pre, date: "2023-07", t: "ETHGlobal Paris のハッカソンで Dojo 上に Paint・Snake・Rock Paper Scissors を作り、StarkWare の「Starknet — Best Use」賞を得た。", k: fact, s: [src-pixelaw-ethglobal, src-pixelaw-shora-vision]}
    - {phase: pre, date: "2023-07", t: "Starknet の週報が、Stark Cafe の X スペース「Shaping the future of AW - With PixeLAW」と、PixeLAW の Discord 開設を伝えた（2023-07-31 号）。", k: fact, s: [src-pixelaw-starknet-roundup76]}
    - {phase: pre, date: "2023-09-12", t: "創設者 shora の構想記事が、2023-11 のテストネット展開と Devconnect（イスタンブール）での最初のデモを予告し、最初に遊びたい人を会場に招いた。Discord の「wakusei」チャンネルでの議論と、助成金・寄付を募った。", k: claim, who: "shora（PixeLAW）", s: [src-pixelaw-shora-vision], q: "Anyone who wants to be among the first to play PixeLAW is warmly invited to come to Istanbul."}
    - {phase: launch, date: "2023-11", t: "現行の core・examples リポジトリが作られ、非公開テストプレイの 1 週間で新作 3 本が作られ公開されたと創設者は述べた。", k: claim, who: "shora（PixeLAW）", s: [src-pixelaw-core-repo, src-pixelaw-shora-easiest]}
    - {phase: launch, date: "2023-12-14", t: "「最も簡単にフルオンチェーンゲームを作る方法」として環境構築・デプロイ各約 1 分を訴え、Dojo のホリデー・ゲームジャム（2023-12-15 開始）への参加とチーム探しを Discord に誘導した。PixeLAW はこのジャムに 250 ドルの賞を出し、応募作に PixeLAW2048 がある。", k: fact, s: [src-pixelaw-shora-easiest, src-pixelaw-itch-jam]}
    - {phase: growth, date: "2024-04-05", t: "Dojo Game Jam #4（72 時間、賞金総額 2 万ドル＋懸賞部門 3.65 万ドル）に PixeLAW 部門（1,000 ドル）を出し、既存アプリの相互運用化か、既存アプリと相互作用する新アプリを課題にした。", k: fact, s: [src-pixelaw-dojo-gj4]}
    - {phase: growth, date: "2024-06", t: "Starknet Foundation の Propulsion Program 2024（総額 2,000 万ドル、ゲームのユーザー手数料を補填）の配分先一覧に PixeLAW が載った。発表は 2024-06-18 と Realms 側のニュースレターは記す。", k: fact, s: [src-pixelaw-propulsion-2024, src-pixelaw-herald-propulsion]}
    - {phase: growth, t: "ETHGlobal StarkHack で第三者が PixeLAW 上のアプリ p/dash を作った（ページに日付なし）。", k: fact, s: [src-pixelaw-pdash]}
    - {phase: growth, date: "2025-06", t: "「ユーザーと開発者に魅力的な体験を作るため PixeLAW でゲームイベントを開く」ことを目的とする p_war リポジトリが更新された。開催実績は確認できなかった。", k: fact, s: [src-pixelaw-pwar]}
  channels:
    - {id: hackathon, t: "ETHGlobal Paris で生まれ、Dojo のゲームジャム（Holiday Game Jam 3、Game Jam #4）に懸賞部門を出し、StarkHack でも第三者アプリが作られた。", k: fact, s: [src-pixelaw-ethglobal, src-pixelaw-itch-jam, src-pixelaw-dojo-gj4, src-pixelaw-pdash]}
    - {id: existing-community, t: "Dojo・Starknet の AW 界隈（「dojo の文化に倣う」と構想記事が述べる）から開発者を集め、Dojo のジャム参加者を自分の部門に誘った。", k: fact, s: [src-pixelaw-shora-vision, src-pixelaw-shora-easiest, src-pixelaw-dojo-gj4]}
    - {id: community-server, t: "2023-07 に Discord を開き、設計議論（wakusei チャンネル）とジャムのチーム探しの場にした。", k: fact, s: [src-pixelaw-starknet-roundup76, src-pixelaw-shora-vision, src-pixelaw-shora-easiest]}
    - {id: crypto-social, t: "Starknet 界隈の X スペース（Stark Cafe）に出演し、X アカウントのフォローを呼びかけた。", k: fact, s: [src-pixelaw-starknet-roundup76, src-pixelaw-shora-vision]}
    - {id: content-research, t: "創設者の Substack で AW の構想（rules for rules）と開発の速さを説明し、Book でアプリの作り方を公開した。", k: fact, s: [src-pixelaw-shora-vision, src-pixelaw-shora-easiest, src-pixelaw-book]}
    - {id: invite-gating, t: "公開前に非公開のテストプレイ期間を設け、その間に新作 3 本が作られたと述べた。", k: claim, who: "shora（PixeLAW）", s: [src-pixelaw-shora-easiest]}
    - {id: builder-grants, t: "ジャムの懸賞（250 ドル、1,000 ドル）を自ら出し、自らは Starknet Foundation のユーザー手数料補填プログラムの配分先になった。", k: fact, s: [src-pixelaw-itch-jam, src-pixelaw-dojo-gj4, src-pixelaw-propulsion-2024]}
  cost:
    - {t: "構想記事は基盤の構築のために資金調達をせず、創設者は借金で暮らしてイベントを回っていると述べ、助成金・寄付を募った。", k: claim, who: "shora（PixeLAW）", s: [src-pixelaw-shora-vision]}
    - {t: "開発者獲得の直接の支出として確認できたのはジャムの懸賞（250 ドルと 1,000 ドル）だけ。ETHGlobal の賞は StarkWare の賞金枠。", k: fact, s: [src-pixelaw-itch-jam, src-pixelaw-dojo-gj4, src-pixelaw-ethglobal]}
    - {t: "Propulsion Program は利用者が払った手数料に応じて月ごとに補填する仕組みで、PixeLAW が実際に受け取った額は不明。", k: fact, s: [src-pixelaw-propulsion-2024, src-pixelaw-propulsion-v2]}
  after:
    - {t: "Dojo の game-jams リポジトリの Game Jam #4 以降（gj4〜gj8）の提出ファイルに PixeLAW への言及はなく、1,000 ドルの PixeLAW 部門に応じた提出は確認できなかった（clone して検索）。", k: fact, s: [src-pixelaw-dojo-gj4]}
    - {t: "公開例のアプリは主に中核メンバーの作で、確認できた外部作品は PixeLAW2048、p/dash、MetaCat の MUD 移植程度。", k: fact, s: [src-pixelaw-examples, src-pixelaw-itch-jam, src-pixelaw-pdash, src-pixelaw-metacat-mud]}
    - {t: "プレイヤー数・登録アプリ数の公表はなく、参照日に公式のデモ・mainnet 世界に到達できなかった。core のコミットは 2024 年 318 件から 2026 年 4 件に減った。", k: fact, s: [src-pixelaw-demo, src-pixelaw-core-repo, src-pixelaw-github-org]}
  counter:
    - {t: "ハッカソンの受賞や「1 週間で新作 3 本」は審査員・開発者側の評価で、遊ぶ人が集まったことの証拠ではない。3 本の作者が中核メンバーだった可能性も排除できない（作品名・作者は非公開）。", k: analysis, s: [src-pixelaw-shora-easiest, src-pixelaw-examples]}
    - {t: "Propulsion の配分先に載ったことは、手数料を生む利用が後に生じたことを意味しない。補填は利用量に比例するため、受給額が分からない限り利用の証拠にならない。", k: analysis, s: [src-pixelaw-propulsion-2024, src-pixelaw-propulsion-v2]}
    - {t: "外部作品が少ないのは集客施策ではなく設計の問題とも説明できる: 既存アプリの多くが他アプリからの書き込みを既定で拒否し、相互作用には相手アプリ側の改修が要るため、72 時間のジャムで「既存アプリとの相互運用」を課題にしても応じにくい。", k: analysis, s: [src-pixelaw-paint-app, src-pixelaw-examples, src-pixelaw-dojo-gj4]}
  lessons:
    - {t: "汎用エンジンのジャムに「自分の世界の上で作る」部門を出す: エンジンの参加者をそのまま自分の上に誘導でき、費用は数百〜千ドルで済む。効く条件は既存アプリを改修せずに乗れる拡張点があり、72 時間で動くものが作れること。破綻条件は相互作用が相手アプリ側の許可リストに依存する場合で、懸賞を出しても応募が出ない（Game Jam #4 では確認できなかった）。", k: analysis}
    - {t: "開発者向けの速さ（環境構築・デプロイ約 1 分）を訴える集客は、作った後に遊ぶ人がいる場（常時稼働の公開世界とイベント）があってはじめて残る。破綻条件は公開世界の運営（シーケンサ・キュー実行者）が止まる場合で、作り手が成果を見せる場を失う。", k: analysis}
  metrics: [m-pixelaw-closedtest-games, m-pixelaw-gj3-bounty, m-pixelaw-gj4-bounty]
  unknowns:
    - "Devconnect イスタンブール（2023-11）で実際にデモを行ったか、何人が遊んだか。"
    - "非公開テストの参加者数と募集方法。"
    - "Propulsion Program での PixeLAW の受給額と、補填対象になった利用量。"
    - "p_war のイベントの開催日時と参加者数。"

