id: wolf-game
name: Wolf Game
name_ja: ウルフ・ゲーム
aliases: [Woolf, "$WOOL", "Wolf Game 2.0"]
kind: game
depth: index
updated: "2026-10-24"
links:
  website: https://wolf.game/
  docs: https://wolf-game.gitbook.io/getting-started
  x: https://x.com/wolfdotgame
  discord: https://discord.gg/wolfgame
chains: [Ethereum mainnet, Blast（2024 年に移行と報道）, Solana（2025 年の Wolf Game 2.0）]
team: "匿名の開発チーム（コントラクトの展開者アドレスは 0x2502…8DEF）。2023-08 に Pixel Vault が買収したと報道。2025 年時点の CEO は GFunk（仮名）"
summary: >-
  2021-11 に Ethereum で始まった、羊（Sheep）と狼（Wolf）の NFT を「Barn」にステークして $WOOL を得るゲーム。羊は 1 日 1 万 WOOL を生むが、
  請求時に 20% を狼へ税として払い、引き揚げ（unstake）時には 50% の確率で全額を狼に奪われる。WOOL で新しい NFT を作ると 10% の確率で
  ステーク中の狼に横取りされる。画像と特性はオンチェーンの SVG で生成される。展開から約 10 日後（2021-11-28 UTC）に同じ展開者が新しい NFT コントラクト（name() は「Wolf Game」、アップグレード可能なプロキシ）を展開した。移行の理由をステーキング契約の再入可能性バグとする報告があるとされるが、報告本文は取得できず検索要約でしか確認していない（未検証）。
  2025 年の Solana での再始動（Wolf Game 2.0）は反発を受けて数日で停止した。
selection_reason: >-
  「ステーキング報酬」に他プレイヤーからの盗みというリスクを組み込み、DeFi の利回りをゲームの駆け引きに変えた初期の例。
  一方で乱数がブロック情報由来で、ステーキング契約には外部呼び出し後に状態を消す（再入を許し得る）順序がコード上見え、移行後のコントラクトはアップグレード可能なプロキシであるなど、
  「100% オンチェーン」を掲げたゲームが実際にはどこで壊れ、どこに管理権限が残ったかをコードで確認できる。
categories:
  - {id: p2e, role: primary, reason: "NFT のステーキングで $WOOL を得る稼ぐ型の設計。リスク（盗み）を報酬設計に組み込んだ"}
  - {id: onchain-rules, role: secondary, reason: "税・盗み・横取りの判定、WOOL の発行上限、特性と画像の生成をコントラクトが行う"}
  - {id: assets, role: secondary, reason: "羊・狼の NFT（ERC-721）と WOOL（ERC-20）"}
status:
  value: unknown
  as_of: "2026-10"
  note: >-
    公式サイトは Valley と Caves という別モードを案内している（© Shiftless 2026）。2025-04-14 に Solana 上の Wolf Game 2.0 を停止し SOL トークンの流動性を引き揚げると公式が発表した。
    初期の Woolf コントラクトは参照日に paused() = true を返した（検証役の RPC 照会）。初期 Barn や移行後コントラクトのステーキングが現在も機能しているかは確認していない。公式サイトは Ethereum と Abstract のロゴを表示するが、チェーンを説明する本文はない。
  s: [src-wolf-site, src-wolf-decrypt-2025, src-wolf-rpc]
dates:
  launched: {date: "2021-11", s: [src-wolf-nobumei, src-wolf-sourcify-woolf], note: "Woolf コントラクトはブロック 13,638,597（2021-11-18 09:44 UTC、検証役が RPC でブロック時刻を確認）で展開。日本語ニュースレターは 2021-11-20 リリースと記載"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      Woolf（ERC-721）が mint・特性の抽選・横取り先の選択を、Barn がステーキング・1 日 1 万 WOOL の発生・20% の税・引き揚げ時の 50% の没収・2 日間の最低滞在・
      発行上限 24 億 WOOL を、WOOL（ERC-20）が発行と焼却を担う。乱数は tx.origin・直前のブロックハッシュ・タイムスタンプ・種のハッシュで、Barn も同じ方式。
      特性画像は Traits コントラクトに base64 PNG として保存され、tokenURI がオンチェーンで SVG を組み立てる。
    s: [src-wolf-sourcify-woolf]
  offchain:
    - {item: "フロントエンド（wolf.game）。後継モード Valley / Caves の仕組みは今回確認していない", s: [src-wolf-site]}
  admin:
    level: significant
    detail: >-
      初期の Woolf / Barn / WOOL / Traits には所有者専用の pause、有料枠数の変更（setPaidTokens）、売上の引き出し、WOOL の発行者（controller）の追加・削除、
      特性画像の上書き（uploadTraits）、Barn の rescue モード切替がある。移行後の NFT コントラクト（0x7f36…be2f）は TransparentUpgradeableProxy で、管理者が実装を差し替えられる。参照日の RPC 照会では、その ProxyAdmin（0x9d84…a329）の owner() は初期コントラクトと同じ展開者 EOA（0x2502…8DEF）だった。
      2025 年の 2.0 では公式が停止と流動性引き揚げを決めた。
    s: [src-wolf-sourcify-woolf, src-wolf-sourcify-proxy, src-wolf-decrypt-2025, src-wolf-rpc]
  open_source:
    level: partial
    detail: "初期コントラクトは Sourcify で検証済みソースが読める。クライアントや後継版のソース公開は確認できなかった。"
    url: "https://sourcify.dev/server/v2/contract/1/0xEB834ae72B30866af20a6ce5440Fa598BfAd3a42"
    s: [src-wolf-sourcify-woolf]
  extensibility:
    level: none
    detail: "WOOL の発行・焼却は所有者が許可した controller に限られる。Avalanche 上のフォーク（Avax Wolfgame）があったと読者コメントは記すが未確認。"
    s: [src-wolf-sourcify-woolf]

compare:
  gameplay: {t: "羊を Barn に預けて WOOL を貯め、請求（20% 税）か引き揚げ（50% で全没収）を選ぶ。狼は保有するだけで税と没収分を alpha 値（5〜8）に比例して受け取る。WOOL で次世代を mint すると 10% で狼の持ち主に横取りされる。", k: fact, s: [src-wolf-sourcify-woolf, src-wolf-nobumei]}
  necessity: {t: "盗み・税の規則をコントラクトに置くことで、運営に頼らず他プレイヤーとの奪い合いが検証可能になる。ただし乱数はブロック情報由来で、運営は停止・発行者変更・アップグレードの権限を持っていた。", k: analysis, s: [src-wolf-sourcify-woolf, src-wolf-sourcify-proxy]}
  information: {t: "全状態とステーク状況は公開。乱数の入力（tx.origin・前ブロックハッシュ・タイムスタンプ）は取引時点で計算可能で、結果を見て取引を通すかどうかを選べる余地がある。", k: analysis, s: [src-wolf-sourcify-woolf]}
  persistence: {t: "初期コントラクトは移行で置き換えられ、移行後の NFT はアップグレード可能なプロキシ。2024 年に Blast、2025 年に Solana へ移った（後者は停止）と報じられた。", k: fact, s: [src-wolf-sourcify-proxy, src-wolf-decrypt-2025]}
  extensibility: {t: "第三者が規則を拡張する仕組みは確認できない。", k: fact, s: [src-wolf-sourcify-woolf]}
  money_flow: {t: "Gen 0（最初の 20%）は 0.069420 ETH で販売、以降は 2 万・4 万・8 万 WOOL を焼却して mint。羊の WOOL の 20%（請求時）または 100%（引き揚げ時に 50% の確率）が狼の持ち主へ移る。WOOL の総発行は 24 億で停止。", k: fact, s: [src-wolf-sourcify-woolf]}
  entry_barrier: {t: "Ethereum のウォレットとガス代、Gen 0 の購入費（0.069420 ETH）か WOOL。mint はコントラクトからは呼べない（EOA 限定）。", k: fact, s: [src-wolf-sourcify-woolf]}

concepts: [c-nft-asset, c-fungible-ingame-token, c-onchain-rules, c-onchain-randomness, e-p2e, e-sink-faucet]
proposed_concepts:
  - {id: m-risk-staking, name: 盗みのリスクを組み込んだステーキング, desc: "ステーク報酬に他プレイヤーへの税・確率的な没収・新規発行の横取りを組み込み、利回りを駆け引きに変える（risk-to-earn）。"}

article:
  principles:
    - {t: "利回りに対抗プレイヤーを入れる: ステーキング報酬の一部を「捕食者」側の資産保有者に流し、引き揚げ時に確率的な全没収を置くと、いつ請求・引き揚げるかが戦略になる。適用条件は捕食者と被捕食者の比率が供給側で固定され（mint の 90/10）、税率と没収率が公開されていること。破綻条件は乱数が予測・選別可能な場合で、有利な結果だけを通す者が没収を回避できる。", k: analysis, s: [src-wolf-sourcify-woolf]}
    - {t: "外部呼び出しの前に状態を確定させる: Barn の引き揚げは NFT を safeTransferFrom で返した後にステーク記録を削除しており、受け手のコールバックで再入できる順序になっている。再入可能性バグがあったとする報告は検索要約でしか確認できず具体的な経路も未確認だが、この順序はその類型に当たる。", k: analysis, s: [src-wolf-sourcify-woolf]}
  counter_evidence:
    - {t: "「100% オンチェーン」を掲げたにもかかわらず、移行後の NFT コントラクトは管理者がアップグレードできるプロキシで、WOOL の発行者も所有者が追加できる。ルールの不変性は運営への信頼に置き換わっていた。", k: fact, s: [src-wolf-sourcify-proxy, src-wolf-sourcify-woolf]}
    - {t: "「再入可能性バグで停止・移行した」という説明は検索要約（medium.com、この環境で取得不可）にしか依拠しておらず、運営告知や報告本文で確認できていない。コード上は Barn の引き揚げが safeTransferFrom の後にステーク記録を削除し、claim 系関数に EOA 制限がない（コントラクトから呼べば乱数の結果を見て revert できる）ことまでは確認できるが、移行の直接の原因がどれかは特定できない。", k: analysis, s: [src-wolf-sourcify-woolf, src-wolf-herdsman]}
    - {t: "2025 年の 2.0 は既存の羊・狼・土地を燃やして別の資産に替える設計で、評議会（Farmhands Council）も 1 週間前まで内容を知らなかったと報じられ、数日で停止した。オンチェーン資産の所有は、運営が経済を作り替えることを防がなかった。", k: fact, s: [src-wolf-decrypt-2025]}

acquisition:
  audience: [players, holders]
  summary: {t: "事前のホワイトリストや告知期間なしに「ステルス」で Gen0 1 万体を 0.06942 ETH で売り出し、2021-11 の NFT 市場の熱狂期に Crypto Twitter と NFT 収集層から買い手が集まった。羊が WOOL を稼ぎ狼が奪うという仕組みと、WOOL で次世代を作る連鎖が話題と二次流通を生んだ。", k: analysis, s: [src-wolf-defiant-1123, src-wolf-sourcify-woolf, src-wolf-brydisanto]}
  steps:
    - {phase: launch, date: "2021-11-18", t: "Woolf・Barn・WOOL を展開し、Gen0 1 万体（羊 90%・狼 10%）を 0.06942 ETH で「ステルス」発売、すぐに売り切れた。The Defiant は発売の根拠として @wolfdotgame の投稿にリンクしている（投稿本文と時刻は未確認）。初期 Woolf コントラクトの展開はブロック 13,638,597（2021-11-18 09:44 UTC）。", k: fact, s: [src-wolf-defiant-1123, src-wolf-sourcify-woolf, src-wolf-rpc]}
    - {phase: growth, date: "2021-11-23", t: "The Defiant は発売 5 日で 5,200 万ドルの販売と報じた（一次販売と二次流通の区別は不明）。後の回想によれば、羊の最安値は数日で 10 ETH 近くに達し、Post Malone や Marshmello、GaryVee らが目立って関わった。", k: claim, who: "The Defiant / brydisanto（コミュニティの回想）", s: [src-wolf-defiant-1123, src-wolf-brydisanto]}
    - {phase: growth, date: "2021-11", t: "WOOL による次世代の mint は狼を確実に引く不具合とステーキングの脆弱性で止まり、計画 5 万体のうち 13,809 体（Gen0 1 万＋WOOL 由来 3,809）で発行が止まった。初期コントラクトの totalSupply は 13,809 を返す。", k: fact, s: [src-wolf-brydisanto, src-wolf-rpc-supply]}
    - {phase: growth, date: "2021-11-28", t: "新しい NFT コントラクト（アップグレード可能なプロキシ）を展開して移行した。回想記事によれば、悪用の後 3 日以内に運営（Shepherd）が救済計画を作り、報酬は 4 年かけて WOOL を解放する WOOL Pouch で配る形になった。", k: fact, s: [src-wolf-sourcify-proxy, src-wolf-rpc, src-wolf-brydisanto]}
  channels:
    - {id: crypto-social, t: "発売は事前告知のないステルス発売で、The Defiant は @wolfdotgame の投稿にリンクしている。回想記事は、匿名の運営者「The Shepherd」がツイートで物語を作り（原文は eloquent Tweets）、コミュニティに謎めいた物語への傾倒があったと記す。", k: claim, who: "The Defiant / brydisanto（コミュニティの回想）", s: [src-wolf-defiant-1123, src-wolf-brydisanto], q: "builds narrative through eloquent Tweets"}
    - {id: viral-mechanic, t: "羊の WOOL への 20% の税、引き揚げ時 50% の全没収、新規 mint の 10% 横取りという奪い合いが、いつ請求・引き揚げるかを巡る議論と二次流通を生んだ。", k: analysis, s: [src-wolf-sourcify-woolf, src-wolf-brydisanto]}
    - {id: token-incentive, t: "羊 1 体あたり 1 日 1 万 WOOL を発生させ、WOOL を燃やして次世代を mint させた。", k: fact, s: [src-wolf-sourcify-woolf]}
    - {id: creator-stream, t: "回想記事は Post Malone、Marshmello、Amanda Cerny、GaryVee、GMoney が目立って関わったと記す（購入時期と影響の大きさは不明）。", k: claim, who: "brydisanto", s: [src-wolf-brydisanto]}
    - {id: community-server, t: "私的な Discord が派生して同盟・対立が生まれ、Twitter Spaces で大口と「snake」の言い争いが起きるなど、コミュニティ内の駆け引きが遊びの一部になった（2022 年の回想）。", k: claim, who: "brydisanto", s: [src-wolf-brydisanto]}
  cost:
    - {t: "原資は Gen0 購入者の ETH（最大 1 万 × 0.06942 ETH）と、その後の WOOL 焼却による mint。外部資金・広告費は確認できなかった。", k: fact, s: [src-wolf-sourcify-woolf]}
  after:
    - {t: "発行は計画の約 28%（13,809 / 50,000）で止まり、初期コントラクトは参照日に paused。2025 年の Solana 版は反発で数日で停止した。保有者・プレイヤー数の推移は確認できない。", k: fact, s: [src-wolf-rpc-supply, src-wolf-rpc, src-wolf-decrypt-2025]}
  counter:
    - {t: "発売は 2021-11 の NFT 市場の高揚期で、売上の多くは仕組みより相場と著名人の関与による短期の転売需要で説明できる可能性がある。回想記事も、熱狂期に入ってすぐ売り抜けた層がいたと記す。", k: analysis, s: [src-wolf-brydisanto, src-wolf-defiant-1123]}
    - {t: "「5 日で 5,200 万ドル」は見出しの数字で、一次販売の上限（約 694 ETH）を大きく超えるため、ほぼ二次流通の取引額と見られる。参加者数の指標ではない。", k: analysis, s: [src-wolf-defiant-1123, src-wolf-sourcify-woolf]}
    - {t: "「1 万体が売り切れた」は 1 万人の初期参加者を意味しない。Gen0 の mint はホワイトリストもアドレス単位の上限もなく、1 取引 10 体まで・EOA 限定の制限しかないため、同じアドレスが繰り返し mint できた。告知のないステルス発売は、コントラクトを監視していた層や転売目的の買い手に有利に働いた可能性があり、一意の購入アドレス数を集計しない限り初期の買い手の広がりは分からない。", k: analysis, s: [src-wolf-sourcify-woolf]}
  lessons:
    - {t: "【ステルス発売＋奪い合いのステーキング】告知期間なしに低価格で売り出し、保有後すぐに稼ぐ・奪う行動が始まる設計は、発売直後から話題と二次需要を作る。効く条件: NFT 市場に資金が流れ込んでいる時期で、規則が単純で公開されている。破綻条件: 乱数や再入可能性の欠陥が残ったまま公開すると、次世代の mint を止めざるを得ず、成長の連鎖（WOOL→mint）が途中で切れる。", k: analysis, s: [src-wolf-sourcify-woolf, src-wolf-brydisanto]}
  metrics: [m-wolf-mint-price, m-wolf-sales-5d, m-wolf-minted-total]
  unknowns:
    - "Gen0 が売り切れるまでの時間と、一意の購入アドレス数"
    - "著名人が買った時期（発売直後か、二次流通で後から買ったか）"
    - "Discord の参加者数の推移"

