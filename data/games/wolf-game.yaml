  - {id: m-wolf-wool-cap, type: other, value: 2400000000, unit: WOOL, period: "初期 Barn", definition: "ステーキングによる WOOL 発行の総上限（MAXIMUM_GLOBAL_WOOL）。総供給 50 億は二次資料の記載", nature: measured, s: [src-wolf-sourcify-woolf, src-wolf-nobumei]}
