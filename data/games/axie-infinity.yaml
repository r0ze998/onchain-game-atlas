relations:
  - {to: cryptokitties, type: similar-to, basis: analytic, note: "繁殖で新しい NFT を生む経済。Axie は繁殖に対戦用途と換金可能な報酬トークンを加えた。直接の影響を当事者が述べた資料は確認していない"}
  - {to: pixels, type: influenced-by, basis: confirmed, note: "創業者が Homeland の再設計で「Pixel's free-to-play onboarding」の成功を参考にすると明記", s: [src-axie-blog-homeland-path]}
  - {to: gods-unchained, type: similar-to, basis: analytic, note: "資産所有はチェーン上、対戦ルールは運営サーバーという分担が共通"}
  - {to: stepn, type: similar-to, basis: analytic, note: "行動量に比例する報酬トークンの発行と、新規流入に依存した消費という構造が共通"}
  - {to: dark-forest, type: contrasts-with, basis: analytic, note: "Dark Forest はルールをコントラクトで実行。Axie は資産のみをチェーンに置き、ルールは運営が変更できる"}
  - {to: huntercoin, type: contrasts-with, basis: analytic, note: "ゲーム内行為への暗号資産報酬は Huntercoin（2014）が先行。Axie は規模と貸借市場の成立が異なる"}
  - {to: e-scholarship, type: similar-to, basis: analytic, note: "スカラーシップを大衆化した代表例"}
  - {to: c-own-chain, type: similar-to, basis: analytic, note: "ゲーム専用サイドチェーン Ronin とブリッジ事件"}

unknowns:
  - "対戦（Classic/Origins）の判定がすべてサーバーで行われることを明言した一次資料は見つけられなかった（ログイン方式・報酬の Claim 方式・BAN 運用からの推定。第三者の Naavik は「Sky Mavis のサーバーが戦闘結果を計算する」と記す）"
  - "DAU・DAA の定義（アカウント単位か人単位か、マルチアカウントの扱い）は非公開"
  - "スカラー（借り手）の総数、ギルド経由の割合、地域別の内訳"
  - "YGG がスカラー分配をスマートコントラクトで自動化していたかは一次資料で確認できなかった"
  - "bAXS の導入告知記事（S19 告知が「bAXS で報酬を配る 3 シーズン目」と書くため Origins S17 からと判断できるが、正確な日付は未確認）と、Terrariums の bAXS 配布量の総額"
  - "Ronin の公式事後報告（roninchain.com の Community Alert / Postmortem）は 404 で直接取得できず、Sky Mavis ブログと報道で代替した"
  - "2025-12〜2026-06 の運営ブログのアーカイブが API 上で欠けており、その期間の変更は確認できていない"
  - "Axie の経済を扱った査読付き論文は確認できなかった"

contradictions:
  - {t: "Sky Mavis は「バリデータを 5 から 21 に拡大する」と書いたが、報道・分析では事件当時のバリデータは 9（承認閾値 5）とされる。運営記述の「5」が何を指すか不明", s: [src-axie-blog-funding-2022, src-rekt-ronin]}
  - {t: "The Block は攻撃者が「9 つのバリデータノードを掌握した」と書くが、運営と他の報道は Sky Mavis の 4 鍵と Axie DAO の 1 鍵の計 5 とする", s: [src-theblock-ronin-reopen, src-rekt-ronin]}
  - {t: "Origin の早期アクセス公開日は白書では 2022-04-06、公開告知記事の日付は 2022-04-07（04-06 付の資金調達記事も「tomorrow's launch」と記載）", s: [src-axie-wp-battling, src-axie-blog-origin-launch, src-axie-blog-funding-2022]}
  - {t: "白書は Origins を「real-time combat system」と書く一方、同じ箇所と公開告知では「Sequential turns」のターン制と説明している", s: [src-axie-wp-battling, src-axie-blog-origin-launch]}
  - {t: "SLP の価格ピーク: Reuters 配信記事は SLP が「2022-02 のピーク」から 99% 下落したと書くが、CoinGecko の最高値は 2021-07-13（0.3997 ドル）で、同記事内でも価格は 2021 年後半から下落したと記す。", s: [src-reuters-ph-ditch, src-coingecko-api-2026-10]}
  - {t: "初期コミュニティへの AXS 配布額を、ステーキング開始記事は 80 万 AXS・5,000 万ドル超、Series B 記事は 1 億ドル超としている（価格時点の違いの可能性）", s: [src-axie-blog-stake-live, src-axie-blog-seriesb]}

