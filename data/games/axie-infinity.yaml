id: axie-infinity
name: Axie Infinity
name_ja: アクシー・インフィニティ
aliases: [Axie, "Axie Infinity: Classic", "Axie Infinity: Origins", "Axie Infinity: Homeland", "Atia's Legacy"]
kind: game
depth: deep
updated: "2026-10-24"
links:
  website: https://axieinfinity.com/
  play: https://app.axieinfinity.com/
  whitepaper: https://whitepaper.axieinfinity.com/
  x: https://x.com/AxieInfinity
  github: https://github.com/axieinfinity
  blog: https://blog.axieinfinity.com/
ids:
  coingecko: [axie-infinity, smooth-love-potion]
chains: [Ethereum, Loom Network (旧マーケット), Ronin]
team: "Sky Mavis（共同創業者として運営は Jeff (Jihoz), Andy, Trung, Tu (Masamune), Aleks (Psycheout) を挙げる）"
summary: >-
  Axie Infinity は、遺伝子（体のパーツ）を持つ収集キャラクター Axie を NFT として所有し、3 体のチームでカード対戦を行い、
  報酬トークン SLP と運営トークン AXS を使って Axie を繁殖させるゲーム群である。2021 年に運営発表で日次 200 万人超まで急拡大し、
  「Play-to-Earn」とスカラーシップ（資産の貸し出しと報酬分配）を大衆化した一方、SLP の発行超過による価格崩落、
  自前サイドチェーン Ronin のブリッジから約 6 億ドル相当が流出した事件を経験した。経済設計・チェーン設計の成功と失敗の両方が
  一つの運営の公開記録として残っている点で、設計史上の基準例である。
selection_reason: >-
  P2E・二層トークン・スカラーシップ・ゲーム専用チェーンという 4 つの論点が一つの作品に集中しており、運営自身が経済調整の理由と数値を
  ブログで逐次公開しているため、「何を試し、何が起き、どう直したか」を一次資料で追える。成功例としてではなく、報酬トークン経済の
  破綻条件とその後の再設計（SLP 上限・非譲渡報酬 bAXS・評判スコア）を記録する対象として選んだ。
categories:
  - {id: p2e, role: primary, reason: "遊びで換金可能な SLP/AXS を得る設計と、その発行・消費の調整の歴史が中心"}
  - {id: assets, role: secondary, reason: "Axie・Land・Rune/Charm などのゲーム資産を NFT として発行・二次流通させる"}
  - {id: infra, role: secondary, reason: "Ethereum の手数料を避けるため専用サイドチェーン Ronin を構築し、ブリッジ事件の当事者となった"}
status:
  value: active
  as_of: "2026-10"
  note: "2026-09-30 に Origins Season 19 が開始、Classic は IP を Axie Foundation に移してコミュニティが開発できるようにする手続き中、Land は 2026-06 に Homeland を終了して Terrariums に移行、新作 MMORPG Atia's Legacy はプレイテスト段階（いずれも運営ブログによる）。"
  s: [src-axie-blog-origins-s19, src-axie-blog-terrariums-v1, src-axie-blog-lounge-2026-10]
dates:
  announced: {date: "2018-02", s: [src-axie-blog-seriesb], note: "運営は「Axie was born in February 2018」と記述。正式な発表日・初公開日は未確認"}
  launched: {date: "2018", s: [src-axie-wp-contracts], note: "2018 年に Origin Axie のプレセール用コントラクトが使われた（Ethereum）。ゲームとしての正式ローンチ日は特定できなかった"}

architecture:
  onchain:
    level: partial-rules
    detail: >-
      チェーン上にあるのは Axie（ERC-721）・Land・アイテム・Rune/Charm（ERC-1155）、AXS と SLP（ERC-20）、繁殖・マーケット・ステーキング・
      報酬請求のコントラクトである。繁殖はコントラクトで実行され SLP と AXS を消費する。対戦の判定、報酬額の計算、シーズン順位、
      Homeland/Terrariums の進行、bAXS 以前のゲーム内通貨などはサーバー側にあり、報酬は Claim Reward コントラクトで請求する形をとる。
      Homeland について運営は、オンチェーン要素は Land NFT と Land アイテムの配置だけだと明言している。
    s: [src-axie-wp-contracts, src-axie-blog-homeland-alpha, src-axie-blog-greatreset, src-axie-blog-origins-s1]
  offchain:
    - {item: "対戦（Classic / Origins）の判定・マッチング・MMR・報酬計算は運営のゲームサーバーとアカウント（Sky Mavis Account / メールとパスワード）で行う（判定のサーバー実行は第三者分析の記述）", s: [src-axie-blog-origin-launch, src-cg-scholarship-study, src-axie-naavik-df]}
    - {item: "Origins の Rune/Charm は「Sealed（NFT 化不可）」のものと、168 時間待って Ronin にミントできるものに分かれる", s: [src-axie-blog-origins-s1]}
    - {item: "Terrariums の燃料 Lunium はオフチェーン資源で、ゲーム内ショップで購入する", s: [src-axie-blog-terrariums-v1]}
    - {item: "Premium Cursed Coliseum に入金した SLP はゲーム内でのみ使え、引き出し不可（2024-01 時点）", s: [src-axie-blog-slp-classic]}
    - {item: "Axie Score（評判スコア）はオフチェーンで計算され、高スコア者へのステーキング報酬は手動のスナップショットとエアドロップで配る", s: [src-axie-blog-axs-staking-revamp, src-axie-blog-axie-score]}
    - {item: "ボット・マルチアカウントの検出と BAN は運営判断", s: [src-axie-blog-season20, src-axie-blog-origins-s19]}
  admin:
    level: significant
    detail: >-
      運営は SLP の発行量（アドベンチャー・デイリークエスト報酬の廃止、MMR 別報酬）と繁殖手数料を一方的に変更してきた。2022-08 には
      マーケットコントラクトを差し替え全出品を取り下げた。SLP の供給上限 440 億は「社会契約」とゲーム内発行で守るとされ、
      コントラクトでは強制されない。SLP 買い戻し基金はコアチームが管理するウォレットに置かれた。Ronin のバリデータ選定・ブリッジ停止も運営側で行われた。
      2025 年以降は AXS ステーキング報酬の配分変更、Ronin Waypoint ウォレットの終了も運営判断で実施されている。
    s: [src-axie-blog-season20, src-axie-blog-breedingadjustment, src-axie-blog-greatreset, src-axie-blog-slpcap, src-axie-blog-securing-ronin, src-axie-blog-axs-staking-revamp, src-axie-blog-waypoint-sunset]
  open_source:
    level: partial
    detail: >-
      GitHub の axieinfinity 組織で、初期の公開コントラクト（2018）、Ronin のノード実装（アーカイブ済み）、Ronin のブリッジ・DPoS コントラクト、
      ゲーム制作用のスターターキットやアセットキットが公開されている。対戦ロジック・ゲームサーバー・Origins クライアントのソースは確認できなかった。
    url: "https://github.com/axieinfinity"
    s: [src-axie-github-org]
  extensibility:
    level: official-api
    detail: >-
      運営は「アートと遺伝子データは第三者が容易にアクセスできる」とし、査定ツール・マーケット検索・情報サイトなどの第三者ツールが多数作られた。
      2022 年の Builders Program では選抜チームに助成（AXS）・パートナー向け API・Ronin ウォレット連携を提供したが、外部チームの作品を
      ゲームルールとして取り込む仕組み（許可不要のコントラクト拡張）はない。初期のファンメイドのミニゲームは Ronin 移行後に終了した。
    s: [src-axie-wp-master, src-axie-wp-thirdparty, src-axie-blog-builders, src-axie-blog-link-directory]

compare:
  gameplay: {t: "Axie 3 体のチームで行うターン制カード対戦（体のパーツがカードを決める）と、2 体の Axie から新しい Axie を作る繁殖が中心。後に土地経営（Homeland→Terrariums）、MMORPG（Atia's Legacy）のプレイテストが加わった。", k: fact, s: [src-axie-wp-battling, src-axie-wp-breeding, src-axie-blog-terrariums-v1]}
  necessity: {t: "運営自身が「P2E の仕組みに完全に分散化された公開チェーンは不要」と述べており、オンチェーン化の主目的はルールの検証ではなく、資産の所有・希少性・外部市場での換金に置かれている。換金可能性がスカラーシップ市場を生んだ点では必然性があったが、対戦自体はチェーンなしでも成立する。", k: analysis, s: [src-axie-wp-technology]}
  information: {t: "資産の所有・取引・繁殖履歴・トークン発行はチェーン上で公開され、第三者が SLP の発行量と消費量を集計できた。対戦の内部状態・マッチング・ボット判定・報酬計算の根拠は運営サーバー内で非公開。", k: fact, s: [src-axie-blog-dev-journal-econ, src-axie-blog-season20, src-axie-wp-contracts]}
  persistence: {t: "NFT とトークンは運営停止後もチェーン上に残るが、遊ぶための対戦サーバー・アカウント・報酬計算は運営に依存する。実際に Homeland の終了（2026-06）、ファンメイドミニゲームの消滅が起きている。資産の保管も運営のサービスに依存し得る: 2026-10 には Ronin Waypoint（ソーシャルログイン・MPC）ウォレットの終了に伴い、期限までに移さない資産はアクセス不能になり得ると運営が告知した。", k: fact, s: [src-axie-blog-classic-back, src-axie-blog-terrariums-v1, src-axie-blog-builders, src-axie-blog-waypoint-sunset]}
  extensibility: {t: "公開チェーンデータを読む分析ツール・ギルド管理ツール・トラッカーが多数あり、運営もリンク集で紹介している。ゲーム体験の拡張は Builders Program など運営の選抜・許可を経る形に限られる。", k: fact, s: [src-axie-blog-link-directory, src-axie-blog-builders]}
  money_flow: {t: "新規参加者が既存プレイヤーから Axie を買い、既存プレイヤーは対戦で得た SLP を売る。マーケット手数料 4.25% と繁殖の AXS 部分はコミュニティ・トレジャリーへ入る。外部からの資金流入が既存プレイヤーの換金を支える構造だと報道は指摘している。", k: fact, s: [src-axie-blog-treasury-2020, src-theblock-axie-money]}
  entry_barrier: {t: "対戦には Axie 3 体が必要で、2021-08 時点で対戦に耐えるチームは最低 1,500 ドル程度と推定された。2022 年の Origin 以降は無料のスターター Axie（非 NFT）で始められる。Ronin ウォレットの作成と ETH の入手も必要。", k: fact, s: [src-cg-scholarship-study, src-axie-blog-origin-launch]}

concepts: [c-nft-asset, c-fungible-ingame-token, c-own-chain, c-client-plugins, m-breeding, m-collectible-cards, m-seasons, m-land, m-farming-idle, e-p2e, e-dual-token, e-scholarship, e-sink-faucet, e-entry-fee-prize, e-grants-subsidy]

article:
  what:
    - {t: "プレイヤーは Axie と呼ばれる生き物を NFT として所有する。各 Axie は 6 つの体のパーツと体型を持ち、各パーツに優性・劣性 2 段の計 3 つの遺伝子がある。", k: fact, s: [src-axie-wp-breeding]}
    - {t: "Classic（2019-12 公開）は 3 体の Axie でチームを組むターン制カードバトルで、Axie は自分のパーツに対応するカードを引き、プレイヤーはその使う順番とタイミングを選ぶ。", k: fact, s: [src-axie-wp-battling]}
    - {t: "勝利やクエストの報酬として ERC-20 の SLP（Smooth Love Potion）が、リーダーボード上位には AXS（Axie Infinity Shards、総供給 2 億 7,000 万）が配られた。SLP は繁殖で消費される。", k: fact, s: [src-axie-wp-battling, src-axie-wp-axs-alloc, src-axie-blog-breedingadjustment]}
    - {t: "運営は Classic を「ゲーム内資源を ERC-20 として配った最初のゲーム」と主張している。", k: claim, who: "運営 (Sky Mavis)", s: [src-axie-wp-battling], q: "Classic was the first game ever to distribute in-game resources as ERC20 tokens."}
    - {t: "2022 年以降は Origins（Classic の作り直し）、土地を使う Homeland（2026-06 終了）と後継の Terrariums、MMORPG の Atia's Legacy（プレイテスト）へと「同じ NFT を複数の遊びで使う」形に広がった。", k: fact, s: [src-axie-wp-battling, src-axie-blog-terrariums-v1, src-axie-blog-atias-founders]}
  loop:
    - {t: "（2021 年の Classic を運営資料から再構成）プレイヤーはマーケットで Axie を 3 体買う（またはスカラーシップで借りる）。毎日エネルギーの範囲で PvE のアドベンチャーと PvP のアリーナを遊び、デイリークエストを達成して SLP を受け取る。", k: fact, s: [src-axie-blog-season20, src-cg-scholarship-study]}
    - {t: "PvP では MMR が高いほど 1 勝あたりの SLP が多かった（Season 20 変更前は 2000 以上で 18 SLP、1100–1299 で 6 SLP）。2022-02 以前はアドベンチャーで 1 日 50 SLP、デイリークエストでも SLP が得られた。", k: fact, s: [src-axie-blog-season20]}
    - {t: "貯めた SLP は外部市場で売るか、繁殖に使う。繁殖は 2 体の親で SLP（繁殖回数ごとに増える）と AXS を払い、5 日で成体になる卵を得る。1 体の繁殖は最大 7 回で、親子・兄弟間の繁殖はできない。", k: fact, s: [src-axie-wp-breeding]}
    - {t: "生まれた Axie は自分のチーム強化に使うか、マーケットで新規参加者に売る。つまり一巡は「対戦→SLP→繁殖→Axie 販売→新規参加者が対戦を始める」で閉じる。", k: analysis, s: [src-axie-blog-breedingadjustment, src-theblock-axie-money]}
    - {t: "Origins では Rune/Charm の作成（SLP を消費し、一部は NFT 化可能）と 60 日のシーズン制リーダーボード（AXS、Season 17 以降は非譲渡の bAXS）が中心になった。", k: fact, s: [src-axie-blog-origins-s1, src-axie-blog-origins-s19]}
  before_after:
    - {t: "CryptoKitties（2017）は繁殖と所有を示したが遊び方は収集・取引が中心だった。Axie は同じ繁殖型 NFT に対戦の用途と、対戦で得る換金可能な報酬トークンを加えた。", k: analysis}
    - {t: "Ethereum 上では手数料が高く、運営は 2021-02 の Ronin メインネット公開時に「高い取引手数料」を重圧として挙げ、まず Land・アイテムから移行を始めた（Ronin 以後に取引頻度がどれだけ上がったかの一次データは本調査では確認していない）。", k: fact, s: [src-axie-blog-ronin-mainnet]}
    - {t: "それ以前のゲームでもアカウント共有や資産の貸し借りは規約違反として扱われることが多かったが、Axie では運営がスカラー（借り手）とマネージャー（貸し手）を公式に共同体の役割として挙げた。", k: fact, s: [src-axie-blog-october-2021, src-cg-scholarship-study]}
    - {t: "運営は「スカラーシップモデルの発明」が仕事の未来を変えるとまで主張した。", k: claim, who: "運営 (Sky Mavis)", s: [src-axie-blog-seriesb], q: "The invention of the scholarship model is redefining the future of work and has created hundreds of thousands of jobs in countries severely impacted by the pandemic."}
  onchain_tradeoffs:
    - {t: "Axie と SLP が外部で換金できたことで、資本を持つ人（マネージャー）と時間を持つ人（スカラー）の間に貸借市場が生まれた。ウォレットの資産はマネージャーが持ち、スカラーにはゲームのログイン情報だけを渡すことで、資産を移されずに貸せた。", k: fact, s: [src-cg-scholarship-study], q: "In most traditional games, this would violate the terms of service, but not Axie Infinity."}
    - {t: "一方で報酬の価値が外部市場で決まるため、運営はトークンの発行量・消費量を中央銀行のように調整し続ける必要が生じた。運営共同創業者 Jeff Zirlin も報道で自らを「バンカー」と表現している。", k: fact, s: [src-theblock-axie-money]}
    - {t: "自前サイドチェーンで手数料は下がったが、少数のバリデータとブリッジに資産が集中した。2022-03-23、Sky Mavis と Axie DAO のバリデータ鍵が奪われ、ブリッジから 173,600 ETH と 2,550 万 USDC が引き出された。運営は少ないバリデータ数を根本原因と認めた。", k: fact, s: [src-axie-blog-funding-2022], q: "The root cause of the breach was the small validator set which made it much easier to compromise the network."}
    - {t: "流出は 6 日後の 03-29、ユーザーの 5,000 ETH の出金失敗の報告で発覚した。報道によれば、9 バリデータのうち 5 署名で出金が承認される構成で、2021-11 に Axie DAO が Sky Mavis に与えた署名代行の許可が取り消されていなかった。", k: fact, s: [src-rekt-ronin, src-bleeping-fbi-ronin]}
    - {t: "SLP 上限 440 億や評判スコアのように、後の再設計の多くはコントラクトではなく運営の約束・オフチェーン計算で実装された。オンチェーン資産の上に置いたルールの信頼は、結局運営への信頼に依存している。", k: analysis, s: [src-axie-blog-slpcap, src-axie-blog-axie-score]}
  roles:
    - {t: "運営（Sky Mavis）はゲーム開発に加え、SLP/AXS の発行と繁殖手数料の調整、マーケット手数料の設定、Ronin の運用、ボット検出、リーダーボード報酬の配分を行う。", k: fact, s: [src-axie-blog-season20, src-axie-blog-breedingfee, src-axie-blog-securing-ronin]}
    - {t: "スカラーシップのマネージャーは Axie を貸し出して報酬を分配した。Reuters によれば 200 人のスカラーを抱えたあるマネージャーは取り分 60% で、スカラーの日収は約 450 ペソ（記事が挙げる最低賃金 470 ペソをやや下回る）だった。", k: fact, s: [src-reuters-ph-ditch]}
    - {t: "ギルドの Yield Guild Games（YGG）は、プレイヤー 70%・コミュニティマネージャー 20%・YGG 10% の分配を採っていたと共同創業者が述べている。", k: claim, who: "YGG 共同創業者 Gabby Dizon（Forkast 報道）", s: [src-forkast-p2e-dwindle]}
    - {t: "AXS 保有者は 2021-09 からステーキングで AXS を受け取り、2025 年までに App.axie 上の提案投票（AIP）が始まり、たとえばトレジャリー資産のステーキングを投票にかけている（投票の実行方式がオンチェーンかは未確認）。投票力は AXS だけでなく、保有・貢献・成績から計算される Axie Score で決まる。", k: fact, s: [src-axie-blog-stake-live, src-axie-blog-aip-004, src-axie-blog-axie-score]}
    - {t: "ボットは公認されず、運営は PvE の SLP 報酬をボットが稼ぎやすい部分として削減し、2026 年もマルチアカウントは永久 BAN としている。AI エージェントの公式な参加の仕組みはない。2026 年には運営が AI ツールでファンが Axie のゲームを作るコンテスト（Vibeathon、第 1 ラウンド 91 作品）を開催した。", k: fact, s: [src-axie-blog-dev-journal-econ, src-axie-blog-origins-s19, src-axie-blog-lounge-2026-10]}
  trajectory:
    - {t: "運営発表の日次プレイヤー数は 2021-04 の 3.8 万人から 2021-10 に 200 万人超、2021-12 に 250 万人超へ伸びた（定義は非公開）。", k: fact, s: [src-axie-blog-seriesb, src-axie-blog-breedingfee]}
    - {t: "SLP の発行は消費を上回り続け、運営は 2022-01 に「持続不可能」と認め、2022-02 にアドベンチャーとデイリークエストの SLP 報酬を 0 にし、代わりに AXS のリーダーボード報酬を 30 万枠に拡大した。", k: fact, s: [src-axie-blog-dev-journal-econ, src-axie-blog-season20], q: "This inflation in the token is not sustainable."}
    - {t: "2022-03 の Ronin ブリッジ事件の後、運営は 1 億 5,000 万ドルの資金調達を発表し利用者に補填した。後の追記では実際の調達は 1,100 万ドルにとどまり、補填は自社資金で行ったとしている。ブリッジは 2022-06-28 に監査と大口出金の停止機構を加えて再開した。", k: fact, s: [src-axie-blog-funding-2022, src-theblock-ronin-reopen], q: "In the end, we only raised $11M, rather than the $150M that was originally allocated."}
    - {t: "2022-04 に Origin（後の Origins）が早期アクセスで公開され、旧作は Classic として残った。Classic は 2023-11 に「復活」として再公開され、2024-01 には SLP 参加費制のモードが加わった。", k: fact, s: [src-axie-blog-origin-launch, src-axie-blog-classic-back, src-axie-blog-slp-classic]}
    - {t: "2024-01 に運営は SLP 供給上限 440 億（当時供給約 414 億）と買い戻し基金を導入した。2023 年は消費が発行の 3 倍超で 2.8% のデフレだったと運営は述べる。", k: fact, s: [src-axie-blog-slpcap]}
    - {t: "Land ゲームは 2022-12 に Homeland のアルファとして公開されたが、2024-02 に創業者が「拠点建設だけではゲームにならない」と方針転換を表明し、2026-06 に Homeland は終了して受動的な報酬ゲーム Terrariums に置き換えられた。", k: fact, s: [src-axie-blog-homeland-alpha, src-axie-blog-homeland-path, src-axie-blog-terrariums-v1], q: "Base building simply cannot be a full game."}
  retention_evidence:
    - {t: "示されている指標：運営発表の日次プレイヤー（ピーク期に 200〜270 万）、月間アクティブ 220 万（2022-04）、2024 年 Q3 のゲーム DAA 8.7 万・MAA 15.5 万、2024-02 時点の直近 30 日プレイヤー 18 万人。いずれも運営発表で、算出方法は公開されていない。", k: fact, s: [src-axie-blog-breedingfee, src-axie-blog-funding-2022, src-axie-blog-q3-2024, src-axie-blog-homeland-path]}
    - {t: "Reuters は日次ユーザーがピーク約 270 万から約 25 万へ減ったと報じた（2023-04 時点の報道。数値の出所は暗号資産ゲーム情報サイト Cryptogambling.tv で、計測方法は不明）。", k: fact, s: [src-reuters-ph-ditch]}
    - {t: "示されていない指標：コホート別の継続率、1 人あたりの複数アカウント率、スカラー（借り手）と所有者の内訳、ボット比率は公開されていない。Axie を保有する 260 万アドレス（2022-04）もプレイヤー数ではなく、マネージャーが多数のアカウントを持つ構造のため人数との対応は不明。", k: fact, s: [src-axie-blog-funding-2022]}
    - {t: "同じ 2021-10 の運営アップデートは「daily active players」200 万超と並べて、Ronin の日次アクティブアドレスの最高記録を 428,536（2021-10-04）と記す。対戦報酬の請求や取引をしないプレイヤーがいるとしても、DAU はオンチェーンで観測できる活動の約 4.7 倍で、DAU の大半はチェーン上に現れない（運営サーバー内の）活動だと読める。日次でアドレスが動かないことは遊んでいないことを意味しないため、この差は「DAU の水増し」の証拠ではない。", k: analysis, s: [src-axie-blog-october-2021]}
    - {t: "運営自身が、エネルギー制度上 Axie を 3 アカウントに分けてスカラーに渡す方が効率的だったと書いており、2021 年の DAU には報酬目的のアカウント分割が含まれていた可能性がある。DAU の伸びを「遊びの定着」と読むことはできない。", k: analysis, s: [src-axie-blog-season20], q: "it’s actually more energy-efficient to split up 9 Axies onto 3 separate accounts and give them to scholars, than it is to buy your 10th from the marketplace for the extra energy."}
    - {t: "2023 年以降も Origins は Season 19（2026-09）まで続き、Classic も 2023-11 に再公開されて運営され続けており、規模は縮小しながらも継続して遊ぶ層がいることは示されているが、その人数の推移の一次データは限られる（Classic の現行シーズン番号は本調査の出典では確認できなかった）。", k: fact, s: [src-axie-blog-origins-s19, src-axie-blog-classic-back, src-axie-blog-lounge-2026-10]}
  extensions:
    - {t: "コミュニティは Axie の査定ツール、マーケット検索、情報サイト（axie.zone など）を作り、運営は白書でこれを紹介した。", k: fact, s: [src-axie-wp-thirdparty]}
    - {t: "2018–2019 年には Flappy Axie や Axie Sushi などのファンメイドのミニゲームがあったが、Ronin への移行後に終了した。", k: fact, s: [src-axie-blog-builders], q: "they ultimately were discontinued once Ronin was released."}
    - {t: "2022-04 の Builders Program は最低 1 万ドル相当の AXS 助成とパートナー API を提供し、収益の 0–75% をトレジャリーに納める条件を付けた。応募は 2025-02 に締め切られた。", k: fact, s: [src-axie-blog-builders]}
    - {t: "2026 年時点で運営が紹介する第三者ツールには、トレジャリー分析、マーケット分析、一括送付・委任・スナップショットツール（AxieDAO Tools）、Origins の試合分析（axie.top、AxieMeta）、Terrariums の管理ツールがある。", k: fact, s: [src-axie-blog-link-directory]}
    - {t: "スカラーシップの管理（アカウント配布、SLP の集計と分配）を行うギルドとツールが第三者の事業として成立した。YGG は分配をスマートコントラクトで自動化したと報じられているが、一次資料では確認できなかった。", k: unknown}
  constraints:
    - {t: "SLP の主な消費先は繁殖で、繁殖が意味を持つのは新しい Axie を買う新規参加者がいる間だけである。運営も「新規プレイヤーが遊べるのは Axie がプレイヤーより多いときだけ」と書いており、消費は新規流入に依存していた。", k: fact, s: [src-axie-blog-breedingadjustment]}
    - {t: "繁殖手数料を SLP と AXS の 2 通貨で設定したため、両者の価格変動で手数料の比率が崩れ、AXS 部分が 80% を超えて SLP の消費が細った。運営は手作業で何度も比率を直した。", k: fact, s: [src-axie-blog-breedingadjustment, src-axie-blog-breedingfee], q: "While we are currently making these changes manually, long-term we’d like to outsource management of the economy either to intelligent machines or informed members of the Axie community."}
    - {t: "報酬が MMR に比例し、プレイヤー数の増加とともに MMR が全体に上がる「MMR インフレ」が起きたため、シーズン 19 の初日から最終日までに PvP 1 戦あたりの平均 SLP が約 40% 増えたと運営は述べる。運営はオフシーズンの MMR リセットで対処した（告知前にリセットしたことを運営自身が誤りと認めている）。", k: fact, s: [src-axie-blog-dev-journal-econ]}
    - {t: "白書のガバナンス移行の基準（DAU 1,000 万人超かつ週 5% 成長の継続、外部チームの 10 万 DAU ゲーム 3 本）は満たされていない。運営はトレジャリーについて 2025-06 時点でコミュニティが資金を使う仕組みはないと述べた。ただしその後 2025-12 までに AIP-003（ETH のステーキング）・AIP-004（AXS と RON のステーキング）がトレジャリー資産の運用を投票にかけており、使途の一部は投票対象になりつつある。", k: fact, s: [src-axie-wp-dao, src-axie-blog-axie-score, src-axie-blog-aip-004], q: "However, there is currently no mechanism for community members to make use of these funds."}
    - {t: "未解決：報酬の価値を外部市場が決める限り、遊びの面白さとは独立に、価格下落が報酬目的の参加者を一斉に離脱させる。bAXS（非譲渡、換金に評判連動の手数料）はこの連動を弱める試みだが、効果を示すデータはまだない。", k: analysis, s: [src-axie-blog-origins-s19]}
  principles:
    - {t: "【発行＝プレイ量／消費＝新資産生成】報酬トークンの発行がプレイ回数に比例し、主な消費が「新しい資産を作ること」に限られる設計は、新規参加者が作られた資産を買い続ける期間にしか釣り合わない。適用条件：参加者が増えている、または資産に新規参加以外の需要（消費・破壊・アップグレード）がある。破綻条件：流入が鈍ると資産が売れず繁殖が止まり、発行だけが残る（Axie では 2022-02 時点で発行が消費の約 4 倍）。", k: analysis, s: [src-axie-blog-season20, src-axie-blog-breedingadjustment]}
    - {t: "【所有と労働の分離（スカラーシップ）】資産が高価で換金可能な報酬があるとき、資産の貸借は参加者を急拡大させる。適用条件：報酬の現金価値が借り手の機会費用（地域の賃金）を上回る。破綻条件：報酬価格が下がり賃金を下回ると借り手は一斉に去り、また報酬設計がアカウント分割を有利にすると、指標上の DAU が遊びの需要を過大に示す。", k: analysis, s: [src-reuters-ph-ditch, src-axie-blog-season20, src-cg-scholarship-study]}
    - {t: "【二通貨の固定手数料】一つの行為の手数料を変動価格の 2 トークンの固定量で決めると、価格比が動くたびに一方の消費が止まる。適用条件：運営が頻繁に手数料を見直せる、または手数料を法定通貨建てで自動調整できる。破綻条件：手動調整の遅れの間に一方（Axie では AXS）が手数料の 80% 超を占め、もう一方のシンクが機能しなくなる。", k: analysis, s: [src-axie-blog-breedingadjustment, src-axie-blog-breedingfee]}
    - {t: "【専用チェーンとブリッジ】手数料を下げるための専用チェーンは、高頻度の資産操作を可能にする一方、ブリッジの署名者が少数で一社に偏ると単一障害点になる。適用条件：署名者を独立した組織に分散し、大口出金の監視・停止機構を持つ。破綻条件：過半の鍵を一社が持つ、一時的な権限付与を取り消さない、出金監視がない（Ronin では 9 中 5 署名、4 鍵が Sky Mavis、発覚まで 6 日）。", k: analysis, s: [src-rekt-ronin, src-axie-blog-funding-2022, src-theblock-ronin-reopen]}
    - {t: "【非譲渡報酬＋評判連動の換金手数料】報酬を譲渡不可のトークンで渡し、ゲーム内の消費（繁殖・強化・ステーキング）には使えるが外部換金には評判スコアに応じた手数料をかける設計（bAXS）は、短期の換金目的の参加を抑える狙いを持つ。適用条件：ゲーム内に十分な使い道がある。破綻条件：使い道が乏しければ報酬の魅力が消え、評判スコアが資産保有で買えるなら手数料の差は富の差になる（Axie Score は保有を 4 割に制限している）。効果はまだ未検証。", k: analysis, s: [src-axie-blog-origins-s19, src-axie-blog-axie-score]}
  counter_evidence:
    - {t: "2021 年の急成長と 2022 年の縮小は、パンデミック下の失業と暗号資産市場全体の上昇・下落でも説明でき、経済設計の効果と切り分けられない。AXS の最高値（2021-11-06）は市場全体のピーク期と重なる。ただし SLP の最高値は 2021-07-13 で AXS より約 4 か月早く、市場が上昇を続けている間に SLP だけが下落していた点は、市場要因だけでは説明できず SLP 固有の発行超過を示唆する（市場全体のピーク時期は本エントリの出典では未確認）。", k: analysis, s: [src-coingecko-api-2026-10, src-axie-blog-seriesb]}
    - {t: "Ronin の事件（2022-03）は縮小期と重なっており、利用者減少の原因が経済設計か、事件による信頼低下か、市場下落かは資料から判別できない。", k: analysis}
    - {t: "運営によれば 2023 年の SLP は消費が発行の 3 倍超でデフレだったが、SLP 価格は回復せず 2026-10 時点で約 0.00055 ドルである。発行と消費の均衡だけでは報酬トークンの価値は戻らないことを示しており、「インフレが崩壊の原因」という単純な読みに反する。", k: analysis, s: [src-axie-blog-slpcap, src-coingecko-api-2026-10]}
    - {t: "スカラーシップは搾取とだけは言えない。Reuters の例ではスカラーの日収は最低賃金に近く、パンデミック期に実際の収入源となった。一方でマネージャーが 60% を取る例もあり、評価は分配条件次第である。", k: analysis, s: [src-reuters-ph-ditch]}
    - {t: "運営は「Play-to-Earn を発明した」と主張するが、ゲーム内行為に暗号資産の報酬を結びつける例は Huntercoin（2014）などそれ以前にもある。Axie が新しかったのは規模と、貸借市場の成立である可能性が高い。", k: analysis, s: [src-axie-blog-homeland-path]}
    - {t: "縮小後もゲームは終了せず、Origins と Classic のシーズン、新作のプレイテストが 2026 年まで続いている。「P2E の失敗例」として終わった作品と扱うのは事実に反する。", k: fact, s: [src-axie-blog-origins-s19, src-axie-blog-atias-playtest3]}

acquisition:
  audience: [players, holders]
  summary: {t: "2018 年の最初の利用者は CryptoKitties の収集・取引層から来たコレクターで、プレセールの紹介報酬と Discord で数百人規模の共同体ができた。2019-12 の Community Alpha で対戦に SLP 報酬が付いた後、2020 年のロックダウン下のフィリピンで既存保有者が Axie を貸し出し（後のスカラーシップ）、紹介と報道で百万人単位の流入に至った。", k: analysis, s: [src-axie-zimared-psycheout, src-axie-blog-lunacian-1, src-axie-blog-community-alpha, src-axie-unchained-leah, src-axie-blog-nation-2020]}
  steps:
    - {phase: pre, date: "2018", t: "共同創業者 Aleksander Larsen によれば、最初の Axie コミュニティは CryptoKitties のコミュニティから来た。彼自身も CryptoKitties の取引を通じて Jiho・Trung と知り合い、Trung から Discord で誘われた。初期は日次 100 人に達したことを祝った規模だった。", k: claim, who: "Aleksander Larsen（Sky Mavis 共同創業者、ポッドキャスト要約）", s: [src-axie-zimared-psycheout]}
    - {phase: pre, date: "2018", t: "Origin Axie のプレセールを Ethereum で実施した（運営は Axie の誕生を 2018-02 とするが、プレセールの開始月は取得した出典に書かれていない）。プレセールで他の購入者を紹介した人には紹介トークンが配られ、後に Axie Origin Coin（AOC）と呼ばれ、5 枚で新しい Origin Axie と交換できた。", k: fact, s: [src-axie-blog-seriesb, src-axie-wp-contracts, src-axie-bgb-aoc]}
    - {phase: launch, date: "2018-08-04", t: "クローズドベータを開始し、同月 9 日にはプレイヤー間マーケットで 900 体・293 ETH が売れたと運営がツイートした。ベータのアクティブユーザーは 400 人近くと報じられた。", k: fact, s: [src-axie-bgb-closed-beta]}
    - {phase: growth, date: "2019-03-11", t: "Land（Lunacia）の販売で 3,000 ETH 超を集め、最初のニュースレターは新規参加者に Discord で「Axie Scholarship」について尋ねるよう呼びかけていた。この語の中身（誰が何を誰に渡すか）は同号に書かれておらず、2020 年以降の貸与・収益分配型のスカラーシップと同じ仕組みかは確認できない。コミュニティ製の AxieWorld.com も同号で紹介された。", k: fact, s: [src-axie-blog-lunacian-1], q: "Want to start playing but not sure where to start? Join our Discord and ask about the “Axie Scholarship”."}
    - {phase: growth, date: "2019-11-07", t: "Animoca Brands 主導で 146.5 万ドルを調達（記事は「seed」の語を使っていない）。運営は 1 日で 1,200 ETH を集めた記録と、資産販売 110 万ドル・プレイヤー間取引 180 万ドルを実績に挙げた。", k: claim, who: "運営 (Sky Mavis)", s: [src-axie-blog-funding-2019]}
    - {phase: growth, date: "2019-12-19", t: "Unity 製アプリの Community Alpha を Axie 3 体以上の保有者に限って公開し、PvE で Small Love Potion（SLP）が得られるようにした（2020-01-02 から PvP でも）。運営は 1 週間で最安値が 0.004→0.008 ETH に倍増、取引量 300% 超増と記した。", k: fact, s: [src-axie-blog-community-alpha, src-axie-blog-yearend-2019]}
    - {phase: growth, date: "2020-02", t: "MakerDAO の支援で 1,500 DAI の PvP シーズン報酬を始め（賞金の 25% を順位表、75% を試合ごとのドロップに配分、2 週間）、その後も DAI・KNC などの報酬シーズンを続けた。同月、母親や知人を Axie に誘ったプレイヤーの手法を運営ブログで紹介した。", k: fact, s: [src-axie-blog-pvp-s1-dai, src-axie-blog-friends-family, src-axie-blog-nation-2020]}
    - {phase: growth, date: "2020-08", t: "Leah Callon-Butler が CoinDesk でフィリピン Cabanatuan のロックダウン下の Axie プレイヤーを報じた（本人の説明）。運営も 2020 年の振り返りで、8 月のフィリピンの記事が play to earn への注目を集めたと書いている。", k: claim, who: "Leah Callon-Butler（Unchained のポッドキャスト）/ 運営 (Sky Mavis)", s: [src-axie-unchained-leah, src-axie-blog-nation-2020], q: "originated from a coin desk article that I wrote in August 2020"}
    - {phase: growth, t: "コロナ禍のフィリピンで、Gabby Dizon が自分の Axie を地域の人々に貸し始め、これが Yield Guild Games（YGG）につながった。Callon-Butler によれば、初期の大量繁殖者が余った Axie を無料で貸したことからスカラーシップの考えが生まれ、友人・家族の間で遊び方を教え合って広がった。", k: claim, who: "a16z（Arianna Simpson）/ Leah Callon-Butler", s: [src-axie-a16z-ygg, src-axie-unchained-leah]}
    - {phase: growth, date: "2020-10-26", t: "AXS を Binance Launchpad で販売すると発表し、過去のプレイ実績のスナップショットに基づく配布を予告した。", k: fact, s: [src-axie-blog-axs-binance]}
    - {phase: growth, date: "2020-12-30", t: "運営によれば 2020 年に Axie 保有者は 3,284→27,716、オンチェーンの月間アクティブ利用者は 594→18,790、Alpha の週間アクティブテスターは 523→23,224 に増えた。運営は無料で試せる手段がないことが伸びを抑えているとも書いた。", k: claim, who: "運営 (Sky Mavis)（Nansen・DappRadar を引用）", s: [src-axie-blog-nation-2020]}
    - {phase: growth, date: "2021-05-11", t: "Series A（750 万ドル）の告知で、運営は日次アクティブ 4.1 万超・保有者 4.5 万超とし、毎月数十万人が手順の多さで挫折していると書いた。以後、2021-10 には日次 200 万人超に達した。", k: claim, who: "運営 (Sky Mavis)", s: [src-axie-blog-seriesa, src-axie-blog-october-2021], q: "Hundreds of thousands of users try to play Axie each month but give up due to all the steps."}
  channels:
    - {id: existing-community, t: "共同創業者によれば最初のコミュニティは CryptoKitties のコミュニティから来た（プレセール購入者が同じ層だったかは出典に書かれていない）。", k: claim, who: "Aleksander Larsen", s: [src-axie-zimared-psycheout]}
    - {id: referral, t: "2018 年のプレセールで紹介者に紹介トークン（後の AOC、5 枚で Origin Axie 1 体）を配り、Mystic Axie を得る唯一の手段とした。", k: fact, s: [src-axie-bgb-aoc, src-axie-zimared-psycheout]}
    - {id: community-server, t: "初期のニュースレターは Discord への参加を呼びかけ、2019-03 には始め方が分からない人に Discord で「Axie Scholarship」を尋ねるよう案内しており、Discord が新規参加者の受け皿として使われた。", k: fact, s: [src-axie-blog-lunacian-1, src-axie-blog-yearend-2019]}
    - {id: invite-gating, t: "2019-12 の Community Alpha は Axie を 3 体以上持つ人だけが遊べる形で公開された。運営は今後 6 か月で利用者の反応を見てから一般層を狙うとし、紹介機構と新規向けの無料 Axie を開発中と書いた。", k: fact, s: [src-axie-blog-community-alpha]}
    - {id: prize-competition, t: "2020-02 以降、MakerDAO 提供の 1,500 DAI などを賞金とする 2 週間の PvP シーズンを繰り返し、順位報酬と試合ごとのドロップに分けた。", k: fact, s: [src-axie-blog-pvp-s1-dai, src-axie-blog-play-dai-2020]}
    - {id: token-incentive, t: "対戦で得る SLP（2019-12〜）と、過去のプレイ実績のスナップショットに基づく AXS の配布（2020-10 発表）で、遊んだ実績に換金可能な報酬を結びつけた。", k: fact, s: [src-axie-blog-community-alpha, src-axie-blog-axs-binance]}
    - {id: scholarship-guild, t: "2019-03 のニュースレターに「Axie Scholarship」の語が出る（中身は未定義）。2020 年のフィリピンで既存保有者が Axie を貸し出し、YGG などのギルドが組織化した（YGG は 2021-08 時点で 4,700 人超のスカラー）。", k: fact, s: [src-axie-blog-lunacian-1, src-axie-a16z-ygg]}
    - {id: press, t: "2020-08 の CoinDesk のコラムと 2021-05 のドキュメンタリー『Play-to-Earn』がフィリピンの事例を広く知らせた。", k: claim, who: "Leah Callon-Butler / BitPinas", s: [src-axie-unchained-leah, src-axie-bitpinas-docu]}
    - {id: platform-distribution, t: "AXS を Binance Launchpad で販売し、取引所の利用者に配布した。", k: fact, s: [src-axie-blog-axs-binance]}
  cost:
    - {t: "2018〜2019 年の原資は Origin プレセールと Land 販売（2019-03 時点で 3,000 ETH 超）でプレイヤー自身が払い、続いて 2019-11 の 146.5 万ドルのシード、2021 年の Series A・B が加わった。", k: fact, s: [src-axie-blog-lunacian-1, src-axie-blog-funding-2019, src-axie-blog-seriesa, src-axie-blog-seriesb]}
    - {t: "2020 年の報酬の一部は提携先が出した（MakerDAO の DAI による PvP シーズン賞金、Kyber Network・Aave との NFT クエスト）。", k: fact, s: [src-axie-blog-pvp-s1-dai, src-axie-blog-nation-2020]}
    - {t: "SLP 報酬の現金価値は、繁殖した Axie を買う新規参加者と SLP の買い手が払う構造で、スカラーシップではマネージャーの Axie 購入費がスカラーの参加費を肩代わりした。", k: analysis, s: [src-theblock-axie-money, src-cg-scholarship-study]}
  after:
    - {t: "2021 年の日次 200 万人超から、Reuters は約 25 万人（2023-04 頃）への減少を報じ、運営発表でも 2024 年 Q3 の DAA は 8.7 万にとどまる。", k: fact, s: [src-axie-blog-october-2021, src-reuters-ph-ditch, src-axie-blog-q3-2024]}
    - {t: "2018〜2019 年の最初期の利用者（CryptoKitties 由来のコレクター）がどれだけ残ったかを示すコホート指標はない。運営は 2019-12 の Alpha の継続率を「主要ゲームより高い」と述べたが、数値は示していない。", k: claim, who: "運営 (Sky Mavis)", s: [src-axie-blog-yearend-2019]}
  counter:
    - {t: "Larsen は SLP 価格の上昇がフィリピンでの製品市場適合をもたらしたと語っており、流入の主因が 2020-08 の報道か、報酬の現金価値の上昇かは切り分けられない。", k: analysis, s: [src-axie-zimared-psycheout, src-axie-blog-nation-2020]}
    - {t: "2020〜2021 年の伸びは、コロナ禍の失業と暗号資産市場全体の上昇期と重なる。運営自身が、エネルギー制度上アカウントを分けてスカラーに渡す方が効率的だったと書いており、DAU の伸びには報酬目的のアカウント分割が含まれ得る。", k: analysis, s: [src-axie-blog-season20, src-axie-unchained-leah]}
    - {t: "2018 年の「CryptoKitties から来た」は共同創業者の回想（ポッドキャスト要約）に依拠し、プレセール購入者が CryptoKitties の保有アドレスと重なるかのオンチェーン照合はしていない。", k: unknown}
    - {t: "2020 年後半の Alpha テスター増は、2020-10-26 に発表された AXS の「過去のプレイ実績に基づく配布」への期待とも重なる。将来のトークン配布を見込んだ参加（多重アカウントを含み得る）と、報道・スカラーシップによる流入は、運営の週間テスター数からは区別できない。", k: analysis, s: [src-axie-blog-axs-binance, src-axie-blog-nation-2020]}
  lessons:
    - {t: "【保有者限定の先行公開】新しい遊び（Community Alpha）を既存の資産保有者（3 体以上）だけに先に開くと、保有者が資産の価値上昇を見込んで新規参加者を勧誘する。効く条件: 資産が市場で買え、先行公開で資産需要が上がる（Axie では最安値が 1 週間で倍）。破綻条件: 参加に資産購入が必須なままだと、運営自身が書くように「無料で試せない」ことが伸びの上限になる。", k: analysis, s: [src-axie-blog-community-alpha, src-axie-blog-yearend-2019, src-axie-blog-nation-2020]}
    - {t: "【余剰資産の貸し出しによる参加費の肩代わり】繁殖で資産を余らせた古参が、資産を持たない人に貸して報酬を分けると、参加費の壁を越えて地域コミュニティ単位で広がる。効く条件: 報酬の現金価値が借り手の地域の賃金と比べて意味を持ち、貸し手が資産を移さずに貸せる（Axie ではログイン情報の共有）。破綻条件: 報酬価格が下がると借り手が一斉に去り、規約・セキュリティ（鍵の共有）の問題も残る。", k: analysis, s: [src-axie-unchained-leah, src-cg-scholarship-study, src-reuters-ph-ditch]}
    - {t: "【提携先が出す安定通貨の賞金】DeFi プロトコルが賞金（DAI・KNC）を出す短いシーズンは、運営の資金を使わずに報酬を用意できる。効く条件: 提携先が宣伝効果を求め、賞金を試合ドロップに回して下位層にも届く。破綻条件: 賞金総額が小さい（1,500 DAI）ため、それ自体で大量流入は起こさず、報酬トークン価格の上昇の方が影響が大きかった可能性がある。", k: analysis, s: [src-axie-blog-pvp-s1-dai, src-axie-zimared-psycheout]}
  metrics: [m-axie-beta-active-2018-08, m-axie-p2p-sales-2018-08, m-axie-landsale-2019-03, m-axie-seed-2019, m-axie-holders-2020, m-axie-onchain-mau-2020, m-axie-alpha-wau-2020, m-axie-dau-2021-04, m-axie-dau-2021-05, m-axie-dau-2021-10, m-axie-ygg-scholars-2021-08]
