    - "2020-08 の CoinDesk 記事の本文（題名・日付を含め未取得。存在はポッドキャストと運営の振り返り・検索要約のみで確認）"
    - "スカラー（借り手）の総数と、2021 年の DAU のうちスカラーが占める割合"
