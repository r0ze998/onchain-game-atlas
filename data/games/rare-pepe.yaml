  - {id: ev-rarepepe-pepecash, date: "2016-09-17", type: release, title: "PEPECASH を 10 億枚発行（ブロック 430263）", detail: "2016-09-27 にロック。Directory の「流通約 7 億・約 3 億焼却」と整合", s: [src-rarepepe-tokenscan-pepecash]}
  - {id: ev-rarepepe-dailydot, date: "2017-02-21", type: other, title: "Daily Dot が Rare Pepe 経済を報道（500 枚超、申請料 4,000 PEPECASH）", s: [src-rarepepe-dailydot-2017]}
  - {id: ev-rarepepe-auction-2018, date: "2018-01-13", type: other, title: "ニューヨークでのライブオークションで Homer Simpson 風の Rare Pepe が 38,500 ドル", s: [src-rarepepe-wikipedia]}

relations:
  - {to: spells-of-genesis, type: similar-to, basis: analytic, note: "同じ Counterparty 上のカード。SoG は運営発行、Rare Pepe は作家発行と共同体の認定"}
  - {to: loot, type: similar-to, basis: analytic, note: "運営が意味付けを決めず、最小の規則と資産から共同体が文化を作った点で類似。影響関係の一次証拠は未確認"}
  - {to: c-cc0, type: contrasts-with, basis: analytic, note: "Pepe は既存キャラクターに基づく二次創作で、権利の放棄ではなく権利関係が曖昧なまま流通した"}

