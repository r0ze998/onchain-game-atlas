  - {id: m-rarepepe-certified, type: other, value_text: "1700 超（over 1700 rares）", unit: cards, period: "投稿締め切り時点（時期未確認）", definition: "Directory が認定したカード数（Directory の掲示）。Wikipedia は 36 シリーズ 1,774 枚と記載", nature: reported, s: [src-rarepepe-directory-submit]}
  - {id: m-rarepepe-pepecash-supply, type: other, value: 700000000, value_text: "約 7 億", unit: PEPECASH, period: "Directory 記載時点（日付不明）", definition: "流通している PEPECASH の数（Directory 掲示）。約 3 億は焼却", nature: reported, s: [src-rarepepe-directory-pepecash]}
  - {id: m-rarepepe-cards-2017-02, type: other, value: 500, value_text: "500 超", unit: cards, period: "2017-02", definition: "Rare Pepe Wallet 上の個別カード数（Daily Dot）", nature: reported, s: [src-rarepepe-dailydot-2017]}

