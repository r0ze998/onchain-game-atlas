id: rare-pepe
name: Rare Pepe
name_ja: レア・ペペ
aliases: [Rare Pepe Directory, Rare Pepe Wallet, PEPECASH, RAREPEPE]
kind: platform
depth: index
updated: "2026-10-24"
links:
  website: https://rarepepedirectory.com/
chains: [Bitcoin（Counterparty）]
team: "運営会社なし。Rare Pepe Directory（「Rare Pepe Scientists」による審査）、Rare Pepe Wallet（Joe Looney とされる）、世界中の投稿作家"
summary: >-
  2016 年 9 月から Bitcoin 上の Counterparty 資産として発行された、インターネットミーム「Pepe」のカード群。
  作家が自分で Counterparty 資産を作り、発行ロック・分割不可・100〜10 万枚といった規則を満たして Rare Pepe Directory に申請し、
  審査を通ると Rare Pepe Wallet などに表示される。36 シリーズ・1700 枚超が認定された後、投稿は締め切られた。
  ゲームではなく、運営会社なしに「誰でも発行し、共同体が認定する」収集文化の初期例。
selection_reason: >-
  特定の運営やゲームなしに、発行規則（ロック・分割不可）と第三者の認定ディレクトリと共通通貨（PEPECASH）だけで資産流通が成立した例として、
  「最小プリミティブを公開して意味付けを第三者に委ねる」設計の前史にあたるから。同時に、認定という中央の関門が残っていた点で反例にもなる。
categories:
  - {id: assets, role: primary, reason: "作家が自分でロックされた Counterparty 資産を発行し、カードとして売買された"}
  - {id: aw, role: secondary, reason: "運営会社なしで、発行は許可不要、認定はディレクトリ、取引は DEX とウォレットという分業で流通した"}
status:
  value: archived
  as_of: "2026-10"
  note: >-
    Rare Pepe Directory は投稿締め切り（「SUBMISSIONS ARE CLOSED FOR THE FORSEEABLE FUTURE」）を掲示し、シリーズ 1〜36 を掲載したまま残る。
    rarepepewallet.com は「Down for maintenance」で別ドメインへの移動を案内している。資産自体は Counterparty 上に残る。
  s: [src-rarepepe-directory-submit, src-rarepepe-wallet-site]
dates:
  launched: {date: "2016-09-09", s: [src-rarepepe-tokenscan-issuances], note: "最初のカード RAREPEPE が Bitcoin ブロック 428919 で 300 枚発行された日（UTC）"}

architecture:
  onchain:
    level: assets-only
    detail: >-
      各カードは Counterparty 資産（Bitcoin 上）で、発行数・ロック・分割可否・保有と移転がチェーン上にある。
      どの資産が「本物の Rare Pepe」かという認定、画像、シリーズ分けはチェーン外の Directory が管理する。
    s: [src-rarepepe-directory-submit, src-rarepepe-tokenscan-asset]
  offchain:
    - {item: "認定（Rare Pepe Directory の審査、Telegram の投稿ボット）", s: [src-rarepepe-directory-submit]}
    - {item: "画像と説明（資産の description は外部 URL / JSON を指す）", s: [src-rarepepe-tokenscan-asset]}
    - {item: "ウォレット兼マーケット（Rare Pepe Wallet、Book of Orbs）", s: [src-rarepepe-directory-submit, src-rarepepe-dailydot-2017]}
  admin:
    level: limited
    detail: "資産の発行は誰でも可能で、運営がカードを凍結・変更する権限はない（ロック済み資産の場合）。ただし「認定カード」の範囲は Directory の審査が決めた。"
    s: [src-rarepepe-directory-submit, src-rarepepe-directory-about]
  open_source:
    level: unknown
    detail: "Counterparty 自体はオープンソースだが、Directory / Wallet のソース公開は確認していない。"
    s: []
  extensibility:
    level: permissionless-onchain
    detail: "誰でも Counterparty 資産を作れる（発行に 0.5 XCP）。カードとしての認定には審査が必要。PEPECASH を使うゲームを作っている人がいると Directory は記す。"
    s: [src-rarepepe-directory-submit, src-rarepepe-directory-pepecash]

compare:
  gameplay: {t: "ゲームではなく収集と売買。作家がカードを発行して申請し、収集者がウォレットや DEX で売買する。", k: fact, s: [src-rarepepe-directory-submit, src-rarepepe-dailydot-2017]}
  necessity: {t: "運営会社なしに発行数の固定（ロック）と所有の移転を保証する部分にチェーンを使った。認定は依然として中央の Directory に依存しており、チェーンは「本物」の判定までは担っていない。", k: analysis, s: [src-rarepepe-directory-about, src-rarepepe-directory-submit]}
  information: {t: "発行数・保有・取引は公開。審査の基準と判断は Directory の人間が行う。", k: fact, s: [src-rarepepe-directory-submit]}
  persistence: {t: "Directory の投稿は締め切られ、公式ウォレットは保守中表示だが、資産は Counterparty 上に残り DEX 等で移転できる。", k: fact, s: [src-rarepepe-directory-submit, src-rarepepe-wallet-site, src-rarepepe-tokenscan-asset]}
  extensibility: {t: "資産の発行は許可不要。認定と表示は Directory とウォレットが決める。", k: fact, s: [src-rarepepe-directory-submit]}
  money_flow: {t: "作家は 0.5 XCP（と BTC 手数料）で資産を作り、Directory に PEPECASH で申請料を払う（掲示上は 200 PEPECASH、週ごとに調整）。申請料の半分は焼却。収集者は PEPECASH 等で作家・他の保有者から買う。", k: fact, s: [src-rarepepe-directory-submit, src-rarepepe-directory-pepecash]}
  entry_barrier: {t: "Counterparty 対応ウォレット、XCP・BTC・PEPECASH の入手、Telegram での申請手続きが必要で、Directory 自身も暗号資産に不慣れな人には難しいと書いている。", k: fact, s: [src-rarepepe-directory-submit]}

concepts: [c-nft-asset, m-collectible-cards, c-composable-primitive]

article:
  principles:
    - {t: "許可不要の発行と許可制の認定の分離: 発行規則（ロック・分割不可・枚数範囲）をチェーンの機能で強制し、「正典」への収録だけを審査にすることで、運営会社なしに供給の信頼と質の管理を両立させた。破綻条件は認定者が不在になること（投稿締め切り後は新規の正典が増えない）と、認定外の資産との区別がチェーン外の一覧に依存すること。", k: analysis, s: [src-rarepepe-directory-submit, src-rarepepe-directory-about]}
  counter_evidence:
    - {t: "流通の中心はウォレット・ディレクトリという特定サイトであり、それが保守中になると一般の利用者は別ドメインに頼るしかない。「運営不在」は資産層についてのみ言える。", k: analysis, s: [src-rarepepe-wallet-site]}

acquisition:
  audience: [creators, holders]
  summary: {t: "最初の参加者は、4chan 由来の「Rare Pepe」ミームを知る人たちと、Counterparty / Bitcoin の利用者が重なる小さな集団だった。最初の数種のカードの保有者に PEPECASH を配り、Telegram で売買と申請を回したことで、作家と収集者が自分たちで増えていった。", k: analysis, s: [src-rarepepe-dailydot-2017, src-rarepepe-directory-pepecash, src-rarepepe-criptonoticias]}
  steps:
    - {phase: pre, date: "2015", t: "Daily Dot によれば、Rare Pepe の「取引」は 4chan の内輪ネタとして始まり、2015 年には /r9k/ の投稿者が、ミームの希少性を壊す目的で 1,200 枚超の Rare Pepe 画像を放出した（「Peppening」）。チェーン以前から、ミームを「希少なもの」として扱う文化があった。", k: fact, s: [src-rarepepe-dailydot-2017]}
    - {phase: launch, date: "2016-09-09", t: "最初のカード RAREPEPE が Counterparty 資産として 300 枚発行された。発行者は「Mike」と呼ばれる匿名の Counterparty 利用者とされる（二次資料による）。", k: fact, s: [src-rarepepe-tokenscan-issuances, src-rarepepe-criptonoticias]}
    - {phase: launch, date: "2016-09-17", t: "PEPECASH を 10 億枚発行した。Directory によれば、RAREPEPE・GOXPEPE・SHITCOINCARD を市場で買った保有者全員に配り、一部を FoldingCoin の採掘者に寄付し、Twitter と Telegram での配布の後、残り約 3 億枚を焼却した。", k: fact, s: [src-rarepepe-tokenscan-pepecash, src-rarepepe-directory-pepecash], q: "After RAREPEPE, GOXPEPE, AND SHITCOINCARD were sold to buyers on the market, PepeCash was distributed to all of those holders."}
    - {phase: growth, t: "Rare Pepe Wallet（Counterparty ウォレット）と Rare Pepe Directory ができ、作家は自分で資産を発行して Telegram 経由で申請し、認定されたカードがウォレットに並ぶ流れが定着した。", k: fact, s: [src-rarepepe-directory-submit, src-rarepepe-directory-about, src-rarepepe-wikipedia]}
    - {phase: growth, date: "2017-02-21", t: "Daily Dot が Rare Pepe 経済を報じた。カードは 500 枚超、申請料は 4,000 PEPECASH（約 13 ドル）で、記事は Telegram の「Rare Pepe Traders」で取引する人々の声を紹介した。", k: fact, s: [src-rarepepe-dailydot-2017], q: "But our Rare Pepe trading community is global."}
    - {phase: growth, date: "2018-01-13", t: "ニューヨークでライブオークションが開かれ、Homer Simpson 風の Rare Pepe が 38,500 ドルで落札された。", k: fact, s: [src-rarepepe-wikipedia]}
  channels:
    - {id: existing-community, t: "4chan 発祥の Rare Pepe ミームの文化と、Counterparty の利用者が最初の層になった。PEPECASH の一部は FoldingCoin の採掘者にも配られた。", k: fact, s: [src-rarepepe-dailydot-2017, src-rarepepe-directory-pepecash, src-rarepepe-criptonoticias]}
    - {id: token-incentive, t: "最初の 3 種のカードの保有者全員に PEPECASH を配り、それが申請料と売買の共通通貨になった。", k: fact, s: [src-rarepepe-directory-pepecash]}
    - {id: community-server, t: "売買と申請は Telegram のグループで行われ、PEPECASH の配布も Telegram と Twitter で行われた。", k: fact, s: [src-rarepepe-directory-pepecash, src-rarepepe-dailydot-2017, src-rarepepe-wikipedia]}
    - {id: composability, t: "誰でも規則（ロック・分割不可・枚数範囲）を満たす Counterparty 資産を発行して申請できたので、作家が自分の作品を持ち込むこと自体が供給と参加者を増やした（認定は 36 シリーズ・1700 枚超）。", k: fact, s: [src-rarepepe-directory-submit]}
    - {id: press, t: "2017-02 に Daily Dot が報じ、2018-01 のニューヨークのライブオークションには美術館関係者が来場したと Wikipedia は記す。", k: fact, s: [src-rarepepe-dailydot-2017, src-rarepepe-wikipedia]}
  cost:
    - {t: "獲得の原資は運営の資金ではなく、新規発行した PEPECASH だった。保有者への配布と寄付・SNS での配布にあて、残りは焼却した。作家の発行費（0.5 XCP と BTC 手数料）と申請料は作家が払い、申請料の半分は焼却された。", k: fact, s: [src-rarepepe-directory-pepecash, src-rarepepe-directory-submit]}
  after:
    - {t: "認定は 36 シリーズ・1700 枚超まで続いた後、投稿が締め切られ、公式ウォレットは保守中の表示になった。資産は Counterparty 上に残る。", k: fact, s: [src-rarepepe-directory-submit, src-rarepepe-wallet-site]}
    - {t: "収集者数・作家数・取引額の時系列は公表されておらず、継続率は示されていない。", k: unknown}
  counter:
    - {t: "Rare Pepe の参加者が増えたのは、PEPECASH の配布や Telegram のおかげではなく、既存のミームの知名度が大きかった可能性がある。チェーン上の仕組みが新しい人を呼んだのか、ミームの愛好者が既存の場所を移ったのかは、資料から切り分けられない。", k: analysis, s: [src-rarepepe-dailydot-2017]}
    - {t: "Counterparty の発行記録では、最初のカード RAREPEPE（ブロック 428919）と PEPECASH（ブロック 430263）は同じアドレス 1GQhaWqejcGJ4GhQar7SjcCfadxvf5DNBD から発行されている。PEPECASH の初期配布は、独立した第三者の報酬ではなく、最初のカードの発行者側が自分のカードの買い手に新規トークンを配ったものと読め、「共同体が自然に増えた」という説明より、発行者による初期の囲い込みとして見る余地がある。", k: analysis, s: [src-rarepepe-tokenscan-issuances, src-rarepepe-tokenscan-pepecash, src-rarepepe-directory-pepecash]}
    - {t: "高額のオークション（2018-01）は 2017 年末の暗号資産相場の高騰の直後で、注目は相場全体の上昇とも重なる。", k: analysis, s: [src-rarepepe-wikipedia]}
  lessons:
    - {t: "先行保有者への通貨エアドロップ: 最初の数種の資産の保有者に、その後の申請・売買に使う共通通貨を配ると、最初の買い手が次の作品の買い手と申請者になる。効く条件は、配る通貨に申請料という確かな使い道があること。破綻条件は、認定者が投稿を締め切ると通貨の使い道が消えること。", k: analysis}
    - {t: "許可不要の発行と許可制の掲載: 誰でも発行でき、掲載だけを審査にすると、作家が自分で供給を持ち込む。ただし、新しい参加者が入ってくる場所（ウォレット・ディレクトリ・Telegram）が特定の運営者に依存したままなので、その運営者が去ると流入が止まる。", k: analysis}
  metrics: [m-rarepepe-first-issuance, m-rarepepe-pepecash-supply, m-rarepepe-cards-2017-02, m-rarepepe-certified]
  unknowns:
    - "最初のカードの発行者「Mike」の身元と、RAREPEPE・GOXPEPE・SHITCOINCARD の最初の販売方法・買い手の数。"
    - "Telegram グループの開設日と参加者数。"
    - "Rare Pepe Wallet の公開日（コミュニティの年表は 2016-10-03 とするが、一次資料は取得していない）。"
    - "PEPECASH の配布比率と受け取った保有者数。"

