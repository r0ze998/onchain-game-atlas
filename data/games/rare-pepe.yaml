  - "収集者数・取引額の時系列（一次集計なし）。"
  - "Rare Pepe Wallet と Directory の運営者の正確な体制。Joe Looney の役割の一次資料。"
  - "Wikipedia が記す 2021 年の高額落札など後年の取引の一次資料。"
contradictions:
  - {t: "申請料: Daily Dot（2017-02）は 4,000 PEPECASH（約 13 ドル）、現在の Directory の掲示は 200 PEPECASH。掲示は週ごとに調整するとしており、時期の差と見られる。", s: [src-rarepepe-dailydot-2017, src-rarepepe-directory-submit]}
  - {t: "認定数: Directory は「1700 超」、Wikipedia は 36 シリーズ 1,774 枚。", s: [src-rarepepe-directory-submit, src-rarepepe-wikipedia]}

