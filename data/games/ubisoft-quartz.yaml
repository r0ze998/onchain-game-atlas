  - {id: ev-ubisoft-quartz-last-digit, date: "2022-03-17", type: end, title: "Ghost Recon Breakpoint の最後の Digit", s: [src-ubisoft-quartz-gamesbeat-end, src-ubisoft-quartz-decrypt-end]}
