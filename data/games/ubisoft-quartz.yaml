id: ubisoft-quartz
name: Ubisoft Quartz
name_ja: ユービーアイソフト・クォーツ
aliases: [Quartz, Digits]
kind: platform
depth: index
updated: "2026-10-24"
links:
  website: https://quartz.ubisoft.com/
chains: [Tezos]
team: "Ubisoft（Strategic Innovation Lab、ブロックチェーン技術ディレクター Didier Genevois ほか）"
summary: >-
  Ubisoft が 2021-12 に発表した、AAA ゲームの装飾品を限定数の NFT「Digits」として配布・取引させるプラットフォーム（ベータ）。Tezos 上で、各 Digit は通し番号を持ち、ゲーム内で他プレイヤーに見える。
  最初の対象は Ghost Recon Breakpoint の PC 版で、無料配布から始めたが、2022-03-17 の Digit を最後に同作での Quartz 展開は終わり、同作の開発自体も終了した。
selection_reason: >-
  大手パブリッシャーが既存の人気シリーズに NFT を入れ、短期間で撤退した代表例であり、「オンチェーン資産を後付けしても遊びや経済は生まれない」という反証側の証拠になるから。
  通し番号付きの装飾品や転売は従来のアカウント制でも実装できるという批判も含め、ブロックチェーン不要論の具体例として扱う。
categories:
  - {id: assets, role: primary, reason: "既存ゲームの装飾品を NFT 化し、外部市場での転売を可能にした"}
status:
  value: ended
  as_of: "2026-10"
  note: "Ghost Recon Breakpoint での Digits は 2022-03-17 が最後。Ubisoft は Quartz を他作で続けると述べたが、2026-08 の報道は Quartz が「重要な利用者基盤を得られなかった」とする。Quartz サイト自体の閉鎖日は未確認。"
  s: [src-ubisoft-quartz-gamesbeat-end, src-ubisoft-quartz-kitguru-2026]
dates:
  announced: {date: "2021-12-07", s: [src-ubisoft-quartz-sixthaxis], note: "PC 向けベータとして発表"}
  ended: {date: "2022-03-17", s: [src-ubisoft-quartz-gamesbeat-end, src-ubisoft-quartz-decrypt-end], note: "Ghost Recon Breakpoint の最後の Digit。プラットフォーム全体の終了日ではない"}

architecture:
  onchain:
    level: assets-only
    detail: "Digit の所有証明（certificate of ownership）だけが Tezos 上にあり、ゲームの規則・進行は Ubisoft のサーバー。"
    s: [src-ubisoft-quartz-sixthaxis]
  offchain:
    - {item: "ゲーム本体と、Digit をゲーム内で表示・使用する処理", s: [src-ubisoft-quartz-sixthaxis]}
  admin:
    level: significant
    detail: "Digit が使えるかどうかは Ubisoft のゲームに依存し、Breakpoint の Digits を他作（Rainbow Six Siege 等）へ持ち込む予定はないとされた。"
    s: [src-ubisoft-quartz-destructoid-end]
  open_source:
    level: unknown
    detail: "公開ソースは確認できなかった（商用タイトルで、公開されている形跡は見つからない）。"
  extensibility:
    level: unknown
    detail: "第三者が Digit を使った拡張を行える仕組みは確認できなかった。"

compare:
  gameplay: {t: "既存の TPS（Ghost Recon Breakpoint）に、通し番号付きの装飾品（武器・装備の見た目）を加えるだけで、遊び自体は変わらない。", k: fact, s: [src-ubisoft-quartz-sixthaxis]}
  necessity: {t: "通し番号と転売は従来のアカウント制でも実装できるとの批判があり、Ubisoft の FAQ 自身が Quartz の消費電力を「標準的なデータベースと同等」と説明していた。オンチェーンの必然性は弱い。", k: analysis, s: [src-ubisoft-quartz-sixthaxis]}
  information: {t: "所有と通し番号はチェーン上で公開される。", k: fact, s: [src-ubisoft-quartz-sixthaxis]}
  persistence: {t: "NFT は残るが、ゲーム内の価値は Breakpoint に限られ、同作の開発終了後は追加されず、他作へも移せない。", k: fact, s: [src-ubisoft-quartz-destructoid-end]}
  extensibility: {t: "なし（確認できず）。", k: unknown}
  money_flow: {t: "最初は無料配布、のち販売と二次流通。GamesBeat は Ars Technica の報道として、数千個発行された Digits の転売成立は 96 件にとどまったと伝えた（Ars Technica の原記事は未読）。", k: claim, who: "GamesBeat（Ars Technica の報道を引用）", s: [src-ubisoft-quartz-gamesbeat-end]}
  entry_barrier: {t: "対象国（米・加・西・仏・独・伊・白・豪・伯）の PC 版プレイヤー向けのベータ。", k: fact, s: [src-ubisoft-quartz-sixthaxis]}

concepts: [c-nft-asset]

article:
  counter_evidence:
    - {t: "「短期間で撤退した」という読みは Quartz の Breakpoint 展開には当てはまるが、Ubisoft のブロックチェーン事業全体ではない。KitGuru（2026-08）によれば、Ubisoft は後続の NFT 系タイトル Champions Tactics を 2026 年まで運営し、ブロックチェーン要素の支援をやめたうえで 2026-10 末にサーバーを停止するとした。", k: claim, who: "KitGuru（VGC の報道を引用）", s: [src-ubisoft-quartz-kitguru-2026]}
    - {t: "Quartz の失敗はブロックチェーンの限界ではなく、評価の低い既存作（Breakpoint）を選んだこと、装飾品だけで遊びに影響しないこと、利用者の反発による、という別の説明もありうる。撤退が「オンチェーン資産一般の不要」を証明するわけではない。", k: analysis, s: [src-ubisoft-quartz-destructoid-end]}

acquisition:
  audience: [players]
  summary: {t: "最初の利用者として狙われたのは、既に Ghost Recon Breakpoint を PC（Ubisoft Connect）で遊んでいる対象 9 か国の成人プレイヤーで、XP レベル 5 以上という条件を満たす人に無料の Digit を 3 回配って「早期採用者」を作ろうとした。第三者の集計では最初の約 2 週間の売買は 15 件にとどまった。", k: analysis, s: [src-ubisoft-quartz-pr-2021, src-ubisoft-quartz-nme-2021]}
  steps:
    - {phase: pre, date: "2021-12-07", t: "Ubisoft Quartz をベータとして発表した。参加条件は Ubisoft Connect の PC 版で Breakpoint を遊ぶこと、XP レベル 5 以上、18 歳以上で、対象は米・加・西・仏・独・伊・白・豪・伯の 9 か国だった。", k: fact, s: [src-ubisoft-quartz-pr-2021]}
    - {phase: launch, date: "2021-12-09", t: "ベータを 12-09 の 18 時（UTC）に開始し、12-09・12-12・12-15 の 3 回、無料の Digit を配った。追加の Digit は 2022 年初めに予定され、Digit は Ubisoft の外の第三者マーケットで他の対象プレイヤーに売れるとされた。", k: claim, who: "Ubisoft（プレスリリース）", s: [src-ubisoft-quartz-pr-2021], q: "to reward the early adopters among players"}
    - {phase: growth, date: "2021-12-22", t: "Apex Legends のアーティスト Liz Edwards は、Quartz サイトからリンクされた 2 つの第三者マーケットで売れた Digit は 15 個で、作られた約 2,256 個の 1% 未満だと集計した。", k: fact, s: [src-ubisoft-quartz-nme-2021]}
    - {phase: growth, date: "2022-03-17", t: "Breakpoint の最後の Digit を出した。Quartz のサイトは「最初の Digit を受け取った」Breakpoint のプレイヤーに感謝を述べ、他作で続けるとした。", k: fact, s: [src-ubisoft-quartz-vgc-2022, src-ubisoft-quartz-gamesbeat-end]}
  channels:
    - {id: existing-community, t: "既存作 Ghost Recon Breakpoint の PC プレイヤーだけを対象にし、XP レベル 5 以上を条件にした。", k: fact, s: [src-ubisoft-quartz-pr-2021]}
    - {id: free-mint, t: "最初の 1 週間に 3 回、条件を満たしたプレイヤーへ無料の Digit を配った。", k: fact, s: [src-ubisoft-quartz-pr-2021]}
    - {id: platform-distribution, t: "自社の配信・アカウント基盤 Ubisoft Connect（PC）を経由してのみ参加できた。", k: fact, s: [src-ubisoft-quartz-pr-2021]}
    - {id: ip-brand, t: "Ubisoft と Tom Clancy's Ghost Recon のブランドで告知した。", k: fact, s: [src-ubisoft-quartz-pr-2021]}
  cost:
    - {t: "無料配布の Digit と開発の費用は Ubisoft が負担した。Ubisoft の Quartz 全体の費用・売上は公表されていない。", k: fact, s: [src-ubisoft-quartz-pr-2021]}
  after:
    - {t: "2022-03-17 を最後に Breakpoint での Digit は終わり、2022-04 には同作の追加コンテンツ自体が終了した。Ubisoft の Nicolas Pouard は、プレイヤーはデジタルの二次市場の利点を理解していないと述べた。2026-08 の報道は Quartz が重要な利用者基盤を得られなかったとする。", k: claim, who: "Nicolas Pouard（VGC の記事内）/ KitGuru", s: [src-ubisoft-quartz-vgc-2022, src-ubisoft-quartz-destructoid-end, src-ubisoft-quartz-kitguru-2026], q: "I think gamers don't get what a digital secondary market can bring to them."}
    - {t: "示されていない指標: 無料 Digit を受け取ったプレイヤー数、参加条件を満たしたプレイヤー数。", k: unknown}
  counter:
    - {t: "利用が少なかった理由は「NFT が不要だったから」だけでなく、参加条件（PC・9 か国・18 歳以上・XP レベル 5）で売買できる相手を自社の一作品のプレイヤーに限ったことでも説明できる。二次市場の流動性を意図的に狭める設計だった。", k: analysis, s: [src-ubisoft-quartz-pr-2021, src-ubisoft-quartz-nme-2021]}
    - {t: "Breakpoint 自体の評価の低さと、発表直後の強い反発（VGC は「圧倒的な反発」と書く）が重なっており、無料配布という施策の効果を単独で評価できない。", k: analysis, s: [src-ubisoft-quartz-vgc-2022, src-ubisoft-quartz-destructoid-end]}
  lessons:
    - {t: "既存作プレイヤー限定の無料 NFT 配布: 獲得費用を抑えて既存利用者に配れるが、売買相手も同じ作品のプレイヤーに限ると二次市場が育たず、装飾品が遊びを変えない場合は配っても使われない。", k: analysis}
    - {t: "既存のヒット作ではない作品への後付け: 既存コミュニティの反発が強いと、獲得の母集団そのものが縮む。導入前に既存プレイヤーの受容を測らないと、配布で取り返せない。", k: analysis}
  metrics: [m-ubisoft-quartz-sales-2021-12, m-ubisoft-quartz-minted-2021-12]
  unknowns: ["無料 Digit の受取人数と、参加条件を満たしたプレイヤー数", "有料 Digit の販売方法と売上", "Quartz サイト自体の終了日"]

