  - {id: ev-aavegotchi-base-vote, date: "2025-04", type: other, title: "DAO が Base への移転と L3 Geist の終了を可決", detail: "The Block によれば Snapshot で 95% 超の賛成。Geist の終了は提案の結果にかかわらず行うと Pixelcraft 側が述べていた", s: [src-aavegotchi-theblock-vote]}
  - {id: ev-aavegotchi-base, date: "2025-07-25", type: pivot, title: "Polygon の全コントラクトを凍結し Base へ移転", detail: "REALM・設置物・タイル・Alchemica/GLTR は後続の移転とされた", s: [src-aavegotchi-blog-base]}

