  - {id: m-aavegotchi-bc-dai, type: funding, value: 30300000, value_text: "約 3,030 万 DAI（別箇所で 3,300 万ドルとも）", unit: DAI, period: "2020-09-14〜2023-03", definition: "GHST bonding curve に入った DAI の総額（Cointelegraph）", nature: reported, s: [src-aavegotchi-ct-bonding-curve], note: "同記事内で 3,030 万 DAI と 3,300 万ドルの 2 つの数字があり、整合しない"}
  - {id: m-aavegotchi-matic-incentives, type: other, value: 100000, value_text: "10 万ドル超（GHST 5 万ドル＋MATIC 5 万ドル＋QUICK）", unit: USD, period: "2021-01-29 から 2 週間", definition: "Polygon（Matic）への移行インセンティブの告知額", nature: reported, s: [src-aavegotchi-substack-matic-incentives]}
  - {id: m-aavegotchi-haunt1-portals, type: nft_sales, value: 10000, value_text: "1 万個を 1 分足らずで完売", unit: portals, period: "2021-03-02", definition: "Haunt 1 のポータル販売数と売り切れまでの時間（公式 Wiki）", nature: reported, s: [src-aavegotchi-wiki-haunt]}

acquisition:
  audience: [holders, players]
  summary: {t: "最初の参加者はゲームの公開前に GHST を買った DeFi 利用者だった。2020-09 の連続トークン販売（Aragon の bonding curve）で GHST を配り、GHST をステークして得る譲渡不可の FRENS で景品抽選の券を買わせ、Chainlink などの既存コミュニティを題材にした抽選でウェアラブルを先に配った。ゲーム本体（Haunt 1、ポータル 1 万個）は Polygon へ移ってから 2021-03 に公開され、1 分足らずで売り切れた。", k: analysis, s: [src-aavegotchi-docs-ghst, src-aavegotchi-wiki-tickets, src-aavegotchi-wiki-haunt]}
  steps:
    - {phase: pre, date: "2020-09-14", t: "GHST を Ethereum 上の Aragon Fundraising の bonding curve（DAI 担保、準備率 30%）で連続販売し始めた。開始価格は 1 GHST＝0.2 DAI で、販売は 2023-03 に DAO の投票で閉じられるまで続いた。", k: fact, s: [src-aavegotchi-docs-ghst, src-aavegotchi-ct-bonding-curve]}
    - {phase: pre, date: "2020-11", t: "GHST のステークで得る FRENS（譲渡不可）で抽選券を買い、ウェアラブルの景品抽選に参加する仕組みを本番公開前に動かした。最初のウェアラブル抽選は Chainlink を題材にした計 6,010 個の景品で、当選は Chainlink VRF で決めた。公式ガイドは初回を 11/10 開始、Link Marines（Chainlink の支持者）を題材にしたと書く。", k: fact, s: [src-aavegotchi-wiki-tickets, src-aavegotchi-medium-raffles]}
    - {phase: pre, date: "2021-01", t: "Ethereum のガス代高騰を理由に公開先を Matic（Polygon）へ変え、1/4 時点で 600 万 GHST 超（380 万ドル超相当）がブリッジされた。1/14 には 10 万ドル超の移行インセンティブ（Pixelcraft の DAICO の引き出し枠から 5 万ドル分の GHST、Matic が同額の MATIC を上乗せ、Quickswap の QUICK 報酬）を告知した。", k: fact, s: [src-aavegotchi-substack-jan2021, src-aavegotchi-substack-matic-incentives]}
    - {phase: launch, date: "2021-03-02", t: "Polygon で Haunt 1 として 1 万個のポータルを先着順で販売した（1 取引あたりの上限は投票で決定）。Wiki は 1 分足らずで売り切れ、「全員がポータルを手にできなかった」ことを除けば成功だったと書く。", k: fact, s: [src-aavegotchi-substack-launch, src-aavegotchi-wiki-haunt]}
    - {phase: growth, date: "2021-08", t: "Haunt 2（1.5 万個）は先着をやめ、80% をオークション（#BidToEarn）、20% を GHST ステーカー向けの Drop Ticket 抽選に回した。", k: fact, s: [src-aavegotchi-wiki-haunt]}
    - {phase: growth, date: "2025-07-25", t: "Base へ移転し、旧 Coinbase Wallet の Base アプリによりオンボーディングが滑らかになることを理由の一つに挙げた。", k: claim, who: "Aavegotchi 運営", s: [src-aavegotchi-blog-base], q: "Formerly known as Coinbase Wallet, the new Base app makes onboarding smoother than ever."}
  channels:
    - {id: token-incentive, t: "GHST のステークで FRENS を貯め、抽選券に換えてウェアラブル・ポータル・土地の抽選に参加させた（FRENS は 2022 年に終了）。", k: fact, s: [src-aavegotchi-wiki-tickets]}
    - {id: existing-community, t: "Aave の利息付き aToken を担保にする設計で DeFi 利用者を対象にし、最初の抽選は Chainlink を題材にした。", k: fact, s: [src-aavegotchi-substack-launch, src-aavegotchi-wiki-tickets]}
    - {id: platform-distribution, t: "Polygon（当時 Matic）が移行インセンティブに同額の MATIC を出し、Quickswap が報酬プールを用意した。2025 年には Base アプリの配布力を移転理由に挙げた。", k: fact, s: [src-aavegotchi-substack-matic-incentives, src-aavegotchi-blog-base]}
    - {id: community-server, t: "Discord と 6 言語の Telegram グループで移行手順を案内した。", k: fact, s: [src-aavegotchi-substack-matic-incentives]}
  cost:
    - {t: "公開前の資金は GHST 購入者が bonding curve に入れた DAI で、Cointelegraph は販売期間全体で約 3,030 万 DAI とする。Pixelcraft はこの準備金から月 10 万 DAI の引き出し枠（tap）を持ち、移行インセンティブの GHST もそこから出した。", k: fact, s: [src-aavegotchi-ct-bonding-curve, src-aavegotchi-substack-matic-incentives]}
    - {t: "Polygon への移行インセンティブの半分（5 万ドル相当の MATIC）はチェーン側（Matic）が負担した。", k: claim, who: "Aavegotchi 運営", s: [src-aavegotchi-substack-matic-incentives]}
  after:
    - {t: "Rarity Farming は DAO の決定でシーズンごとに約 150 万 GHST を配り続けたが、ドキュメント自身が近年の順位表は「stale」になったと書く。Polygon 期・Base 期の利用者数と継続率は公開されていない。", k: fact, s: [src-aavegotchi-docs-rarity]}
  counter:
    - {t: "公開前の参加の誘因は、遊びではなく GHST の価格と抽選景品の転売価値だった可能性が高い。bonding curve は買うほど価格が上がる販売方式で、早く買った人ほど有利だった。", k: analysis, s: [src-aavegotchi-docs-ghst, src-aavegotchi-ct-bonding-curve]}
    - {t: "Haunt 1 が 1 分足らずで売り切れたことは需要の強さと同時に、少数の資金力のある参加者・自動化が先着枠を取った可能性を示す。購入者数・アドレス分布は確認できなかった。", k: analysis, s: [src-aavegotchi-wiki-haunt]}
  lessons:
    - {t: "譲渡不可ポイント（FRENS）→ 譲渡可能な抽選券 → 景品という段階: ゲーム公開前にトークンを長く保有させ、景品の配布で参加を可視化できる。効く条件は景品に二次市場の価値があること。破綻条件は抽選券自体が売買できるため、資金量の多い保有者が確率を買える点で、景品は人数でなくステーク量に比例して配られる。", k: analysis}
  metrics: [m-aavegotchi-bc-dai, m-aavegotchi-matic-incentives, m-aavegotchi-haunt1-portals]
  unknowns:
    - "GHST の初期購入者数、FRENS の参加アドレス数、各抽選の参加者数"
    - "Haunt 1 の購入アドレス数"
    - "Base 移転後の新規プレイヤー数"

