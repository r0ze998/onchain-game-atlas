id: aavegotchi
name: Aavegotchi
name_ja: アーヴェゴッチ
aliases: [Gotchiverse, GHST]
kind: game
depth: index
updated: "2026-10-23"
chains: [Ethereum（GHST の初期販売）, Polygon（2021-03〜2025-07）, Base（2025-07〜）]
team: "Pixelcraft Studios と AavegotchiDAO"
summary: >-
  Aave の利息付きトークン（aToken）を担保として預けて「召喚」するたまごっち風のペット NFT。特性値・名前・外見の SVG まで主要データをコントラクト内に持ち、
  撫でる（オンチェーン取引）ことで親密度が上がり、希少性・親密度・経験値の順位に応じて GHST 報酬が配られる「Rarity Farming」を DAO の投票で回してきた。
  Gotchiverse の土地（REALM）では設置物で資源 Alchemica を「採掘・農業」する仕組みもある。2025-07 に Polygon の全コントラクトを凍結し、スナップショットから Base へ移った。
selection_reason: >-
  DeFi の担保と収集ペットを一体化し、ゲーム状態の大部分をアップグレード可能な Diamond コントラクトに置いた例であり、
  「オンチェーンの状態を持つゲームがチェーンを移る」とき何が起きるか（凍結・スナップショット・再 mint）を一次資料で確認できるから。
  オンチェーンの「撫でる」行動を報酬に結びつけた設計は、利用者の農業・生産ループを持つ構想で、行動証明をオンチェーンに載せる場合の参照になる。
categories:
  - {id: assets, role: primary, reason: "aToken を担保に持つ NFT ペットと、オンチェーンに保存されたウェアラブル・SVG"}
  - {id: onchain-rules, role: secondary, reason: "特性値・親密度・経験値・装備がコントラクト内の状態として計算される"}
  - {id: p2e, role: secondary, reason: "Rarity Farming（シーズンごとに約 150 万 GHST）と Alchemica の採掘"}
  - {id: infra, role: secondary, reason: "Ethereum のガス高騰で Polygon へ、のち Base へ移転し、専用 L3（Geist）は取りやめた"}
status:
  value: active
  as_of: "2026-10"
  note: "2025-07-25 に Base への移転を完了と公式ブログが告知。ドキュメントは参照日時点で公開中。2026 年の利用者数は確認できない。"
  s: [src-aavegotchi-blog-base]
dates:
  launched: {date: "2021-03-02", s: [src-aavegotchi-substack-launch], note: "Polygon（旧 Matic）で Haunt 1（ポータル 1 万個）を公開"}

architecture:
  onchain:
    level: partial-rules
    detail: >-
      Aavegotchi の名前・特性値・親密度・経験値・装備、ウェアラブルと本体の SVG 画像までコントラクトに保存される（SvgFacet）。
      召喚時の乱数は Chainlink VRF を使った。ミニゲームや Gotchiverse の操作の一部は別のゲームクライアントで行われる（範囲は未確認）。
    s: [src-aavegotchi-docs-svg, src-aavegotchi-docs-gotchis, src-aavegotchi-substack-launch]
  offchain:
    - {item: "ゲームクライアント・ミニゲーム（Gotchi Battler 等は外部チームの実装）", s: [src-aavegotchi-docs-rarity]}
  admin:
    level: significant
    detail: >-
      EIP-2535 Diamond で全面的にアップグレード可能。diamondCut は当初チームのマルチシグのみが呼べ、DAO への移管は「段階的」とされた。
      2025 年の移転では、アップグレード権限を使って Polygon の全コントラクトを停止し、閲覧専用・転送不可にした（担保の引き出しと出品の取り消しのみ可能）。
    s: [src-aavegotchi-docs-governance, src-aavegotchi-blog-base]
  open_source:
    level: full
    detail: "Polygon 版コントラクトは MIT で公開（aavegotchi-contracts）。Base 版は aavegotchi-geist リポジトリ（README 題「Aavegotchi Base Contracts」、MIT）で公開されている。"
    url: "https://github.com/aavegotchi/aavegotchi-contracts"
    s: [src-aavegotchi-github-contracts, src-aavegotchi-github-geist]
  extensibility:
    level: official-api
    detail: "DAO が setGameManager でミニゲーム管理コントラクトを指定でき、Gotchi Battler のような外部チームのゲームが DAO の投票で報酬配分に組み込まれた。サブグラフ・コントラクトの読み取りは公開。"
    s: [src-aavegotchi-docs-governance, src-aavegotchi-docs-rarity]

compare:
  gameplay: {t: "ポータルを開けて候補から 1 体を選んで召喚し、担保を預け、ウェアラブルを装備して特性値を上げ、定期的に撫でて親密度を保つ。シーズンごとの希少性・親密度・経験値の順位で GHST を得る。Gotchiverse の REALM 区画（最大 420,069、発行済み 5 万）では、Alchemica で作った設置物を置いて資源を採掘し、Aavegotchi で祭壇から Alchemica を「channel」する（親密度が 2 下がる）。", k: fact, s: [src-aavegotchi-docs-gotchis, src-aavegotchi-docs-rarity, src-aavegotchi-docs-gotchiverse]}
  necessity: {t: "担保（aToken）の保有と特性・画像をコントラクトに置くこと自体が売りであり、DeFi との結合にはチェーンが必要だった。一方で遊びの多くは順位表への参加で、公式ドキュメント自身が Rarity の順位表が近年のシーズンで「stale」になったと書いている。", k: analysis, s: [src-aavegotchi-docs-rarity, src-aavegotchi-docs-svg]}
  information: {t: "特性値・装備・画像はコントラクトから誰でも読める。", k: fact, s: [src-aavegotchi-docs-svg]}
  persistence: {t: "データがコントラクト内にあるため、移転時もスナップショットから同じ ID・特性で Base に複製できた。旧 Polygon のトークンは転送不可の ERC-721 として残る。", k: fact, s: [src-aavegotchi-blog-base]}
  extensibility: {t: "DAO の承認を経た外部ゲームの統合とコントラクトの読み取りは可能。", k: fact, s: [src-aavegotchi-docs-governance, src-aavegotchi-docs-rarity]}
  money_flow: {t: "プレイヤーは GHST でポータル・ウェアラブルを買い、担保を預ける。Rarity Farming は通常シーズンあたり約 150 万 GHST を DAO の決定で配る。", k: fact, s: [src-aavegotchi-docs-rarity]}
  entry_barrier: {t: "NFT の購入（またはオンチェーンの Gotchi Lending での借用）、ウォレット、ガスが必要。撫でる行動も取引である。", k: fact, s: [src-aavegotchi-docs-gotchis]}

concepts: [c-nft-asset, c-onchain-state, c-onchain-randomness, e-p2e, m-land, m-seasons, e-scholarship, m-farming-idle]

article:
  principles:
    - {t: "定期的なオンチェーン行動を減衰する値で報いる（親密度: 撫でないと 1 日 1 ずつ減る）: 毎日の参加をチェーン上で証明でき、順位報酬と結べる。破綻条件は行動が単純で自動化できる場合で、撫でる行為は取引 1 回で済むため、人間の関与の証明にはならない。", k: analysis, s: [src-aavegotchi-docs-gotchis]}
  counter_evidence:
    - {t: "移転の公式説明（Base のインフラ・配布力・Ethereum との整合）とは別に、The Block は提案時の事情として Pixelcraft の大幅な人員削減と資金の延命、L3 市場の不振、Polygon PoS の TVL の停滞を挙げており、また L3 Geist の終了は DAO の投票結果にかかわらず決まっていたと報じた。移転は DAO の意思というより開発会社の経営判断の色が濃い。", k: claim, who: "The Block（Coderdan の提案文の引用）", s: [src-aavegotchi-theblock-vote, src-aavegotchi-blog-base]}
    - {t: "オンチェーンの状態はチェーン移転を「スナップショット＋再 mint」で可能にしたが、それはアップグレード権限で旧コントラクトを凍結できたからであり、所有の永続性が運営・DAO の権限に依存することも示した。所有者のいないスマートコントラクトに置かれた資産は移せなかった。", k: fact, s: [src-aavegotchi-blog-base]}

