id: daydreams
name: Daydreams
aliases: ["Daydreams agent framework", "daydreamsai/daydreams", "dojoengine/daydreams"]
kind: platform
depth: index
updated: "2026-10-24"
links:
  website: https://www.daydreams.systems/
  x: https://x.com/daydreamsagents
  discord: https://discord.gg/P8UUNGtHZs
  github: https://github.com/daydreamsai/daydreams
ids:
  coingecko: daydreams
chains: [Starknet（Eternum・Loot Survivor・Ponziland の例）, Abstract（Gigaverse の例）, Base など（チェーン非依存を標榜）]
team: "Loaf（Realms / Eternum の開発者、GitHub の ponderingdemocritus と Loaf 名義が主要コミット作者）ほか"
summary: >-
  LLM で動くエージェントが文脈（ゲームの説明・コントラクトアドレス・資源 ID などのテキスト）を注入されてオンチェーンゲームを遊ぶ、という発想で 2024-12 に始まった TypeScript のエージェント枠組み。
  初期 README は「現在サポートするゲームは Eternum のみ」と記し、Eternum Season 1 には「Daydreams エージェント」と称する AI 軍勢が登場した。
  2025 年に Gigaverse・Loot Survivor・Ponziland の例を加えたが、2026-02 に「機能はすでに陳腐化」として枠組みの開発を主軸から外し、エージェント間決済（x402 等）へ移った。
selection_reason: >-
  「AI エージェントがオンチェーンゲームを人間と同じ入口で遊ぶ」という主張を、Eternum という具体的なゲームで実装しようとした例。
  主張（1,000 のエージェント・プレイヤー）と確認できた事実（運営設定の controller が操作する NPC 軍、プロンプトに文脈を流し込む例示コード、
  枠組み自体の撤退）の差が大きく、Wylls の「人間と AI が遊ぶ文明シミュレーション」構想にとって重要な反証材料になる。
categories:
  - {id: ai, role: primary, reason: "LLM エージェントが文脈注入でオンチェーンゲームの行動を生成・署名する枠組み"}
  - {id: infra, role: secondary, reason: "Dojo・MUD との統合、メモリ・コンテキスト管理、モデルルーターを提供する開発基盤"}
status:
  value: pivoted
  as_of: "2026-10"
  note: "2026-02-06 に README へ「この枠組みはもはや主軸ではない。機能はすでに陳腐化」との告知を追加し、Agentic Commerce（lucid-agents）へ主軸を移した。リポジトリは 2026-10 も軽微な更新あり。"
  s: [src-daydreams-repo]
dates:
  announced: {date: "2024-12-21", s: [src-daydreams-repo], note: "リポジトリ履歴の最初期のコミット（readme）"}

architecture:
  onchain:
    level: none
    detail: "枠組み自体はオフチェーンの TypeScript ライブラリ。エージェントはゲームのコントラクトを外部から呼ぶ。Eternum S1 のエージェント軍は Eternum 側のコントラクトで、管理者設定の controller アドレスが操作した（Daydreams のコードが controller を動かしたかは未確認）。"
    s: [src-daydreams-repo, src-daydreams-eternum-s1-contracts]
  offchain:
    - {item: "LLM 推論（OpenRouter 等）、記憶（ベクトル DB 等）、ゲーム文脈のプロンプト注入", s: [src-daydreams-repo, src-daydreams-bankless-eliza]}
    - {item: "Eternum の例は、Realm の ID・座標、資源 ID、システムのアドレス（一部はプレースホルダ）を LLM に渡す文脈ファイル", s: [src-daydreams-eternum-context]}
  admin:
    level: none-known
    detail: "オフチェーンのライブラリでありオンチェーンの管理権限はない。トークン DREAMS による起動器の利用制限があった（2025-05 の記事）。"
    s: [src-daydreams-bankless-may]
  open_source:
    level: full
    detail: "MIT ライセンス（licence.md、Copyright 2025 Loaf）。2025-01〜09 に dojoengine/daydreams からのマージが繰り返しあり、Bankless（2025-01）は「part of @ohayo_dojo」と書いた。最初からどちらの組織で始まったかは未確認。"
    url: "https://github.com/daydreamsai/daydreams"
    s: [src-daydreams-repo, src-daydreams-bankless-eliza]
  extensibility:
    level: official-api
    detail: "Discord・Telegram・Twitter・Hyperliquid・MCP などの拡張パッケージがある。ゲームごとの例（Gigaverse・Loot Survivor・Ponziland）は 2025-03〜06 に追加されたが、2025-08-17 のコミットで examples/games ごと削除され、参照日の main にはない。Ponziland の例は外部チーム（RuneLabsxyz）の PR（2025-06）。"
    s: [src-daydreams-repo]

compare:
  gameplay: {t: "ゲームではない。エージェントにゲームの説明と操作可能なコントラクトを文脈として与え、LLM が次の行動を決めてトランザクションを送る。", k: fact, s: [src-daydreams-repo, src-daydreams-eternum-context]}
  necessity: {t: "エージェントが人間と同じ入口で参加できることは、ルールと状態が公開コントラクトにあるゲームでは追加の API なしに成立する。ただしそれは公開 API を持つ従来のゲームでも同様で、オンチェーンである必要は薄い。", k: analysis}
  information: {t: "エージェントはオンチェーン状態とインデクサから情報を得る。秘匿情報の扱いは確認できなかった。", k: unknown}
  persistence: {t: "枠組みは 2026-02 に主軸から外れた。ゲームの例示コードはそれより前の 2025-08-17 に main から削除され、履歴にのみ残る。各ゲームの変更（Eternum の Dojo 離脱など）に追随している証拠はない。", k: fact, s: [src-daydreams-repo, src-daydreams-eternum-history]}
  extensibility: {t: "拡張パッケージを追加できる。外部チームによる Ponziland の例が 2025-06 にマージされたが、ゲーム例は 2025-08 に一括削除された。", k: fact, s: [src-daydreams-repo]}
  money_flow: {t: "2025-05 時点で play.dreams.fun の起動器は 2,000 DREAMS（当時約 7 ドル）の保有を要した。その後 Dreams Router による USDC の従量課金（x402）を README が案内する。", k: fact, s: [src-daydreams-bankless-may, src-daydreams-repo]}
  entry_barrier: {t: "開発者向けライブラリで、bun / Node と LLM の API キー、ウォレット鍵が必要。", k: fact, s: [src-daydreams-repo]}

concepts: [c-ai-agent-player, m-bot-automation, m-ai-adversary]

article:
  counter_evidence:
    - {t: "主張: 2025-01-03、Loaf は X 投稿で次の Eternum シーズンに 1,000 のエージェントを投入し LORDS と覇権を争わせると述べ、Bankless（2025-01-06）はそれを埋め込みで引用し、NPC ではなく世界の能動的な参加者と紹介した。", k: claim, who: "Loaf（@lordOfAFew の X 投稿、Bankless 記事に埋め込み）", s: [src-daydreams-bankless-eliza], q: "We are pushing to have 1000 agents in the upcoming season, all fighting over $lords and supremacy of the world."}
    - {t: "確認できた事実: Eternum S1 のエージェントは探索時に 5% の確率で出現する軍で、同時 1,000・通算 10,000 は上限の設定値、所有・操作は管理者が設定した単一の controller アドレス。S1 の紹介記事も、エージェントはプレイヤーと 1 対 1 で同等ではなく地図上の軍として現れる NPC だと書いた。", k: fact, s: [src-daydreams-eternum-s1-contracts, src-daydreams-eternum-s1-config, src-daydreams-bankless-s1]}
    - {t: "Daydreams の Eternum 例（2025-05 時点の examples/tasks/eternum.ts）は、Realm の情報と資源 ID とシステムのアドレス（trade_systems は 0x1234… のプレースホルダ）を LLM に流し込む文脈で、自律的に勝ちを狙う常駐エージェントの実装ではなかった。", k: fact, s: [src-daydreams-eternum-context]}
    - {t: "Eternum 側の内部文書は、その後のエージェント／ヘッドレスの 3 つの試み（Axis を含む）がいずれも削除されたと記録し、Daydreams 自身もゲーム例を 2025-08 に削除し、2026-02 に枠組みの開発を主軸から外した。", k: fact, s: [src-daydreams-eternum-hired-agents, src-daydreams-repo]}
    - {t: "「AI が人間と同じルールで遊ぶ」実験は、継続的なプレイ実績を確認できないまま形を変えた。ただし Eternum は 2026-09 から Daydreams を使わない別の「雇われたエージェント」ランナー（apps/agent-runner）を開発中で、構想自体は放棄されていない。", k: analysis, s: [src-daydreams-eternum-hired-agents, src-daydreams-eternum-history]}
    - {t: "未確認: S1 のエージェント軍が実際に LLM（Daydreams）で意思決定したのか、何体出現し、どれだけ倒されたか、エージェント用の 25 万 LORDS がどれだけ払い出されたか。", k: unknown}

acquisition:
  audience: [developers, holders]
  summary: {t: "最初の開発者は作者 Loaf（ponderingdemocritus）自身と、彼が関わる Realms / Eternum・Dojo（Starknet のオンチェーンゲーム圏）と Eliza 系 AI エージェントの界隈だった。2025-01 初めの X 投稿と Bankless の記事の後、1 月中旬から外部のコミット作者が加わった。人間の開発者・利用者と、枠組みで動く AI エージェントは別に数える必要があるが、どちらの実数も公表されていない。", k: analysis, s: [src-daydreams-repo, src-daydreams-bankless-eliza]}
  steps:
    - {phase: pre, date: "2024-12-21", t: "リポジトリを開始。初期 README は対応ゲームを Eternum のみとし、Dojo との統合を掲げた。2025-01-13 までのコミットはすべて作者 1 人（ponderingdemocritus）による。", k: fact, s: [src-daydreams-repo]}
    - {phase: launch, date: "2025-01-03", t: "Loaf は X で、次の Eternum シーズンに 1,000 のエージェントを投入すると投稿した。Bankless（2025-01-06）はこれを埋め込みで引用し、Daydreams を Dojo スタックの一部として、Loaf を Eliza リポジトリの主要コントリビュータとして紹介した。", k: fact, s: [src-daydreams-bankless-eliza]}
    - {phase: growth, date: "2025-01-14", t: "この日以降、作者以外のコミット作者が加わり始め、2025-02-28 までにボットを除くコミット作者名は 21 種（同一人物の別名を含む）、コミットは 619 件になった。", k: fact, s: [src-daydreams-repo]}
    - {phase: growth, date: "2025-05-09", t: "Bankless は、2,000 DREAMS（当時約 7 ドル）の保有を条件とする起動器 play.dreams.fun と、最初の対応ゲーム Gigaverse（Abstract）を紹介した。", k: fact, s: [src-daydreams-bankless-may]}
    - {phase: growth, date: "2025-06", t: "外部チーム（RuneLabsxyz）が Ponziland のゲーム例を PR で追加した。", k: fact, s: [src-daydreams-repo]}
  channels:
    - {id: existing-community, t: "作者が開発する Eternum を最初の唯一の対応ゲームにし、Starknet の Dojo スタックと結び付けて、その開発者・プレイヤー圏から始めた。", k: fact, s: [src-daydreams-repo, src-daydreams-bankless-eliza]}
    - {id: crypto-social, t: "Loaf の X 投稿（1,000 エージェントの目標、Eliza との関係を説明するスレッド）で発信した。", k: fact, s: [src-daydreams-bankless-eliza]}
    - {id: press, t: "暗号資産メディア Bankless が 2025-01 と 2025-05 に Daydreams を取り上げた。", k: fact, s: [src-daydreams-bankless-eliza, src-daydreams-bankless-may]}
    - {id: invite-gating, t: "エージェント起動器の利用に DREAMS トークンの保有（2,000 DREAMS）を条件にした。", k: fact, s: [src-daydreams-bankless-may]}
    - {id: composability, t: "MIT ライセンスで、外部チームが自分のゲームの例（Ponziland）を追加できた。", k: fact, s: [src-daydreams-repo]}
  cost:
    - {t: "開発は作者と少数のコントリビュータが担い、助成金・懸賞・VC 資金の記録は見つからなかった。DREAMS トークンの発行経緯（発行日・方式）は検索要約で資料ごとに食い違い、確認できなかった。", k: unknown}
  after:
    - {t: "ゲーム例は 2025-08-17 に main から削除され、2026-02-06 に README は枠組みを「機能はすでに陳腐化」として主軸から外した。", k: fact, s: [src-daydreams-repo]}
    - {t: "参照日時点の README は「Join 1,000+ Developers Building Better AI」と掲げるが、リポジトリページの表示はスター 622・フォーク 137 で、1,000 人超の開発者を裏付ける資料は見つからなかった。", k: fact, s: [src-daydreams-repo]}
  counter:
    - {t: "「1,000 のエージェント」の主張は AI エージェントの数であり、人間の利用者や開発者の数ではない。しかも Eternum S1 のエージェントは管理者設定の単一 controller が操作する NPC 軍で、Daydreams のコードが使われたかは未確認である。", k: analysis, s: [src-daydreams-bankless-eliza, src-daydreams-eternum-s1-contracts, src-daydreams-bankless-s1]}
    - {t: "2025-01 の外部コントリビュータの流入は、Bankless の記事や X 投稿だけでなく、同時期の AI エージェント枠組み（Eliza 等）への関心の高まりや DREAMS トークンの話題でも説明でき、どれが効いたかは区別できない。", k: analysis, s: [src-daydreams-repo, src-daydreams-bankless-eliza]}
  lessons:
    - {t: "自作ゲームを最初の対応先にして枠組みを出す: 自分が運営するゲームを唯一の対応ゲームにすると、文脈（アドレス・資源 ID）を用意でき、最初のデモを早く作れる。効く条件は母体のゲームが継続し、外部のゲームにも対応を広げられること。破綻条件は母体のゲームの仕様変更やゲーム例の保守が追いつかない場合で、この例では 2025-08 にゲーム例が一括削除された。", k: analysis}
    - {t: "トークン保有を利用条件にする起動器: ツールの利用に少額のトークン保有を求めると、保有者に使い道を与えられる。効く条件はツール自体に継続的な価値があること。破綻条件は対象ゲームの例が削除されるなどツールの価値が先に消える場合。", k: analysis}
  metrics: [m-daydreams-early-authors, m-daydreams-github-2026]
  unknowns:
    - "DREAMS トークンの発行日・方式・配分（検索要約では pump.fun 経由、2025-01-19 発行とする資料があるが本文は未確認）。"
    - "外部開発者がどこから来たか（Eternum・Dojo・Eliza のどの界隈か）、起動器の利用者数。"

