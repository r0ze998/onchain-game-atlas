id: dope-wars-roll-your-own
name: "Roll Your Own (Dope Wars)"
aliases: [RYO, "Dope Wars", "Dope World"]
kind: game
depth: index
updated: "2026-10-24"
links:
  website: https://dopewars.gg/
  play: https://rollyourown.preview.cartridge.gg/
  x: https://x.com/TheDopeWars
  github: {url: "https://github.com/cartridge-gg/rollyourown", status: defunct}
chains: [Ethereum mainnet（DOPE NFT、2021）, Optimism（Hustler・Gear）, Starknet Goerli（Cairo 0 版 RYO の展開記録）, Starknet（Dojo 版）]
team: "Dope Wars DAO / Cartridge（Tarrence van As ほか）。Cairo 0 版は perama-v が主に執筆し Tarrence van As・guiltygyoza らが参加"
summary: >-
  Loot の翌日に公開された Loot 派生の DOPE NFT（8,000 個）から始まった Dope Wars 生態系の、Drug Wars（計算機時代の麻薬裁定取引ゲーム）を
  オンチェーンで再実装したゲーム。2021–22 年の Cairo 0 版は「モジュールが互いの状態を読み書きする」開かれたゲームエンジン構想だった。
  その後 Cartridge が Dojo の最初期の自社タイトルとして作り直し、Dojo とバーナーウォレット等のツールの実証の場になった。
selection_reason: >-
  Loot 派生の「最小資産 → 第三者がゲームを作る」系譜が、実際にどのようなゲームとエンジン（Dojo・Cartridge）に結びついたかを示す例。
  Cairo 0 版の ModuleController / Arbiter による「モジュール間の読み書き許可」は、他者が作った機能を再利用する構造の初期設計として Wylls の関心に直結する。
  一方、Dojo 版のリポジトリは参照日に公開されておらず、規模・継続の資料も乏しい。
categories:
  - {id: onchain-rules, role: primary, reason: "市場価格・移動・イベント（取り締まり等）を含む取引ゲームのルールをコントラクトで実行"}
  - {id: assets, role: secondary, reason: "Loot 派生の DOPE NFT、Hustler・Gear・PAPER を基盤とする生態系"}
  - {id: infra, role: secondary, reason: "Cairo 0 版は汎用のモジュール型エンジンを志向し、Dojo 版は Cartridge・Dojo のツールの実証に使われた"}
status:
  value: unknown
  as_of: "2026-10"
  note: "cartridge-gg/rollyourown は参照日に 404（clone も不可）。dopewars.gg は Roll Your Own を Dojo 製としてプレビュー URL で紹介。継続運営の有無は未確認。"
  s: [src-dope-wars-roll-your-own-gh-404, src-dope-wars-roll-your-own-site]
dates:
  announced: {date: "2021-09-15", s: [src-dope-wars-roll-your-own-cairo0], note: "Cairo 0 版 RYO リポジトリの初回コミット"}
  launched: {date: "2023", s: [src-dope-wars-roll-your-own-op-forum], note: "2023-10-03 の DopeLabs 関係者の投稿が、Starknet の更新を待って「最近」ローンチしたと記載。正確な日付は未確認"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      Cairo 0 版は ModuleController が各モジュールのアドレスと書き込み権限を管理し、01_DopeWars（取引）、02_LocationOwned 等のモジュールが状態を共有する。
      Goerli への展開記録がある。Dojo 版の内部は、リポジトリが参照日に公開されていないため確認できなかった。
    s: [src-dope-wars-roll-your-own-cairo0]
  offchain:
    - {item: "バーナーウォレットでプレイヤーが署名せずに遊べた（第三者記事）", s: [src-dope-wars-roll-your-own-chaincatcher]}
  admin:
    level: significant
    detail: "Cairo 0 版では Arbiter が ModuleController を更新し、モジュールの差し替え・追加と書き込み権限の付与ができる（ガバナンスに委ねる構想）。Dojo 版は未確認。"
    s: [src-dope-wars-roll-your-own-cairo0]
  open_source:
    level: partial
    detail: "Cairo 0 版（dopedao/RYO）は公開。Dojo 版（cartridge-gg/rollyourown）は以前公開されていたと第三者索引が示すが、参照日に 404。"
    url: "https://github.com/dopedao/RYO"
    s: [src-dope-wars-roll-your-own-cairo0, src-dope-wars-roll-your-own-gh-404]
  extensibility:
    level: permissionless-onchain
    detail: "Cairo 0 版は誰でも番号を取ってモジュールを書き、他モジュールの状態を読めるとし、書き込み権限はガバナンス経由で付与する設計だった（読みは許可不要、書きは許可制）。実際に第三者モジュールが稼働した例は確認できなかった。"
    s: [src-dope-wars-roll-your-own-cairo0]

compare:
  gameplay: {t: "場所ごとに価格の違う市場で薬物を安く買い高く売る裁定取引ゲーム。盗難や供給ショックのような確率的・市場全体のイベントが不安定さと裁定の機会を生む（Cairo 0 版の設計メモ）。PvP の取引が価格に影響したと第三者は述べる。", k: fact, s: [src-dope-wars-roll-your-own-perama, src-dope-wars-roll-your-own-chaincatcher]}
  necessity: {t: "共有市場の価格を全プレイヤーの取引で動かす設計はオンチェーンの共有状態と整合する。一方、Tarrence は裁定取引ゲームはフルオンチェーン版に向くと述べつつ、ゲーム性自体は単一サーバーでも成立する。", k: analysis, s: [src-dope-wars-roll-your-own-bgb]}
  information: {t: "未確認（Dojo 版のコードを読めていない）。", k: unknown}
  persistence: {t: "Cairo 0 版のコードは残るが、Dojo 版のリポジトリは参照日に非公開・削除状態で、運営停止後に遊べるかは確認できない。", k: fact, s: [src-dope-wars-roll-your-own-cairo0, src-dope-wars-roll-your-own-gh-404]}
  extensibility: {t: "Cairo 0 版はモジュール追加と状態共有を前提とする開かれたエンジン構想。収益が出たら 5% を DOPE DAO に向ける文化的規範も README に書かれていた。", k: fact, s: [src-dope-wars-roll-your-own-cairo0]}
  money_flow: {t: "DopeDAO と StarkWare が 2021-09 に部分的に資金提供したと DopeLabs 関係者は述べる。PAPER は生態系の通貨。Dojo 版の課金・報酬は未確認。", k: claim, who: "Butterbum（DopeLabs、Optimism フォーラムへの代理投稿）", s: [src-dope-wars-roll-your-own-op-forum]}
  entry_barrier: {t: "第三者記事によれば、バーナーウォレットのためウォレット接続や署名なしで遊べた。", k: fact, s: [src-dope-wars-roll-your-own-chaincatcher]}

concepts: [c-onchain-rules, c-composable-primitive, c-permissionless-extension, c-gas-abstraction, c-nft-asset, c-cc0]

article:
  principles:
    - {t: "中央の ModuleController による読み書き許可: モジュールのアドレスと書き込み権限を 1 つの台帳に置き、読みは自由・書きは許可制にすると、他者が作ったモジュールが同じ状態（位置・所持品）を共有できる。適用条件は許可を出す主体（Arbiter / DAO）が機能すること。破綻条件はその主体が止まるか中央集権的になる場合で、拡張の可否が一者に握られる。PixeLAW は同じ問題を書き込まれる側のフックに分散して解こうとした。", k: analysis, s: [src-dope-wars-roll-your-own-cairo0]}
  counter_evidence:
    - {t: "Dope Wars の NFT は当初「ゲームが存在しない段階のアート」として 報じられ（4 日で約 900 万ドルが Dope Wars NFT に費やされた。一次販売は gas のみのミントだったと公式サイトは記す）、開発者自身もゲームの実現は保証されないと述べた。Loot 派生の資産が先行し、RYO が「最近ローンチした」と DopeLabs 関係者が書いたのは約 2 年後（2023-10）だった。", k: fact, s: [src-dope-wars-roll-your-own-vice, src-dope-wars-roll-your-own-op-forum, src-dope-wars-roll-your-own-site], q: "The Dope Wars NFT is artwork."}

acquisition:
  audience: [holders, players, developers]
  summary: {t: "最初の参加者は Loot 熱の直後にガス代だけで DOPE をミントした NFT 利用者で、5,000 人近い Discord に「ゲームを作る人・描く人」を呼びかける形で始まった。Roll Your Own 自体の最初のプレイヤーは、この Dope Wars 保有者コミュニティと、Cartridge / Dojo 周辺の Starknet 開発者・利用者だったとみられるが、人数の資料はない。", k: analysis, s: [src-dope-wars-roll-your-own-vice, src-dope-wars-roll-your-own-site, src-dope-wars-roll-your-own-cartridge-interview]}
  steps:
    - {phase: pre, date: "2021-09", t: "Loot 派生の DOPE 8,000 個をガス代のみのミントで配布し、1 DOPE あたり 125,000 PAPER を一度だけ請求できるようにした。Vice は 4 日で約 900 万ドルが DOPE に費やされたと報じた。", k: fact, s: [src-dope-wars-roll-your-own-site, src-dope-wars-roll-your-own-vice]}
    - {phase: pre, date: "2021-09", t: "Dope Wars の X アカウントは「game builders and artists」に Discord への参加を呼びかける投稿をリツイートし、Discord の参加者は 5,000 人近く（nearly 5,000）だった（Vice 2021-09-09）。開発者 Tarrence は、ゲームは保証されず、コミュニティが上に作っていると述べた。", k: fact, s: [src-dope-wars-roll-your-own-vice], q: "I think the community is working on various games on top of it."}
    - {phase: pre, date: "2021-09-15", t: "Cairo 0 版 RYO のリポジトリが始まり、DopeDAO と StarkWare が 2021-09 に部分的に資金を出したと DopeLabs 関係者は述べる。", k: claim, who: "Butterbum（DopeLabs、Optimism フォーラムへの代理投稿）", s: [src-dope-wars-roll-your-own-cairo0, src-dope-wars-roll-your-own-op-forum]}
    - {phase: pre, date: "2023-04-06", t: "Cartridge の Tarrence は、Dojo と Controller の開発と並行して自社ゲーム RYO の開発を始めると述べ、標準ツールで Starknet に開発チームを呼び込む狙いを語った。", k: claim, who: "Tarrence van As（Cartridge、Nurstar の取材）", s: [src-dope-wars-roll-your-own-cartridge-interview]}
    - {phase: pre, date: "2023-06", t: "第三者の解説は、Dojo 版 RYO の計画をテストネットでの Alpha（Web UI）→ Beta（Web とモバイル）→ mainnet と紹介し、PAPER でラウンドに参加し賞金プールを持ち帰る形を掲げたと記す。", k: fact, s: [src-dope-wars-roll-your-own-awresearch-2023], q: "Buy in to rounds with PAPER, use your hustler and items to win the streets, and take home the prize pool."}
    - {phase: launch, date: "2023-10", t: "DopeLabs 関係者は 2023-10-03 の投稿で、RYO が Starknet の更新を待って「最近」ローンチしたと書いた。第三者記事によればバーナーウォレットで署名なしに遊べた。", k: claim, who: "Butterbum（DopeLabs、Optimism フォーラムへの代理投稿）", s: [src-dope-wars-roll-your-own-op-forum, src-dope-wars-roll-your-own-chaincatcher]}
    - {phase: growth, date: "2023-12", t: "Dojo Holiday Game Jam #3 に Dope Wars のトラック（5,000 ドル＋優勝者に DOPE NFT 2 個、準優勝にも 2 個）が設けられ、開発者向けに生態系を露出させた。", k: fact, s: [src-dope-wars-roll-your-own-dojo-jam3]}
  channels:
    - {id: existing-community, t: "Loot 派生として Loot 熱の直後に始まり、DOPE 保有者・PAPER 保有者の集団が RYO を含む後続作の母集団になった。", k: fact, s: [src-dope-wars-roll-your-own-vice, src-dope-wars-roll-your-own-op-proposal, src-dope-wars-roll-your-own-site]}
    - {id: free-mint, t: "DOPE 8,000 個をガス代のみでミントし、PAPER を保有者に無料で請求させた。", k: fact, s: [src-dope-wars-roll-your-own-site]}
    - {id: community-server, t: "Discord（2021-09 に 5,000 人近く）への参加をゲームを作る人とアーティストに呼びかけた。呼びかけで何人の作り手が加わったかは資料がない。", k: fact, s: [src-dope-wars-roll-your-own-vice]}
    - {id: crypto-social, t: "X で Discord への参加呼びかけをリツイートした（拡散の規模を示す資料はない）。", k: fact, s: [src-dope-wars-roll-your-own-vice]}
    - {id: hackathon, t: "Dojo のゲームジャムに Dope Wars の賞金トラックを出した。", k: fact, s: [src-dope-wars-roll-your-own-dojo-jam3]}
  cost:
    - {t: "DOPE は一次販売の代金を取らず（ガス代のみ）、初期の金額は二次流通で生じた。RYO の開発は DopeDAO と StarkWare の部分的な出資、のちに Cartridge の自社負担で進んだとされる。", k: claim, who: "DopeLabs 関係者 / Tarrence van As", s: [src-dope-wars-roll-your-own-site, src-dope-wars-roll-your-own-op-forum, src-dope-wars-roll-your-own-cartridge-interview]}
  after:
    - {t: "RYO のプレイヤー数・継続の資料は見つからず、Dojo 版のリポジトリは参照日に 404 だった。LS2（2025）の無料ゲーム配布は Dope Wars を対象集合の一つ（1 NFT あたり 3 回）にしており、保有者集団は他作の獲得対象として残っている。", k: fact, s: [src-dope-wars-roll-your-own-gh-404, src-dope-wars-roll-your-own-ls-eligible]}
  counter:
    - {t: "2021-09 の DOPE 購入は「ゲームのない段階のアート」への支出で、RYO が実際に遊べるようになったのは約 2 年後だった。初期の集客は投機と Loot 熱によるもので、RYO の最初のプレイヤーと同じ人たちだったかは確認できない。", k: analysis, s: [src-dope-wars-roll-your-own-vice, src-dope-wars-roll-your-own-op-forum]}
    - {t: "Dojo 版 RYO は Cartridge の自社タイトルでツールの実証を兼ねていたため、初期プレイヤーは Dope Wars 保有者より Starknet / Dojo の開発者・利用者だった可能性もある（人数の内訳の資料はない）。", k: analysis, s: [src-dope-wars-roll-your-own-cartridge-interview, src-dope-wars-roll-your-own-chaincatcher]}
    - {t: "初期のミント参加者はゲームを求めて来たわけではないと開発者自身が述べている。DOPE の初期分布は「無料で面白半分に」取った人たちで、後のゲームの最初のプレイヤーを集めた施策とは言いにくい。", k: analysis, s: [src-dope-wars-roll-your-own-vice], q: "People minted it for free and for fun without any expectations of the future."}
  lessons:
    - {t: "保有者コミュニティの Discord に「作り手」を呼ぶ: ガス代のみで資産を配り、ゲームは後からコミュニティが作ると明言すると、開発者・アーティストが集まり派生が生まれる。効く条件は資産の熱が高い時期に開発者を確保できること。破綻条件は実際に遊べるものが出るまでの時間（RYO は約 2 年）で、その間に関心と資金が冷める。", k: analysis}
  unknowns:
    - "Dojo 版 RYO の mainnet 公開日、シーズン、賞金額、プレイヤー数。"
    - "DOPE 保有者のうち RYO を遊んだ人の割合。"

