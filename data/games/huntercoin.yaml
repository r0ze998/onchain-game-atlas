  - "各ハードフォークの実施日（ブロック高 255000 / 500000 / 590000 / 795000 / 1521500 は分かるが、日付に換算できる一次資料を取得していない）。"
  - "「1 年の実験」の期限がコード上にあったか、それを外すフォークがいつ行われたか。"
  - "Huntercoin の保有者が Chimaera / Xaya の CHI に移行・配布を受けたか（確認できる資料なし）。"
