contradictions:
  - {t: "創始者・開発者の記述が資料で異なる: Bitcoin Magazine は SnailBrain と故 thecoder、Xaya は Andrew Colosimo と Mikhail Syndeev（2014 年以降 Daniel Kraft が保守）、BlockchainGamer は Colosimo と Kraft が公開したと記す。", s: [src-huntercoin-btcmag-2014, src-huntercoin-xaya-legacy, src-huntercoin-bgamer-2018]}
  - {t: "盤上に出る割合: コードと公開スレッドは 10 HUC 中 9 HUC（90%）、Xaya の現行ページは「約 80% のコインが仮想世界で得られる」と記す。公開スレッド自身が「採掘者は長期的にブロック報酬の 20%（2 コイン）＋全課税を受け取るはず」と書いており、盤上に出た分の一部が死亡・入金時の課税で採掘者に戻ることを考えると 80% は実効値の可能性がある。", s: [src-huntercoin-code, src-huntercoin-xaya-legacy, src-huntercoin-ann-2014]}
  - {t: "ジェネラルの表記: Bitcoin Magazine は名前に .1 が付くのがジェネラルと書くが、2014-03 の案内は「bob General」と兵士「bob.1」を区別している。", s: [src-huntercoin-btcmag-2014, src-huntercoin-guide-2014]}
  - {t: "基盤チェーン: BlockchainGamer は「Bitcoin ブロックチェーン上に構築」と書くが、公開スレッドとコードでは Namecoin のフォーク（Bitcoin とはマージマイニング）。", s: [src-huntercoin-bgamer-2018, src-huntercoin-ann-2014]}
  - {t: "キャラクター作成費: 公開スレッド（後に編集）は 1 体 101 HUC（100 は返還可能）と書き、コードの GetNameCoinAmount は 1 → 10 → 200 → 100 HUC とフォークごとに変化し、2014-03 の案内は 1.005 HUC 以上と記す。時期の差と見られる。", s: [src-huntercoin-ann-2014, src-huntercoin-code, src-huntercoin-guide-2014]}
  - {t: "発行配分: 構想段階（2013-10 の返信）は 1 ブロック 50 コイン（採掘者 5・ゲーム 45、課税は未定）案、公開時のコードは 1 ブロック 10 HUC（採掘者 1・盤上 9）。", s: [src-huntercoin-ann-2013, src-huntercoin-code]}

