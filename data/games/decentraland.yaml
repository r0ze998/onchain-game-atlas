id: decentraland
name: Decentraland
name_ja: ディセントラランド
aliases: [DCL, Genesis City]
kind: platform
depth: index
updated: "2026-10-23"
links:
  website: https://decentraland.org/
  play: https://decentraland.org/download
  docs: https://docs.decentraland.org/
  whitepaper: https://decentraland.org/whitepaper.pdf
  x: https://x.com/decentraland
  discord: https://dcl.gg/discord
  github: https://github.com/decentraland
  blog: https://decentraland.org/blog/
ids:
  coingecko: decentraland
chains: [Ethereum mainnet, Polygon（ウェアラブル等。本調査では一次資料未確認）]
team: "Decentraland Foundation（創業者 Ari Meilich / Esteban Ordano）と Decentraland DAO"
summary: >-
  Ethereum 上の土地（LAND）所有を中心にした 3D 仮想世界。座標 (x, y) ごとの区画を ERC-721 として所有し、区画に置くシーンの内容はハッシュで参照されて分散ストレージから配信される。
  2017 年の ICO と土地販売、2020-02 の一般公開を経て、DAO が LAND コントラクトや Catalyst サーバーの一覧を管理する体制になった。
  2022-10 の「1 日 38 人」報道と運営の反論は、オンチェーン指標と実際の利用者の定義の違いを示す代表例である。
selection_reason: >-
  「土地を NFT として所有させれば仮想世界が成立するか」を検証できる最大規模の事例であり、DAO による統治の範囲、
  オンチェーンの活動指標（ウォレットの取引）と運営発表の利用者数がどれほど乖離するかを、報道と第三者分析で比較できるため。
categories:
  - {id: assets, role: primary, reason: "LAND（区画）・ESTATE・NAME・ウェアラブルを NFT とし、MANA（ERC-20）で取引する"}
  - {id: aw, role: secondary, reason: "区画の所有者が自分のシーンを公開でき、DAO が中核コントラクトとサーバー一覧を管理する"}
  - {id: infra, role: secondary, reason: "内容配信（IPFS 等）とリアルタイム通信（P2P / Catalyst）をチェーン外に分けた三層構成"}
status:
  value: active
  as_of: "2026-10"
  note: "公式サイトはデスクトップ・モバイルのクライアント配布を掲げる（参照日）。2024-10 に Decentraland 2.0 のベータ版デスクトップクライアントを公開（Wikipedia）。"
  s: [src-dcl-site, src-dcl-wikipedia]
dates:
  launched: {date: "2020-02", s: [src-dcl-wikipedia], note: "一般公開（ブラウザ版）。Wikipedia の本文は 2020-02、情報ボックスは 2020-02-20。開発は 2015 年から、ICO は 2017 年"}

architecture:
  onchain:
    level: assets-only
    detail: >-
      ホワイトペーパーの構成では、コンセンサス層（Ethereum のスマートコントラクト）が区画の所有と内容記述ファイルへの参照（ハッシュ）を保持し、LAND は MANA を焼却して得る。
      シーンの内容（3D オブジェクト・スクリプト）とその実行、利用者同士の通信はチェーン外。第三者分析は MANA・LAND・ESTATE・POI 一覧・NAME・マーケットの収集品・DAO の投票と助成をオンチェーン要素として挙げる。
    s: [src-dcl-whitepaper, src-dcl-naavik]
  offchain:
    - {item: "シーン内容の配信（ホワイトペーパーでは BitTorrent / IPFS、その後は Catalyst サーバー）", s: [src-dcl-whitepaper, src-dcl-naavik]}
    - {item: "利用者同士のリアルタイム通信（P2P とランデブーサーバー）", s: [src-dcl-whitepaper]}
    - {item: "利用者数の集計（DCL Metrics 等のダッシュボード）", s: [src-dcl-coindesk-2022, src-dcl-naavik]}
  admin:
    level: significant
    detail: "DAO が LAND・ESTATE など主要コントラクトを管理し、重要コントラクトの変更には DAO と Security Advisory Board の双方のオンチェーン投票が必要とされる。MANA コントラクトは管理権限が焼却され変更不能（第三者分析の記述）。"
    s: [src-dcl-naavik]
  open_source:
    level: full
    detail: "第三者分析はクライアント・サーバーを含むオープンソースの世界と位置づける（本調査ではリポジトリを個別に確認していない）。"
    s: [src-dcl-naavik]
  extensibility:
    level: official-api
    detail: "区画の所有者は SDK で作ったシーン（ゲーム・展示等）を自分の区画に公開できる。他人の区画や世界のルールを許可なく変えることはできない。"
    s: [src-dcl-whitepaper]

compare:
  gameplay: {t: "アバターで区画の集まる世界を歩き、所有者が公開したシーン（イベント・ギャラリー・ミニゲーム）を訪れる。ゲームのルールは各シーン次第。", k: fact, s: [src-dcl-whitepaper, src-dcl-wikipedia]}
  necessity: {t: "区画の所有と内容の参照をチェーンに置くことで、運営が区画を没収できない点にはオンチェーンの意味がある。ただし体験の大半（描画・通信・配信）はチェーン外で、利用者の多くはチェーンに触れずに訪問している（2022-10 の論争が示す）。", k: analysis, s: [src-dcl-whitepaper, src-dcl-coindesk-2022]}
  information: {t: "所有と取引は公開。シーンの中身は配信ファイルとして誰でも取得できる構成。", k: fact, s: [src-dcl-whitepaper]}
  persistence: {t: "所有記録はチェーン上に残るが、世界の表示は Catalyst サーバーとクライアントの継続に依存する。", k: analysis, s: [src-dcl-naavik]}
  extensibility: {t: "区画所有者によるシーン公開。DAO の投票で Catalyst ノードや POI を追加できる。", k: fact, s: [src-dcl-naavik]}
  money_flow: {t: "2017 年の ICO で 2600 万ドルを調達。LAND は MANA の焼却で発行され、以後は MANA で LAND・NAME・ウェアラブルを売買する。DAO は財務から助成金を出す。", k: fact, s: [src-dcl-wikipedia, src-dcl-whitepaper, src-dcl-naavik]}
  entry_barrier: {t: "ゲストとしての訪問はウォレット取引を伴わずに可能（運営は「受動的に関わる」利用者も数えると説明）。土地所有や取引にはウォレットと MANA が要る。", k: fact, s: [src-dcl-coindesk-2022]}

concepts: [m-land, c-nft-asset, c-fungible-ingame-token, c-autonomous-world]

article:
  retention_evidence:
    - {t: "示されている指標（測定）: 2022-10 時点で DappRadar が数えた「過去 24 時間にコントラクトと取引した一意ウォレット」は 38、過去最高でも 1 日 675。Dapp.com は 2022-10-05 に 312（7 月以降の中央値約 600）。", k: fact, s: [src-dcl-coindesk-2022, src-dcl-cryptoslate-2022]}
    - {t: "示されている指標（運営発表）: 1 日平均 8000 人（クリエイティブディレクター Sam Hamilton）、コミュニティのダッシュボードで 2022-10-03〜09 の 1 日あたり一意訪問者 6999、9 月の月間アクティブ 56,697、同時期にコントラクトと取引した利用者 1074。財団は「アクティブ」を「ログインして区画の外へ移動した人」と定義した（CoinDesk）。", k: claim, who: "Decentraland（Sam Hamilton / 公式ツイート、CoinDesk の記事内）", s: [src-dcl-coindesk-2022], q: "DappRadar doesn't track our users, only people interacting with our contracts"}
    - {t: "第三者分析は DCL Metrics の DAU が直近 90 日で 12,304 から 7,800 に 37% 減り、2021-12 の共同創業者の発言（DAU 18,000、MAU 30 万）と比べて 56% 超減少したと計算した。", k: claim, who: "Naavik（Lars Doucet, Devin Becker）", s: [src-dcl-naavik]}
    - {t: "示されていない指標: 運営発表の DAU の厳密な定義（ゲスト・ボットの扱い）、滞在時間、継続率。", k: unknown}
  counter_evidence:
    - {t: "「38 人」は取引したウォレット数で、訪問者数ではない。一方、運営の 8000 人や 56,697 MAU は「ログインして区画の外へ移動した人」という運営自身の定義による、チェーンと無関係な訪問の数で、ゲスト・ボット・重複の扱いは公表されていない。どちらを採るかで「土地 NFT の世界は空っぽか」の結論が反転するため、オンチェーン指標だけで仮想世界の利用を評価するのは誤りで、運営発表だけを信じるのも検証不能である。", k: analysis, s: [src-dcl-coindesk-2022, src-dcl-cryptoslate-2022]}
    - {t: "LAND の平均売価はピーク付近の約 9845 ドルから 2418 ドルへ 75% 下落し、マーケットの月間取引高は 2021-12 のピーク 2200 万ドルから 2022-08 の約 87.9 万ドルへ 96% 超減少したと第三者分析は述べた。土地の希少性が利用を生むという想定には反証になる。", k: claim, who: "Naavik（Dune の @metaland クエリ等を引用）", s: [src-dcl-naavik]}

