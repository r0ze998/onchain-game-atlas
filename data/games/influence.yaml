id: influence
name: Influence
aliases: [Adalia]
kind: game
depth: index
updated: "2026-10-24"
links:
  website: https://www.influenceth.io/
  play: https://game.influenceth.io/
  x: https://x.com/influenceth
  discord: https://discord.gg/8QW2EAEHgK
  github: https://github.com/influenceth
  blog: https://influenceth.substack.com/
chains: [Ethereum mainnet（Asteroid・Crewmate 等の NFT と L1 側の SWAY）, Starknet mainnet（ゲーム本体の Dispatcher と各 NFT・SWAY）]
team: "Unstoppable Games, Inc."
summary: >-
  小惑星帯 Adalia を舞台に、採掘・精製・建設・輸送・交易・賃貸を行う宇宙経済シミュレーション MMO。NPC のいない完全にプレイヤー主導の経済を掲げ、
  2024-06-27 に Starknet mainnet で正式稼働した。小惑星・クルー・船は NFT、通貨は ERC20 の SWAY で、ゲーム状態は独自の Dispatcher コントラクトに
  コンポーネントとして保存される（Dojo ではない独自 ECS）。
selection_reason: >-
  生産チェーン・物流・土地（区画）賃貸・市場を中心とする「経済そのものがゲーム」の大型オンチェーン MMO で、Wylls の文明シミュレーション構想の生産・交易側の比較対象。
  Eternum と違い期間限定シーズンではなく永続世界として運営されている点、Dojo を使わない独自 ECS を持つ点で対照になる。情報は乏しく、規模・継続の証拠は確認できていない。
categories:
  - {id: onchain-rules, role: primary, reason: "全行動がオンチェーンで、状態は Dispatcher コントラクトのコンポーネントとして保存される"}
  - {id: assets, role: secondary, reason: "小惑星・クルーメイト・船を NFT、SWAY を ERC20 として発行"}
  - {id: aw, role: secondary, reason: "運営が消えても世界が残る「unstoppable」なゲームを標榜"}
status:
  value: active
  as_of: "2026-10"
  note: "公式サイトは参照日に Play Now の導線（game.influenceth.io、HTTP 200 を確認）を持ち（2026 年の著作権表示）、SDK リポジトリの最新コミットは 2026-10-20（GitHub の組織ページ上の更新表示は 2026-10-22）。利用規模は未確認。公式 Substack の最新投稿は 2024-09-12 の物語記事で、運営状況の公式発表は 2024-09 以降見つからない。検索要約にあった「2025-12 の Sepolia pre-release」は 2024-02-23 公開・2025-12-02 更新の games.gg 記事で、mainnet 前（2024-02）のテストを指しており新たなテストの証拠ではない。"
  s: [src-influence-site, src-influence-github-org, src-influence-sdk, src-influence-substack-archive]
dates:
  announced: {date: "2021", s: [src-influence-starknet-launch], note: "Starknet 公式記事は 2021 年に Starknet へのコミットを決めた最初期のチームと記載。最初の告知日は未確認"}
  launched: {date: "2024-06-27", s: [src-influence-starknet-launch, src-influence-bankless], note: "Starknet mainnet で正式稼働"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      Starknet 上の Influence Dispatcher コントラクトが run_system でシステムを実行し、全状態をコンポーネント（例: Crew）として保持する。
      公式記事は全行動がオンチェーンで誰でも閲覧できると述べる。小惑星・クルーメイト・クルー・船は Ethereum と Starknet の両方に NFT コントラクトがある。
      トークノミクス文書は、SWAY の継続的な発行はすべて L1 Ethereum 側で行い、Starknet 側の SWAY は発行できないとする。
    s: [src-influence-sdk, src-influence-starknet-launch, src-influence-tokenomics]
  offchain:
    - {item: "公式クライアント（game.influenceth.io）と SDK による読み取り・描画", s: [src-influence-site, src-influence-sdk]}
  admin:
    level: unknown
    detail: "Dispatcher のアップグレード権限・停止権限は確認できなかった。トークノミクス文書（v3.0、2024-06-22）は、Starknet の SWAY コントラクトは当初アップグレード可能で管理者役割を持ち、ローンチ前にその役割を取り消して不変にすると述べる（運営の計画。実際に取り消されたかはオンチェーンで未確認）。"
    s: [src-influence-tokenomics]
  open_source:
    level: partial
    detail: "SDK・天体力学ライブラリ（astro）・クライアント（client）等は公開。ゲームコントラクト本体のソース公開は確認できなかった。"
    url: "https://github.com/influenceth"
    s: [src-influence-github-org, src-influence-sdk]
  extensibility:
    level: official-api
    detail: "SDK で状態の読み取り（ReadComponent）と ABI が提供される。プレイヤーが将来ミッションを作れるようになると紹介記事は述べるが、第三者がルールを追加した例は確認できなかった。"
    s: [src-influence-sdk, src-influence-bankless]

compare:
  gameplay: {t: "25 万の小惑星が実時間で公転する Adalia で、5 職種のクルーを率いて 22 種の原料を採掘し、約 200〜250 の製品を加工・建設・輸送・売買する。小惑星上の区画は賃貸でき、PvP は将来の拡張とされる。", k: fact, s: [src-influence-starknet-launch, src-influence-site, src-influence-bankless]}
  necessity: {t: "運営が消えてもゲームが残るという「unstoppable」の主張と、資産・通貨の外部市場性がオンチェーン化の理由として挙げられた。コントラクトのソースとアップグレード権限が確認できないため、その主張を検証できていない。", k: analysis, s: [src-influence-starkware-invest, src-influence-sdk]}
  information: {t: "全行動はオンチェーンで、誰でも全プレイヤーの行動履歴を見られると公式記事は述べる。", k: claim, who: "Starknet 公式ブログ", s: [src-influence-starknet-launch], q: "since all actions are onchain, players have deep insight and access to all game actions taken."}
  persistence: {t: "シーズン制ではなく永続世界として運営。運営停止後に遊べるかはコントラクトとクライアントの公開状況に依存し、未確認。", k: unknown}
  extensibility: {t: "SDK による読み取りと ABI の提供は確認。第三者の拡張例は未確認。", k: fact, s: [src-influence-sdk]}
  money_flow: {t: "プレイヤーはゲーム内ストアで Starter Pack（30 ドルから）を購入し、資源採掘・市場運営・賃貸・流動性提供・取引で SWAY を稼ぐ。SWAY に投資家割当はないと紹介記事は述べる。StarkWare が Unstoppable Games に出資した（額は非公表）。", k: fact, s: [src-influence-bankless, src-influence-starkware-invest]}
  entry_barrier: {t: "Starknet ウォレットと Starter Pack の購入が必要。ゲームは複雑で文書を読む必要があると第三者記事は述べる。", k: fact, s: [src-influence-bankless, src-influence-chaincatcher]}

concepts: [c-onchain-rules, c-onchain-state, m-production-chain, m-land, c-nft-asset, c-fungible-ingame-token, c-ecs-engine, c-autonomous-world]

article:
  counter_evidence:
    - {t: "status: active の根拠は公式サイトの Play Now 導線と SDK のコミットで、プレイヤー数や取引量の公開データ、2024-09 以降の公式の運営報告は見つからなかった。「稼働している」ことと「遊ばれている」ことは区別が必要。", k: analysis, s: [src-influence-site, src-influence-sdk, src-influence-github-org]}
    - {t: "「unstoppable」「コミュニティが最終的に運営する」という主張に対し、SWAY の Starknet コントラクトは当初アップグレード可能な管理者役割付きで展開され、ゲームコントラクトのソースと Dispatcher の権限は確認できない。運営からの独立性は主張の段階にとどまる。", k: analysis, s: [src-influence-starkware-invest, src-influence-tokenomics, src-influence-github-org]}

acquisition:
  audience: [holders, players]
  summary: {t: "最初の利用者は、ゲームが遊べるようになる 3 年以上前（2021-04 と 2021-09）に Ethereum 上で小惑星 NFT を買った人たちで、運営はこの販売で開発費を全額賄い、購入者の半数がブロックチェーン初利用だったと述べる。2024-06 の Starknet mainnet 公開時はこの保有者層に加え、30 ドルからの Starter Pack と SWAY を稼げるローンチイベントで新規プレイヤーを募った。", k: analysis, s: [src-influence-p2e-2021, src-influence-gamespress-2022, src-influence-bankless]}
  steps:
    - {phase: pre, date: "2021-04", t: "最初の小惑星販売（2021-05-01 終了）。価格は 0.028 ETH から大きさに応じて数百 ETH までで、購入者には以後の販売にはない「early adopter rewards」があるとされた。", k: fact, s: [src-influence-p2e-2021]}
    - {phase: pre, date: "2021-10", t: "Influence は次の「Exploitation」リリースを StarkNet で出すと発表した（BlockchainGamer.biz の報道）。", k: fact, s: [src-influence-bgb-2021]}
    - {phase: pre, date: "2022-03-15", t: "Unstoppable Games は 2 回の小惑星販売で開発費を 100% 賄ったこと、購入者の 50% がブロックチェーン初利用だったこと、ユーザー作成ツールに計 2 万ドルのコミュニティ助成（6 組）を出したことを発表した。", k: claim, who: "Unstoppable Games（プレスリリース）", s: [src-influence-gamespress-2022], q: "Unstoppable has 100% funded Influence via player blockchain purchases"}
    - {phase: pre, date: "2023-04-10", t: "StarkWare が Unstoppable Games に戦略的出資（額非公表）。", k: fact, s: [src-influence-starkware-invest]}
    - {phase: launch, date: "2024-06-27", t: "Starknet mainnet で正式稼働。Starknet 公式ブログが告知し、コミュニティ・スチュワードによる Bankless のゲスト記事は 30 ドルからの Starter Pack、初日にコミュニティへ配る SWAY、ローンチイベントとミッションで SWAY を稼げることを案内した。", k: fact, s: [src-influence-starknet-launch, src-influence-bankless]}
    - {phase: growth, date: "2024-09", t: "Loot Survivor 1.5 のローンチ・トーナメントが Influence（Starknet 上の集合）を無料ゲームの対象 8 集合の一つにしており、同じ Starknet 上の他作との相互送客の対象になった。", k: fact, s: [src-influence-ls15-deploy]}
  channels:
    - {id: existing-community, t: "2021 年の小惑星・クルーメイトの購入者が、2024 年のゲーム公開時の最初の保有者層になった。", k: fact, s: [src-influence-p2e-2021, src-influence-gamespress-2022, src-influence-sdk]}
    - {id: builder-grants, t: "公開前の 2022 年に、データ分析・同盟管理・資産ランキング等のユーザー作成ツールへ計 2 万ドルの助成を出した。", k: fact, s: [src-influence-gamespress-2022]}
    - {id: token-incentive, t: "公開時に SWAY の大部分を初日にコミュニティへ配り、ローンチイベントとミッションで SWAY を稼げるとした（投資家割当なし）。", k: claim, who: "Influence コミュニティ・スチュワード（Bankless ゲスト記事）", s: [src-influence-bankless]}
    - {id: referral, t: "残りの SWAY をゲーム内イベント・紹介・助成に充てると説明された（紹介制度の実装は未確認）。", k: claim, who: "Influence コミュニティ・スチュワード（Bankless ゲスト記事）", s: [src-influence-bankless]}
    - {id: platform-distribution, t: "Starknet 公式ブログによる公開告知、StarkWare の出資、Loot Survivor 1.5 の無料ゲーム対象集合への組み込み。", k: fact, s: [src-influence-starknet-launch, src-influence-starkware-invest, src-influence-ls15-deploy]}
  cost:
    - {t: "開発費は小惑星を買ったプレイヤーが前払いし（運営の説明）、のちに StarkWare の出資が加わった。", k: claim, who: "Unstoppable Games", s: [src-influence-gamespress-2022, src-influence-starkware-invest]}
    - {t: "公開後の獲得はゲーム内ストアの Starter Pack（プレイヤー負担）と SWAY の配布（トークン放出）で賄う設計。配布額の実績は確認できなかった。", k: claim, who: "Influence コミュニティ・スチュワード（Bankless ゲスト記事）", s: [src-influence-bankless]}
  after:
    - {t: "参照日の Etherscan は Ethereum 上の Influence Asteroids の保有アドレスを 1,765 と表示する（Starknet へ移した分は含まない）。", k: fact, s: [src-influence-etherscan-asteroids]}
    - {t: "2024-06 の公開後のプレイヤー数、継続率、2021 年の購入者のうち実際に遊んだ割合は公表されていない。公式 Substack の運営報告は 2024-09 以降見つからない。", k: unknown}
  counter:
    - {t: "2021 年の購入は 2021 年の NFT 高騰期の資産購入で、購入者がプレイヤーになったかは別問題である。ゲームが遊べるまで 3 年以上かかっており、初期の熱はその間に冷めた可能性がある。", k: analysis, s: [src-influence-p2e-2021, src-influence-starknet-launch]}
    - {t: "「購入者の 50% がブロックチェーン初利用」は運営のプレスリリースの主張で、計測方法は示されていない。", k: analysis, s: [src-influence-gamespress-2022]}
    - {t: "公開時の案内記事は Influence のコミュニティ・スチュワードによるゲスト寄稿で、独立した報道ではない。", k: fact, s: [src-influence-bankless]}
  lessons:
    - {t: "土地（小惑星）の先行販売で開発費と初期保有者を同時に得る: 有限の土地を大きさ別の価格で売ると、ゲームより先に資金と保有者層ができる。効く条件は公開までの期間が短く、保有者に早期アクセスや固有の役割（賃貸・採掘）があること。破綻条件は公開が年単位で遅れる場合で、保有者は「待つ投資家」になり、公開時に新規プレイヤーを別に集め直す必要がある（Influence は 2024 年に Starter Pack とトークン配布を加えた）。", k: analysis}
  metrics: [m-influence-first-time-buyers, m-influence-community-grants, m-influence-l1-asteroid-holders]
  unknowns:
    - "2021 年の 2 回の小惑星販売の販売数と売上（公式 Medium は参照不可）。"
    - "テストネット（Goerli）期間の test-to-earn の参加者数と報酬（該当する公式 Substack 記事は参照日に削除されており、Wayback Machine にも到達できなかった）。"
    - "2024-06 の公開後に Starter Pack を買った人数と SWAY の配布実績。"

metrics:
  - {id: m-influence-first-time-buyers, type: other, value: 50, unit: "%", period: "2021 年の 2 回の小惑星販売", definition: "小惑星購入者のうちブロックチェーン初利用者の割合（運営の発表、計測方法は不明）", nature: reported, s: [src-influence-gamespress-2022]}
  - {id: m-influence-community-grants, type: grants, value: 20000, unit: USD, period: "2022-03 発表", definition: "ユーザー作成コンテンツ・ツールへのコミュニティ助成の総額（6 組）", nature: reported, s: [src-influence-gamespress-2022]}
  - {id: m-influence-l1-asteroid-holders, type: wallets, value: 1765, unit: addresses, period: "2026-10-24 時点", definition: "Etherscan が表示する Ethereum 上の Influence Asteroids（INFA）の保有アドレス数。Starknet 側は含まない", nature: measured, s: [src-influence-etherscan-asteroids]}

events:
  - {id: ev-influence-starkware, date: "2023-04-10", type: funding, title: "StarkWare が Unstoppable Games に戦略的出資", detail: "額は非公表。当時は 2023 年夏のローンチを予定", s: [src-influence-starkware-invest]}
  - {id: ev-influence-mainnet, date: "2024-06-27", type: launch, title: "Starknet mainnet で正式稼働", s: [src-influence-starknet-launch, src-influence-bankless]}

relations:
  - {to: realms-eternum, type: similar-to, basis: analytic, note: "Starknet 上の生産・交易中心のオンチェーン経済。Influence は永続世界、Eternum はシーズン制"}
  - {to: dojo, type: contrasts-with, basis: analytic, note: "Starknet 公式ブログは Dojo 製と記すが、SDK は独自の Dispatcher ECS を示し Dojo への言及がない"}
  - {to: primodium, type: similar-to, basis: analytic, note: "生産チェーンを中心にしたオンチェーン経済ゲーム"}

unknowns:
  - "プレイヤー数・継続率・SWAY の流通量など規模を示す数値。"
  - "ゲームコントラクトのソース公開とアップグレード・停止権限。"
  - "2024-06 の mainnet 稼働後の運営状況（公式 Substack の運営報告は 2024-06 以降なし）。SWAY 管理者役割の取り消しが実行されたか。"
  - "2021 年の Ethereum 上の小惑星販売の日時・規模（SDK に L1 の Asteroid NFT はあるが販売経緯は未確認）。"
contradictions:
  - {t: "Starknet 公式ブログ（2023）は Influence を Dojo で作られたゲームとして挙げるが、Influence の SDK は独自の Dispatcher を使い Dojo への言及がない。", s: [src-influence-starknet-dojo-blog, src-influence-sdk]}
  - {t: "StarkWare 出資の記事（2023-04）は 2023 年夏のローンチ予定と記すが、mainnet 稼働は 2024-06-27。", s: [src-influence-starkware-invest, src-influence-starknet-launch]}
  - {t: "製品数の記載が資料で異なる: Starknet 公式記事は「nearly 200」のプレイヤー製品、Bankless は「over 240 items」、公式サイトは 250 のクラフト可能な資源。", s: [src-influence-starknet-launch, src-influence-bankless, src-influence-site]}

