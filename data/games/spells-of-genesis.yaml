  - "プレイヤー数・継続率、チェーン上のカードを実際に移転したユーザー数。"
  - "現在カードが Bitcoin（Counterparty）以外のチェーンにもあるか（公式サイトは OpenSea・LooksRare にも言及）。"
  - "「Blockchainize」の具体的な手順と、運営がゲーム内カードとチェーン上カードの対応をどう管理しているか。"
contradictions:
  - {t: "BCY トークンセール時の需要試算（MAU 5 万・有料 2,500 人）はゲーム公開（2017-04）の約 2 年前に示された見込みで、実績値は公表されていない。", s: [src-sog-btcmag-sale]}
  - {t: "「最初の NFT モバイルゲーム」とする公式の主張に対し、独立した検証は見つからない。2015 年の最初のカード発行とゲームの公開（2017-04-20）には 2 年の差がある。", s: [src-sog-site]}
  - {t: "トークンセール序盤の額: Brave New Coin（2015-08-05）は開始 72 時間未満で「630 BTC 弱」、SiliconANGLE（2016-02）は 3 日未満で目標の 90%（約 730 BTC）と記す。最終額も 934 BTC と「930 BTC 超」で表現が異なる。", s: [src-sog-bnc-sale-2015, src-sog-siliconangle-2016, src-sog-bnc-milestone-2015]}

