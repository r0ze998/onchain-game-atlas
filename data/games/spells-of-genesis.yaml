  - {id: m-sog-bcy-sale, type: other, value: 70000000, value_text: "7000 万 BCY（総発行予定 1 億）", unit: BCY, period: "2015-08（トークンセール）", definition: "トークンセールで販売予定とされた BitCrystals の数（調達額ではない）", nature: reported, s: [src-sog-btcmag-2015, src-sog-counterparty-forum]}
  - {id: m-sog-mau-projection-2015, type: mau, value: 50000, unit: players, period: "2015-08 時点の見込み（公開後数か月）", definition: "CEO Shaban Shaame がトークンセール時に示した MAU の見込み（有料 2,500 人×月 40 ドルで月 10 万ドル相当の BCY 需要とする試算）。実績ではない", nature: estimated, s: [src-sog-btcmag-sale]}
  - {id: m-sog-moonga-downloads, type: other, value: 250000, value_text: "25 万超", unit: downloads, period: "2015-05 時点", definition: "前作 Moonga のダウンロード数（SoG ではない）", nature: reported, s: [src-sog-btcmag-2015]}
  - {id: m-sog-bcy-raise-2015, type: funding, value: 934, value_text: "934 BTC（SiliconANGLE は 930 BTC 超・約 34.6 万ドル）", unit: BTC, period: "2015-08-04〜2015-09-03", definition: "BitCrystals トークンセールで集まった BTC（Brave New Coin の報道。運営発表に基づくと見られる）", nature: reported, s: [src-sog-bnc-milestone-2015, src-sog-siliconangle-2016]}

