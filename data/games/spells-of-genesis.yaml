id: spells-of-genesis
name: Spells of Genesis
name_ja: スペルズ・オブ・ジェネシス
aliases: [SoG, BitCrystals, BCY]
kind: game
depth: index
updated: "2026-10-23"
links:
  website: https://spellsofgenesis.com/
  play: https://play.spellsofgenesis.com/
  docs: https://docs.spellsofgenesis.com/
  x: https://x.com/SpellsofGenesis
  discord: https://discord.com/invite/H4UXSaJ
  telegram: https://t.me/EverdreamSoft
chains: [Bitcoin（Counterparty）]
team: "EverdreamSoft SA（スイス・ジュネーブ。CEO Shaban Shaame。前作 Moonga）"
summary: >-
  スイスの EverdreamSoft が開発した、トレーディングカードとアーケード的な射撃操作を組み合わせたモバイルゲーム。
  2015 年から一部のカードを Bitcoin 上の Counterparty 資産として発行し、ゲーム内外で自由に売買できるようにした。
  プレミアム通貨 BitCrystals（BCY）も Counterparty 資産としてトークンセールで販売した。ゲームのルールはサーバー側で、チェーンにあるのはカードと通貨の所有だけ。
selection_reason: >-
  「ゲーム資産をチェーンに置き、ルールは従来のサーバーに置く」という型を、ERC-721 以前に Bitcoin 上で実装した初期の例であり、
  ゲーム内通貨のトークンセールによる開発資金調達の早い事例でもあるから。公式は「2015 年以来の最初の NFT モバイルゲーム」と主張している。
categories:
  - {id: assets, role: primary, reason: "カードと BitCrystals を Counterparty 資産として発行し、ゲーム外でも取引可能にした"}
  - {id: p2e, role: secondary, reason: "ゲーム内通貨のトークンセールで開発資金を集め、通貨を焼却してゲーム資産を発行する設計"}
status:
  value: active
  as_of: "2026-10"
  note: "公式サイトは Android・iOS・Web 版を案内し、2023 年からの月額 NFT ルートボックス（ChainChronicles）と BitCrystals のステーキング報酬を掲載している（実際の利用者数は未確認）。"
  s: [src-sog-site]
dates:
  announced: {date: "2015-02-16", s: [src-sog-counterparty-forum], note: "Counterparty フォーラムで Counterparty の利用計画を公表"}
  launched: {date: "2017-04-20", s: [src-sog-site], note: "公式サイトがゲームの公開日として記載。最初のオンチェーンカードは 2015-03-11"}

architecture:
  onchain:
    level: assets-only
    detail: "カード（一部）と BitCrystals が Counterparty 資産として Bitcoin 上にある。カードの希少性は Counterparty の発行ロック機能で公開的に固定できる。ゲームの対戦・進行はチェーン外。"
    s: [src-sog-counterparty-forum, src-sog-btcmag-2015]
  offchain:
    - {item: "ゲームのルール・対戦・進行はアプリとサーバー側。ゲーム内で育てたカードを「Blockchainize」してチェーンに出す仕組みがある", s: [src-sog-site]}
    - {item: "BitCrystals の販売はトークンセールサイトと ShapeShift 経由", s: [src-sog-btcmag-sale]}
  admin:
    level: significant
    detail: "カードと通貨の発行主体は EverdreamSoft。BitCrystals を焼却して新しいゲーム資産を発行する仕組みも運営が管理する。"
    s: [src-sog-counterparty-forum]
  open_source:
    level: unknown
    detail: "ゲームのソース公開は確認できなかった。"
    s: []
  extensibility:
    level: none
    detail: "カード資産は Counterparty の DEX や第三者のウォレット・ディスペンサーで取引できるが、ゲームのルールを第三者が拡張する仕組みは確認できなかった。"
    s: [src-sog-site, src-sog-counterparty-forum]

compare:
  gameplay: {t: "カードでデッキを組み、アーケード的なタイミングでオーブ（呪文）を敵に放つ。トレーディングカードゲームと射撃の組み合わせ。", k: fact, s: [src-sog-btcmag-2015, src-sog-site]}
  necessity: {t: "チェーンが担うのは所有と移転だけで、ゲームの成立にチェーンは不要。チェーンの役割は、カードを運営のデータベース外で売買・保持できるようにし、発行数を公開的にロックすること。", k: analysis, s: [src-sog-counterparty-forum]}
  information: {t: "カードと通貨の保有・発行数は Counterparty 上で公開。ゲーム内の状態は非公開（サーバー）。", k: fact, s: [src-sog-counterparty-forum]}
  persistence: {t: "運営が停止してもカード資産自体は Bitcoin 上に残るが、ゲームとして遊ぶにはアプリとサーバーが必要。", k: analysis, s: [src-sog-counterparty-forum]}
  extensibility: {t: "第三者が拡張した例は見つからなかった。", k: unknown}
  money_flow: {t: "BitCrystals を 1 億枚発行予定で、うち 7000 万枚をトークンセールで販売し開発資金にした。ゲーム内ではカードパックや資産の取得に BitCrystals を使い、焼却または再利用する。", k: fact, s: [src-sog-btcmag-2015, src-sog-counterparty-forum]}
  entry_barrier: {t: "基本無料のモバイルゲームとして遊べ、カードをチェーンに出すときに Counterparty 対応のウォレットが必要になる（詳細な手順は未確認）。", k: analysis, s: [src-sog-site]}

concepts: [c-nft-asset, c-fungible-ingame-token, m-collectible-cards]

acquisition:
  audience: [players, holders]
  summary: {t: "最初の支持者は、前作 Moonga のプレイヤーと、Counterparty / Bitcoin の利用者だった。ゲーム公開（2017-04）の約 2 年前に、BitCrystals のトークンセール（2015-08）とオンチェーンのカード発行でこの人たちを集めた。最初の利用者はプレイヤーである前に、出資者でありカード保有者だった。", k: analysis, s: [src-sog-counterparty-forum, src-sog-bnc-sale-2015, src-sog-btcmag-2015]}
  steps:
    - {phase: pre, date: "2015-02-16", t: "EverdreamSoft が Counterparty フォーラムで、カードを Counterparty 資産にする計画と BitCrystals のトークンセールを公表した。前作 Moonga では、規約で禁じられていたのにプレイヤーがレアカードを 1000 ドル超で取引していたと書き、トークンセール前にサイトに登録した初期の支持者には BitCrystals を無料で配ると告知した。", k: fact, s: [src-sog-counterparty-forum], q: "We saw some of our players trading rare cards for more than 1000 USD, even if it was not allowed by the terms of service."}
    - {phase: pre, date: "2015-03-11", t: "最初のオンチェーンカード（FDCARD）を発行した。", k: fact, s: [src-sog-site]}
    - {phase: pre, date: "2015-05-09", t: "Bitcoin Magazine が Moonga シリーズのブロックチェーン利用を報じ、前作 Moonga を 25 万ダウンロード超と紹介した。", k: fact, s: [src-sog-btcmag-2015]}
    - {phase: pre, date: "2015-08-04", t: "BitCrystals のトークンセールを ShapeShift 経由で開始した（当初予定の Swarm は技術的問題で断念）。出資額に応じて限定カード（SATOSHICARD、GENESISCARD）や専用ストアへのアクセスを付け、開始 2 時間で 240 BTC が集まったと Brave New Coin は報じた。", k: fact, s: [src-sog-btcmag-sale, src-sog-bnc-sale-2015]}
    - {phase: pre, date: "2015-09", t: "セールは 2015-09-03 に終わり、934 BTC・約 1360 万 BitCrystals の配布、プレイヤー向け終身会員 181 件・パートナー向け 39 件と報じられた。試遊できる Alpha 0.1 も出ており、Counterparty の開発者（CoinDaddy の Jeremy Johnson）が試していると述べた。", k: fact, s: [src-sog-bnc-milestone-2015]}
    - {phase: pre, date: "2016-02", t: "iOS と Android でベータを始めた。Android 版は公式サイトから無料で入手でき、iOS 版はトークンセールの出資者に自動で配られ、それ以外は申請制だった。", k: fact, s: [src-sog-siliconangle-2016]}
    - {phase: launch, date: "2017-04-20", t: "ゲームを公開し、第 2 カードコレクションを始めた。", k: fact, s: [src-sog-site]}
  channels:
    - {id: existing-community, t: "前作 Moonga のプレイヤー（運営はカードの闇取引を観察していた）と、Counterparty の利用者・開発者を最初の層にした。", k: fact, s: [src-sog-counterparty-forum, src-sog-bnc-milestone-2015]}
    - {id: crypto-social, t: "計画の公表は Counterparty の公式フォーラムで行った。", k: fact, s: [src-sog-counterparty-forum]}
    - {id: token-incentive, t: "トークンセール前に公式サイトに登録した支持者に、BitCrystals を無料で配ると告知した。", k: fact, s: [src-sog-counterparty-forum]}
    - {id: invite-gating, t: "2016-02 のベータでは、iOS 版をトークンセールの出資者に自動で配り、それ以外の人は申請制にした。", k: fact, s: [src-sog-siliconangle-2016]}
    - {id: press, t: "Bitcoin Magazine、Brave New Coin、SiliconANGLE など暗号資産・テック系の媒体が、トークンセールとベータを報じた。", k: fact, s: [src-sog-btcmag-2015, src-sog-btcmag-sale, src-sog-bnc-sale-2015, src-sog-siliconangle-2016]}
  cost:
    - {t: "初期の資金は、トークンセールで BitCrystals を買った出資者が出した（Brave New Coin は 934 BTC、SiliconANGLE は 930 BTC 超・約 34.6 万ドルと記す）。資金はマルチシグで保管され、25% ずつ 4 段階で開発に充てるとされた。", k: fact, s: [src-sog-bnc-milestone-2015, src-sog-bnc-sale-2015, src-sog-siliconangle-2016]}
    - {t: "登録者への無料 BitCrystals や出資特典のカードは、運営が新規に発行したトークンとカードでまかなった。配布量は確認できなかった。", k: fact, s: [src-sog-counterparty-forum, src-sog-bnc-sale-2015]}
  after:
    - {t: "セール時に CEO が示した「公開後数か月で MAU 5 万」は見込みで、ゲームの公開は約 2 年後（2017-04-20）だった。実績の MAU・継続率は公表されていない。", k: fact, s: [src-sog-btcmag-sale, src-sog-site]}
    - {t: "公式サイトは 2023 年からの月額 NFT ルートボックスと BitCrystals のステーキングを掲載しており、運営は続いているが、利用者数は示されていない。", k: fact, s: [src-sog-site]}
  counter:
    - {t: "トークンセールで集まったのは主に BitCrystals の買い手で、プレイヤーになったかどうかは分からない。開始 2 時間の 240 BTC は、ゲームへの期待より、新しいトークンへの投機的な需要を反映している可能性がある。", k: analysis, s: [src-sog-bnc-sale-2015]}
    - {t: "Moonga のプレイヤーが SoG に移ったという直接のデータはない。Moonga の 25 万ダウンロードは前作の数字であり、SoG の利用者数ではない。", k: analysis, s: [src-sog-btcmag-2015]}
  lessons:
    - {t: "前作の闇取引を根拠にした資産化: 前作のプレイヤーが規約違反を承知でアイテムを高額取引していたという観察は、「所有と取引を公式化すれば需要がある」という仮説の根拠になる。効く条件は、前作に取引需要の証拠があること。破綻条件は、取引需要がゲームの継続的なプレイを意味しないことで、公開が 2 年遅れる間にトークン保有者とプレイヤーが分かれてしまう。", k: analysis}
    - {t: "出資者へのベータ優先配布: トークンセールの出資者にベータを自動で配ると、最初のテスターを確保できる。ただし、テスターが出資者に偏るので、ゲームの評価がトークン価格への関心と混ざる。", k: analysis}
  metrics: [m-sog-bcy-raise-2015, m-sog-bcy-sale, m-sog-mau-projection-2015, m-sog-moonga-downloads]
  unknowns:
    - "トークンセール前の登録者数と、無料で配った BitCrystals の量。"
    - "トークンセールの参加者数（終身会員の数は分かるが、出資者の総数は不明）。"
    - "2016-02 のベータと 2017-04 の公開時のプレイヤー数。"
    - "Moonga のプレイヤーのうち SoG に移った人の割合。"

