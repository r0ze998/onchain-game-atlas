id: dark-forest
name: Dark Forest
name_ja: ダーク・フォレスト
aliases: [DF, "Dark Forest v0.6"]
kind: game
depth: deep
updated: "2026-10-24"
links:
  website: https://zkga.me/
  x: https://x.com/darkforest_eth
  discord: https://discord.gg/2u2TN6v8r6
  github: https://github.com/darkforest-eth
  blog: https://blog.zkga.me/
chains: [Ethereum Ropsten (testnet), xDai / Gnosis Chain, Ethereum mainnet（賞品 NFT のみ）]
team: "Dark Forest team（Brian Gu / gubsheep ほか。後に 0xPARC が主な資金源）"
summary: >-
  zkSNARK を使い、公開台帳の上で「計算によってしか晴れない戦場の霧」を実現した宇宙征服型 RTS / MMO。
  惑星の座標はハッシュとしてのみチェーンに載り、移動の正当性はブラウザで生成した ZK 証明で示す。
  2020 年の Ropsten テストネットから xDai（Gnosis Chain）へ移り、期間限定のラウンド制で運営され、
  プラグイン・第三者クライアント・プレイヤー DAO・独自コントラクトを公認したことで、オンチェーンゲームの拡張文化の原型の一つになった。
selection_reason: >-
  ZK による秘匿情報をゲームの中心メカニクスとして実戦投入した代表例であり、同時に「ボット・自動化を公認したときに何が起きるか」
  「ラウンド制と管理者権限（アップグレード・停止・スコア操作）が残るオンチェーンゲームは何を約束できるか」を、
  公式ブログの各ラウンド報告とコードで追える数少ない事例だから。拡張が盛んだった一方で公式開発は 2022 年夏に休止しており、反例としても重要。
categories:
  - {id: onchain-rules, role: primary, reason: "移動・資源成長・戦闘・アーティファクトの判定がコントラクト（v0.6 では Diamond の各 facet）内で行われる"}
  - {id: zk, role: secondary, reason: "init / move / reveal などの zkSNARK 回路で座標を秘匿したまま行動の正当性を検証する"}
  - {id: aw, role: secondary, reason: "Lobbies により誰でもオンチェーンで自分の宇宙を展開でき、プレイヤー DAO や第三者コントラクトが周辺に生まれた"}
  - {id: infra, role: secondary, reason: "Ropsten の負荷問題から xDai へ移行し、RPC 負荷・ガス・コントラクトサイズ上限が設計を規定した"}
status:
  value: dormant
  as_of: "2026-10"
  note: >-
    公式の最後のラウンドは v0.6 Round 5（2022-02-18〜02-28）。2022-07 に公式チームが「ラウンド駆動の開発」を休止すると告知し、
    以後の公式ラウンドは確認できなかった。コミュニティラウンドや dfdao の派生モードは 2022 年に行われた。
    GitHub リポジトリは公開のまま残り、zkga.me はタイトルのみ表示（参照日時点）。「終了」と明言する一次資料は見つからないため dormant とした。
  s: [src-df-summer-break, src-df-r5-wrapup, src-df-github-org, src-df-zkgame-site]
dates:
  announced: {date: "2020-08-02", s: [src-df-announce], note: "公式ブログで v0.3 ベータを告知"}
  launched: {date: "2020-08", s: [src-df-announce, src-df-v3-rules], note: "v0.3 を Ropsten テストネットで開始。開始日は告知では 8/7、ルール記事では 8/8 と記載（contradictions 参照）"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      プレイヤー初期化・移動・惑星のアップグレード・シルバー引き出し・アーティファクトの発見と移動・捕獲ゾーンなどのルール判定はコントラクトで行われ、
      惑星のエネルギーやシルバーは時刻差分から遅延評価（LibLazyUpdate）される。座標そのものはチェーンに載らず MiMC ハッシュ（location ID）だけが保存され、
      移動時は zkSNARK 証明（移動距離・世界半径・ハッシュの一致・Perlin 値）がコントラクト上の Verifier で検証される。
      一方、地図の探索（座標のハッシュ総当たり）とその結果の地図データ、証明生成、描画はすべてオフチェーン（プレイヤーの端末）にある。
    s: [src-df-code-eth, src-df-code-circuits, src-df-init-circuit, src-df-announce]
  offchain:
    - {item: "地図の探索（座標空間のハッシュ総当たり）はブラウザまたはプレイヤーのサーバー・GPU マイナーで行う", s: [src-df-announce, src-df-r3-wrapup]}
    - {item: "zkSNARK 証明の生成はクライアント側（snarkjs / circom）", s: [src-df-init-circuit, src-df-naavik]}
    - {item: "公式クライアント（zkga.me）、プラグイン配信（plugins.zkga.me）、サブグラフ（The Graph）による読み取り", s: [src-df-plugins-repo, src-df-r3-announce]}
    - {item: "ホワイトリスト鍵の配布とメール・Discord での運営、賞品 NFT の請求手続き", s: [src-df-announce-v6, src-df-r5-wrapup]}
    - {item: "RPC エンドポイント（v0.4 で公開 RPC が過負荷になり、独自ノード指定を可能にした）", s: [src-df-v4-recap]}
  admin:
    level: significant
    detail: >-
      v0.6 のコントラクトは EIP-2535 Diamond で、所有者は diamondCut により機能を差し替えられる（Round 5 中に実際に修正に使ったと公式が記述）。
      DFAdminFacet には pause/unpause、任意惑星の所有者変更 (setOwner)、スコアの加減 (addScore / deductScore)、惑星の作成、世界半径の変更、資金引き出し (withdraw) があり、
      DFWhitelistFacet で参加者の鍵・アドレスを管理する。onlyWhitelisted が付くのは initializePlayer・revealLocation・捕獲ゾーン操作・giveSpaceShips で、
      move・withdrawSilver・アーティファクト操作などには付かない（ただし初期化に whitelist が必要なため、参加自体は実質 whitelist 制）。
      ゲームプレイ方針でも、重大なバグ修正のためのアップグレードとラウンドの早期終了の権利を運営が留保している。
    s: [src-df-code-eth, src-df-diamond, src-df-gameplay-policy]
  open_source:
    level: full
    detail: >-
      コントラクト（eth）、回路（circuits）、クライアント（client）、npm パッケージ、v0.3 / v0.6 一式が darkforest-eth 組織で公開されている。
      現在の主要リポジトリのライセンス表示は GPL-3.0。v0.5 告知時には MIT と記載されていた（contradictions 参照）。
    url: "https://github.com/darkforest-eth"
    s: [src-df-github-org, src-df-v05, src-df-code-eth]
  extensibility:
    level: client-mods
    detail: >-
      v0.5 でクライアント内プラグイン機構を導入し、df / ui オブジェクト経由でゲーム操作と描画を拡張できた（例: Repeat Attack、Wage War、Heatmap、Distribute Silver）。
      コントラクトは誰でも呼べるため、第三者コントラクト（アーティファクト市場 darkforest.market・DarkSea・dropswap.gg、dfdao の Astral Colossus、Nightmarket の座標売買）も作られた。
      Lobbies により誰でも xDai を払って自分の宇宙（Diamond のコピー）を所有者として展開できた。ただし公式宇宙のルール自体を第三者が書き換えることはできない。
    s: [src-df-plugins-contest, src-df-r3-wrapup, src-df-r4-wrapup, src-df-lobbies, src-df-nightmarket, src-df-code-eth]

compare:
  gameplay: {t: "手続き生成された 2 次元宇宙で、惑星間にエネルギーを送って占領・強化し、ラウンドごとに定められた得点（シルバー引き出し、中心への接近、捕獲ゾーンなど）を競う実時間戦略ゲーム。", k: fact, s: [src-df-announce, src-df-announce-v6, src-df-r3-wrapup, src-df-r5-announce]}
  necessity: {t: "秘匿座標を公開台帳上で検証可能にするという中心の主張は、第三者（他プレイヤー・ボット・コントラクト）が運営なしで同じルールを検証・利用できる点にオンチェーン化の意味がある。ただし運営は停止・アップグレード・スコア操作の権限を保持しており、運営を信頼しなくてよいゲームにはなっていない。", k: analysis, s: [src-df-announce, src-df-code-eth]}
  information: {t: "惑星座標は MiMC ハッシュとしてのみ公開され、他者の位置は座標空間をハッシュ総当たりすることでしか分からない。行動そのもの（どのハッシュからどのハッシュへの移動か）は公開される。座標を公開する revealLocation もある。", k: fact, s: [src-df-announce, src-df-init-circuit, src-df-code-eth]}
  persistence: {t: "コントラクトとコードは公開されており、Lobbies やコミュニティラウンドで第三者が宇宙を再展開できた。一方、各ラウンドの宇宙は期間限定で、アーティファクトはラウンド・インスタンス間で使えなかったと第三者分析は指摘する。", k: fact, s: [src-df-lobbies, src-df-community-round, src-df-naavik]}
  extensibility: {t: "クライアントプラグイン（公式ショーケースに 57 件のディレクトリ）、第三者クライアント・マイナー、公開コントラクトを呼ぶ第三者コントラクト、Lobbies による宇宙の展開が可能だった。", k: fact, s: [src-df-plugins-repo, src-df-r3-wrapup, src-df-lobbies]}
  money_flow: {t: "代替可能トークンはなく、賞金は運営・寄付者負担（v0.3/v0.5 は 1024 DAI、v0.6 は上位 63 名へ mainnet の惑星 NFT）。プレイヤーは xDai で HAT（見た目）を購入でき、開発資金は Gitcoin Grants と 0xPARC が主（プラグイン機構には Ethereum Foundation の助成もあったと開発者が記す）。", k: fact, s: [src-df-v3-rules, src-df-v05, src-df-announce-v6, src-df-df05-faq, src-df-holiday, src-df-lobbies]}
  entry_barrier: {t: "ホワイトリスト鍵が必要（前ラウンドで得点した者・待機リストの抽選等）。ブラウザ内のバーナーウォレットと少額の xDai 配布で最初の数十手は拡張機能なしで遊べたが、上位争いは探索用の計算資源とスクリプト作成能力に強く依存した。", k: fact, s: [src-df-df04-faq, src-df-announce-v6, src-df-r1-wrapup]}

concepts: [c-zk-hidden-info, m-fog-of-war, c-onchain-rules, c-onchain-state, c-client-plugins, m-bot-automation, m-seasons, c-own-chain, c-onchain-randomness, c-nft-asset, m-pvp-territory, e-grants-subsidy, c-autonomous-world]
proposed_concepts:
  - {id: m-computational-exploration, name: 計算による探索（ハッシュ総当たりの地図）, desc: "秘匿座標のハッシュを総当たりすることで地図を開く。探索速度がプレイヤーの計算資源に比例する。"}
  - {id: c-forkable-instance, name: 誰でも展開できるゲームインスタンス（Lobbies）, desc: "公式と同じルールのコピーを誰でもオンチェーンに展開し、設定を変えて運営できる。"}

article:
  what:
    - {t: "プレイヤーは手続き生成された宇宙のどこかにある自分の母星から始め、惑星から惑星へエネルギーを送って未占領・他者の惑星を奪い、惑星をアップグレードして版図を広げる。", k: fact, s: [src-df-announce, src-df-df04-faq]}
    - {t: "他者の惑星の位置は最初は見えない。座標はハッシュとしてしかチェーンに載らず、プレイヤーは自分の端末で座標空間を総当たりしてハッシュを照合し、地図を少しずつ「掘り」出す。", k: fact, s: [src-df-announce], q: "This construction introduces a fog of war that can only be uncovered by computation."}
    - {t: "宇宙は Perlin ノイズで配置された種類の異なる領域（NEBULA・SPACE・DEEP SPACE・DEAD SPACE）に分かれ、v0.4 ではプレイヤーは最も安全な NEBULA に出現し、暗い領域ほど希少で強い惑星がある。小惑星帯でシルバーが採れ、アップグレードや得点に使う。", k: fact, s: [src-df-df04-faq, src-df-naavik]}
    - {t: "勝敗は期間限定ラウンドの得点で決まり、得点規則はラウンドごとに変わった（v0.3 は上位 10 惑星の人口容量＋シルバーの 10%、v0.6 R1 は引き出したシルバー量、R3 は中心への接近、R5 は捕獲ゾーン等）。", k: fact, s: [src-df-v3-rules, src-df-announce-v6, src-df-r3-wrapup, src-df-r5-announce]}
    - {t: "v0.5 以降、惑星で見つかるアーティファクト（NFT）が加わり、v0.6 ではワームホールや Photoid Cannon などの効果を持つものが追加された。", k: fact, s: [src-df-v05, src-df-announce-v6]}
  loop:
    - {t: "以下は公式ブログ・FAQ・コードからの再構成（筆者は実プレイしていない）。ホワイトリスト鍵を入力するとブラウザ内にバーナーウォレットが作られ、少額の xDai が配られる。", k: fact, s: [src-df-df04-faq, src-df-df05-faq]}
    - {t: "クライアントが母星候補の座標を探し、init 回路で「座標のハッシュが h であり、世界半径内にある」ことを証明して initializePlayer を送る。", k: fact, s: [src-df-init-circuit, src-df-code-eth]}
    - {t: "探索（マイナー）を走らせて周囲の座標をハッシュし、既存惑星のハッシュと照合して地図を広げる。見つけた惑星にエネルギーを送る move では、移動元・移動先のハッシュ、移動距離が上限以下であること、移動先の Perlin 値を証明する。", k: fact, s: [src-df-code-circuits, src-df-announce]}
    - {t: "到着したエネルギーが守備を上回れば惑星を奪う。資源はブロック時刻から遅延評価で増え、シルバーでアップグレードし、ラウンドの得点条件（例: スペースタイム・リップでのシルバー引き出し）を満たす行動を数日〜2 週間繰り返す。", k: fact, s: [src-df-code-eth, src-df-announce-v6]}
    - {t: "上位プレイヤーの多くはこの一巡をプラグイン・スクリプト・専用サーバーで自動化していた（v0.6 R1 の 1 位は独自プラグイン・スクリプト・サーバーを使用）。ただし同じ R1 の 2 位 Ner0nzz は「ほぼ完全に手動」で、Twitter 外交で地図データと同盟を得たと公式は記す。", k: fact, s: [src-df-r1-wrapup]}
  before_after:
    - {t: "公開台帳では全状態が誰にでも読めるため、戦場の霧のような不完全情報ゲームはオンチェーンでは作りにくかった。Dark Forest は「座標を秘匿したまま行動が正しいことだけを証明する」構成でこれを可能にしたと主張した。", k: claim, who: "Dark Forest team", s: [src-df-announce], q: "With zkSNARKs, players can keep private state while publicly submitting verifiably-valid actions."}
    - {t: "それ以前の Ethereum ゲームの多くが資産（NFT）だけをチェーンに置いたのに対し、移動・戦闘の判定そのものをコントラクトに置いた点で異なる。ただし「世界初」と言える直接の根拠はこの調査では確認していない。", k: analysis}
    - {t: "当時、Perlin ノイズの SNARK 証明生成は 1 年前には数分かかっていたが数秒になったと運営は述べており、ブラウザで遊べる速度の ZK 証明が成立したことが前提条件だった。", k: claim, who: "Dark Forest team", s: [src-df-v4-recap]}
    - {t: "運営は ZK 回路の解説記事を公開し、circom / snarkjs（iden3）を使った実装をエンジニア向けに説明した。", k: fact, s: [src-df-init-circuit]}
  onchain_tradeoffs:
    - {t: "生まれた遊び: 地図を開く速度が計算資源に比例するため、GPU マイナーの開発、地図データやハッシュ計算力の売買といったメタ経済が生まれた。", k: fact, s: [src-df-r2-wrapup, src-df-r3-wrapup]}
    - {t: "生まれた遊び: 秘匿座標を ZK で証明しつつ売る Nightmarket のように、秘匿情報そのものを取引対象にする第三者プロトコルが作られた。", k: fact, s: [src-df-nightmarket]}
    - {t: "増えた不便: v0.3 は約 300 人で Ropsten テストネットをほぼ破綻させ、v0.4 は xDai の公開 RPC を過負荷にして招待を一時停止した。運営は Ethereum mainnet では現状のガス使用量では運用不能と述べた。", k: fact, s: [src-df-v4-recap, src-df-df05-faq], q: "Dark Forest v0.3 nearly broke the Ropsten test network, with only ~300 players."}
    - {t: "増えた不便: 各手は数秒の確定待ちがあり、反射神経を要する設計は避けるべきだと第三者分析は指摘した。また証明生成コストのため、コントラクトが自律的に最も基本の行動（エネルギー送出）を行えないと述べている。", k: claim, who: "Naavik (Anthony Pecorella)", s: [src-df-naavik], q: "smart contracts cannot do the most fundamental action in the game — sending energy"}
    - {t: "増えた不便: コントラクトサイズ上限のため機能追加のたびに分割・ライブラリ化が必要になり、v0.6 R5 前に Diamond 標準へ移行した。", k: claim, who: "Blaine Bublitz (Dark Forest team)", s: [src-df-diamond], q: "In previous rounds, adding new features was quite complex due to hitting contract size limits."}
    - {t: "オンチェーンの擬似乱数に依存したアーティファクトのレア度決定は、v0.5 で入力が予測・操作可能だった（ブロック時刻を使うはずが惑星 ID を二重に使うバグもあった）ため、事前計算と手数の調整で伝説級を狙って出す攻略がゲストポスト（Blaine Bublitz、後の公式チームメンバー）で公開された。", k: fact, s: [src-df-minting-exploit]}
  roles:
    - {t: "運営: ラウンドの設計・展開、ホワイトリスト管理、賞品授与、バグ時のアップグレードや早期終了の判断を担った。自動化・欺瞞・買収は公認する一方、明らかに非紳士的な悪用は避けるよう求めた。", k: fact, s: [src-df-gameplay-policy], q: "As always, automation, deception, bribery, and other legal out-of-band behavior is fair game."}
    - {t: "プレイヤー: 個人に加え、dfdao・orden_gg・MarrowDAO・P_DAO などの集団が登場し、帝国や鋳造所の寄付（R2）、DAO 契約への資源集約（R4 の Astral Colossus）、ボイスチャットでの常時協調（R5 の P_DAO）で上位を争った。", k: fact, s: [src-df-r2-wrapup, src-df-r4-wrapup, src-df-r5-wrapup]}
    - {t: "開発者（第三者）: プラグイン作者、アーティファクト市場、サブグラフ、DFWiki、リモートマイナー等の作者が「特別賞」の NFT で報いられた。運営はプレイヤーのツール作りを、プレイヤーが所有するゲームの中心と位置づけた。", k: fact, s: [src-df-r1-wrapup, src-df-r3-wrapup, src-df-v4-recap]}
    - {t: "エージェント: v0.6 では高レアのアーティファクトが GPT-3 で動く AI だと告知され、R3 では AI ボットのプラグインが公開された。ただしそれらがどの程度プレイに使われたかは確認できなかった。", k: fact, s: [src-df-announce-v6, src-df-r3-wrapup]}
    - {t: "資金提供者: Gitcoin Grants の寄付と 0xPARC。運営は利益ではなく学びが動機だと述べた（第三者記事内の発言引用）。", k: claim, who: "Ivan Chub（Hard Mode First の記事内引用）", s: [src-df-holiday, src-df-hardmode]}
  trajectory:
    - {t: "2020-08 に v0.3（Ropsten、1 週間、賞金 1024 DAI）。2020-10 に v0.4 で xDai へ移行。2020-12-25 に v0.5（プラグイン機構と NFT アーティファクト）。", k: fact, s: [src-df-announce, src-df-v3-rules, src-df-v4-recap, src-df-v05]}
    - {t: "v0.6 は 2〜3 か月にわたる複数ラウンド制として 2021-05 に開始し、R1（05-22〜06-06）から R5（2022-02-18〜02-28）まで 5 ラウンドを実施した。", k: fact, s: [src-df-announce-v6, src-df-r3-announce, src-df-r4-announce, src-df-r5-announce]}
    - {t: "2022-02 に Diamond 標準へ移行、2022-03 に Lobbies を公開し、誰でも自分の宇宙を展開できるようにした。2022-04 にはコミュニティラウンドの開催指針を公開した。", k: fact, s: [src-df-diamond, src-df-lobbies, src-df-community-round]}
    - {t: "2022-07、運営はラウンド駆動の開発を夏の間休止し、コア開発者は 0xPARC の他プロジェクトに参加すると告知した。年内に次の段階を発表するとしたが、その後の公式ラウンドは確認できなかった。", k: fact, s: [src-df-summer-break], q: "taking a break from round-driven development this summer."}
    - {t: "コミュニティ側では dfdao が 2022-01 の新年コミュニティラウンド、2022-06〜07 の Arena: Grand Prix、Galactic League を運営した。", k: fact, s: [src-df-community-round, src-df-fgw-dfdao]}
  retention_evidence:
    - {t: "示されている指標: 運営発表の参加者数は v0.3 約 300、v0.4 約 600、v0.6 R1 で 1700 強（ホワイトリスト数）、R2 約 1900、R3 2500 超、R4 1700 超、R5 約 2000（定義は回ごとに異なる）。", k: fact, s: [src-df-v4-recap, src-df-r1-wrapup, src-df-r2-wrapup, src-df-r3-wrapup, src-df-r4-wrapup, src-df-r5-wrapup]}
    - {t: "ラウンド間の再参加の手がかりとして、次ラウンドの招待鍵を得た人数（R1 700、R2 800、R3 約 1000、R4 750 超）が公表されている。ただしこれは「資格を得た人数」であり、実際に次ラウンドへ参加した人数ではない。", k: fact, s: [src-df-r1-wrapup, src-df-r2-wrapup, src-df-r3-wrapup, src-df-r4-wrapup]}
    - {t: "orden_gg は R5 時点で 1 位を 4 回（うち 1 回は同点）重ねており（R5 の振り返りによる。どの回かは明記なし）、ベテラン集団の継続参加を示す。Discord は 2021-12 時点で 8000 人超と運営は述べた。", k: fact, s: [src-df-r3-wrapup, src-df-r4-wrapup, src-df-r5-wrapup, src-df-holiday]}
    - {t: "示されていない指標: 一意ウォレット単位の継続率、ラウンド内の DAU、ボット口座と人間の比率、複数アカウント保有の程度、取引のうち自動化によるものの割合は公表されていない。", k: unknown}
    - {t: "参加者数はホワイトリストによる供給制限下の数字であり、需要（待機リストの人数）は数千の招待鍵を配ったこと以外分からない。", k: analysis, s: [src-df-announce-v6]}
  extensions:
    - {t: "v0.5 プラグインコンテストの受賞作: 定期移動を設定する Repeat Attack、指定プレイヤーへの自動戦争を行う Wage War、領土のヒートマップ、テーマ変更、シルバー自動分配。", k: fact, s: [src-df-plugins-contest]}
    - {t: "公式プラグイン・ショーケース（GitHub）には artifacts / casual / diplomacy / productivity / strategic / utilities の 6 分類で計 57 のプラグインディレクトリがある（clone 時点の数え上げ）。", k: fact, s: [src-df-plugins-repo]}
    - {t: "第三者コントラクト: 初の第三者コントラクト（jacobrosenthal・phated、R1）、owocki のメタゲーム懸賞（R1）、darkforest.market・DarkSea・dropswap.gg のアーティファクト市場（R3）、dfdao の Astral Colossus（R4、38 位）。", k: fact, s: [src-df-r1-wrapup, src-df-r3-wrapup, src-df-r4-wrapup]}
    - {t: "第三者による周辺基盤: サブグラフ、GPU 宇宙マイナー（MarrowDAO、ceccon_me）、MEV を使うプラグインの検討、Project Sophon のエクスプローラ、DFWiki、開発ガイド。", k: fact, s: [src-df-r2-wrapup, src-df-r3-wrapup, src-df-r4-wrapup]}
    - {t: "Lobbies とコミュニティラウンド: 約 0.06 xDai で 30 超の設定項目を持つ自分の宇宙を展開でき、277DAO・MarrowDAO・dfdao・Ner0nzz らが運営した。dfdao は Arena: Grand Prix など短時間モードを作った。", k: fact, s: [src-df-lobbies, src-df-community-round, src-df-summer-break, src-df-fgw-dfdao]}
  constraints:
    - {t: "管理者権限が大きい: Diamond の差し替え、停止、任意惑星の所有者変更、スコアの加減がコントラクト上で可能。プレイヤーが得る保証は運営の自制と DiamondCut イベントによる監視可能性に依存する。", k: fact, s: [src-df-code-eth, src-df-diamond]}
    - {t: "プラグインはゲーム内で評価され、秘密鍵を含む全情報にアクセスできると公式リポジトリ自体が警告しており、拡張性とウォレット安全性が衝突していた。", k: fact, s: [src-df-plugins-repo], q: "Plugins are evaluated in the context of your game and can access all of your private information (including private key!)."}
    - {t: "探索が計算資源の競争になるため、GPU やサーバーを持つプレイヤーと自動化に長けた集団が有利になる。v0.6 R1 の 1 位は独自プラグイン・スクリプト・サーバーを使った。", k: fact, s: [src-df-r1-wrapup, src-df-r3-wrapup]}
    - {t: "オンチェーン乱数の設計ミスが攻略可能だった（v0.5 の artifact minting）。筆者は、時刻を使う修正で JS プラグインからの攻略はほぼ不可能になるが、コントラクトから遊ぶ「contract player」なら結果が悪いとき revert できるはずだと推測している（本人は未実装と明記）。", k: claim, who: "Blaine Bublitz（ゲストポスト筆者）", s: [src-df-minting-exploit]}
    - {t: "アーティファクトや惑星 NFT はラウンド・インスタンスをまたいで使えず、トロフィー NFT は 2022-03 以降取引がないと第三者分析は述べた。", k: claim, who: "Naavik (Anthony Pecorella)", s: [src-df-naavik]}
    - {t: "未解決: 期間限定ラウンドの外で、公式の継続運営なしに「永続する」宇宙が成立するかは、Lobbies 以後の利用状況が不明なため検証できない。", k: unknown}
  principles:
    - {t: "ハッシュ化座標＋移動証明による霧: 位置を MiMC 等のハッシュで公開し、移動距離・範囲を ZK で証明すれば、検証可能なまま位置を隠せる。適用条件は座標空間が総当たりに対して十分広く、証明生成がクライアントで数秒以内に済むこと。破綻条件は空間が狭い・計算資源の格差が大きい場合で、霧は「計算力の差」に置き換わり、GPU を持つ側だけが晴らせる。", k: analysis, s: [src-df-announce, src-df-code-circuits, src-df-r3-wrapup]}
    - {t: "自動化の公認＋ラウンドごとの得点規則変更: ボットやスクリプトを禁止せず、ラウンドごとに得点規則を変えて既存の最適化を陳腐化させると、ツール作りそのものが競技になる。適用条件は第三者がツールを作れる公開 API・コードがあること。破綻条件は同一集団が知識とインフラを蓄積して勝ち続ける場合（orden_gg は R5 時点で 1 位 4 回、うち 1 回は同点）で、新規参加者の勝ち目が消える。", k: analysis, s: [src-df-gameplay-policy, src-df-r3-wrapup, src-df-r5-wrapup]}
    - {t: "クライアント内プラグインによる拡張: ゲームの状態と操作を JS オブジェクトとして公開し、プラグインを共有させると、UI 改善・自動化・可視化が短期間で集まる。適用条件は審査済みショーケースなど信頼の経路があること。破綻条件はプラグインが秘密鍵へアクセスできるサンドボックス不在の設計で、悪意あるプラグインが資産を奪い得る。", k: analysis, s: [src-df-plugins-repo, src-df-plugins-contest]}
    - {t: "誰でも展開できるインスタンス（Lobbies）: ルール実装をコントラクトとして公開し、設定だけを変えたコピーを誰でも所有者として展開できるようにすると、運営が休止してもコミュニティが遊び場を作れる。適用条件は展開コストが低い（約 0.06 xDai）チェーン。破綻条件は資産や得点がインスタンス間で通用しない場合で、各インスタンスは孤立し、累積的な価値が生まれにくい。", k: analysis, s: [src-df-lobbies, src-df-naavik]}
    - {t: "秘匿情報の二次市場: ZK で「知っていること」を証明しながら売れるなら、情報そのものが取引財になる（Nightmarket）。適用条件は秘匿情報がゲーム上の価値を持つこと。破綻条件は回路・コントラクトが未監査で、買い手が詐欺リスクを負う場合。", k: analysis, s: [src-df-nightmarket]}
  counter_evidence:
    - {t: "拡張文化が盛んだったにもかかわらず、公式開発は 2022 年夏に休止し、その後の公式ラウンドは確認できなかった。プラグインや第三者コントラクトの豊富さは、ゲームの継続を保証しなかった。", k: fact, s: [src-df-summer-break]}
    - {t: "参加者数（最大 2500 超）は招待制で上限があり、第三者分析は 14 日間のラウンドの総アクティブ数が Axie Infinity の同時接続より少ないと述べた。ZK・オンチェーンという設計の意義は、大衆的な定着の証拠とは別物である。", k: claim, who: "Naavik (Anthony Pecorella)", s: [src-df-naavik]}
    - {t: "「他者が作った機能の再利用」の観点では、プラグインは主に個々のプレイヤーの自動化・UI 改善であり、他者のプラグインは秘密鍵リスクから「自分か完全に信頼できる人のもの以外使うな」と公式が警告した。再利用は信頼の問題で制限されていた。", k: fact, s: [src-df-plugins-repo]}
    - {t: "第三者コントラクトが世界のルールに参加する例（Astral Colossus）も、証明生成ができないため自ら移動できなかったと第三者分析は推測しており、オンチェーン合成可能性は ZK 部分で途切れていた。一方で公式報告では Astral Colossus は 38 位に入っており、効果の評価は分かれる。", k: claim, who: "Naavik (Anthony Pecorella)", s: [src-df-naavik, src-df-r4-wrapup]}
    - {t: "R5 では dfdao が母船 10 隻を 1 惑星に集めるエネルギー農場を作り、公平性をめぐる論争が起きた。自動化・創発を公認する方針は、プレイヤーが「意図に反する」と感じる戦略も生む。", k: fact, s: [src-df-r5-wrapup]}
    - {t: "上位が自動化だけで決まったわけではない。v0.6 R1 の 2 位 Ner0nzz はほぼ手動で、外交により地図データと同盟を集めたと公式は記す。「自動化を公認すると計算資源の競争になる」という一般化には例外がある。", k: fact, s: [src-df-r1-wrapup]}
    - {t: "「アーティファクトはラウンド間で使えず孤立する」という第三者分析に対し、R4 では orden_gg の dropswap.gg が任意のラウンドのアーティファクトを閲覧・送付できるよう更新されたと公式は記す（ゲーム内で使えたかは未確認）。", k: fact, s: [src-df-r4-wrapup, src-df-naavik]}
    - {t: "拡張文化は当初からの設計方針ではなかった可能性がある。コア貢献者 Ivan Chub は、ゲームがフォークされたとき当初は腹を立てたが、それを強みとして受け入れることにしたと講演で述べた（第三者記事内の引用）。", k: claim, who: "Ivan Chub（Hard Mode First の記事内引用）", s: [src-df-hardmode]}
    - {t: "ZK による霧が遊びの中心だったかどうかについては、上位争いが探索 GPU・自動化・集団協調で決まっていた記述が多く、プレイヤー体験の中心が「霧の駆け引き」より「計算とツールの競争」だった可能性がある。", k: analysis, s: [src-df-r1-wrapup, src-df-r3-wrapup]}

acquisition:
  audience: [players, developers]
  summary: {t: "最初のプレイヤーは、開発者 Brian Gu（gubsheep）が 2019 年から関わっていた Ethereum Foundation のワークショップや Semaphore 周辺の ZK 研究者と、内部 alpha プレイテストの参加者だった。v0.3 は「Ethereum と ZK のコミュニティ」へ招待鍵を配る半非公開ベータとして始まり、以後も鍵の供給量（待機リストへの約 1000 本、v0.6 の数千本、得点者への次ラウンド鍵）で参加者数を段階的に増やした。", k: analysis, s: [src-df-zkpodcast-141, src-df-v3-rules, src-df-v05, src-df-announce-v6, src-df-r1-wrapup]}
  steps:
    - {phase: pre, date: "2019", t: "Dark Forest は MIT の学部生 Brian Gu のプロジェクトとして始まり、2019 年の最初の版の盤面は 1 次元の輪だった（第三者分析）。", k: fact, s: [src-df-naavik]}
    - {phase: pre, date: "2019", t: "Brian Gu は Ethereum Foundation のワークショップで Wei Jie・Kobi・Barry と知り合い、2019 年秋に Dark Forest と並行して Semaphore の trusted setup 用ツールを調べたと語った。学部生を EF のワークショップに連れて行っているとも述べている。", k: claim, who: "Brian Gu（ZK Podcast 141）", s: [src-df-zkpodcast-141], q: "I met Wei Jie and Kobi and Barry at some of these workshops as well"}
    - {phase: pre, t: "公開前に 1 回のプレイテストと内部 alpha プレイテストを行い、直近のプレイテストでは参加者の Kobi が MiMC ハッシュを並列計算するコードを書いて誰よりも速く惑星を見つけたと開発者は語った（2020-08-05 公開の回で、収録は公開の約 2 週間前。プレイテストの日付は不明）。", k: claim, who: "Brian Gu（ZK Podcast 141）", s: [src-df-zkpodcast-141], q: "We did run one play test earlier in, and we've been running some like more like alpha kind of like internal play tests as well."}
    - {phase: pre, date: "2020-08-02", t: "公式ブログで v0.3 を「ホワイトリスト制・半非公開」のベータとして告知し、賞金 1024 DAI を用意した。更新はブログ購読と Twitter で知らせるとした。", k: fact, s: [src-df-announce], q: "This beta will be whitelisted and semi-private, and includes only a limited featureset."}
    - {phase: pre, date: "2020-08-03", t: "ルール記事で、招待鍵を Ethereum と ZK のコミュニティのプレイヤーに開始前から期間中にかけて配ると説明した。鍵は譲渡でき、複数の鍵を自分で使ってもよく、追加の鍵を公開配布することもあり、欲しい人はメーリングリスト登録か Twitter のフォローを求められた。", k: fact, s: [src-df-v3-rules], q: "We’ll be distributing invite keys to players in the Ethereum and ZK communities"}
    - {phase: pre, date: "2020-08-05", t: "ZK 研究者向けポッドキャスト Zero Knowledge の回「ZK & Games: Dark Forest with Brian Gu」が公開され、ZK による戦場の霧と 8 月 7 日の開始予定が紹介された。", k: fact, s: [src-df-zkpodcast-141]}
    - {phase: launch, date: "2020-08", t: "v0.3 を Ropsten テストネットで 1 週間実施し、約 300 人で Ropsten をほぼ破綻させたと運営は振り返った。", k: fact, s: [src-df-v3-rules, src-df-v4-recap]}
    - {phase: launch, date: "2020-10", t: "v0.4 を xDai で実施し、参加者は約 600 人。公開 RPC の過負荷で週の途中に追加の招待送付を止めた。質問対応は Telegram で行われた。", k: fact, s: [src-df-v4-recap], q: "we had to put a pause on sending out additional invitations midway through the week"}
    - {phase: growth, date: "2020-12-25", t: "v0.5 で約 1000 本の招待鍵を待機リストへ送り、プラグイン機構を導入した。2021-02 にはプラグインコンテストの受賞作を発表した。", k: fact, s: [src-df-v05, src-df-plugins-contest], q: "We’re sending out about 1000 invite keys to the waitlist."}
    - {phase: growth, date: "2021-05-21", t: "v0.6 では開始数日で数千本の招待鍵を Ethereum コミュニティの人々に送り、メーリングリストと Twitter・Discord・Twitch での無作為な鍵配布も続け、R1 で得点 1 以上の人に次ラウンドの鍵を与えるとした。道具を作るプレイヤー向けに Developer Grants も予告した。", k: fact, s: [src-df-announce-v6], q: "Several thousand invite keys will be sent out to Ethereum community members over the first few days of the round."}
    - {phase: growth, date: "2021-06", t: "R1 のホワイトリスト登録は 1700 強で、700 人がシルバーを 1 以上引き出して次ラウンドの鍵を得た。以後 R2 約 1900、R3 2500 超と運営は発表した。", k: fact, s: [src-df-r1-wrapup, src-df-r2-wrapup, src-df-r3-wrapup]}
    - {phase: growth, date: "2021-12", t: "運営は Discord が 8000 人超、直近の Gitcoin Grants で 1 万人超から約 17.5 万ドルを集めたと述べ、ギルド・DAO の急拡大に触れた。", k: fact, s: [src-df-holiday]}
    - {phase: growth, date: "2022-03", t: "Lobbies とコミュニティラウンドの指針を公開し、宇宙を開いて人を集める役割を dfdao・277DAO・MarrowDAO などプレイヤー集団にも開いた。", k: fact, s: [src-df-lobbies, src-df-community-round]}
  channels:
    - {id: existing-community, t: "v0.3 の招待鍵は Ethereum と ZK のコミュニティに、v0.6 の数千本は Ethereum コミュニティの人々に配られ、開発者自身も EF のワークショップや Semaphore 周辺の研究者とつながっていた。", k: fact, s: [src-df-v3-rules, src-df-announce-v6, src-df-zkpodcast-141]}
    - {id: invite-gating, t: "全ラウンドがホワイトリスト制で、待機リストへの約 1000 本（v0.5）や得点者への次ラウンド鍵（v0.6）のように鍵の配り方で参加者の数と顔ぶれを決めた。v0.4 では負荷のため送付を止めた。", k: fact, s: [src-df-announce, src-df-v05, src-df-announce-v6, src-df-r1-wrapup, src-df-v4-recap]}
    - {id: prize-competition, t: "v0.3 と v0.5 は 1024 DAI の賞金、v0.6 は上位 63 名に Ethereum mainnet の惑星 NFT を賞品にした期間限定ラウンドとして開催した。", k: fact, s: [src-df-v3-rules, src-df-v05, src-df-announce-v6]}
    - {id: builder-grants, t: "v0.6 で道具を作るプレイヤー向けの Developer Grants を予告し、各ラウンドでプラグイン・第三者コントラクト・ツールの作者に特別賞の NFT を授与した。", k: fact, s: [src-df-announce-v6, src-df-r1-wrapup, src-df-r3-wrapup]}
    - {id: crypto-social, t: "鍵の入手方法としてメーリングリストと Twitter のフォローを案内し、v0.6 では Twitter・Discord・Twitch で無作為に鍵を配った。", k: fact, s: [src-df-v3-rules, src-df-announce-v6]}
    - {id: content-research, t: "ZK 回路のエンジニア向け解説記事を公開し、開始直前には ZK 研究者向けポッドキャストに開発者が出演した。", k: fact, s: [src-df-init-circuit, src-df-zkpodcast-141]}
    - {id: community-server, t: "v0.6 では Discord でも無作為に招待鍵を配り、Discord を鍵の入手経路の一つにした。v0.4 の Telegram（質問対応・コード共有）や 2021-12 の Discord 8000 人超は参加後の場の規模であり、獲得経路だったことを示すものではない。", k: fact, s: [src-df-announce-v6, src-df-v4-recap, src-df-holiday]}
    - {id: composability, t: "v0.5 のプラグイン機構とプラグインコンテスト以後、プレイヤーがプラグイン・市場・マイナーなどを作って配る場ができ、gubsheep は Dark Forest で暗号資産や ZK を知った参加者が ZK の生態系に貢献するようになったと述べた。", k: claim, who: "gubsheep（ZK Podcast 225）", s: [src-df-plugins-contest, src-df-r3-wrapup, src-df-zkpodcast-225], q: "a number of our community members who have discovered either crypto or specifically ZK through Dark Forest"}
  cost:
    - {t: "賞金・賞品は運営側が用意した（v0.3/v0.5 は 1024 DAI、v0.6 は mainnet の惑星 NFT）。告知記事は出資者を明記していないが、v0.6 告知は「これまで完全にコミュニティの寄付で支えられてきた」と述べる。", k: fact, s: [src-df-v3-rules, src-df-v05, src-df-announce-v6], q: "So far, Dark Forest has been entirely supported by community contributions."}
    - {t: "開発と運営の原資は Gitcoin Grants の寄付（2021 年末の直近ラウンドで 1 万人超から約 17.5 万ドル）と 0xPARC（主な資金源）で、0xPARC は寄付と助成だけで運営されていると gubsheep は述べた。", k: fact, s: [src-df-holiday, src-df-zkpodcast-225]}
    - {t: "v0.4・v0.5 の FAQ は、参加者のバーナーウォレットに約 0.05 ドル分の xDAI を自動で送り（「最初の数十手」分）、ガス代の一部を運営が負担したと説明する。v0.6 の告知にはこの記載はない。", k: fact, s: [src-df-df04-faq, src-df-df05-faq]}
    - {t: "賞金・賞品と寄付で原資をまかない、参加費やゲーム内の代替可能トークンを確認できなかったため、後から来た参加者が先行者に払う構造は見当たらない。", k: analysis, s: [src-df-v3-rules, src-df-announce-v6]}
  after:
    - {t: "運営発表の参加者数は v0.3 約 300 → v0.4 約 600 → v0.6 R1 1700 強 → R3 2500 超 → R5 約 2000 と推移した。ただし定義は回ごとに異なり、一意ウォレット単位の継続率は公表されていない。", k: fact, s: [src-df-v4-recap, src-df-r1-wrapup, src-df-r3-wrapup, src-df-r5-wrapup]}
    - {t: "次ラウンドの鍵を得た人数（R1 700、R2 800、R3 約 1000、R4 750 超）は再参加の「資格」を示すだけで、実際に戻った人数は示されていない。", k: fact, s: [src-df-r1-wrapup, src-df-r2-wrapup, src-df-r3-wrapup, src-df-r4-wrapup]}
    - {t: "残った層は上位プレイヤーの集団化として見える。dfdao の Will Robinson はリーダーボード上位者に Twitter の DM で声をかけて DAO を作り、orden_gg は R5 時点で 1 位を 4 回（うち 1 回は同点）重ねていた。", k: fact, s: [src-df-hardmode, src-df-r5-wrapup]}
    - {t: "初期の参加者から開発側に移った例がある。gubsheep は v0.4 で上位 2 人の一人だった Blaine が ZK の生態系に大きく貢献したと述べ、Blaine Bublitz は後に公式ブログに Diamond 移行の記事を書いた。", k: claim, who: "gubsheep（ZK Podcast 225）", s: [src-df-zkpodcast-225, src-df-diamond]}
    - {t: "2022-07 に公式のラウンド駆動開発が休止し、集まった参加者を公式ラウンドで受け止める場はなくなった。その後はコミュニティラウンドに移った。", k: fact, s: [src-df-summer-break, src-df-fgw-dfdao]}
  counter:
    - {t: "参加者数の伸びは、配った鍵の量（v0.5 約 1000、v0.6 数千）と負荷の上限（v0.4 で送付停止）に強く縛られており、「何人が遊びたかったか」ではなく「運営が何人入れたか」を表す。告知・コンテンツの効果と鍵の供給増の効果は切り分けられない。", k: analysis, s: [src-df-v05, src-df-announce-v6, src-df-v4-recap]}
    - {t: "v0.3 のルールは複数の鍵を自分で使うことを認めており、v0.6 は自動化を公認していた。発表された参加者数には複数アカウントやボットが含まれ得る。", k: analysis, s: [src-df-v3-rules, src-df-gameplay-policy]}
    - {t: "Gitcoin の 1 万人超の寄付者や Discord 8000 人はプレイヤー数ではなく、ZK・公共財への関心で集まった層を含む。寄付の数字を「ゲームの利用者を集めた」証拠として読むことはできない。", k: analysis, s: [src-df-holiday]}
    - {t: "v0.6（2021-05〜2022-02）は Axie Infinity などブロックチェーンゲーム全般が伸びた時期と重なっており、参加者の増加を Dark Forest 固有の施策だけで説明することはできない（市況との切り分けはしていない）。", k: analysis}
    - {t: "第三者分析は、14 日間のラウンドの総アクティブ数が Axie Infinity の毎秒の数より少ないと述べており、伸びは界隈内の小規模なものだった。", k: claim, who: "Naavik (Anthony Pecorella)", s: [src-df-naavik]}
    - {t: "開発者自身が、参加者の正体（人かボットかスマートコントラクトか）を運営も完全には把握していないと述べ、初期の数版は単独プレイヤーが主だったが後に DAO・ギルド・コントラクト口座が加わったとした。ラウンドごとの「players」の数は人数ではなく口座数に近く、構成も版ごとに変わっている。", k: claim, who: "gubsheep（ZK Podcast 225）", s: [src-df-zkpodcast-225], q: "No one knows if you're a bot or if you're a smart contract or any manner of interesting entities."}
  lessons:
    - {t: "研究コミュニティへの招待鍵配布: 新しい暗号技術そのものが見どころなら、最初の数百人はその技術の研究者・開発者コミュニティに鍵を配るだけで集まり、ハッシュ計算の並列化のような「技術で勝つ」遊びを最初から持ち込んでくれる。効く条件は技術的な新規性が研究者にとって触る理由になること。破綻条件は一般プレイヤーへの拡大で、上位が計算資源とスクリプト力を持つ層に固定され、新規参加者の勝ち目が見えなくなる。", k: analysis}
    - {t: "得点を次ラウンドの鍵に変える段階的開放: 「得点 1 以上で次の鍵」のように最低限遊んだ人に優先権を与えると、ラウンド間で一定数の経験者を残しつつ、空いた枠を新しい鍵で埋められる。効く条件は需要が供給（鍵・チェーン容量）を上回っていること。破綻条件は鍵が譲渡・複数利用でき、得点条件が自動化で容易に満たせる場合で、鍵が人ではなくアカウントに配られる。", k: analysis}
    - {t: "道具の作者への特別賞: 賞金ラウンドの順位とは別に、プラグイン・市場・マイナーの作者に賞を出すと、プレイヤーの一部が開発者として残り、後から来る人の参入障壁（UI・自動化）を下げる道具が増える。効く条件はクライアントとコントラクトが公開されていること。破綻条件は道具が秘密鍵に触れる設計で信頼の経路がない場合と、道具が上位集団の内部にとどまり共有されない場合。", k: analysis}
  metrics: [m-df-v03-players, m-df-v04-players, m-df-v05-invites, m-df-v06r1-whitelisted, m-df-v06r3-players, m-df-v06r5-players, m-df-invite-keys-earned, m-df-gitcoin-2021, m-df-discord-2021-12, m-df-prize-v03]
  unknowns:
    - "v0.3 で配った招待鍵の数と、内部 alpha プレイテストの参加人数。"
    - "待機リストの登録者数（需要の大きさ）と、鍵を受け取った人のうち実際に参加した割合。"
    - "v0.3・v0.5 の賞金 1024 DAI を誰が拠出したか（告知記事には記載がない）。"
    - "各ラウンドの参加者のうち新規と再参加の内訳。"
    - "ZK Podcast 出演や Twitter での告知が参加申込みにどれだけ寄与したか。"

