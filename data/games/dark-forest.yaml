  - {t: "v0.3 の賞金対象: ルール記事は上位 15 アドレスへの配分を示すが、受賞者記事は 16 名に授与したと記載（同点の扱いと見られるが未確認）。", s: [src-df-v3-rules, src-df-v3-winners]}
  - {t: "プラグイン数: 公式ショーケースの clone では 57 ディレクトリ、Hard Mode First は 55 の査読済みプラグインと記載（時点差の可能性）。", s: [src-df-plugins-repo, src-df-hardmode]}

