acquisition:
  audience: [developers]
  summary: {t: "最初の開発者は、Lattice 自身が育った Dark Forest／0xPARC のオンチェーンゲーム開発者コミュニティと、Lattice の社内作品（OPCraft・Sky Strife）だった。Devcon 6（2022-10）の講演と OPCraft の公開デモで存在を示し、2023-05 の ETHGlobal Autonomous Worlds ハッカソン（賞金は Optimism・0xPARC・Lattice 等が拠出）と 2024-05 の Redstone 公開時の開発者施策で外部チームを集めた。", k: analysis, s: [src-mud-winding-down, src-mud-devcon6-talk, src-mud-ethglobal-aw, src-mud-rpgf3-lattice]}
  steps:
    - {phase: pre, date: "2021", t: "Lattice は Dark Forest を中心とするコミュニティから生まれ、Dark Forest 型の手作りの構造で zkDungeon を作った経験が MUD の出発点になったと述べる。", k: claim, who: "Lattice (ludens, alvarius)", s: [src-mud-winding-down, src-mud-zero-to-v2], q: "Lattice initially grew out of the community around Dark Forest, which was the original inspiration for zkDungeon."}
    - {phase: launch, date: "2022-10", t: "Devcon 6（Bogotá）で Lattice の 2 人と Optimism の Kelvin Fichter が「MUD: an Engine for On-chain Games」を講演し、0xPARC と Lattice が 1 年半かけて MUD を作ってきたと紹介した。同じ週の Autonomous Worlds 自主セッションでも MUD が紹介された。", k: fact, s: [src-mud-devcon6-talk, src-mud-devcon6-sls, src-mud-op-bogota]}
    - {phase: launch, date: "2022-10-18", t: "MUD v1 の実証として、社内作品 OPCraft を Optimism の発表とともに OP Stack のテストネットで 2 週間公開した。Lattice は約 2000 人が遊んだと述べ、OPCraft が OP Stack のゲーム用途の可能性を開発者に示したと主張した。", k: claim, who: "Lattice", s: [src-mud-opcraft-announce, src-mud-zero-to-v2, src-mud-rpgf3-lattice]}
    - {phase: growth, date: "2023-05-18", t: "0xPARC・Lattice・ETHGlobal が初のオンライン Autonomous Worlds ハッカソン（2023-05-18〜26）を開き、MUD を使った作品を募った。部門賞は Optimism 1 万ドル、0xPARC・Lattice・NFT.Storage 各 5000 ドル。Lattice は後に MUD のハッカソン作品を 69 件と申告した。", k: fact, s: [src-mud-ethglobal-aw, src-mud-rpgf3-lattice]}
    - {phase: growth, date: "2023-10", t: "Optimism RetroPGF 3 の申請で、Lattice は MUD を使う常勤プロジェクトを 24 件（Words3・Primodium・Sky Strife・Kamigotchi 等）とし、開発資金は非営利財団からの研究開発助成 210 万 9200 ドルと RetroPGF 2 の 18 万 3348 OP だと記した。", k: claim, who: "Lattice", s: [src-mud-rpgf3-lattice]}
    - {phase: growth, date: "2024-03", t: "MUD v2 安定版の告知で、Project Awakening（CCP Games）・Sky Strife・Biomes・Primodium・Moving Castles・Small Brain Games・DEAR・Gaul を早期採用者として挙げ、そのフィードバックに謝意を示した。", k: fact, s: [src-mud-v2-ready]}
