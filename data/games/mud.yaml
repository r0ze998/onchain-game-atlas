    - {id: hackathon, t: "ETHGlobal と組んだオンライン Autonomous Worlds ハッカソン（2023-05）で MUD の利用を前面に出し（告知ページは MUD を参加要件とはしていないが、Optimism と Lattice の部門賞は名称に MUD を掲げた）、2024-05 には Redstone 上のゲームが Composability Day の Wiki で改造を募り、Downstream が Composability Hackathon を案内した。", k: fact, s: [src-mud-ethglobal-aw, src-mud-composability-wiki, src-mud-rpgf3-lattice]}
    - {id: platform-distribution, t: "Optimism との協業（OPCraft の OP Stack 上での公開、ハッカソンの OP Stack 部門賞）と、自社 L2 の Redstone の開発者プレビューを採用の入口にした。", k: fact, s: [src-mud-op-bogota, src-mud-opcraft-announce, src-mud-ethglobal-aw, src-mud-race-to-mainnet]}
    - {id: composability, t: "社内作品 OPCraft・Sky Strife を「拡張できる世界」の見本として公開し、第三者の改造・プラグインの例を開発者向けの宣伝材料にした。", k: fact, s: [src-mud-zero-to-v2, src-mud-composability-wiki]}
  cost:
    - {t: "MUD の開発と普及の原資は助成金で、Lattice は 0xPARC・Optimism Foundation・Ethereum Foundation などから資金を受け、ベンチャー資金は受けなかったと述べる。RetroPGF 3 の申請では研究開発助成 210 万 9200 ドルと RetroPGF 2 の 18 万 3348 OP を申告した。", k: claim, who: "Lattice", s: [src-mud-winding-down, src-mud-rpgf3-lattice]}
    - {t: "ハッカソンの賞金は Optimism（1 万ドル）・0xPARC・Lattice・NFT.Storage（各 5000 ドル）が拠出した。フレームワーク自体は無償（MIT）で、開発者側の金銭負担は採用作品のガス代・インフラ費に限られる。", k: fact, s: [src-mud-ethglobal-aw, src-mud-repo]}
  after:
    - {t: "Lattice は MUD が「Ethereum で最も広く使われたオンチェーンゲームフレームワーク」になり、個人開発者から CCP Games まで使ったと総括した。ただし採用 World 数・継続している開発者数の集計は公表されていない。", k: claim, who: "Lattice (ludens, alvarius)", s: [src-mud-winding-down], q: "MUD became the most widely used framework for onchain games on Ethereum"}
    - {t: "2023 年時点の早期採用チーム（Words3・Primodium・Sky Strife 等）の多くは 2026 年までに運営を終え、Lattice 自身も事業化できず解散した。ハッカソン作品 69 件のうち継続した作品の数は確認できない。", k: analysis, s: [src-mud-winding-down, src-mud-rpgf3-lattice]}
  counter:
    - {t: "採用の伸びはハッカソン賞金・助成・Redstone の開発者プレビューなど Lattice と Optimism 側の資金で支えられており、開発者が MUD の技術的利点だけで集まったとは言い切れない。賞金・助成が尽きた後の採用の持続は示されていない。", k: analysis, s: [src-mud-ethglobal-aw, src-mud-rpgf3-lattice, src-mud-winding-down]}
    - {t: "「24 の常勤プロジェクト」「69 のハッカソン作品」は助成を申請する当事者の自己申告で、定義（常勤とは何か）や重複の有無は確認できない。", k: analysis, s: [src-mud-rpgf3-lattice]}
    - {t: "ETHGlobal の作品一覧には Autonomous Worlds ハッカソンの作品が 100 件を超えて並ぶ（検証役が 4 ページを数えた）が、Mud Todo・Scroll-ToDo-List・Just Some Mud Examples・mud_demo のような学習用デモや非ゲームも多い。Lattice 申告の「69 のハッカソン作品」とは定義が一致せず、提出数をそのまま獲得した開発者数とは読めない。", k: analysis, s: [src-mud-ethglobal-aw-showcase, src-mud-rpgf3-lattice]}
    - {t: "2022〜2023 年は他にオンチェーンゲーム用の汎用フレームワークの選択肢が少なく、Dark Forest 系の開発者が自然に移った可能性もある。施策の効果と、競合の不在による選択を分けられない。", k: analysis}
  lessons:
    - {t: "自社ゲームを公開デモにしてエンジンを売る: エンジンの開発元が、短期間（2 週間）の公開デモを主要カンファレンスの期間中に提携チェーンと同時発表すると、技術の実証と開発者への露出を一度に得られる。効く条件はデモが未経験者にも見える成果（建築物・制度の出現）を生むこと。破綻条件はデモの負荷でエンジンの欠陥が露呈し（OPCraft の状態肥大）、作り直しの期間に開発者を待たせること。", k: analysis}
    - {t: "チェーン側の賞金でフレームワーク推奨のハッカソンを開く: L2 の運営者が部門賞を出し、フレームワーク開発元がメンターと審査をすると、双方の費用で初期作品を数十件規模で集められる。効く条件は作品を本番に載せる受け皿（テストネット・開発者プレビュー）が直後にあること。破綻条件は作品が賞金目当ての一回限りで終わり、継続開発への助成や受け皿がないこと。", k: analysis}
  metrics: [m-mud-fulltime-projects-2023, m-mud-hackathon-projects-2023, m-mud-rd-grants-2023, m-mud-ethglobal-aw-prizes]
  unknowns:
    - "ETHGlobal Autonomous Worlds ハッカソンの参加者数と提出数の公式値（作品一覧には 100 件超、Lattice は 69 件と申告、出典の表計算シートは未取得）。"
    - "MUD の開発者 Discord の規模と、最初の外部採用チームが MUD を知った経路。"
    - "Composability Day の参加数・成果物・賞金の有無。"

