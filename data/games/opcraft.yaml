acquisition:
  audience: [players, developers]
  summary: {t: "Devcon 6（2022-10）の会期に合わせ、Optimism の公式ブログと Lattice の講演で発表し、Lattice・Optimism の X と Discord から人を呼んだ 2 週間限定のテストネット公開デモ。公開クライアントの蛇口画面はテスト用 ETH の受け取りに「Play OPCraft … @latticexyz @optimismFND」というツイートを求める作りで、参加者自身に告知させる設計だった（本番の蛇口サーバの設定は未確認）。", k: analysis, s: [src-opcraft-op-announce, src-opcraft-devcon6-talk, src-opcraft-repo]}
  steps:
    - {phase: pre, date: "2022-10", t: "Lattice は試作 2 日・完成まで 3 か月で OPCraft を作り、Devcon 6 の講演「MUD: an Engine for On-chain Games」で Optimism の Kelvin Fichter と登壇し、Optimism との協業を発表すると予告した。", k: fact, s: [src-opcraft-zero-to-v2, src-opcraft-devcon6-talk]}
    - {phase: launch, date: "2022-10-18", t: "Optimism の公式ブログが OPCraft を発表し、opcraft.mud.dev で約 2 週間公開、ハロウィンに世界とチェーンを凍結すると告知した。読者には Discord と X（@latticexyz）を案内した。", k: fact, s: [src-opcraft-op-announce], q: "Today we’re officially unveiling OPCraft: a fully on-chain 3D voxel world built with MUD"}
    - {phase: launch, date: "2022-10", t: "クライアントはブラウザ内でバーナーウォレットを自動生成し、クライアントの蛇口（faucet）画面は、X のハンドルを入力して署名入りの指定文面をツイートし、「Verify」でツイートを確認させてから資金を受け取る作りだった。一方でクライアントは残高 0.005 ETH 以下のとき dev 用の自動配布（dripDev）も呼び、こちらはサーバが dev モードのときだけ通る。本番がどちらの設定だったかは公開コードからは分からない。", k: fact, s: [src-opcraft-repo, src-opcraft-mud-v1-faucet], q: "Play OPCraft https://bit.ly/3VCVYyt @latticexyz @optimismFND"}
    - {phase: growth, date: "2022-10-27", t: "公開期間中に Bankless が「Optimistic on OPCraft」を掲載し、閲覧・参加先として opcraft.mud.dev を紹介した。", k: fact, s: [src-opcraft-bankless]}
    - {phase: growth, date: "2022-10-29", t: "終了 2 日前にプレイヤー SupremeLeaderOP が Discord と X で「世界政府」を宣言し、apro-comrade プラグインで忠誠を誓わせる「Autonomous People's Republic of OPCraft（APRO）」を作った。SNS 上でどれだけ話題になったかの数字は示されていない。", k: claim, who: "Lattice", s: [src-opcraft-part3]}
    - {phase: growth, date: "2022-10-31", t: "公開を終え、Lattice は約 2000 人のプレイヤー、約 1000 万ブロックの採掘、2 週間で約 350 万トランザクション（Bedrock テストネットの約 2 倍）と述べた。", k: claim, who: "Lattice", s: [src-opcraft-zero-to-v2, src-opcraft-rpgf3-lattice]}
  channels:
    - {id: platform-distribution, t: "OP Stack（Bedrock）テストネット上で、Optimism の公式ブログが発表記事を出した（チェーン側の公式施策）。", k: fact, s: [src-opcraft-op-announce, src-opcraft-op-bogota]}
    - {id: content-research, t: "Devcon 6 での Lattice・Optimism の共同講演と、Lattice の技術ブログ連載（Making of OPCraft Part 1〜3）。", k: fact, s: [src-opcraft-devcon6-talk, src-opcraft-part1, src-opcraft-part3]}
    - {id: viral-mechanic, t: "テスト用 ETH の蛇口が、@latticexyz と @optimismFND を含む告知文のツイートを受け取りの手順に組み込んでいた（実際に流れたツイート数は不明。本番サーバがツイート確認を必須にしていたかも未確認）。", k: fact, s: [src-opcraft-repo, src-opcraft-mud-v1-faucet]}
    - {id: crypto-social, t: "Discord と X でプレイヤー自身が「世界政府」の宣言などを発信した。", k: claim, who: "Lattice", s: [src-opcraft-part3]}
    - {id: press, t: "Bankless が公開期間中に紹介記事を掲載し、Lattice は WIRED の記事にも取り上げられたと申告した（WIRED の記事自体は未確認）。", k: fact, s: [src-opcraft-bankless, src-opcraft-rpgf3-lattice]}
    - {id: composability, t: "クライアントプラグインと独自コンポーネント・システムの追加を許し、プラグイン作者や制度を作るプレイヤーを呼び込んだ。", k: claim, who: "Lattice", s: [src-opcraft-part3, src-opcraft-zero-to-v2]}
  cost:
    - {t: "テストネットで、参加者のガス代は Lattice の蛇口が払うテスト用 ETH で賄われた。賞品は確認できず、運営費（チェーン運用・開発）は Lattice が負担した。Lattice の原資は助成金（RetroPGF 3 申請では研究開発助成 210 万 9200 ドルを申告）。", k: fact, s: [src-opcraft-repo, src-opcraft-op-announce, src-opcraft-rpgf3-lattice]}
  after:
    - {t: "期間限定のデモとして 2022-10-31 に凍結され、プレイヤーが残る場所はなかった。Lattice は後継の Biomes を Zuse と Dhvani が引き継いだと述べ、Redstone の公開時には Biomes の制作者を「OPCraft fans」と紹介した。", k: claim, who: "Lattice", s: [src-opcraft-part3, src-opcraft-winding-down, src-opcraft-race-to-mainnet]}
    - {t: "参加者数（約 2000 人）以外の指標、つまり再訪率や 1 人あたりのプレイ時間は公表されていない。", k: unknown}
  counter:
    - {t: "約 2000 人・350 万 tx は運営の自己申告で、バーナーウォレットと自動化（ダイヤモンド・ドリル）を考えると、プレイヤー数とアカウント数・トランザクションと人の行動は一致しない可能性が高い。", k: analysis, s: [src-opcraft-zero-to-v2, src-opcraft-part3]}
    - {t: "参加の動機が仕組み（ツイート蛇口）なのか、Devcon 会期という注目の集中、Optimism・Bankless の露出なのかは分けられない。ツイート蛇口でどれだけ新規が来たかのデータはない。", k: analysis}
    - {t: "ツイート蛇口は OPCraft 独自の工夫ではなく MUD v1 共通の蛇口サービスの機能（TwitterMode・DevMode の起動フラグで切り替え）で、OPCraft のクライアントは dev 用の自動配布も呼ぶ。本番が dev モードなら参加にツイートは要らず、「ツイートが参加の条件で告知が広がった」という説明自体が成り立たない可能性がある。", k: analysis, s: [src-opcraft-repo, src-opcraft-mud-v1-faucet]}
  lessons:
    - {t: "告知ツイートを蛇口の条件にする: テストネットのガス代を配る見返りに、運営と提携先のアカウントを含む定型ツイートを求めると、参加者 1 人ごとに告知が 1 回流れ、ボット対策（X アカウントとアドレスを紐付け、配布の間隔と期間あたりの総量を制限）にもなる。効く条件は資金が無価値なテストネットで、参加が一時的な話題性を持つ場合。破綻条件は X 側の制限や、実資産のチェーンで多重アカウントが報酬目当てに増える場合。", k: analysis}
    - {t: "期間を区切った公開デモ: 終了日時（ハロウィン 0 時）を先に告知すると、短期間に参加と創作が集中し、負荷試験と話題化を同時に得られる。破綻条件は、集まった人を受け止める次の世界がなく、関心が凍結とともに散ること。", k: analysis}
  metrics: [m-opcraft-players, m-opcraft-transactions]
  unknowns:
    - "参加者がどの経路（Devcon 会場・Optimism・Lattice の X・Discord）から来たかの内訳。"
    - "ツイート蛇口の利用回数と、ツイートからの流入数。"
    - "WIRED の記事の題名・日付。"

