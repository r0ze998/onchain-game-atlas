  website: {url: https://opcraft.mud.dev/, status: archived, note: "2022-10-31 に凍結した公開テスト世界の閲覧専用クライアント", s: [src-opcraft-repo]}
  github: https://github.com/latticexyz/opcraft
  blog: https://lattice.xyz/blog
chains: [Optimism Bedrock テストネット（Lattice が運用した OP Stack チェーン）]
team: "Lattice"
summary: >-
  Lattice が MUD v1 の実証として作った、地形・ブロック・所有のすべてをチェーン上に置く Minecraft 風のボクセル世界。
  2022-10 の Devcon 期間に Optimism Bedrock テストネットで 2 週間公開され、2022-10-31 に終了した。プレイヤーは採掘・建築・クラフトし、
  ダイヤモンドを賭けて区画を確保し、クライアントプラグインや独自のコンポーネント・システムを持ち込んで「人民共和国」のような制度を作った。
  状態肥大（終了時にクライアントの読み込みに約 20 分）が MUD v2 と Redstone の設計動機になった。
selection_reason: >-
  プレイヤーが運営の想定しない社会制度（土地の集団所有・配給・社会信用）を、独自のコントラクトで世界に追加した早期の具体例として、
  Autonomous Worlds 論の根拠としてしばしば引かれる。同時に、2 週間・テストネット・賞品なしという条件での出来事であり、その一般化には慎重さが要る。
categories:
  - {id: aw, role: primary, reason: "目的やクエストのない共有世界で、プレイヤーがコンポーネントとシステムを追加して制度を作った"}
  - {id: onchain-rules, role: secondary, reason: "採掘・建築・クラフト・区画確保と、Perlin ノイズによる地形生成がコントラクトで判定される"}
  - {id: infra, role: secondary, reason: "MUD v1 の負荷試験として、状態肥大とブロックスペースの飽和を明らかにした"}
status:
  value: ended
  as_of: "2026-10"
  note: >-
    公開テストは 2022-10-31 0 時 UTC（ハロウィン）に終了し、世界はその時点で凍結され閲覧専用クライアント（opcraft.mud.dev）で公開された。
    Lattice によれば、その後 Zuse と Dhvani が OPCraft を引き継いで Biomes にし、Biomes は Lattice と合流して DUST になった。
    閲覧専用の opcraft.mud.dev は参照日（2026-10-23）にも HTTP 200 を返した（検証役が確認。中身の表示までは未確認）。
