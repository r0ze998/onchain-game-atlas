  ended: {date: "2022-10-31", s: [src-opcraft-part3], note: "2 週間の公開テストがハロウィンの夜 0 時 UTC に終了"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      ブロックは MUD v1 のエンティティで、Position・Item・OwnedBy などのコンポーネントで表され、採掘（Mine）・設置（Build）・クラフト・ステーク・区画確保（Claim）・転送がシステムで判定される。
      未採掘の地形は Solidity と WebAssembly の Perlin ノイズで手続き生成され、チェーン上で検証される。一方、プレイヤーの位置はチェーンに置かれず、P2P で配信されたため、
      ループで遠隔地を採掘する自動化が可能だった。
    s: [src-opcraft-part1, src-opcraft-part3, src-opcraft-zero-to-v2, src-opcraft-repo]
  offchain:
    - {item: "プレイヤー位置の P2P 配信、クライアント（noa エンジン）、MUD インデクサ", s: [src-opcraft-zero-to-v2, src-opcraft-repo]}
    - {item: "公式サイトのプラグインは Lattice の公開リポジトリへの PR と手動の品質・安全確認を経て掲載された", s: [src-opcraft-part3]}
  admin:
    level: significant
    detail: >-
      MUD v1 ではコンポーネントの所有者が書き込み権を管理する。最終版リポジトリの deploy.json には、全コンポーネントへの書き込み権を持ち所有者だけが呼べる ComponentDevSystem
      （コード中に「本番に含めないこと」と注記）と BulkSetStateSystem が含まれる。2022-10 の公開テスト時の展開にどこまで含まれていたかは確認していない。
    s: [src-opcraft-repo]
  open_source:
    level: full
    detail: "latticexyz/opcraft にクライアントとコントラクトを公開（コントラクトの一部は GPL-3.0 表記）。最終コミット 2022-12-16。"
    url: "https://github.com/latticexyz/opcraft"
    s: [src-opcraft-repo]
  extensibility:
    level: permissionless-onchain
    detail: >-
      世界自体は許可不要で、誰でも独自のクライアントや新しいコンポーネント・システムを展開できた。実例: SupremeLeaderOP が 13 万 5200 個のダイヤを集めて出現地点周辺を確保し、
      ComradeComponent・GovernmentSystem などを展開して「Autonomous People's Republic of OPCraft」を作った。チャット・テレポート・紅葉表示・ダイヤ掘削などのプラグインも作られた。
      ただし公式サイト掲載のプラグインは審査制で、許可不要だったのはオンチェーンの世界と自前のフロントエンドだと Lattice は注記している。
    s: [src-opcraft-part3, src-opcraft-zero-to-v2]

compare:
  gameplay: {t: "目的やクエストのないボクセル世界で、採掘・建築・クラフトを行い、ダイヤを賭けて 16×16×16 の区画を守る。プレイヤーは巨大なドット絵、空中ピラミッド、Dark Forest への敬意を表す惑星などを作った。", k: fact, s: [src-opcraft-part3]}
  necessity: {t: "Lattice は「所有者のいない世界でなければプレイヤーは安心して創造できない」と主張したが、実際の公開は 2 週間で終わり凍結された。プレイヤーが規則を追加できたのはオンチェーンの共有状態ゆえだが、長期の永続性は実証されていない。", k: analysis, s: [src-opcraft-part3]}
  information: {t: "ブロックと所有は公開。プレイヤー位置はオンチェーンにない。", k: fact, s: [src-opcraft-part3]}
  persistence: {t: "公開テスト終了時の世界が閲覧専用で公開され、コードも公開されているが、テストネット上の世界は継続しなかった。後継の Biomes・DUST は別プロジェクトとして再出発した。", k: fact, s: [src-opcraft-part3, src-opcraft-repo, src-opcraft-winding-down]}
  extensibility: {t: "許可不要のコンポーネント・システム追加と自前クライアント、審査制の公式プラグイン。", k: fact, s: [src-opcraft-part3]}
  money_flow: {t: "テストネットのため実費・賞品は確認できない。ゲーム内のダイヤが区画確保のステーク資産として機能した。", k: fact, s: [src-opcraft-part3]}
  entry_barrier: {t: "テストネットで遊べた。具体的なウォレット・ガスの扱いは未確認。", k: unknown}

concepts: [c-ecs-engine, c-onchain-state, c-onchain-rules, c-permissionless-extension, c-client-plugins, c-autonomous-world, m-land, m-bot-automation, c-own-chain]

article:
  principles:
    - {t: "プレイヤーが制度をコントラクトとして追加できる: ゲームに組合・政府の仕組みがなくても、プレイヤーが独自のコンポーネントとシステムを展開し、参加者がそれに資産を預ける形で制度（集団所有・配給・社会信用）を作れる。適用条件は、資産の移転と土地の権利がオンチェーンの規則で表され、第三者コントラクトがそれを操作できること。破綻条件は、参加の誘因が弱い・期間が短い場合で、OPCraft の共和国は終了 2 日前に宣言され、反発したプレイヤーは空に別の都市を作った。", k: analysis, s: [src-opcraft-part3]}
  counter_evidence:
    - {t: "共和国などの事例は 2 週間・テストネット・資産価値なしという条件下のもので、運営自身が「期待を超えた」と述べる主観的な報告に基づく。長期的に制度が維持されるか、実資産が絡んでも同様に起きるかは示されていない。", k: analysis, s: [src-opcraft-part3]}
    - {t: "2 週間・約 2000 人規模でもテストネットのブロックスペースが活動のピークで飽和し、L1 にデータを投稿する通常の L2 では 1 ブロック置くのも非常に高額だったと Lattice は述べた。同じ設計を本番の大規模世界に広げるには専用チェーン（後の Redstone）が必要と判断された。", k: claim, who: "Lattice", s: [src-opcraft-intro-redstone, src-opcraft-zero-to-v2]}
    - {t: "Lattice によれば、区画確保のステークに使うダイヤは、位置がオンチェーンで強制されない仕様を突いた「ダイヤモンド・ドリル」（ループによる自動採掘）で大量に掘られた。共和国の 13 万 5200 ダイヤがドリル由来かは書かれていないが、土地の囲い込みという「創発的制度」の経済的基盤が、オンチェーン範囲の抜け穴による自動化と結び付いていた可能性があり、純粋な社会的創発の例として扱うには留保が要る。", k: analysis, s: [src-opcraft-part3]}
    - {t: "プレイヤー位置がオフチェーンだったため、ループによる遠隔採掘が可能になった。オンチェーンの範囲の選び方が、意図しない自動化を生んだ例でもある。", k: fact, s: [src-opcraft-part3]}

