contradictions:
  - {t: "公開日: Wikipedia は 2017-11-28（5 日間のクローズドベータ後）、Bloomberg（2017-12-04、検索要約）も 11/28 デビューとする。Frontiers 論文は「2017-11-23 にリリース」とし、データ期間も 11-23 開始（5 日間のベータ開始日と整合）。ConsenSys 記事は「2017 年 10 月にローンチ」と記載（ETHWaterloo のテスト版を指す可能性）。正式公開日としては 11-28 が多数。", s: [src-ck-wikipedia, src-ck-bloomberg-2017-12, src-ck-frontiers-2021, src-ck-consensys-2018]}
  - {t: "ネットワーク占有率: TechCrunch 15%（「トラフィック」）、MIT TR 12%（全トランザクション）、Bloomberg（ETH Gas Station）11%、Decrypt（2024）13%、Wikipedia 約 25%（「ネットワークトラフィック」）。測定日と定義が異なる。検証役の標本では日により約 6〜21%。", s: [src-ck-techcrunch-2017-12, src-ck-mittr-2017-12, src-ck-bloomberg-2017-12, src-ck-decrypt-2024-zen, src-ck-wikipedia, src-ck-rpc-share-sample]}
  - {t: "Flow 移行の発表時期: Cointelegraph・Decrypt は 2020-05-21 に Flow での提供を報じたが、Wikipedia は「2021-03 に近い将来 Flow へ切り替える計画を発表」と記す。", s: [src-ck-cointelegraph-flow-2020, src-ck-decrypt-flow-2020, src-ck-wikipedia]}
  - {t: "gen0 上限: KittyCore のコメントは gen0 の上限を 5 万匹と書くが、定数は GEN0_CREATION_LIMIT = 45000 と PROMO_CREATION_LIMIT = 5000（合計で 5 万）。", s: [src-ck-sourcify-kittycore]}
  - {t: "Flow 移行: 2020 年の報道は「Ethereum から移行する」とし、CEO は Ethereum 版も並行させたいと述べた。2026 年時点で Ethereum 版は動き続け、Flow 版の提供は確認できない。", s: [src-ck-decrypt-flow-2020, src-ck-cointelegraph-flow-2020, src-ck-etherscan-txs]}

