concepts: [c-autonomous-world, c-onchain-state, c-onchain-rules]

article:
  principles:
    - {t: "導入規則としてのチェーン: 「何が世界に存在するか」を決める規則（導入規則）をコードで形式化し、誰でも検証できるようにすれば、運営者が去っても世界の境界は保たれる。適用条件は、状態とルールの両方がチェーン上にあり、第三者がノードやクライアントを独立に動かせること。破綻条件は、世界がゲーム専用チェーンなど少数の運営者が維持する基盤に載る場合で、「止められない」は基盤運営者の継続に依存する。", k: analysis, s: [src-awe-0xparc-part1]}
  counter_evidence:
    - {t: "論考自身が「存亡の危機が来るまで自律性はしばしば演技的」と認めている。Redstone（2026-05 停止）上の Downstream・Biomes や、2026-12 停止予定の DUST Chain のように、AW を掲げた世界がホストチェーン停止に直面した例があり、「誰も止められない」は少なくともゲーム専用チェーンでは成り立たなかった。ただし論考の条件は「少なくとも一人がコンセンサスに参加する限り」であり、単一運営者のシーケンサーに依存する L2 はそもそも論考の想定する基盤（誰でも合意に参加できるチェーン）を満たしていなかった、と論考側から反論し得る。", k: analysis, s: [src-awe-0xparc-part1, src-awe-l2beat-redstone, src-awe-lattice-x]}
    - {t: "論考は、ハードな境界は商取引に、ソフトな境界はファンフィクションに向くと述べ、ハードな境界が常に望ましいとは主張していない。ゲームにとってどちらが良いかは論考の範囲外。", k: fact, s: [src-awe-0xparc-part1]}

