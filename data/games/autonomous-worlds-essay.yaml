  persistence: {t: "「少なくとも一人がコンセンサスに参加する限り実体は世界内にとどまる」とし、「誰も Autonomous Worlds の電源を抜けない（unplug）」と述べる。同時に、自律性は存亡の危機を経て事後的にしか測れないとも書いている。", k: claim, who: "ludens", s: [src-awe-0xparc-part1], q: "Of course, autonomy is something you can only measure in retrospect."}
