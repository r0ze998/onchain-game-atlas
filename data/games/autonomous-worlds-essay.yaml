summary: >-
  2022-08-03 に 0xPARC ブログで公開された ludens の論考。「世界」を実体の容れ物と導入規則（introduction rule）の組として定義し、
  ブロックチェーンを導入規則を形式化し誰もが検証できる「正典（canon）の技術」と位置付け、その上の世界を Autonomous Worlds と呼んだ。
  「Nobody can unplug Autonomous Worlds（誰も AW の電源を抜けない）」という主張は、後続の DUST が README で本論考に直接リンクして目標に掲げるなど、AW を名乗るプロジェクトの参照点になった（Downstream・Etherplay 等も AW の語を使うが、本論考への直接言及は確認できなかった）。
  2023 年には 0xPARC と Autonomous Worlds Network が論集『Autonomous Worlds N1』を刊行した。
selection_reason: >-
  オンチェーンゲームの一系統（AW）の語彙と目標を定めた原典で、後続プロジェクトが自らの設計を説明する際に直接リンクしている。
  一方で、論考自体が「自律性は事後的にしか測れず、それまでは演技的（performative）になりがち」と認めており、ホストチェーン停止で世界が失われた後続例と突き合わせて検証すべき主張を含むため。
