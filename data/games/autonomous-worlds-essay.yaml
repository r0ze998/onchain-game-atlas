  gameplay: {t: "ゲームではない。世界を「実体と、何が世界内（diegetic）かを決める導入規則」の組として定義する概念枠組み。", k: fact, s: [src-awe-0xparc-part1]}
  necessity: {t: "ブロックチェーンは導入規則をコードで形式化し、誰でも状態根を検証できるため、特権的な個人や機器なしに世界の境界を保てる、というのが中心の主張。", k: claim, who: "ludens", s: [src-awe-0xparc-part1], q: "Autonomous Worlds have hard diegetic boundaries, formalised introduction rules, and no need for privileged individuals to keep the World alive."}
