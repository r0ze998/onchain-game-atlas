acquisition:
  audience: [players]
  summary: {t: "最初のプレイヤーは Small Brain Games の X（ローンチスレッド）とコミュニティから来た暗号資産利用者で、本物の ETH を賞金庫に積む賭けの構造が参加の動機の一つだったとみられる。チームはユーザーインタビューを根拠に、Optimism 版・Base 版の利用者の 8 割超がこのゲームのために初めて OP 系チェーンへブリッジしたと申告している（運営の自己申告で、インタビューの規模は不明）。", k: analysis, s: [src-words3-rpgf3, src-words3-wiki]}
  steps:
    - {phase: launch, date: "2022-11-23", t: "2 週間で作った未監査の初期版を Optimism（OP Mainnet）に展開。チームはこれを MUD のスマートコントラクトの初めての mainnet 展開と位置づけ、X でローンチスレッドを出した。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3, src-words3-onchain, src-words3-wiki]}
    - {phase: pre, date: "2023-08", t: "2023-08-11 付の参加者の体験記によれば、Words3 の「最終プレイテスト」が行われ、参加者のウォレットには Lattice テストネットの ETH があらかじめ入れられていた（実施日は未記載）。", k: fact, s: [src-words3-coreloop]}
    - {phase: launch, date: "2023-08-06", t: "改良版を Base mainnet に展開（チームは MUD v2 の初の mainnet 展開と申告）。Base 版のユニークプレイヤーは 124 人、Base へのブリッジ額は約 2 万ドルとチームは示した。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3, src-words3-contracts]}
    - {phase: growth, date: "2023-10", t: "Optimism RetroPGF 3 の申請で、Words3 の展開が OP 系チェーンに数百人を連れてきたとし、他のオンチェーンゲーム（Gaul・Dark Seas・Underverse）のプレイテストを自分たちのコミュニティで行ったと記した。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3], q: "From user interviews, >80% of these users bridged to & made their first transaction on OP chains because of Words3."}
    - {phase: growth, date: "2024-05-15", t: "Redstone mainnet の公開期間（Worlds Expo）に合わせて Redstone に展開し、2024-05-21 には CSV の宛先へ文字を一括転送（エアドロップ）するスクリプトを追加した。", k: fact, s: [src-words3-contracts, src-words3-redstone-live]}
  channels:
    - {id: crypto-social, t: "X の @0xsmallbrain でローンチスレッドを出した（スレッド本文は未取得）。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3]}
    - {id: prize-competition, t: "支払いの大半が得点比例で分配される賞金庫に入る構造で、ゲーム自体が賞金付きの競争だった（賞金はプレイヤーの支払いが原資）。", k: fact, s: [src-words3-wiki, src-words3-contracts]}
    - {id: existing-community, t: "Small Brain Games は自前のコミュニティを持ち（同チームは Ape's Gambit・Network States も公開していた）、他チーム（Gaul・Dark Seas・Underverse）のゲームのプレイテストにも使った。コミュニティの規模・構成は書かれていない。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3]}
    - {id: platform-distribution, t: "Lattice が Redstone の紹介・公開記事で Words3 を MUD 作品・公開予定作として挙げ、Redstone の公開期間に展開した。", k: fact, s: [src-words3-intro-redstone, src-words3-redstone-live]}
  cost:
    - {t: "賞金庫はプレイヤーが文字を買う支払いが原資で、運営は賞金を出していない（初期版は運営手数料もなし）。後から入った人の支払いの一部が、土台にされた単語の作者（先に入った人）へ流れる構造だった。", k: fact, s: [src-words3-wiki]}
    - {t: "開発の原資として、Small Brain Games は RetroPGF 2 で 28 万 2670 OP（申請時点で未請求）を得たと申告し、それまでゲームから収益を得ていないとした。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3]}
  after:
    - {t: "チームは「100 人超・2 万ドル超」と要約し、Base 版のユニークプレイヤー 124 人、Optimism 版へのブリッジ約 1 万ドル・Base 版へ約 2 万ドルを示した。継続率・再訪率は示されていない。", k: claim, who: "Small Brain Games", s: [src-words3-rpgf3]}
    - {t: "Base では少なくとも 3 つの World アドレスで展開し直し、2024-05 に Redstone へ移った。各版の盤面・賞金庫はつながっておらず、同じプレイヤーが版をまたいで残ったかを示す資料はない。", k: analysis, s: [src-words3-contracts]}
  counter:
    - {t: "人数・金額・「8 割超が初めてのブリッジ」はいずれも助成を申請する当事者の自己申告で、ユーザーインタビューの規模は不明。ブリッジ額は賞金庫への賭け金を含み、人数の多さではなく少数の高額参加者を示す可能性がある。", k: analysis, s: [src-words3-rpgf3]}
    - {t: "参加の動機が単語ゲームの面白さなのか、賞金庫の分配（賭け）なのか、OP 系チェーンのエアドロップ期待なのかは区別できない。", k: analysis}
    - {t: "申請書自身が「プレイヤーがスクリプトを書いた」と記し、Base 版 124 人の根拠は第三者の Dune ダッシュボード（ユニークアドレス数とみられる、この環境で再確認不可）である。自動化・複数アドレスを考えると、124 はアドレス数であり、人数としては上限と読むべきで、「数百人を連れてきた」という申告とも突き合わせられない。", k: analysis, s: [src-words3-rpgf3]}
  lessons:
    - {t: "プレイヤーの支払いで賞金庫を作る小規模の実資産ゲーム: 運営が賞金を出さず、参加費の大半を得点比例の賞金庫に入れると、100 人規模でも本物の ETH が動き、新しい L2 にブリッジさせる動機になる。効く条件は参加者が既にウォレットと資産を持つ暗号資産利用者であること。破綻条件は参加者が少なく賞金庫が小さいときに動機が消えること、再展開で賞金庫と盤面が分断されること。", k: analysis}
  metrics: [m-words3-base-players, m-words3-bridged-base, m-words3-bridged-op, m-words3-rpgf2]
  unknowns:
    - "ローンチスレッドの本文と、Optimism 版の参加者数。"
    - "Redstone 版のエアドロップの配布先・数量と参加者数。"

