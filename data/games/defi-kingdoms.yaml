  - {id: ev-dfk-chain-sunset-announce, date: "2026-07-31", type: announce, title: "DFK Chain を 2026-08-28 で終了し Avalanche C-Chain へ移ると告知", detail: "DFK 由来の資産は運営が移し、JEWEL・ブリッジ済み資産は利用者が自分で移す必要がある。第三者向け SDK の公開も予告。報道はインフラ費用の削減が目的とする", s: [src-defi-kingdoms-x-sunset, src-defi-kingdoms-egamers-sunset]}
