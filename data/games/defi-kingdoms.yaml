  - {id: ev-dfk-harmony-leave, date: "2022-08-23", type: announce, title: "Serendale を Harmony から Klaytn へ移すと発表", detail: "Horizon ブリッジ攻撃（約 1 億ドル）の約 2 か月後", s: [src-defi-kingdoms-theblock-leave]}
  - {id: ev-dfk-harmony-close, date: "2022-10-12", type: end, title: "Harmony の Serendale を閉鎖し Outpost 化", s: [src-defi-kingdoms-docs-realms]}
  - {id: ev-dfk-serendale-klaytn, date: "2022-12-07", type: launch, title: "Serendale 2.0 を Klaytn（現 Kaia）で開始（JADE）", s: [src-defi-kingdoms-docs-realms]}
