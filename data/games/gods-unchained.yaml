id: gods-unchained
name: Gods Unchained
name_ja: ゴッズ・アンチェインド
aliases: [GU]
kind: game
depth: index
updated: "2026-10-23"
links:
  website: https://godsunchained.com/
  x: https://x.com/GodsUnchained
  discord: https://discord.com/invite/godsunchained
  blog: https://godsunchained.com/blog
ids:
  coingecko: gods-unchained
chains: [Ethereum mainnet（初期）, Immutable X, Immutable zkEVM（2025 年に移行予定）]
team: "Immutable（旧 Fuel Games。Robbie Ferguson ほか）"
summary: >-
  2018 年に予約販売を始めた対戦型デジタルカードゲーム。カードの所有を NFT としてチェーン上に記録し、対戦そのものは Unity クライアントとサーバーでチェーン外に行う。
  開発元 Fuel Games は Immutable に改名し、取引をレイヤー 2 の Immutable X へ移し、2025 年には Immutable zkEVM への移行を進めた。
  無料で得た「プレーン」カードは NFT ではなく、Flux と GODS を払って Forge で NFT 化する二層構造をとる。
selection_reason: >-
  「カードの所有はチェーン、ルールはサーバー」という分業の代表例で、ルールのオンチェーン化を目指す作品群に対する対照として重要。
  取引手数料、NFT 化の条件、チェーン移転の繰り返しが、所有の意味と参加障壁をどう変えるかを確認できる。
categories:
  - {id: assets, role: primary, reason: "カード（NFT）の所有と取引だけをチェーンに置き、対戦はチェーン外"}
  - {id: p2e, role: secondary, reason: "ランク戦の報酬として GODS トークンや Flux を配る"}
  - {id: infra, role: secondary, reason: "Ethereum mainnet → Immutable X → Immutable zkEVM と基盤を移した"}
status:
  value: active
  as_of: "2025-04"
  note: "2025-04 時点の公式 FAQ は Immutable zkEVM への移行手順を案内している。2024-02 にモバイル版の早期アクセスを公開。2026 年時点の運営状況は本調査で確認していない。"
  s: [src-gu-zkevm-faq, src-gu-decrypt-mobile-2024]
dates:
  announced: {date: "2018-07", s: [src-gu-wikipedia-immutable], note: "Fuel Games が予約販売を開始"}
  launched: {date: "2019", s: [src-gu-wikipedia-immutable, src-gu-mittr-2019], note: "Wikipedia は 2019 年に Android / iOS / Windows / macOS 向けに公開と記載。MIT TR（2019-07-11）は同週に非公開テストを経てベータ版が一般公開されたと報じた（Decrypt は 2018 年に Ethereum で公開と記載。contradictions 参照）"}

architecture:
  onchain:
    level: assets-only
    detail: "カードとその所有者だけがチェーン上で追跡され、ゲームプレイはチェーン外で行われる（2019 年報道）。NFT は tokenID と Proto（カードの種類）のメタデータを持つ。"
    s: [src-gu-mittr-2019, src-gu-zkevm-faq]
  offchain:
    - {item: "対戦・ルール判定・マッチング（Unity クライアントとサーバー）", s: [src-gu-mittr-2019]}
    - {item: "プレーンカード（NFT でないカード）と Flux（売買不可の資源）の管理", s: [src-gu-zkevm-faq]}
  admin:
    level: significant
    detail: "カードの発行・Forge の稼働・取引手数料（9%）・チェーン移行は運営が決める。zkEVM 移行の初期段階では Forge を停止すると告知した。"
    s: [src-gu-zkevm-faq]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: unknown
    detail: "NFT は外部マーケットで取引できるが、第三者がゲームルールを拡張する手段は確認できなかった。"

compare:
  gameplay: {t: "Hearthstone 型の 1 対 1 のデジタルカード対戦。ランク戦の勝利で報酬を得る。", k: fact, s: [src-gu-mittr-2019]}
  necessity: {t: "カードの所有と二次流通だけをチェーンに置く構成で、ルールはサーバー。チェーンが提供するのは運営外での売買と所有の記録で、対戦の公正さやルールの永続性ではない。", k: analysis, s: [src-gu-mittr-2019]}
  information: {t: "手札・山札は通常のサーバー型カードゲームと同様に秘匿される（対戦がチェーン外のため）。", k: analysis, s: [src-gu-mittr-2019]}
  persistence: {t: "NFT は残るが、対戦はチェーン外のサーバーで行われるため、ゲームとしての継続は運営に依存する。", k: analysis, s: [src-gu-mittr-2019]}
  extensibility: {t: "未確認", k: unknown}
  money_flow: {t: "予約販売・パック販売（2019 年報道で予約販売収入 400 万ドル）、マーケットの取引手数料 9%。Forge で NFT 化する際に GODS を消費する。", k: fact, s: [src-gu-mittr-2019, src-gu-zkevm-faq]}
  entry_barrier: {t: "無料で始められ、プレーンカードは NFT ではない。売買・NFT 化にはウォレットと GODS、MetaMask 等からの操作では IMX のガスが必要。", k: fact, s: [src-gu-zkevm-faq]}

concepts: [m-collectible-cards, c-nft-asset, c-own-chain, e-p2e, e-sink-faucet]

article:
  counter_evidence:
    - {t: "Fuel Games 共同創業者は「ブロックチェーンで時間を収益化できる」と主張したが、対戦の勝敗や価値の源泉（カードの強さ・環境）は運営がサーバーとカード設計で決めており、所有は「運営が作る環境の中の財産権」に留まる。", k: claim, who: "Robbie Ferguson（MIT Technology Review の記事内）", s: [src-gu-mittr-2019], q: "Blockchain allows players to monetize their time."}
    - {t: "2023-12 に ESRB は暗号資産による賭博的要素を理由に Adults Only 18+ と評価し、Epic Games Store が一時掲載を外した（後に再掲載）。所有と換金性が配信・規制上の障壁になった例である。", k: fact, s: [src-gu-wikipedia-immutable]}

acquisition:
  audience: [holders, players]
  summary: {t: "最初の参加者は、遊べる版がない 2018-07 からの予約販売で ETH を払ってカードパックを買った暗号資産の保有者・収集家で、一点物の Mythic カードの抽選・競売と、予約販売の売上から積み立てる世界大会の賞金が呼び水になった。対戦するプレイヤーとしての流入は、数か月の非公開テストを経た 2019-07 のベータ一般公開以降である。", k: analysis, s: [src-gu-cryptoslate-2018, src-gu-bgb-1m-cards, src-gu-mittr-2019]}
  steps:
    - {phase: pre, date: "2018-07", t: "Fuel Games が予約販売を始めた。", k: fact, s: [src-gu-wikipedia-immutable]}
    - {phase: pre, date: "2018-08", t: "予約販売のデッキは 0.012・0.075・0.112・1 ETH の 4 段階で、どのパックにも年 4 枚しか作られない一点物の Mythic カード（残り 3 枚のうち 2 枚）が入る可能性があった。3 枚目の Mythic「Hyperion」は別に競売にかけられ、入札額は 137.84 ETH（約 6.9 万ドル）に達していた。予約販売の売上の 10% を 2019 年第 1 四半期予定の世界大会の賞金に充て、目標は 160 万ドル（当時の積立は 26 万ドル余り）とされた。", k: fact, s: [src-gu-cryptoslate-2018]}
    - {phase: pre, date: "2018-10", t: "74 日でカード 100 万枚を売った（記事は 3 か月未満とし、起点は明記していない）。", k: fact, s: [src-gu-bgb-1m-cards]}
    - {phase: launch, date: "2019-07", t: "数か月の非公開テストを経てベータ版を一般公開した。この時点で予約販売の収入は 400 万ドルとされた。", k: fact, s: [src-gu-mittr-2019]}
    - {phase: growth, date: "2019-10", t: "1 年以上続いた Genesis パックの販売が 33,333 ETH（当時 600 万ドル超）で完売した。DappRadar の数える日次ウォレットは 2019-10 中旬に 700 でピークだった。", k: fact, s: [src-gu-bgb-genesis]}
  channels:
    - {id: prize-competition, t: "予約販売の売上の 10% を世界大会の賞金（目標 160 万ドル）に積み立てると告知した。", k: fact, s: [src-gu-cryptoslate-2018]}
    - {id: invite-gating, t: "ベータの一般公開（2019-07）の前に、数か月の非公開テストを行った（参加者数・選び方は未確認）。", k: fact, s: [src-gu-mittr-2019]}
    - {id: viral-mechanic, t: "一点物の Mythic カードをパックに混ぜ、別の Mythic を公開の競売にかけて高額入札を話題にした。", k: fact, s: [src-gu-cryptoslate-2018]}
  cost:
    - {t: "最初の参加者自身がパック代を払い、それが開発資金になった（予約販売 400 万ドル、Genesis 販売の総額 33,333 ETH）。2018 年に 240 万ドルのシード調達もあった。世界大会の賞金は予約販売の売上の 10% から出す設計で、パック購入者の支払いの一部が一部の上位プレイヤーへの賞金に回る構造だった。", k: fact, s: [src-gu-mittr-2019, src-gu-bgb-genesis, src-gu-wikipedia-immutable, src-gu-cryptoslate-2018]}
  after:
    - {t: "Genesis 完売時（2019-10）の日次ウォレットは最大 700（DappRadar）で、プレイヤー数ではない。その後 NFT 売上の累計は約 3.5 億ドル（2024-02、CryptoSlam）に達し、2024-02 にモバイル版の早期アクセスを出した。プレイヤー数・継続率は公表されていない。", k: fact, s: [src-gu-bgb-genesis, src-gu-decrypt-mobile-2024]}
  counter:
    - {t: "100 万枚の販売や 400 万ドルの予約販売は、カードの将来価値を見込んだ収集・投機の需要を示すもので、遊ぶプレイヤーの数は示さない。同じ時期の日次ウォレットは数百規模だった。", k: analysis, s: [src-gu-bgb-1m-cards, src-gu-bgb-genesis]}
  lessons:
    - {t: "予約販売の一部を大会賞金に積み立てる: 先行購入に「競技で取り返せる」意味を与えられるが、賞金は後続の購入に依存するため、販売が止まると賞金の約束も弱まる。", k: analysis}
    - {t: "一点物カードの抽選と公開競売: 少数の高額入札で話題を作れるが、集まるのは収集家で、対戦の需要とは別に測る必要がある。", k: analysis}
  metrics: [m-gu-presale-revenue-2019, m-gu-cards-1m-2018, m-gu-prize-goal-2018, m-gu-genesis-sale, m-gu-daily-wallets-2019-10, m-gu-seed-2018]
  unknowns: ["予約販売の購入者数（ウォレット数）", "非公開テスト（2018〜2019）の参加者数と選び方（公式タイムライン記事は 403 で読めず、検索要約では 2018-11-09 に少数が閉じたベータに参加）", "世界大会の賞金が実際にいくら支払われたか"]

