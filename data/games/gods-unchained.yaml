  - {id: m-gu-prize-goal-2018, type: other, value: 1600000, unit: USD, period: "2018-08（告知時点、積立は 26 万ドル余り）", definition: "予約販売の売上の 10% から積み立てる世界大会の賞金の目標額（CryptoSlate）", nature: reported, s: [src-gu-cryptoslate-2018]}
  - {id: m-gu-daily-wallets-2019-10, type: wallets, value: 700, unit: wallets, period: "2019-10 中旬（ピーク）", definition: "DappRadar の日次ウォレット数（BlockchainGamer.biz の引用、プレイヤー数ではない）", nature: measured, s: [src-gu-bgb-genesis]}

