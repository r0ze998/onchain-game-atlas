id: nba-top-shot
name: NBA Top Shot
name_ja: NBA トップショット
aliases: [Top Shot, NBATS]
kind: game
depth: index
updated: "2026-10-24"
links:
  website: https://nbatopshot.com/
  x: https://x.com/nbatopshot
  discord: https://discord.gg/nbatopshot
  blog: https://blog.nbatopshot.com/
chains: [Flow]
team: "Dapper Labs（NBA・NBPA のライセンス）"
summary: >-
  NBA の試合映像の一場面（Moment）をパックで販売し、Dapper Labs が作ったブロックチェーン Flow 上の NFT として売買させる収集プラットフォーム。
  2020-10 の公開ベータから一般層に広がり、2021-02 には月間取引高が 2 億ドルを超えたが、2022 年後半には月 270 万ドル程度まで落ちた。
  運営発表の「登録者 100 万人」と、第三者集計の購入者数（The First Mint によるピーク 18.4 万〔出典不明・複数アカウントを含む可能性〕、CryptoSlam による 2022-10 の二次市場の一意購入者 1.35 万未満）の差が大きい。
  Moment が証券に当たるとする集団訴訟は 2024 年に 400 万ドルで和解した。
selection_reason: >-
  CryptoKitties の開発元が専用チェーンを作り、一般層向けにクレジットカード決済で NFT を売った最大級の事例。
  ゲーム性の薄い収集・投機がどう伸び縮みするか、運営発表の利用者数と第三者計測の差、法的リスク（証券該当性）を確認できる。
  指標の定義の違いを扱う比較対象として重要。
categories:
  - {id: assets, role: primary, reason: "Moment を Flow 上の NFT として発行・二次流通させる"}
  - {id: infra, role: secondary, reason: "Dapper Labs が自ら作ったチェーン Flow 上で運営"}
status:
  value: active
  as_of: "2026-10"
  note: "参照日の公式サイトに 2025-26 シーズンのパック販売・ドロップ予定・マーケットが表示され、「Built on Flow」と記載されている。"
  s: [src-nbats-site]
dates:
  launched: {date: "2020-10", s: [src-nbats-ap-2021], note: "公開ベータ開始（AP は「10 月」と記載）"}

architecture:
  onchain:
    level: assets-only
    detail: "Moment は Dapper Labs が作った Flow ブロックチェーン上で発行される NFT。パックの販売、表示、マーケットの運営は Dapper が行う。"
    s: [src-nbats-theblock-2024, src-nbats-site]
  offchain:
    - {item: "パック販売・抽選・ドロップの運営と、クレジットカード決済（運営 CEO は日次のカード決済額は小さいと述べた）", s: [src-nbats-ledger-2021, src-nbats-site]}
    - {item: "映像コンテンツとライセンス管理", s: [src-nbats-site]}
  admin:
    level: significant
    detail: "Moment の発行、マーケット、チェーン（Flow）自体が Dapper Labs の管理下で始まった。2024 年の和解条件には、Flow が十分に分散化されるための事業上の変更が含まれた（検索要約）。原告は数か月にわたり出金を妨げたと主張した。一方、2022-03 以降は他の 4 つのマーケットプレイスでも Moment の販売が認められた（The Block）。"
    s: [src-nbats-theblock-2024]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: unknown
    detail: "未確認。"

compare:
  gameplay: {t: "パックを買って Moment を集め、セットを揃える・売買する。試合をプレイする要素は中心ではない。", k: fact, s: [src-nbats-site, src-nbats-ledger-2021]}
  necessity: {t: "運営がチェーン・マーケット・発行を全て管理する構成で、チェーンの役割は所有記録と二次流通の台帳に近い。裁判所は 2023 年に、価値が Flow の成否と結びついている点を証券性の主張を退けない理由の一つにした（検索要約）。", k: analysis, s: [src-nbats-theblock-2024]}
  information: {t: "未確認", k: unknown}
  persistence: {t: "Moment は Flow 上に残るが、映像・ライセンス・マーケットは Dapper とリーグの契約に依存する。", k: analysis, s: [src-nbats-site]}
  extensibility: {t: "未確認", k: unknown}
  money_flow: {t: "Dapper はパック販売（一次）とマーケット手数料から収入を得る。2021-03 時点の売上は 5 億ドル、取引の 3 分の 2 は 50 ドル未満と運営は述べた。", k: fact, s: [src-nbats-ap-2021, src-nbats-ledger-2021]}
  entry_barrier: {t: "一般向けの決済で購入でき、暗号資産の知識を前提にしない設計が意図された。実際にはクレジットカードの日次決済額は小さく、購入の多くは暗号資産によると推測された。", k: claim, who: "Ledger Insights（Roham Gharegozlou の発言の要約）", s: [src-nbats-ledger-2021]}

concepts: [c-nft-asset, m-collectible-cards, c-own-chain]

article:
  retention_evidence:
    - {t: "運営発表: 2021-03 に 80 万超のアカウント、2021-05 に登録 100 万人超（うち購入経験は約半数）。", k: claim, who: "Dapper Labs（AP / Ledger Insights の記事内）", s: [src-nbats-ap-2021, src-nbats-ledger-2021]}
    - {t: "オンチェーン計測: CryptoSlam によれば 2022-10 の二次市場の一意購入者は 13,500 未満、取引高は約 270 万ドルで、ピークの 2021-02（2.24 億ドル）から大きく減った。", k: fact, s: [src-nbats-decrypt-2022]}
    - {t: "The First Mint は購入者のピークを 2021-03 の 18.4 万（複数アカウントを含む可能性）とし、2023-01 時点で 94% 減、2022-01→2023-01 で月間一意購入者が 83% 減と書く（購入者数の出典は明示なし）。", k: claim, who: "The First Mint", s: [src-nbats-firstmint-2023]}
    - {t: "示されていない指標: 登録者のうち継続して購入・閲覧する人数、カストディ口座内の取引とオンチェーン取引の区別、複数アカウントの規模。", k: unknown}
  counter_evidence:
    - {t: "「100 万人の登録」と「1.35 万人の月間購入者」は定義が違う数字であり、前者を利用者の規模とする報道も、後者を「誰も使っていない」とする報道も、どちらも片面的である。収集プラットフォームでは閲覧・保有だけの利用者がオンチェーン指標に現れない。", k: analysis, s: [src-nbats-ledger-2021, src-nbats-decrypt-2022]}
    - {t: "「マーケットを運営が独占する」という見方への反証として、2022-03 以降は Dapper 以外の 4 つのマーケットプレイスでも Moment の販売が認められている。ただし発行と Flow の初期運営は Dapper に集中していた。", k: fact, s: [src-nbats-theblock-2024]}
    - {t: "2024 年の和解で Dapper は Moment が証券でないとの立場を維持しつつ 400 万ドルを支払った。運営がチェーンと市場を管理する設計は、所有の「分散性」を主張しにくくし、法的リスクを生む。", k: fact, s: [src-nbats-theblock-2024]}

acquisition:
  audience: [players, holders]
  summary: {t: "最初の利用者は、サイトで更新通知に登録し Discord で早期参加を申請した人に段階的に送った招待で選ばれた閉じたベータ参加者（2020-05〜、最初の 500 人、のち 1.7 万人）だった。NBA のライセンスとクレジットカードでのパック購入を入口にして暗号資産の外のバスケットボールファンを狙い、大きな流入は 2020-10 の一般公開後、2021-02 の相場の熱狂期に起きた。", k: analysis, s: [src-nbats-decrypt-2020-beta, src-nbats-gamesbeat-2020, src-nbats-pr-2020-10, src-nbats-decrypt-2022]}
  steps:
    - {phase: pre, date: "2020-05-27", t: "CryptoKitties の開発元 Dapper Labs が閉じたベータを翌週に始めると発表した。参加は更新通知に登録した人のうち招待を受けた人に限られ、中身の分からないパックをクレジットカード・Bitcoin・Ethereum で買える設計だった。", k: fact, s: [src-nbats-decrypt-2020-beta]}
    - {phase: pre, date: "2020-08", t: "閉じたベータの最初の 500 人で 120 万ドル超の売上が出たと発表した。招待は段階的に送られ、希望者はサイトで登録した後に Discord で早期参加を申請する手順だった。同時に発表した 1200 万ドルの調達には NBA 選手（Spencer Dinwiddie、Andre Iguodala、JaVale McGee、Aaron Gordon、Garrett Temple）が参加した。", k: claim, who: "Dapper Labs（GamesBeat の記事内）", s: [src-nbats-gamesbeat-2020]}
    - {phase: launch, date: "2020-10-01", t: "ベータを全員に開放した。閉じたベータには 1.7 万人が招待され、パック約 4.3 万個の販売、Moment 2.9 万個の配布（gifted）、マーケットでの Moment 1.05 万件の販売があったと発表した。Web に加え、Samsung の Galaxy Store で Android 版を配信した。", k: claim, who: "Dapper Labs（プレスリリース）", s: [src-nbats-pr-2020-10], q: "the NBA Top Shot community is the best I've ever worked with: people are always happy to help."}
    - {phase: growth, date: "2021-02", t: "月間取引額が 2.24 億ドルに達した（CryptoSlam）。2021-02-26 の 99 ドル・約 1 万個のパック販売にはボットを含む記録的な人数が並び（見出しは 20 万人超）、Dapper はボット対策を理由に販売を 1 日延期していた。", k: fact, s: [src-nbats-decrypt-2022, src-nbats-thelogic-2021]}
    - {phase: growth, date: "2021-03", t: "公開ベータ以降の登録アカウントが 80 万超、売上が 5 億ドルに達したと Dapper Labs は発表した。2021-05 には登録 100 万超（購入経験は約半数）と述べた。", k: claim, who: "Dapper Labs（AP / Ledger Insights の記事内）", s: [src-nbats-ap-2021, src-nbats-ledger-2021]}
  channels:
    - {id: invite-gating, t: "閉じたベータは更新通知の登録者に招待を段階的に送る形で、最初の 500 人から 1.7 万人まで広げた。", k: fact, s: [src-nbats-decrypt-2020-beta, src-nbats-gamesbeat-2020, src-nbats-pr-2020-10]}
    - {id: community-server, t: "早期参加の申請窓口を Discord に置き、登録後に Discord で招待を求める手順にした。", k: fact, s: [src-nbats-gamesbeat-2020]}
    - {id: ip-brand, t: "NBA・NBPA のライセンスを受けた試合映像を商品にし、資金調達に現役 NBA 選手を加えた。", k: fact, s: [src-nbats-gamesbeat-2020, src-nbats-site]}
    - {id: platform-distribution, t: "一般公開時に Samsung の Galaxy Store で Android 版を配信した（ブロックチェーンの収集品として同ストア初とされる）。", k: claim, who: "Dapper Labs（プレスリリース）", s: [src-nbats-pr-2020-10]}
    - {id: free-mint, t: "閉じたベータ中に Moment 2.9 万個が「gifted」（配布）されたと発表した（誰が誰に配ったかの内訳は不明）。", k: claim, who: "Dapper Labs（プレスリリース）", s: [src-nbats-pr-2020-10]}
  cost:
    - {t: "最初の利用者は自分でパックを買っており、閉じたベータの 500 人で 120 万ドル超の売上が出た。獲得の原資は無料配布より利用者自身の購入で、運営側は VC 資金（2020 年 1200 万ドル、2021-03 に 3.05 億ドル）で開発とチェーン Flow を賄った。", k: fact, s: [src-nbats-gamesbeat-2020, src-nbats-ap-2021]}
  after:
    - {t: "2022-10 の二次市場の一意購入者は 13,500 未満、月間取引額は約 270 万ドルで、2021-02 のピークから大きく減った（CryptoSlam）。登録 100 万超のうち継続して購入・閲覧する人数は公表されていない。", k: fact, s: [src-nbats-decrypt-2022, src-nbats-ledger-2021]}
  counter:
    - {t: "2021-02 の急増は NFT 市場全体の熱狂期と重なり、パック販売の行列にはボットも含まれた。招待制やカード決済といった施策の効果と、転売益を狙う流入を分ける資料はない。", k: analysis, s: [src-nbats-thelogic-2021, src-nbats-decrypt-2022]}
    - {t: "運営 CEO は 2021-05 にクレジットカードの日次決済額は小さいと述べ、購入の多くは暗号資産によると推測された。「カード決済で一般層を集めた」という説明は弱まる。", k: claim, who: "Ledger Insights（Roham Gharegozlou の発言の要約）", s: [src-nbats-ledger-2021]}
  lessons:
    - {t: "段階招待＋Discord 申請（波状の招待）: 熱心な層を先に集め、マーケットの流動性を作ってから開放できる。ただし二次市場の価格上昇が招待の価値を上げるため、相場が下がる局面では待機リストの熱も消える。", k: analysis}
    - {t: "リーグ・選手のライセンスを入口にする: 暗号資産の外のファンへの訴求は強いが、ライセンスと発行を運営が独占するため、証券性の訴訟や市場停滞の責任も運営に集中する。", k: analysis}
  metrics: [m-nbats-beta-revenue-2020, m-nbats-beta-invited-2020, m-nbats-beta-packs-2020, m-nbats-volume-2021-02, m-nbats-accounts-2021-03, m-nbats-registered-2021-05, m-nbats-buyers-2022-10]
  unknowns: ["更新通知の登録者数（待機リストの規模）と招待の選び方", "閉じたベータで配布（gifted）された Moment の配布元と条件", "2021-02-26 の行列の実数（記事本文に数字なし）とボットの割合"]

