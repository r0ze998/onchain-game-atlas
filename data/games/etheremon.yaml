id: etheremon
name: Etheremon
name_ja: イーサモン
aliases: [Ethermon（2019 年以降の後継）, EMONT]
kind: game
depth: index
updated: "2026-10-24"
links:
  github: https://github.com/etheremon/smartcontract
chains: [Ethereum mainnet]
team: "Etheremon チーム（共同創業者 Nedrick Ngo ほか）。2019 年以降は上位プレイヤーと新チームによる Ethermon として継続したとされる"
summary: >-
  2017 年 12 月に Ethereum 上で始まった、Pokémon に着想を得たモンスター収集・対戦ゲーム。モンスター（Mon）はトークンで、
  城（castle）への攻撃などの対戦判定、経験値、変身（transform）の一部がコントラクトで実行された。ERC-20 の EMONT トークンもゲーム内報酬として使われた。
  乱数は直前ブロックのハッシュとアドレスから作られ、モデレーターがゲーム設定や経験値を変更できる設計だった。
selection_reason: >-
  CryptoKitties 直後に、資産の所有だけでなく対戦の判定までコントラクトに載せようとした初期の例であり、
  「対戦をオンチェーンで判定するとき、乱数と管理者権限をどこに置いたか」をコードで確認できるから。
categories:
  - {id: onchain-rules, role: primary, reason: "城への攻撃（attackCastle）と勝敗・経験値の計算が EtheremonBattle コントラクトで行われる"}
  - {id: assets, role: secondary, reason: "モンスターを ERC-721 として扱い、EMONT（ERC-20）を報酬に使った"}
status:
  value: unknown
  as_of: "2026-10"
  note: "公式リポジトリの最終更新は 2024-08（GitHub 表示）だが、コミット履歴の最終は 2018-03-13（refactor ERC721）。etheremon.com は参照日時点でカジノの紹介サイトになっている。後継の Ethermon の現状は確認できなかった（公式ドメインは名前解決できず）。"
  s: [src-etheremon-github-org, src-etheremon-site-now]
dates:
  launched: {date: "2017-12", s: [src-etheremon-bgamer-2018, src-etheremon-code], note: "共同創業者は 2017-12 に始めたと述べ、コントラクトの最初のコミットは 2017-12-24"}

architecture:
  onchain:
    level: partial-rules
    detail: >-
      モンスターのデータ（EtheremonData）、捕獲・世界（EtheremonWorld）、城の作成と攻撃・勝敗・経験値（EtheremonBattle）、取引（EtheremonTrade）、変身、ERC-721 化がコントラクトにある。
      対戦の乱数は直前ブロックのハッシュとプレイヤーアドレスから作られる（getRandom）。調査論文は、追加された一部の要素は完全にはコントラクトで実装されていない可能性があると記す。
    s: [src-etheremon-code, src-etheremon-survey-2019]
  offchain:
    - {item: "Web クライアント、アドベンチャーモード等の一部要素（どこまでがオンチェーンかは未確認）", s: [src-etheremon-bgamer-2018, src-etheremon-survey-2019]}
    - {item: "Decentraland と連携した VR 対戦の構想（2018 年時点でデモ）", s: [src-etheremon-bgamer-2018]}
  admin:
    level: significant
    detail: >-
      各コントラクトに owner とモデレーターがあり、モデレーターはモンスターの経験値の増減（increaseMonsterExp / decreaseMonsterExp）、任意のモンスターの作成・上書き（addMonsterObj / setMonsterObj、EtheremonData）、型相性・ゲーム設定の変更、城の除去、コントラクト参照先の変更、ETH の引き出しができる。
      owner は isMaintaining で機能を停止できる。
    s: [src-etheremon-code]
  open_source:
    level: partial
    detail: "スマートコントラクトは etheremon/smartcontract で公開。クライアントのソースは確認できなかった。"
    url: "https://github.com/etheremon/smartcontract"
    s: [src-etheremon-code, src-etheremon-github-org]
  extensibility:
    level: none
    detail: "コントラクト間の参照先や設定はモデレーターが変更する設計で、第三者がルールを追加する仕組みは確認できなかった。"
    s: [src-etheremon-code]

compare:
  gameplay: {t: "モンスターを捕まえて育て、他プレイヤーが作った城（3 体＋支援 3 体）を攻撃して勝てば経験値と報酬を得る。トレーニング、対戦、アドベンチャーなど 4 つのモードがあった。", k: fact, s: [src-etheremon-code, src-etheremon-bgamer-2018]}
  necessity: {t: "モンスターの所有と対戦結果を運営の DB 外に置く意図だが、モデレーターが経験値や設定を書き換えられるため、判定の改変不能性は限定的。", k: analysis, s: [src-etheremon-code]}
  information: {t: "モンスターの能力・城の構成は公開。乱数は直前ブロックハッシュ由来で、同じブロック内では予測可能。", k: fact, s: [src-etheremon-code]}
  persistence: {t: "コントラクトは残るが、owner が maintaining を有効にすると機能が止まる。運営の継続に依存する設計。", k: fact, s: [src-etheremon-code]}
  extensibility: {t: "第三者による拡張の例は確認できなかった。", k: unknown}
  money_flow: {t: "モンスターの購入（0.03 ETH から）が主な収入源。EMONT は総量 2000 万で 70% をゲーム内で採掘させる設計と報じられた。", k: fact, s: [src-etheremon-egamers-2018]}
  entry_barrier: {t: "Ethereum ウォレット、ETH とガス代が必要。報道は基本無料プレイと記すが、その範囲は未確認。", k: fact, s: [src-etheremon-egamers-2018]}

concepts: [c-nft-asset, c-onchain-rules, c-onchain-randomness, c-fungible-ingame-token, m-collectible-cards, e-p2e]

acquisition:
  audience: [players]
  summary: {t: "最初のプレイヤーは、2017-12 の CryptoKitties ブームの直後に Ethereum 上の収集ゲームを探していた利用者だった。公開ベータ（2017-12-18）の当初の規則では、同じ種類のモンスターが後から買われるたびに先に買った人へ ETH が戻り（報道と、gen0 の払い戻しを清算する 2017-12-24 のコントラクトで確認）、早く買う動機になったと考えられる。", k: analysis, s: [src-etheremon-criptonoticias-2017, src-etheremon-code]}
  steps:
    - {phase: launch, date: "2017-12-18", t: "ベータ版として公開した。スペインの暗号資産メディアは、ベータ中に一部のモンスターが 0.694〜1.143 ETH で取引されたと報じ、P2P の市場は 1 月 1 日から開くと伝えた。", k: fact, s: [src-etheremon-criptonoticias-2017]}
    - {phase: launch, date: "2017-12", t: "当初の仕組みでは、同じ種類・種のモンスターが後から買われると、先に買った保有者に払い戻し（devolución）が入った。開発者はこれが投機を促すとして、1 種あたり 22 体の上限を設け、追加の収益をなくす新ルールに置き換えると説明した。", k: claim, who: "開発チーム（CriptoNoticias の記事内）", s: [src-etheremon-criptonoticias-2017], q: "los demás competidores recibian una cantidad de dinero de devolución como incentivo"}
    - {phase: launch, date: "2017-12-24", t: "公開リポジトリの最初のコミット（v.beta.0.02）の EtheremonWorld.sol は、gen0 の 24 クラスを「return price があり、このコントラクトのデプロイ時にはもう捕獲できない」とコメントし、各クラスの元の価格（0.1〜1 ETH）、returnPrice（多くは元の価格の 1%）、捕獲済み総数（82〜518 体、計 8,479 体。卵からの誕生は含まない）を定数で持つ。保有者は、自分の後に同じクラスで捕獲された数 × returnPrice を cashOut で引き出せる。12-18〜12-24 に実際に動いていた最初のコントラクトはリポジトリになく、払い戻しが捕獲のたびにどう積み上がったかは直接確認できていない。", k: fact, s: [src-etheremon-code], q: "Gen0 has return price & no longer can be caught when this contract is deployed"}
    - {phase: launch, date: "2017-12-24", t: "同じコントラクトでは、gen0 以外のクラスの捕獲価格は、そのクラスの既存の捕獲数 1 体ごとに元の価格の 0.1% 上がる（priceIncreasingRatio = 1000）。1 アドレスが持てる数の上限は 500 体（maxDexSize）。", k: fact, s: [src-etheremon-code]}
    - {phase: growth, date: "2017-12-26", t: "英語の暗号資産ブログは、CryptoKitties と並べて Etheremon を紹介し、1 月に予定された更新は加わり続ける多数の利用者に対応するためだと書いた。", k: fact, s: [src-etheremon-emchat-2017]}
    - {phase: growth, date: "2018-01", t: "運営の 2018 年の振り返りによれば、1-03 に城の対戦、1-14 にジム、1-21 に変身・産卵のルールとゲーム内通貨 EMONT を導入した（Medium は取得できず、検索要約のみ）。", k: claim, who: "Etheremon 運営", s: [src-etheremon-medium-2018-lookback]}
    - {phase: growth, date: "2018-03", t: "Twitter で Decentraland への参加を発表した。TechNews によれば、当時の対戦は文字の流れのみで、VR の画面はなかった。", k: fact, s: [src-etheremon-technews-2018]}
    - {phase: growth, date: "2018-07", t: "共同創業者 Nedrick Ngo は、ガス代の高騰で日次アクティブユーザーが大きく減ったと述べ、対戦を Zilliqa のサイドチェーンへ移す計画を語った。", k: claim, who: "Nedrick Ngo（共同創業者、CoinDesk の記事内）", s: [src-etheremon-coindesk-2018], q: "we saw our daily active users drop a lot."}
  channels:
    - {id: existing-community, t: "対象は CryptoKitties ブームで MetaMask と ETH を用意していた Ethereum の利用者で、当時の報道も CryptoKitties との比較で紹介した。", k: analysis, s: [src-etheremon-criptonoticias-2017, src-etheremon-emchat-2017]}
    - {id: viral-mechanic, t: "gen0 では同じクラスが後から捕獲されるたびに先の保有者に ETH が積み上がり（コントラクト上は 1 体ごとに元の価格の約 1%）、保有者に他人を呼び込む動機を与える構造だった。実際に拡散を生んだかを示す資料はない。", k: analysis, s: [src-etheremon-code, src-etheremon-criptonoticias-2017]}
    - {id: ip-brand, t: "Pokémon を明示的に参照し、創業者は「人々が Pokémon にどれほど夢中か」を引き合いに出した（Pokémon の公式な提携ではない）。", k: claim, who: "Jarvis Nguyen（創業者、TechNews の記事内）", s: [src-etheremon-technews-2018, src-etheremon-coindesk-2018]}
    - {id: press, t: "公開直後にスペイン語・英語の暗号資産メディアが CryptoKitties と並べて紹介した。", k: fact, s: [src-etheremon-criptonoticias-2017, src-etheremon-emchat-2017]}
  cost:
    - {t: "獲得の原資はプレイヤーの ETH だった。モンスターの捕獲代金の一部が、同じクラスに先に入った保有者への払い戻しにあてられる構造で、後から入った人が先に入った人に払った。", k: fact, s: [src-etheremon-code, src-etheremon-criptonoticias-2017]}
    - {t: "EMONT は総量 2000 万のうち 70% をゲーム内で採掘させる設計とされ、2018-01 以降はトークンによる報酬も加わった。", k: fact, s: [src-etheremon-egamers-2018, src-etheremon-medium-2018-lookback]}
    - {t: "広告などの獲得費用と外部からの資金調達は確認できなかった。", k: unknown}
  after:
    - {t: "2018-07 には DappRadar で直近 24 時間の利用者が 209 人、2018-08 頃には月 465 人とされた。共同創業者はガス代高騰で日次の利用者が大きく減ったと述べた。", k: fact, s: [src-etheremon-coindesk-2018, src-etheremon-bgamer-2018]}
    - {t: "累計では 2018-08 までに 3 万 5000 体超のモンスターが購入され、15 万回の対戦があったとされるが、出典不明の数字で、継続率は示されていない。", k: fact, s: [src-etheremon-egamers-2018]}
  counter:
    - {t: "流入は CryptoKitties ブームと 2017 年末の相場上昇期に重なっており、払い戻しの仕組みではなく、新しい収集ゲームへの全体的な関心が人を呼んだ可能性がある。", k: analysis, s: [src-etheremon-emchat-2017]}
    - {t: "2017-12-24 のコントラクトが記す gen0 の捕獲済み 8,479 体はモンスターの数で、人数ではない。1 アドレスで最大 500 体まで持てる設計で、払い戻しは早い捕獲ほど大きい（例: クラス 1 の最初の捕獲者は、後続 373 体 × 0.003 ETH で約 1.12 ETH、代金 0.3 ETH の約 3.7 倍）ので、少数のアドレスがまとめ買いした可能性がある。ベータの「人気」を人数の多さと読むことはできない。", k: analysis, s: [src-etheremon-code]}
    - {t: "払い戻しの仕組みは開発者自身が投機を促すとして公開直後に改めると説明しており、仕組みが集めた人がプレイヤーとして残ったかは疑わしい。利用者の減少についても、共同創業者はガス代高騰を理由に挙げており、獲得施策の失敗とは区別できない。", k: analysis, s: [src-etheremon-criptonoticias-2017, src-etheremon-coindesk-2018]}
  lessons:
    - {t: "後続購入からの払い戻し: 同じ種類が後から買われるたびに先の保有者へ還元すると、早期購入と勧誘の動機が強く働く。効く条件は新規購入が続くこと。破綻条件は、流入が止まると還元も止まり、後から買った人ほど回収できない構造になることで、開発者自身が投機を促すとして撤回した。", k: analysis}
    - {t: "ブームの直後に既存のウォレット利用者を拾う: 先行作が作ったウォレットと ETH を持つ人たちに、似た収集の仕組み＋対戦という差分で入ると、獲得費用は小さい。ただし、基盤のガス代が上がるとその人たちごと離れる。", k: analysis, s: [src-etheremon-coindesk-2018]}
  metrics: [m-etheremon-mau-2018-08, m-etheremon-dau-2018-07, m-etheremon-mons-2018, m-etheremon-battles-2018, m-etheremon-gen0-caught-2017-12]
  unknowns:
    - "ベータ公開時の実際の returnPrice の値と、22 体上限への変更日。"
    - "公開初月のプレイヤー数・取引数（運営の振り返りは公開 3 日で 1 万 4000 件の取引・gen0 9,516 体と主張するとされるが、Medium の本文は取得できず。コントラクト定数の gen0 捕獲数 8,479 体とは一致しない）。"
    - "12-18〜12-24 に稼働した最初のコントラクトのアドレスとソース、そこでの returnPrice の実際の積み上げ方。"
    - "Discord・Telegram・Reddit などのコミュニティの規模と開設時期。"

