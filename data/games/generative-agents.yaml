id: generative-agents
name: "Generative Agents: Interactive Simulacra of Human Behavior"
aliases: ["Smallville", "Generative Agents（Park et al. 2023）"]
kind: research
depth: index
updated: "2026-10-23"
links:
  website: https://arxiv.org/abs/2304.03442
  github: https://github.com/joonspk-research/generative_agents
chains: []
team: "Joon Sung Park, Joseph C. O'Brien, Carrie J. Cai, Meredith Ringel Morris, Percy Liang, Michael S. Bernstein（Stanford University / Google Research）"
summary: >-
  大規模言語モデルに「記憶の流れ・反省（reflection）・計画」を組み合わせた生成エージェントを提案し、The Sims 風の町 Smallville に 25 人を住まわせた研究（2023 年、UIST '23）。
  1 人に「バレンタインパーティーを開きたい」という意図を与えると、2 ゲーム日のうちに 25 人中 13 人がパーティーを知り、招待された 12 人中 5 人が実際に集まった。
  ブロックチェーンを一切使わずに、エージェント社会の創発的な振る舞いを示した代表例である。
selection_reason: >-
  「AI が住む世界」「AI と人間が遊ぶ文明シミュレーション」の基準点として頻繁に参照される論文である（AI Town は README で着想元と明記し、Project Sid は参考文献に挙げる）。オフチェーンの研究用サーバーだけで社会的な創発が得られたことは、
  エージェント社会にチェーンが必須ではないことの基準点になる。同時に、2 日間の実行に数千ドルと数日を要したというコスト記述は、常時稼働する世界の制約を示す。
categories:
  - {id: ai, role: primary, reason: "LLM エージェントの記憶・反省・計画アーキテクチャと、その社会的振る舞いの評価"}
status:
  value: archived
  as_of: "2026-10"
  note: "論文（arXiv v2: 2023-08-06）とコードは公開されたまま。研究としての実験は完了しており、継続運営される世界ではない。"
  s: [src-ga-arxiv, src-ga-github]
dates:
  announced: {date: "2023-04-07", s: [src-ga-arxiv], note: "arXiv v1 投稿日"}
  launched: {date: "2023", s: [src-ga-github], note: "コード公開。リポジトリの最初のコミットは 2023-07-23、外部コントリビュータの PR #24 が 2023-08-11 に merge されており、遅くともその時点で公開済み。公開日そのものは未確認（検証時に git clone で確認）"}

architecture:
  onchain:
    level: none
    detail: "ブロックチェーンは使わない。世界の状態はサーバー（Python のシミュレーションと Django の環境）にあり、エージェントの判断は OpenAI API 経由の言語モデル（論文では ChatGPT）。"
    s: [src-ga-arxiv-pdf, src-ga-github]
  offchain:
    - {item: "シミュレーションサーバー（reverie/backend_server）と Smallville の Django 環境。1 ステップは 10 秒のゲーム内時間", s: [src-ga-github]}
    - {item: "言語モデル推論（OpenAI API。README は 2023 年初時点で実行費用がかさむと注意）", s: [src-ga-github]}
  admin:
    level: none-known
    detail: "研究用のローカル実行コードで、運営による管理という概念がない。実行者が世界とエージェントを完全に制御する。"
    s: [src-ga-github]
  open_source:
    level: full
    detail: "シミュレーションモジュールと環境、25 人・3 人の初期状態を Apache-2.0 で公開。"
    url: "https://github.com/joonspk-research/generative_agents"
    s: [src-ga-github]
  extensibility:
    level: client-mods
    detail: "コードの改変・フォークによる拡張。a16z-infra の AI Town は README でこの論文に着想を得たと明記している。"
    s: [src-ga-github, src-aitown-repo]

compare:
  gameplay: {t: "エンドユーザーは自然言語で町の 25 人のエージェントと対話できる。25 人のエージェントは起床・仕事・会話・計画を自律的に行う。", k: fact, s: [src-ga-arxiv]}
  necessity: {t: "チェーンなしで社会的創発（情報拡散、関係形成、イベントへの集合）を示した。所有や支払いの要素がなく、オンチェーン化の必然性はない。", k: analysis, s: [src-ga-arxiv-pdf]}
  information: {t: "研究者は全エージェントの記憶ストリームを閲覧でき、幻覚の有無を記憶と照合して検証した。", k: fact, s: [src-ga-arxiv-pdf]}
  persistence: {t: "世界は実行者のマシン上だけに存在し、実行を止めれば止まる。保存済みのシミュレーションは再生できる。", k: fact, s: [src-ga-github]}
  extensibility: {t: "オープンソースのコードとして第三者が改変・再実装できる。AI Town はその JS/TS 版の出発点を掲げた。", k: fact, s: [src-ga-github, src-aitown-repo]}
  money_flow: {t: "資金循環はない。費用は実行者が払う LLM API の利用料で、論文は 25 人・2 日の実行に数千ドルかかったと記す。", k: fact, s: [src-ga-arxiv-pdf], q: "costing thousands of dollars in token credits and taking multiple days to complete"}
  entry_barrier: {t: "Python 環境と OpenAI API キーが必要。一般プレイヤー向けの製品ではない。", k: fact, s: [src-ga-github]}

concepts: [c-ai-agent-player]

article:
  principles:
    - {t: "記憶ストリーム＋反省＋計画: すべての観察を自然言語で記録し、重要度・新しさ・関連度で検索し、定期的に高次の「反省」にまとめて計画に使うと、短期の会話を超えた一貫した振る舞いが得られる。適用条件は LLM 呼び出しの費用と待ち時間を許容できること。破綻条件は記憶が増えすぎた場合で、論文自身が関連情報の検索や行動場所の選択が難しくなる（昼食に夜向けのバーへ行く等）と報告している。", k: analysis, s: [src-ga-arxiv-pdf]}
    - {t: "1 つの種（意図）を与えて社会的連鎖を観察する: 1 人のエージェントに目標を与えるだけで、招待の拡散や集合が起きる。適用条件はエージェント同士が出会う空間と時間があること。破綻条件は、情報が届いても行動に結びつく保証がないこと（招待された 12 人中 5 人のみ出席。来なかった 7 人のうち 3 人は予定の衝突を挙げ、4 人はインタビューで関心を示したが当日の予定に入れていなかった）。", k: analysis, s: [src-ga-arxiv-pdf]}
  counter_evidence:
    - {t: "社会的創発はチェーン、トークン、所有権のいずれも使わずに得られた。エージェント社会を作るためにブロックチェーンが必要だという主張に対する反証の基準点になる。", k: analysis, s: [src-ga-arxiv-pdf]}
    - {t: "統制評価の従属変数は「信じられるか（believability）」で、100 人の評価者が 1 体のエージェントのインタビュー回答を 4 種のアーキテクチャと人間（クラウドワーカー）作成の条件で順位付けし TrueSkill で集計した。経済・生産・戦闘のような規則的な成果は測っていない。", k: fact, s: [src-ga-arxiv-pdf]}
    - {t: "情報拡散と関係形成は、シミュレーション終了時（関係形成は開始時と終了時）に各エージェントへ「知っているか」と質問した回答で判定しており、行動として観察されたのはパーティーへの出席のみ。肯定回答は記憶ストリームと照合されたが、他エージェントについての回答 453 件のうち 1.3%（6 件）は幻覚だった。", k: fact, s: [src-ga-arxiv-pdf]}
    - {t: "論文自身が、指示調整（instruction tuning）の影響でエージェントが過度に丁寧・協力的になり、Isabella は他者の提案をほとんど断らず関心まで他者に寄っていったと報告している。協調や情報拡散の「創発」の一部は、基盤モデルの協力的な傾向で説明できる可能性がある。", k: analysis, s: [src-ga-arxiv-pdf]}
    - {t: "25 人・2 ゲーム日という規模と、数千ドル・数日の実行コストは、常時稼働する大規模な世界へそのまま外挿できないことを示唆する。", k: analysis, s: [src-ga-arxiv-pdf]}

