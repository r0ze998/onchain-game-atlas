ids:
  coingecko: [stepn, green-satoshi-token]
chains: [Solana, BNB Chain, Polygon, Ethereum（GMT・GST の ERC 版は現在 inactive と記載）]
team: "Find Satoshi Lab（FSL）"
summary: >-
  NFT のスニーカーを持って屋外を歩く・走ると、スマートフォンの GPS で計測された移動に応じてトークンが得られる「move & earn」アプリ。
  報酬用の GST（供給上限なし）と統治・高位報酬用の GMT（上限 60 億）の二重トークンで、スニーカーの作成・修理・レベル上げに GST/GMT を燃やす。
  2022 年春に急成長したが、同年 5 月の中国本土向け GPS 停止の発表と前後してトークン価格と利用者数が大きく下落し、運営は作成コストや報酬規則を繰り返し変更した。
selection_reason: >-
  ゲームの判定（移動の計測・不正判定）はすべて運営のサーバーとアプリにあり、チェーンは資産と通貨にだけ使われる「P2E 型」の代表例。
  二重トークンの sink/faucet 調整、運営発表の利用者数と第三者計測・市場価格の乖離、規制対応による地域遮断が、短期間に公開資料で追える。
categories:
  - {id: p2e, role: primary, reason: "移動に応じて GST/GMT を付与し、スニーカー NFT の購入を前提とする稼ぐ型の設計"}
  - {id: assets, role: secondary, reason: "スニーカー・宝石・ミント用スクロールが NFT として外部マーケットでも取引される"}
status:
  value: active
  as_of: "2026-10"
  note: "ホワイトペーパーの変更履歴は 2026-07-13 まで更新され、アプリの配布リンクも有効。ホワイトペーパー自体は「Public Beta」段階と記す。"
  s: [src-stepn-wp-changelog, src-stepn-wp-overview]
dates:
  launched: {date: "2021-12-20", s: [src-stepn-bw-public-beta, src-stepn-wp-overview], note: "公開ベータの発表日（公式プレスリリース、当初はスニーカー NFT 保有者に限定）。それ以前に Solana Ignition Hackathon 2021 で 4 位"}

architecture:
  onchain:
    level: assets-only
    detail: >-
      GST・GMT（SPL / BEP-20 / Polygon、ETH 版は inactive）とスニーカー等の NFT がチェーン上の資産。移動の計測、報酬計算、エネルギー、不正判定（SMAC）、
      スニーカーの作成・修理などのゲーム内処理はアプリ内の「Spending Account」で行われ、ゲーム内で使った GST は毎日 Spending Account から燃やすと記載。
    s: [src-stepn-wp-tokenomic, src-stepn-wp-governance, src-stepn-wp-gst-earning]
  offchain:
    - {item: "GPS による移動計測と、人間・乗り物・複数端末・ボットを判定する SMAC（現行 SMAC-7）。判定とチューリング・スコアに応じて報酬没収・出金制限・アカウント停止", s: [src-stepn-wp-anticheat]}
    - {item: "エネルギーの全体補充（1 日 4 回、UTC 1/7/13/19 時）と報酬計算はアプリ側", s: [src-stepn-wp-energy]}
    - {item: "iOS 版では Apple Pay で買う譲渡不可の SPARK でスニーカーを購入", s: [src-stepn-wp-tokenomic]}
  admin:
    level: significant
    detail: >-
      報酬率・作成コスト・クールダウン・半減期など主要な経済パラメータを運営が変更履歴として随時改定してきた。不正判定による報酬没収・出金制限・アカウント停止の権限を持ち、
      2024-05-23 以前の未発見の不正を一括で赦免する方針も運営が決めた。エコシステム基金の GMT のチェーン間移動・焼却も運営が実施し記録を公開している。
    s: [src-stepn-wp-changelog, src-stepn-wp-anticheat, src-stepn-wp-governance]
  open_source:
    level: none
    detail: "アプリとサーバーのソースは公開されていない（公開リポジトリは確認できなかった）。"
    s: [src-stepn-wp-overview]
  extensibility:
    level: none
    detail: "第三者がゲームの規則を拡張できる仕組みは確認できない。NFT とトークンは外部市場で取引できる。"
    s: [src-stepn-wp-tokenomic]

compare:
  gameplay: {t: "スニーカー（Walker/Jogger/Runner/Trainer）ごとの最適速度で歩く・走ると、エネルギー 1 につき 5 分ぶん GST（レベル 30 以降は GMT も選択可）を得る。スニーカーの作成・レベル上げ・宝石・修理で報酬効率を上げる。", k: fact, s: [src-stepn-wp-gst-earning, src-stepn-wp-energy, src-stepn-wp-gmt-earning]}
  necessity: {t: "チェーンが担うのは資産の所有と外部市場での換金性だけで、移動の判定は運営の GPS 解析に依存する。報酬に換金性を与えることが急成長と急落の両方の原因になった可能性がある。", k: analysis, s: [src-stepn-wp-anticheat, src-stepn-blockcrunch]}
  information: {t: "移動データ・判定結果・報酬計算は運営側にあり、プレイヤーはチューリング・スコアを信号の色で見るだけ。判定の詳細は不正対策のため限定公開と明記。", k: fact, s: [src-stepn-wp-anticheat]}
  persistence: {t: "運営が GPS を止めれば報酬は得られない。2022-07-15 に中国本土のアカウントへの GPS 提供を停止すると 2022-05 に発表した。", k: fact, s: [src-stepn-decrypt-china]}
  extensibility: {t: "第三者による拡張の仕組みは確認できない。", k: fact, s: [src-stepn-wp-overview]}
  money_flow: {t: "新規参加者が GMT 等でスニーカー（NFT）を買い、移動で GST/GMT を得て、作成・修理・レベル上げで燃やす。マーケットの取引手数料 2% は運営の運営費に充てると 2022-02-19 の変更履歴に記載。Q1 2022 のマーケット手数料・ロイヤルティ収入は 192,635 SOL と FSL の報告にあると ForkLog は報じた。", k: fact, s: [src-stepn-wp-changelog, src-stepn-forklog-2022-04]}
  entry_barrier: {t: "スニーカー NFT の購入が必須（2022-04 時点で最安 11.59 SOL ≈ 1,216 ドルと ForkLog は記載）。メールで登録しアプリ内ウォレットを作る。エネルギー上限は保有スニーカー数で増える。", k: fact, s: [src-stepn-wp-getting-started, src-stepn-forklog-2022-04, src-stepn-wp-energy]}

concepts: [e-p2e, e-dual-token, e-sink-faucet, c-nft-asset, c-fungible-ingame-token, m-bot-automation]

article:
  principles:
    - {t: "二重トークンで作成コストを動的に付け替える: 報酬トークン（GST）の価格が暴落・暴騰すると固定の作成コストが機能しなくなるため、STEPN は 2022 年に作成コストの GST/GMT 比率を何度も改め、2023-06 には追加 GMT コストを GST/GMT 比で決めるようにした。適用条件は二つのトークンの価格が独立に動き、片方を sink の調整弁にできること。破綻条件は両方の価格が新規流入に依存している場合で、調整は下落の速度を変えるだけになる。", k: analysis, s: [src-stepn-wp-changelog, src-stepn-blockcrunch]}
    - {t: "現実の行動を報酬にするなら判定はオフチェーンの運営に集中する: GPS の真偽判定（SMAC）とチューリング・スコアによる出金制限は、運営を信頼しない設計と両立しない。適用条件は運営が判定の正当性を担保できる規模であること。破綻条件は判定を回避する端末・ボットの改良が報酬額に見合う場合。", k: analysis, s: [src-stepn-wp-anticheat]}
  counter_evidence:
    - {t: "利用者の急減は中国本土の GPS 停止発表（2022-05-26）と時期が重なるが、Motley Fool は類似アプリとの競争、暗号資産市況、季節性を挙げ、中国には触れていない。トークン設計だけが原因とは断定できない。", k: claim, who: "The Motley Fool（Dominic Basulto）", s: [src-stepn-fool-2022-10, src-stepn-decrypt-china]}
    - {t: "Blockcrunch は、利用者が稼ぎ続ける選択は容易なので既存利用者の継続は保たれやすく、より大きなリスクは損益分岐の長さが新規参加を妨げることだと分析した。継続率の悪化ではなく流入の停止が問題だった可能性がある。", k: claim, who: "Blockcrunch（Jason Choi, Javier Ang）", s: [src-stepn-blockcrunch]}

acquisition:
  audience: [players]
  summary: {t: "最初の利用者は Solana Ignition Hackathon（2021-08〜10）での露出で集まったベータ参加者と、Magic Eden でスニーカー NFT を買った Solana の暗号資産利用者だった。2022-01 からは既存利用者がアプリ内の招待コード（Activation Code）を配る招待制で広がり、2022-03 の GMT の Binance Launchpad 販売と 2022-04 の Crypto Twitter での流行で急拡大した。", k: analysis, s: [src-stepn-techcrunch-2022-05, src-stepn-bw-public-beta, src-stepn-wp-changelog, src-stepn-decrypt-2022-06]}
  steps:
    - {phase: pre, date: "2021", t: "Solana Ignition Hackathon（2021-08-31〜10-15、最終提出 568 件）の Gaming 部門で 4 位になった。TechCrunch によれば、この露出が最初のベータ利用者の獲得につながった。", k: fact, s: [src-stepn-solana-ignition, src-stepn-wp-overview, src-stepn-techcrunch-2022-05], q: "After coming in fourth, its exposure at the event helped land its first batch of beta users."}
    - {phase: pre, date: "2021-11", t: "創業者は当初自己資金で開発し、2021-11 に Sequoia Capital などから 500 万ドルのシードを調達した。", k: fact, s: [src-stepn-techcrunch-2022-05]}
    - {phase: launch, date: "2021-12-20", t: "公開ベータを発表。当初は Magic Eden で入手できるスニーカー NFT を持つ利用者だけに機能を開放した。", k: fact, s: [src-stepn-bw-public-beta]}
    - {phase: launch, date: "2022-01-09", t: "アプリ内の Activation Code を導入し、各利用者は一定数のコードを友人・家族に渡せ、使い切った後は 10 エネルギー消費ごとに 1 つ追加で生成できるとした（現行の記述は「招待制のゲーム」で、保有は同時に 1 つまで）。", k: fact, s: [src-stepn-wp-changelog, src-stepn-wp-activation]}
    - {phase: growth, t: "TechCrunch によれば、公開時にはすでに暗号資産コミュニティで評判が広がっており、大規模な広告なしに登録が殺到し、数週間で 1 日の登録数に上限を設けた。", k: claim, who: "TechCrunch（Rita Liao）", s: [src-stepn-techcrunch-2022-05]}
    - {phase: growth, date: "2022-03-09", t: "GMT を 60 億枚発行（TGE）。第三者の集計では同日 Binance Launchpad で供給の 7%（4.2 億 GMT）を 1 GMT 0.01 ドルで販売し 420 万ドルを集めた。", k: fact, s: [src-stepn-wp-gmt-vesting, src-stepn-coincodex-ieo]}
    - {phase: growth, date: "2022-04", t: "Decrypt によれば 2022-04 に Crypto Twitter と Web3 界隈で大流行し、運営は同月「300k DAU」を投稿した。GMT は 2022-04-27 に最高値 4.11 ドルを付けた。", k: fact, s: [src-stepn-decrypt-2022-06, src-stepn-forklog-2022-04, src-stepn-coingecko-gmt]}
    - {phase: growth, date: "2022-06", t: "CMO の Shiti Manghani は月間アクティブ 300 万人、利用者の 3 分の 1 が暗号資産の新規参入者だとし、招待コードは新規利用者が古参の「出口流動性」にならないよう流入を絞るためだと説明した。", k: claim, who: "STEPN CMO Shiti Manghani（Decrypt）", s: [src-stepn-decrypt-2022-06], q: "funnel the inflow of users so that the new users don't end up becoming the exit liquidity for the older users"}
  channels:
    - {id: hackathon, t: "Solana Ignition Hackathon の Gaming 部門 4 位（568 件中）で露出し、最初のベータ利用者を得た。", k: fact, s: [src-stepn-solana-ignition, src-stepn-techcrunch-2022-05]}
    - {id: platform-distribution, t: "公開ベータは Magic Eden で売られるスニーカー NFT の保有者に限定して始まり、GMT は Binance Launchpad で販売された。", k: fact, s: [src-stepn-bw-public-beta, src-stepn-coincodex-ieo]}
    - {id: invite-gating, t: "登録に既存利用者の Activation Code が必要で、コードは 10 エネルギー（＝運動 50 分）ごとに生成されるため、招待枠は既存利用者の活動量に比例して増えた。運営はマーケティングのために時々コードを不要にするとも記す。", k: fact, s: [src-stepn-wp-activation, src-stepn-wp-changelog, src-stepn-wp-energy]}
    - {id: token-incentive, t: "移動に応じて GST（上限なし）と GMT を付与し、GMT の 30% を move&earn と統治参加で配る設計にした。", k: fact, s: [src-stepn-wp-gmt-vesting, src-stepn-wp-gst-earning]}
    - {id: crypto-social, t: "2022-04 に Crypto Twitter と Web3 界隈で流行した（Decrypt）。", k: fact, s: [src-stepn-decrypt-2022-06]}
  cost:
    - {t: "開発は当初創業者の自己資金、2021-11 から 500 万ドルのシード資金。GMT の Launchpad 販売は第三者集計で 420 万ドル。", k: fact, s: [src-stepn-techcrunch-2022-05, src-stepn-coincodex-ieo]}
    - {t: "報酬の GST は上限なく発行され、その現金価値は新しくスニーカーを買う参加者と作成・修理のための需要が支えた。運営収入（2022 Q1 のマーケット手数料・ロイヤルティ 192,635 SOL）も参加者の取引から得ていた。", k: analysis, s: [src-stepn-wp-tokenomic, src-stepn-forklog-2022-04, src-stepn-blockcrunch]}
  after:
    - {t: "Dune に基づく第三者集計では MAU は 2022-05 の 70 万超から 2022-12 には 4.5 万弱に減った。継続率・コホート別の数値は公開されていない。", k: fact, s: [src-stepn-decrypt-2023]}
  counter:
    - {t: "急拡大の時期（2022-03〜04）は GMT の Launchpad 販売と最高値（04-27）に重なり、招待制や運動の魅力より、トークン価格の上昇が流入を説明する可能性がある。", k: analysis, s: [src-stepn-coincodex-ieo, src-stepn-coingecko-gmt, src-stepn-decrypt-2022-06]}
    - {t: "招待制は流入を絞るためと運営は説明するが、コードが希少なほど入手競争と話題を生み、むしろ投機的な期待を強めた可能性もある。招待制で投機を抑えられた証拠は示されていない。", k: analysis, s: [src-stepn-decrypt-2022-06, src-stepn-coinpost-2022-06]}
    - {t: "CMO の「月間 300 万人」と Dune 集計の 2022-05 の 70 万超は 4 倍以上離れており、利用者数の定義（登録・アプリ起動・オンチェーン活動）が異なる。", k: analysis, s: [src-stepn-decrypt-2022-06, src-stepn-decrypt-2023]}
  lessons:
    - {t: "【活動量に比例する招待枠】招待コードを一定の活動（10 エネルギー消費）ごとに 1 つ生成させると、実際に使っている利用者だけが勧誘者になり、招待枠が利用量とともに増える。効く条件: 報酬や話題性で招待コード自体に需要がある。破綻条件: コードが転売・配布サイトで流通すると選別の機能が消え、報酬目的の流入を止められない。", k: analysis, s: [src-stepn-wp-activation, src-stepn-wp-changelog]}
    - {t: "【NFT 保有者限定の公開ベータ】最初の利用者を NFT の購入者に限ると、初期から資金を払った層だけで経済を回せる一方、参加費が新規流入の壁になる（2022-04 の最安スニーカーは 1,000 ドル超）。破綻条件: 報酬トークン価格が下がると、参加費を回収できない新規参加者が来なくなる。", k: analysis, s: [src-stepn-bw-public-beta, src-stepn-forklog-2022-04, src-stepn-blockcrunch]}
  metrics: [m-stepn-seed-2021-11, m-stepn-gmt-launchpad, m-stepn-dau-2022-04-reported, m-stepn-mau-2022-06-cmo, m-stepn-mau-2022-05-dune, m-stepn-mau-2022-12-dune, m-stepn-gmt-ath]
  unknowns:
    - "ベータ利用者の最初の人数、公開ベータ時点のスニーカー販売数"
    - "招待コードの初期配布数と、コードが不要になった期間"
    - "地域別の初期利用者（日本・韓国などでの流行の時期。TechCrunch は中国本土は 5% 未満とする）"
    - "Binance Launchpad 販売の一次資料（Binance の告知ページは取得できなかった）"

