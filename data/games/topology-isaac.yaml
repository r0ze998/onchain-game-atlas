id: topology-isaac
name: Isaac (Topology)
name_ja: アイザック（Topology）
aliases: [Isaac, "Isaac Alpha"]
kind: game
depth: index
updated: "2026-10-23"
chains: [StarkNet testnet]
team: "Topology（GuiltyGyoza ほか。2022-12 時点でエンジニア 3 人以下）"
summary: >-
  三つの太陽を持つ星系で、全プレイヤーが同じ惑星に住む一つの文明として協力し、資源採取 → 精製 → 発電 → 推進機関（NDPE）の生産網を組み、
  惑星を太陽への衝突から救う、または星系から脱出させることを目指した大規模協力型ゲーム。三体問題の軌道計算（4 次ルンゲ＝クッタ）と
  資源輸送・電力分配の法則を Cairo コントラクトに置き、StarkNet 上で「物理演算を持つオンチェーン世界」を試みた。
  テストネットで 2 ラウンドのアルファ（約 13 人）を行ったのち、運営は中断し、その理由を詳しく公開した。
selection_reason: >-
  「生産チェーン＋協力＋オンチェーン物理」という、文明・工場型オンチェーンゲームの初期の試みであり、
  開発者自身が「なぜうまくいかなかったか」（ブロック時間、協調ツールの欠如、複雑さによる反復の遅さ、直線的な進行）を書いた一次資料がある。
  生産・協力型のオンチェーンゲームを構想する際の、最も直接的な反証資料の一つ。
categories:
  - {id: onchain-rules, role: primary, reason: "軌道積分・資源輸送・電力分配の法則をスマートコントラクトに置き、ロールアップが強制すると説明"}
  - {id: aw, role: secondary, reason: "クライアント非依存と、最小限の自律的ガバナンス（Isaac Protocol）による正規インスタンスの開発を構想"}
status:
  value: ended
  as_of: "2026-10"
  note: "2022-12 の公式ニュースレターが、2 回のアルファの後に Isaac を棚上げ（shelved）したと説明。チームは Shoshin、続いて MuMu（MovyMovy）へ移った。参照日時点で topology-gg の GitHub 組織の isaac リポジトリはゲームと無関係な内容を表示していたが、ゲームのソースは guiltygyoza/isaac に残っている（最後の Isaac 本体の変更は 2022-09-10）。"
  s: [src-isaac-what-happened, src-isaac-after, src-isaac-github-org, src-isaac-repo]
dates:
  announced: {date: "2022-05-01", s: [src-isaac-presents], note: "DEFCON '22 での発表をまとめた記事"}
  launched: {date: "2022-08", s: [src-isaac-what-happened, src-isaac-repo], note: "Solve2Mint 2.0 の後に StarkNet テストネットで Isaac Alpha を 2 ラウンド実施（記事に日付なし）。コミット履歴では 2022-08-02 にクローズド・アルファ用パラメータ、2022-08-19 にオープン・アルファのコントラクト展開、2022-09-10 に alpha2 の変更"}
  ended: {date: "2022-12", s: [src-isaac-what-happened], note: "2022-12-13 の記事で棚上げを説明（棚上げ自体の日付は不明）"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      物理法則（三体の軌道積分、RK4）と「形而上の法則」（資源輸送・電力分配）を Cairo コントラクトに置き、StarkNet が強制すると説明。
      ゲーム内の乱数はプレイヤーの行動から Fiat–Shamir ヒューリスティクスで導き、物理シミュレーションに注入する計画だった（アルファでは非決定性を無効化）。
    s: [src-isaac-presents, src-isaac-what-happened]
  offchain:
    - {item: "バックエンド（同期）とフロントエンド（3 種のビュー）。保留中の建設がプレイヤー間で同期されない、建設した設備が地図に出ない等の不具合を、StarkNet フルノードの不安定さとバックエンド同期の問題に帰している", s: [src-isaac-what-happened, src-isaac-after]}
  admin:
    level: significant
    detail: "主要コントラクト（universe・lobby・charter・fsm・dao）は Goerli 上にプロキシ経由で展開され（deployed_isaac.json）、プロキシの change_implementation_hash は定数アドレス GYOZA だけが呼べる。Isaac Protocol（最小限の自律的ガバナンス、リポジトリでは CarseDAO）を予定していたと説明されたが、運用で実装の差し替え権限が移譲されたかは確認できなかった。"
    s: [src-isaac-presents, src-isaac-repo]
  open_source:
    level: full
    detail: "guiltygyoza/isaac に Cairo コントラクト（RK4 の軌道積分、Fiat–Shamir 風の種更新のコメントを含む）、各ビューのフロントエンド、Apibara バックエンド、Solve2Mint 2.0 が公開されている（Isaac 部分は Apache 2.0）。topology-gg/isaac は参照日時点で無関係な内容に置き換わっていた。"
    url: "https://github.com/guiltygyoza/isaac"
    s: [src-isaac-repo, src-isaac-presents, src-isaac-github-org]
  extensibility:
    level: unknown
    detail: "クライアント非依存（プレイヤーが独自のビューを作れる）を設計価値に掲げたが、第三者クライアントの例は確認できなかった。"
    s: [src-isaac-presents]

compare:
  gameplay: {t: "全員が 1 つの惑星の文明として、採取機・精製所・発電機・推進機関を建て、推進機関（NDPE）の噴射時刻を合わせて軌道を変え、太陽への衝突を避けるか脱出速度に達する協力ゲーム。", k: fact, s: [src-isaac-presents, src-isaac-what-happened]}
  necessity: {t: "運営は物理・経済法則をロールアップが強制する「オンチェーンの現実」を掲げたが、アルファの失敗要因（協調ツール・ブロック時間・同期）はオンチェーン化そのものの利点を検証する前に表面化した。", k: analysis, s: [src-isaac-presents, src-isaac-what-happened]}
  information: {t: "秘匿情報は使わず、不確実性は三体系のカオスから得ると説明（「隠し情報なしの情報非対称」）。", k: claim, who: "Topology", s: [src-isaac-presents]}
  persistence: {t: "テストネットの 2 ラウンドのみで、どのラウンドの文明も同じブロック高（574）で惑星 Ev が太陽 Boyuk に衝突して終わった。", k: fact, s: [src-isaac-what-happened]}
  extensibility: {t: "クライアント非依存を掲げたが、実例は確認できない。", k: unknown}
  money_flow: {t: "参加資格は Solve2Mint 2.0（50 問のオンチェーンパズル）で配布。トークン経済の記述は確認できなかった。", k: fact, s: [src-isaac-what-happened]}
  entry_barrier: {t: "パズルを解いて参加資格を得る必要があった。テストネットのブロック時間（最良で約 2 分、当時は 1 時間超もしばしば）で操作の応答性が極めて低かったと運営は書いた。", k: claim, who: "Topology", s: [src-isaac-what-happened]}

concepts: [c-onchain-rules, c-onchain-state, m-production-chain, c-onchain-randomness]

article:
  principles:
    - {t: "協力型の生産網には協調ツールが前提: 全員が 1 つの文明を動かす設計では、意思決定の委任・ゲーム内連絡・複数行動の一括送信がないと、匿名で時間帯の違うプレイヤーは進捗を出せない（Isaac のアルファではどのラウンドも有意な進捗なし）。適用条件はプレイヤー間の役割分担が必要な協力ゲーム。破綻条件はブロック時間が長く、1 手ごとの待ち時間が協調の遅延をさらに増幅する場合。", k: analysis, s: [src-isaac-what-happened]}
    - {t: "複雑さは最初の実プレイまでの時間を延ばす: 三体シミュレーション・ティック・建設・在庫・3 種のビュー・協調を最初から揃えようとすると、コアループの欠陥が実プレイヤーの前で露呈するまでに時間がかかる。運営は「効果的な反復＝反復回数×反復間の進歩」を指標とし、コア・メカニクスから始めるべきだったと総括した。", k: claim, who: "Topology", s: [src-isaac-what-happened, src-isaac-after], q: "Complexity at the birth of a project lengthens the time to iteration #0 with real players"}
  counter_evidence:
    - {t: "失敗の主因として運営が挙げたのは、協調ツール不足、インフラの不安定さ、ブロック時間、抽象的な見た目、直線的な進行で、いずれも「オンチェーンだから成立しない」ことの直接証拠ではない。より速い基盤と小さな設計なら成立した可能性は検証されていない。", k: analysis, s: [src-isaac-what-happened]}
    - {t: "アルファ参加者は 50 問のオンチェーン・パズル（S2M2）を解いた層から集められており、一般のプレイヤーより技術的関心が高い可能性がある。協力が成立しなかったことの一般化には選抜の偏りも考慮が要る。", k: analysis, s: [src-isaac-what-happened]}
    - {t: "参加者は約 13 人・2 ラウンドのみで、文明・工場型の協力ゲームの成否を一般化するにはサンプルが小さすぎる。", k: fact, s: [src-isaac-what-happened]}

