  - {to: c-commit-reveal, type: built-with, basis: confirmed, note: "FleetsCommit / FleetsReveal facet", s: [src-conquest-repo, src-conquest-handbook]}
  - {to: c-ai-agent-player, type: built-with, basis: confirmed, note: "MCP サーバーとエージェント用スキル", s: [src-conquest-mcp]}
