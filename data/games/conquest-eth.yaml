id: conquest-eth
name: Conquest.eth
name_ja: コンクエスト・イーエス
aliases: ["conquest", "Conquest DEFCON edition", "Conquest 2025-1"]
kind: game
depth: index
updated: "2026-10-24"
links:
  website: https://conquest.game/
  x: https://x.com/conquest_eth
  discord: https://discord.com/invite/Qb4gr2ekfr
  github: https://github.com/etherplay/conquest-eth
  blog: https://paragraph.com/@etherplay
chains: [Gnosis Chain (xDai), "テスト・別版の展開: Sepolia, Celo, Monad testnet 等"]
team: "Etherplay（Ronan Sandford / wighawag の個人スタジオ）"
summary: >-
  Ronan Sandford（wighawag）による、期間・ホワイトリストのない「無限ゲーム」を掲げたオンチェーン宇宙戦略・外交ゲーム。
  プレイヤーはトークンを惑星にステークして宇宙船を生産させ、艦隊の行き先をハッシュでコミットして送り出し、到着後 12 時間以内にリビールして解決する。
  ZK を使わずコミット・リビールで行き先を秘匿し、フロントランニング（攻撃を見てから逃げる）を防ぐ時間規則を組み込んだ。
  第三者が同盟コントラクト・マーケット・統計サイト・ボットを作れ、2026 年には AI エージェント向けの CLI／MCP ツールも公開された。
selection_reason: >-
  Dark Forest と同じ宇宙戦略・秘匿情報の問題を、ZK ではなくコミット・リビールで解き、さらに「期間制のラウンド」ではなく「終わらない一つの世界」と「実資産のステーク」を選んだ対照例。
  作者自身が「拡張はゲームと同じだけ生き続ける」と主張しており、その主張と実際の第三者ツールの寿命を比較できる。
categories:
  - {id: onchain-rules, role: primary, reason: "ステーク・艦隊送出・戦闘・退出の判定がコントラクト（OuterSpace の各 facet）で行われる"}
  - {id: aw, role: secondary, reason: "許可不要・永続・合成可能な「無限ゲーム」を掲げ、第三者の同盟・市場コントラクトを公認"}
  - {id: ai, role: secondary, reason: "2026 年に AI エージェント向け CLI・MCP サーバー・スキル定義を公開"}
status:
  value: dormant
  as_of: "2026-10"
  note: "リポジトリは 2026-02 まで更新され、2025-1 版の展開記録（Gnosis Chain）がある。2025-1 版の OuterSpace（0xD833…）のイベントログは約 200 万ブロック（約 4 か月）ごとの集計で 2024-11〜2025-03 に 14,157 件、2025-03〜07 に 1,859 件、2025-07〜10 に 66 件、2025-10〜2026-02 に 27 件、2026-02 以降は 1 件で、参照日時点でほぼ動いていない（コントラクトは存続）。conquest.game は「ローンチを待つ」告知ページ。"
  s: [src-conquest-repo, src-conquest-site, src-conquest-gnosis-logs]
dates:
  launched: {date: "2022-04", s: [src-conquest-infinite-games], note: "作者のブログが「4 月に Defcon で開始」と記載（DEFCON 版）。それ以前の alpha 版の時期は未確認"}

architecture:
  onchain:
    level: core-rules
    detail: "OuterSpace（facet 構成）が惑星のステーク・生産、艦隊のコミット（FleetsCommit）とリビール（FleetsReveal）、戦闘、退出、報酬を処理する。惑星の性質は genesis 値から決定的に導かれる。"
    s: [src-conquest-repo]
  offchain:
    - {item: "リビールを代行する Agent Service（2025.1 版から行き先を運営にも知らせない方式。手数料は送出時に支払う）", s: [src-conquest-handbook]}
    - {item: "サブグラフ（インデクサ）と Web クライアント", s: [src-conquest-repo]}
  admin:
    level: limited
    detail: "プロキシ経由の展開（アップグレード可能）、OuterSpaceAdminFacet による報酬生成器の設定と管理者による報酬追加がある。ルール変更権限の全範囲は未確認。"
    s: [src-conquest-repo]
  open_source:
    level: full
    detail: "AGPL-3.0 で全ソースを公開（一部のグラフィック資産を除く）。"
    url: "https://github.com/etherplay/conquest-eth"
    s: [src-conquest-repo]
  extensibility:
    level: permissionless-onchain
    detail: "同盟レジストリと、フォークして独自の加盟条件・統治を作れる basic alliance、フロントエンドのプラグイン機構と既定の宇宙船マーケット（xDai で売買）。第三者による bugout-dev のデータ分析・ボット、統計サイト、地図ツールが公開されている。"
    s: [src-conquest-handbook, src-conquest-third-party]

compare:
  gameplay: {t: "トークンを惑星にステークして宇宙船を生産し、艦隊を送って他者の惑星を攻撃・味方を支援し、退出してステークを回収する。行動は stake / send / exit の 3 つが核。", k: fact, s: [src-conquest-handbook]}
  necessity: {t: "実資産を賭ける以上、運営を介さずにルールと結果が検証できることに意味がある、というのが作者の立場。終わりのない世界にした結果、先行者の蓄積と新規参入の釣り合いが課題になり得る。", k: analysis, s: [src-conquest-infinite-games, src-conquest-handbook]}
  information: {t: "艦隊の行き先はコミット（ハッシュ）で隠され、到着後のリビールで明かされる。出発直前に到着した攻撃は出発艦隊を攻撃でき、取引キューを見て逃げるフロントランニングを抑える。", k: fact, s: [src-conquest-handbook]}
  persistence: {t: "作者は期限のない永続ゲームを掲げたが、実際には alpha・beta・DEFCON・2025-1 など複数の展開（別コントラクト）が存在する。各展開間で惑星やステークが引き継がれたかは未確認。", k: fact, s: [src-conquest-repo, src-conquest-infinite-games]}
  extensibility: {t: "同盟コントラクトのフォーク、フロントエンドのプラグイン、第三者の分析・ボット・地図ツール、2026 年の AI エージェント向け CLI／MCP。", k: fact, s: [src-conquest-handbook, src-conquest-third-party, src-conquest-mcp]}
  money_flow: {t: "プレイヤーが惑星にステークした資産がゲームの賭け金で、作者は「勝つこともあるが失うこともある」と警告している。代行リビールは利用者が手数料を払う。", k: fact, s: [src-conquest-repo, src-conquest-handbook]}
  entry_barrier: {t: "ウォレット、Gnosis Chain のガス、ステーク用トークンが必要。艦隊 1 回に 2 トランザクションが要り、12 時間以内にリビールしないと艦隊を失う。", k: fact, s: [src-conquest-handbook]}

concepts: [c-commit-reveal, m-fog-of-war, c-onchain-rules, c-permissionless-extension, c-client-plugins, m-pvp-territory, c-ai-agent-player, m-bot-automation, c-autonomous-world]

article:
  principles:
    - {t: "コミット・リビールによる艦隊の秘匿: 行き先のハッシュだけを先に出し到着後に明かすと、ZK 回路なしで「どこへ向かっているか分からない」状態を作れる。適用条件は、移動に時間がかかり、到着時刻の後に明かす猶予（12 時間）を設けられること。破綻条件は、プレイヤーがリビールを忘れる・オフラインになる場合で、代行サービスへの信頼が必要になる（Conquest は行き先を運営にも隠す代行で対処）。", k: analysis, s: [src-conquest-handbook]}
    - {t: "読み取り専用の拡張は寿命をゲームに預けられる: 作者は、ゲームのコントラクトへ書き戻さない拡張でも、ゲームが続く限り生き続けると主張する。破綻条件は、ゲーム自体が版の作り直しやチェーン移行で別コントラクトになる場合で、拡張も追従が必要になる。", k: analysis, s: [src-conquest-infinite-games, src-conquest-repo]}
  counter_evidence:
    - {t: "第三者ツール（bugout-dev のボット・分析、地図）の多くは 2022 年に作られ、その後更新が止まっている（地図 2022-05、bugout-dev 2022-09）。統計サイト yonadaa/conquest.eth-stats は 2025-02 まで更新があり、2025-1 版の活動期と重なる。「拡張はゲームと同じだけ生きる」という主張に対し、第三者拡張の多くは短命で、続いたものも版の活動期間に連動していた。", k: fact, s: [src-conquest-third-party]}
    - {t: "「終わらない一つの世界」を掲げながら、実際の 2025-1 版のオンチェーン活動は 2024-11〜2025-03 に集中し、2025-10 以降はほぼ途絶えた（イベントログ計測）。無期限の設計でも、参加は版の公開直後の短期間に集中する点で期間制ラウンドと大差ない可能性がある。", k: analysis, s: [src-conquest-gnosis-logs]}

acquisition:
  audience: [players]
  summary: {t: "最初の参加者がどの集団から来たかを示す一次資料は見つからなかった。確認できたのは、2021 年に誰でも参加できる賞金付き alpha テストを 2 回行い、2022 年の beta・DEFCON 版を経て、2025 年の再開では運営と提携先が出す賞品・ポイント報酬とニュースレター・Discord で参加者を呼び込んだことである。", k: analysis, s: [src-conquest-p2e-alpha2, src-conquest-back-2025]}
  steps:
    - {phase: pre, date: "2021", t: "2021 年に 2 回の alpha、2022 年に beta と DEFCON 版を実施した。運営は、このうち設計どおり許可不要・永続の形で始めたのは DEFCON 版だけだったと振り返る。", k: claim, who: "Etherplay", s: [src-conquest-back-2025], q: "Conquest had 4 versions prior to this one. 2 alphas in 2021, plus 1 beta and the \"DEFCON\" edition in 2022."}
    - {phase: pre, date: "2021-11", t: "第三者メディアは、第 2 alpha を 12 月 7 日に開き、誰でも参加でき、少なくとも 2000 ドルの賞品があると報じた（開発ログの告知に基づく記事。賞品の拠出者は記載なし）。同じ版で同盟と、不在時に艦隊を操作する雇える代行が加わった。", k: fact, s: [src-conquest-p2e-alpha2], q: "There will be at least $2000 in prizes up for grabs."}
    - {phase: launch, date: "2022-04", t: "DEFCON 版を Gnosis Chain で開始した（作者のブログが「4 月に Defcon で開始」と記載）。", k: fact, s: [src-conquest-infinite-games]}
    - {phase: growth, date: "2025-01-21", t: "2025-02-03 の再開を告知した。期限も人数上限もないゲームと説明しつつ、まず 1 か月のセッションを行い、続ける参加者は以後の無期限モードに移るとした。1 惑星あたり 1〜12 xDai のステークで参加する形にし、ランダムな惑星に提携先の賞品（Blockscout が計 200 ドル、Xaya の Soccerverse が 500 ドル相当のサッカークラブ）を置き、運営が 1000 ドルをポイント上位の報酬に出すとした。参加方法はニュースレター登録・アンケート・Discord 参加を案内した。", k: fact, s: [src-conquest-back-2025]}
    - {phase: growth, date: "2025-05", t: "Faction 版を公開した。運営は翌年、この版では過去のどの版よりも多くのトークンを配布したが、固定の参加費にしたことで想定していなかった複数アカウントの問題が多発したと振り返った。", k: claim, who: "Etherplay", s: [src-conquest-future-2026], q: "We also had a lot of multi-accounting issues that we did not plan for."}
  channels:
    - {id: prize-competition, t: "2021 年の alpha テストは賞品付きで（第 2 alpha は 2000 ドル以上と報道）、2025 年の再開でも運営の 1000 ドルを上位報酬に充てた。2025 年版では Blockscout（計 200 ドル）と Xaya の Soccerverse（500 ドル相当のサッカークラブ）がランダムな惑星に賞品を置くスポンサーになり、運営はさらにスポンサーを募った（提携先が自らの配信網・告知で参加者を送ったことを示す記述はない）。", k: fact, s: [src-conquest-p2e-alpha2, src-conquest-back-2025]}
    - {id: token-incentive, t: "2025 年版ではステークの保有量と期間で決まるポイントに応じて報酬を配り、運営は合算しても有利にならない線形の配分にしたと説明した。Faction 版では過去最多のトークンを配布した。", k: claim, who: "Etherplay", s: [src-conquest-back-2025, src-conquest-future-2026]}
    - {id: community-server, t: "2025 年の再開告知と 2026 年の振り返りで、参加・情報入手の方法として Discord への参加とニュースレター登録（2025 年はアンケート回答も）を案内した。Discord 経由で何人が参加したかは示されていない。", k: fact, s: [src-conquest-back-2025, src-conquest-future-2026]}
  cost:
    - {t: "獲得の原資は、運営の賞金（2025 年版で 1000 ドル）と提携先の賞品（計 700 ドル相当）、そしてプレイヤー自身のステーク（1 惑星 1〜12 xDai）である。2021 年 alpha の 2000 ドル以上の賞品を誰が出したかは未確認（報道は第三者が報酬を置くスポンサー惑星を受け付けるとだけ記す）。", k: fact, s: [src-conquest-back-2025, src-conquest-p2e-alpha2]}
    - {t: "ハンドブックは、攻略した惑星のステークを exit で回収できると説明しており、プレイヤー間で資金が移る構造がある。移る方向は攻略の成否で決まり、後から来た参加者が先行者に払う仕組みとは限らない。", k: analysis, s: [src-conquest-handbook]}
  after:
    - {t: "2025-1 版の OuterSpace のイベントログは、最初のログが 2025-01-31（ブロック 38,326,402）で、そこから 2025-03 上旬までの区間に 14,157 件、その後の約 4 か月ごとに 1,859 件、66 件、27 件と減り、再開直後の流入は続かなかった（2026-10-24 の再計測でも、区切りをずらして 14,250 / 1,772 / 60 / 27 / 0 / 1 件と同じ形）。プレイヤー数・継続率の公表値はない。", k: fact, s: [src-conquest-gnosis-logs]}
  counter:
    - {t: "報酬を厚くした Faction 版では、固定の参加費が複数アカウントを有利にしたと運営自身が認めており、報酬による「参加者」の増加には同一人物の複数口座が含まれ得る。ステーク量に比例する設計は、それ以前の版では複数アカウントへの耐性になっていたと運営は述べる。", k: claim, who: "Etherplay", s: [src-conquest-future-2026], q: "This was due to the fixed entry price, a big departure from what made Conquest.eth immune to it prior to that."}
    - {t: "再開告知は最初に 1 か月のセッションを置き、その後は続けたい参加者だけが無期限モードに移る設計だった。ログが開始後約 5 週間に集中して減ったことの一部は、関心の喪失ではなく予定どおりのセッション終了で説明できる。", k: analysis, s: [src-conquest-back-2025, src-conquest-gnosis-logs]}
    - {t: "イベントログの集中は報酬の告知と開始の時期に一致するが、ログ件数は行動数であって人数ではなく、少数の活発なプレイヤーやボットでも同じ形になり得る。", k: analysis, s: [src-conquest-gnosis-logs]}
  lessons:
    - {t: "ステーク比例の報酬で複数アカウントを無意味にする: 報酬を「保有ステーク量×期間」に線形に比例させると、口座を分けても合算しても受け取りが変わらず、賞金で人を呼んでも多重アカウントの動機が生まれにくい。効く条件は参加単位の価格が自由（1〜12 xDai のように可変）であること。破綻条件は固定の参加費や 1 口座あたりの固定報酬を入れた場合で、Conquest の Faction 版のように報酬が口座数に比例してしまう。", k: analysis, s: [src-conquest-back-2025, src-conquest-future-2026]}
    - {t: "スポンサー賞品をマップ上に置く: 提携先の賞品をランダムな惑星に置くと、少額でも探索と奪い合いの目標になり、提携先の告知経路も使える。破綻条件は賞品額が小さく（2025 年版で計 700 ドル相当）、開始直後の流入が数か月で消える場合で、獲得はできても継続の理由にはならない。", k: analysis, s: [src-conquest-back-2025, src-conquest-gnosis-logs]}
  metrics: [m-conquest-2025-1-logs]
  unknowns:
    - "2021 年の alpha の参加者がどこから来たか（作者の既存の開発者コミュニティ、Gnosis/xDai の利用者など）を示す一次資料。開発ログ conquest.eth.limo/devlog/ は参照日に 504 で読めなかった。"
    - "各版の参加者数、alpha の賞品の拠出者、DEFCON 版の参加条件と報酬。"
    - "Faction 版（2025-05）が 2025-1 版と同じコントラクトか別の展開か。"

metrics:
