chains: ["EVM ベースシャード（Polaris＋Rollkit、DA に Celestia、2022〜2024 期）", "ゲームシャード（Cardinal）"]
team: "Argus Labs（創業者・CEO Scott Sunarto）"
summary: >-
  Argus Labs が開発する、オンチェーンゲーム向けの「シャード型ロールアップ」SDK。汎用 EVM の「ベースシャード」と、ゲームロジックを Go で書く ECS・ティック駆動の「ゲームシャード」（最初の実装が Cardinal）を分け、
  ゲームは毎ティック決定的に状態を進める。イベント駆動の EVM では重力や回復のような定期更新に「クランク」トランザクションが必要になるという問題への回答として設計された。
  2024-12 に EVM 関連の依存を外し、2025-10 以降「ゼロから書き直し中」と README に掲げている。参照日の書き直し版のコードにはブロックチェーン・ロールアップ・DA 層の依存がなく（状態はメモリ上に持ち S3／NATS JetStream にスナップショット）、文書だけが「ブロックチェーン上で検証可能」と述べている。
selection_reason: >-
  「ゲームのルールを汎用チェーンのコントラクトで動かす」MUD・Dojo 系に対し、「ゲーム専用の実行環境（サーバー的ループ）を検証可能にしてチェーンにつなぐ」という逆向きの設計を代表するため。
  リアルタイム性と引き換えに第三者が同じ状態にコントラクトで合成する経路がどう変わるかを比較する基準点になる。
categories:
  - {id: infra, role: primary, reason: "ゲーム専用のシャード型ロールアップ SDK"}
  - {id: onchain-rules, role: secondary, reason: "ゲームロジックをゲームシャード内で決定的に実行し、検証可能にすることを目指す"}
status:
  value: active
  as_of: "2026-10"
  note: "Argus-Labs/world-engine は参照日の直前（2026-10-20）までコミットがあり、2026-09〜10 は月 50 件前後と開発は活発。README は「ゼロから書き直し中」と記載。v1 系（EVM ベースシャード＋Cardinal）は 2024-12 に EVM 依存が外され、2025-10 に v2 準備が始まった。v2 のアーキテクチャ文書は「under construction」で、v2 が実際にチェーンへ状態を投稿・検証する仕組みはコード上確認できない。Dark Frontier の稼働状況は未確認。"
  s: [src-argus-repo, src-argus-commits]
dates:
  launched: {date: "2023", s: [src-argus-4pillars], note: "2023-10 の第三者解説時点で Cardinal とベースシャードが公開済み。正式な公開日は未確認"}

architecture:
  onchain:
    level: unknown
    detail: >-
      v1 期: EVM ベースシャード（Berachain の Polaris と Rollkit で構成、Celestia へデータ投稿）が資産・コントラクトを扱い、ゲームシャード Cardinal が Go で書かれたゲームロジックを最大 20 ティック／秒で実行する。シャード間は非同期で、アトミックな束ねはできないと第三者解説は記す。
      ゲームシャードの実行がどの程度ベースシャードやデータ可用性層で検証されたかは本調査では確認できなかった。
      v2 期（参照日）: go.mod に Celestia・Rollkit・go-ethereum 等の依存はなく、Cardinal の状態はメモリ上にあり S3 または NATS JetStream へのスナップショットだけが永続化される。docs/introduction は「fully secure and verifiable on the blockchain」と述べるが、それを実装するコードは確認できなかった。v1 は partial-rules に近いが検証範囲が不明、v2 は none に近いがチェーン連携が未実装なのか構想から外れたのか不明なため unknown とした。
    s: [src-argus-4pillars, src-argus-commits, src-argus-repo, src-argus-snapshots-doc]
  offchain:
    - {item: "Nakama ベースのリレー／ゲームサーバー（v1 期）", s: [src-argus-4pillars, src-argus-commits]}
    - {item: "Cardinal 自体がティックを回すゲームサーバー的プロセス", s: [src-argus-loop-doc]}
    - {item: "v2 の Cardinal は世界全体をメモリに保持し、一定ティックごと（例: 60 TPS で 300 ティック＝5 秒）に S3 または NATS JetStream へ非同期・ベストエフォートでスナップショットを書く。クラッシュ時は直近のスナップショット以降が失われ得る", s: [src-argus-snapshots-doc]}
  admin:
    level: unknown
    detail: "シーケンサーの運営主体、アップグレード権限、ゲームシャード運営者の権限は未確認。"
    s: []
  open_source:
    level: full
    detail: "GitHub で LGPL-3.0 として公開。Go、protobuf、C#／TypeScript クライアント。"
    url: "https://github.com/Argus-Labs/world-engine"
    s: [src-argus-repo]
  extensibility:
    level: official-api
    detail: "ドキュメントは「コミュニティプラグインとプリセットシャード」を掲げ、リポジトリには data・lobby・physics2d のプラグインがある。これらはゲーム開発者がシャードに組み込むライブラリで、プレイヤーが稼働中のゲームに許可なく拡張を加える仕組みではない。"
    s: [src-argus-repo]

compare:
  gameplay: {t: "エンジンでありゲームではない。Argus は World Engine で動くゲームとして Dark Frontier（ZK を使う宇宙征服 MMORTS）を挙げる。", k: claim, who: "Argus Labs", s: [src-argus-argus-site]}
  necessity: {t: "ゲームの状態更新をティック駆動の専用シャードに置くことで、EVM の手数料・遅延・クランク問題を避けつつ検証可能性を保つという主張。代わりに、第三者のコントラクトがゲーム状態と同期的に合成する余地は小さくなる（シャード間は非同期）。", k: analysis, s: [src-argus-loop-doc, src-argus-4pillars]}
  information: {t: "未確認（秘匿情報の扱いはゲーム実装次第）。", k: unknown}
  persistence: {t: "ゲームシャードはゲーム開発者が運営するプロセスで、運営停止後に第三者が同じ状態で継続できるかは未確認。", k: unknown}
  extensibility: {t: "開発者向けのプラグイン（data, lobby, physics2d）とクライアント SDK。プレイヤーによる許可不要拡張は設計目標として確認できなかった。第三者解説は「Intergame」として出版者・市場・モッダー間の互換性を掲げると記す。", k: fact, s: [src-argus-repo, src-argus-4pillars]}
  money_flow: {t: "未確認。公式サイトは投資家として Haun・Robot Ventures・Dispersion Capital・Alchemy・Anagram のロゴと個人投資家を挙げるが額は書かれていない。検索要約では 1000 万ドルのシード（Haun Ventures 主導）とされるが、取得して読めた資料では確認できなかった。", k: unknown, s: [src-argus-argus-site, src-argus-jobs]}
  entry_barrier: {t: "開発者は Go と ECS、ゲームシャードの運用を扱う必要がある。プレイヤー側の障壁はゲーム次第。", k: analysis, s: [src-argus-repo]}

