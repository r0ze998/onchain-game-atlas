  - {t: "公式サイト（argus.gg）は World Engine を「EVM-compatible」でイーサリアムのウォレットとツールに対応すると説明するが、リポジトリでは 2024-12-10 に EVM 依存が削除され、参照日の v2 コードに EVM・ロールアップの依存はない。", s: [src-argus-argus-site, src-argus-commits, src-argus-repo]}
  - {t: "docs/introduction は「fully secure and verifiable on the blockchain」と述べるが、同じリポジトリの v2 コードの永続化は S3／JetStream へのスナップショットのみで、チェーンへの投稿・証明のコードは見つからない（アーキテクチャ文書は作成中）。", s: [src-argus-repo, src-argus-snapshots-doc]}

article:
  counter_evidence:
    - {t: "「ゲーム専用の実行環境を検証可能にしてチェーンにつなぐ」という位置付けは v1 の設計資料（2023 年の第三者解説）に基づく。2024-12 以降のコードはチェーン側の部品を外しており、参照日の World Engine は実装上はティック駆動の ECS ゲームサーバーフレームワークに近い。オンチェーンゲーム基盤の代表例として扱うには、v2 で検証の仕組みが実装されるかの確認が必要。", k: analysis, s: [src-argus-commits, src-argus-repo, src-argus-snapshots-doc]}

