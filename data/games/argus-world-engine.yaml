  lessons:
    - {t: "自社タイトルを先にエンジンへ載せる（dogfooding）: エンジンの信用を「本番で何件処理したか」で示せ、ゲームキー配布と賞金で負荷試験の参加者も集められる。効く条件は自社タイトルに既存の関心層（ここでは Dark Forest 系）がいること。破綻条件は自社タイトルが止まったとき、エンジン側に外部の稼働例が残らず実績の根拠が古くなること。", k: analysis}
    - {t: "少数招待のベータ＋直接サポート: 未成熟な基盤で初期チームを深く支援できる。破綻条件は基盤の構成を大きく変える場合（ここでは EVM 削除と v2 の全面書き直し）で、初期参加者ほど移行コストを負い、外部採用が積み上がりにくい。", k: analysis}
  unknowns:
    - "プライベートベータに参加したチームの数と名前。"
    - "2024-02 に予告されたビルダープログラムの実施内容。検索要約では 2024-03 に「World Builders Fellowship」（2 か月、Celestia と共同、奨励金あり）の募集があったとされるが、X の投稿を取得できず未確認。"
    - "Dark Frontier のプレイヤー数と、プレイテスト賞金の負担者。"
    - "World Engine で本番稼働した外部スタジオのゲーム。"

