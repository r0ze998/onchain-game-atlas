  - {to: mud, type: contrasts-with, basis: analytic, note: "MUD は EVM コントラクト上の ECS、World Engine はコントラクト外のティック駆動シャード"}
  - {to: dojo, type: contrasts-with, basis: analytic, note: "Dojo も汎用チェーン（Starknet）上のコントラクト ECS"}
  - {to: magicblock, type: similar-to, basis: analytic, note: "ゲーム用に専用の実行環境を切り出す発想"}
