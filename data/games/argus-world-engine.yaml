id: argus-world-engine
name: World Engine (Argus Labs)
name_ja: ワールドエンジン（Argus）
aliases: ["World Engine", "Cardinal", "Argus World Engine"]
kind: engine
depth: index
updated: "2026-10-24"
links:
  website: https://argus.gg/
  docs: https://world.dev/
  x: https://x.com/ArgusLabs_
  discord: https://discord.gg/XyfDPHDmWU
  telegram: https://t.me/worldengine_dev
