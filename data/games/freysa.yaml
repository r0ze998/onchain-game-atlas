  - "Act IV で主張された TEE 実行と署名検証が第三者に検証されたか。"
  - "運営主体（Eternis AI とする報道）と 3000 万ドル調達の報道（検索スニペットのみで本文未確認）、FAI トークンの発行時期と Freysa ゲームとの関係。"
  - "公開リポジトリの Payment.sol（トークンへのスワップ）が、どの時点のゲームで使われたか。"
contradictions:
  - {t: "1 回の参加費の上限: 運営ブログ（2024-12-26）は参加費が「$500 per interaction」まで上がったと書くが、報道された Act I の最終参加費は 443.24 ドル（Cointelegraph）または 449.22 ドル（The Block）で、Act II・III の上限は 20 ドル・200 ドルとされる。500 ドルは概数か、別の時点の値とみられる。", s: [src-freysa-blog-verifiable-games, src-freysa-cointelegraph-win, src-freysa-theblock-reflects]}
  - {t: "Act I のタイマー開始条件: 公開リポジトリの README は「After 1500 attempts」、公式サイトの FAQ は「After 150 attempts」/「After 150 messages」と記載。", s: [src-freysa-agent-repo, src-freysa-site-act1]}
  - {t: "Act I のシステムプロンプト: agent リポジトリの README に載る文面と、acts リポジトリ・公式 FAQ の文面（キャラクター設定や背景説明を含む長い版）が異なる。", s: [src-freysa-agent-repo, src-freysa-acts-repo]}
  - {t: "Act I の賞金額: The Block は 47,316.05 ドル、iq.wiki は 47,148 ドルと記載。", s: [src-freysa-theblock-win, src-freysa-iqwiki]}
  - {t: "TEE の実装: 運営ブログは Intel TDX、sovereign-freysa リポジトリは AWS Nitro Enclaves を記載（時期による変更の可能性）。", s: [src-freysa-blog-verifiable-autonomy, src-freysa-saf-repo]}
  - {t: "Act II の README は tools 欄に Act III と同じ scoreConnection を載せており、送金承認型の Act II の説明と合わない（記載ミスの可能性）。", s: [src-freysa-acts-repo, src-freysa-site-act2]}
  - {t: "Act I の勝利日: The Block の記事は 2024-11-29（米東部時間）公開、Plisio の解説（スニペット）は 2024-11-30 とする。", s: [src-freysa-theblock-win, src-freysa-plisio]}
  - {t: "Act I の初期賞金: FAQ は「$3000」、同じサイトの Act I 利用規約は「$3700 (1 ETH)」と記載。", s: [src-freysa-site-act1]}
  - {t: "Act I の文脈長: FAQ は「50k+ tokens (at least 10 historical user messages)」、利用規約は「20,000 tokens」と記載。", s: [src-freysa-site-act1]}
  - {t: "公開性: Act I の FAQ は「the full Freysa game is open-source」と主張するが、公開された agent リポジトリは actions/ と送金処理を欠き単体では動かない。", s: [src-freysa-site-act1, src-freysa-agent-repo]}
  - {t: "Act I の最後の参加費: The Block（2024-12-13）は 449.22 ドル、Cointelegraph（2024-11-29）は 443.24 ドルと記載。", s: [src-freysa-theblock-reflects, src-freysa-cointelegraph-win]}

