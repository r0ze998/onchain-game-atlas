  as_of: "2026-08"
  note: "2026-08 の報道では、残る人員はほぼ MMO（2026-12 目標、範囲縮小）に集中し、外部スタジオがライセンスで Primal Tactica を開発中。Overworld・Arena の現在の稼働状況と利用者数は未確認。"
  s: [src-illuvium-cryptoslate-2026]
dates:
  launched: {date: "2024-07-25", s: [src-illuvium-decrypt-launch, src-illuvium-bg-openbeta], note: "Epic Games Store で公開。Decrypt（当日）は運営が「official game launch」と称し 3 作（Zero を含む）を出したとし、事前の BlockchainGamer.biz は Overworld と Arena のオープンベータ、Zero は後日とした"}

architecture:
  onchain:
    level: assets-only
    detail: "NFT（Illuvial 等）は Ethereum 上で Immutable の zkEVM を通じて統合される。ゲームの進行・戦闘はゲームクライアントとサーバー側で行われる（オンチェーンで判定される根拠は見つからなかった）。"
    s: [src-illuvium-bg-openbeta]
  offchain:
    - {item: "ゲーム本体と戦闘・探索の処理", s: [src-illuvium-bg-openbeta]}
  admin:
    level: significant
    detail: "2026 年の評議会議事録では、運営コスト・人員再編・金庫と収益分配の議論が NDA の下に置かれ、財務の内訳が公開されていないと報じられた。"
    s: [src-illuvium-cryptoslate-2026]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: unknown
    detail: "未確認。外部スタジオが IP ライセンスで別作（Primal Tactica）を作る形の展開はある。"
    s: [src-illuvium-cryptoslate-2026]

compare:
  gameplay: {t: "Overworld で生物（Illuvial）を捕まえて育て、Arena で自動戦闘させる。Zero は土地で資源を集めるモバイル・PC 向けの別作として計画された。", k: fact, s: [src-illuvium-bg-openbeta]}
  necessity: {t: "チェーンは主に資金調達（土地販売、トークン）と NFT の所有に使われ、遊びの規則はクライアント・サーバー側にある。", k: analysis, s: [src-illuvium-bg-openbeta, src-illuvium-decrypt-land]}
  information: {t: "未確認。", k: unknown}
  persistence: {t: "NFT はチェーン上に残るが、遊ぶにはサーバーとクライアントが必要。", k: analysis, s: [src-illuvium-bg-openbeta]}
  extensibility: {t: "未確認。", k: unknown}
  money_flow: {t: "2022-06 の土地販売（2 万区画中 19,969 区画）で 7,200 万ドル超を集め、そのうち 4,018 ETH をステーク中の ILV 保有者へ配り、239,388 sILV2 を焼却するとされた。CEO は 2024-12 に、ゲームがマイクロトランザクションに頼りすぎたと認めた。", k: fact, s: [src-illuvium-decrypt-land, src-illuvium-bg-2025]}
  entry_barrier: {t: "PC と Epic Games Store。NFT 取引にはウォレットが必要。", k: fact, s: [src-illuvium-bg-openbeta]}

concepts: [c-nft-asset, m-land, e-p2e]

article:
  counter_evidence:
    - {t: "「資金が尽きて縮小した」という読みへの留保: 2024-12 時点で運営は 7,000 万ドル超相当の ILV を金庫に持つと報じられ、2026-08 には削減で 12 か月超の運転資金を確保したと CEO が述べた。縮小は資金枯渇ではなく、トークン価格下落下での支出抑制の選択とも読める（現金残高は非公開）。", k: claim, who: "BlockchainGamer.biz / Kieran Warwick (CEO)", s: [src-illuvium-bg-2025, src-illuvium-cryptoslate-2026]}
    - {t: "大型予算のゲームであっても、リリース後の利用者数は公表されず、2 年足らずで支出削減と範囲縮小に入った。資金量は定着の代わりにならなかった。一方で、ゲームとしての評価や利用者数の一次データがないため、失敗の原因をオンチェーン要素に帰すこともできない。", k: analysis, s: [src-illuvium-bg-2025, src-illuvium-cryptoslate-2026]}

acquisition:
  audience: [holders, players]
  summary: {t: "最初に集まったのはゲームではなく ILV トークンの保有者で、2021 年のステーキング（高い利回り）と AXS・SNX 保有者向けの「flash pool」で他のトークンのコミュニティからも資金と人を呼んだ。プレイヤーとしての最初の参加者は、200 万超の事前登録者から段階的に選ばれた非公開ベータの参加者（2022-12 の 3 万人、2023-05 に 7.5 万人）だった。", k: analysis, s: [src-illuvium-cointelegraph-2021, src-illuvium-techbullion-2022, src-illuvium-dailycoin-2023]}
  steps:
    - {phase: pre, date: "2021-06-30", t: "ILV のステーキングを開始した。柔軟型で年 39.77%、52 週ロックで 79.53%、SushiSwap の流動性提供者には 283〜566% の利回りが示された。2021-07-28 に Axie の flash pool を開き、記事時点で AXS・SNX のステーキング枠は埋まっていた。ゲームは開発中だった。", k: fact, s: [src-illuvium-cointelegraph-2021]}
    - {phase: pre, date: "2021-08", t: "ILV は 2021-06-22 の安値 29.32 ドルから 2021-08-13 の 545.26 ドルへ 1,765% 上昇した。記事は複数資産のステーキング、ゲームの予告映像と影響力のある人物の NFT、NFT 市場全体の好調を要因に挙げた。", k: fact, s: [src-illuvium-cointelegraph-2021]}
    - {phase: pre, date: "2022-06", t: "土地 NFT のダッチオークションで 7,200 万ドル超を売り上げた（ゲームはまだ遊べなかった）。", k: fact, s: [src-illuvium-decrypt-land]}
    - {phase: pre, date: "2022-12-12", t: "Overworld の非公開ベータを 3 万人のコミュニティ参加者に公開し、その後 Discord コミュニティへ段階的に広げると発表した。登録者は 200 万超とされた。Arena の非公開ベータ（PB2）の参加者は Overworld にも入れた。", k: claim, who: "Illuvium（プレスリリース）/ PlayToEarn", s: [src-illuvium-techbullion-2022, src-illuvium-playtoearn-2022, src-illuvium-theblock-2022]}
    - {phase: pre, date: "2023-05-18", t: "Overworld Beta 2 で参加上限を 3 万人から 7.5 万人に広げた。ベータの進行・アイテムは引き継がれない可能性があると告知された。", k: fact, s: [src-illuvium-dailycoin-2023]}
    - {phase: pre, date: "2023-11", t: "Overworld と Arena を Epic Games Store に掲載した。土地で資源を採る Zero のアルファ版は土地 NFT の所有者だけが遊べた。", k: fact, s: [src-illuvium-decrypt-preview]}
    - {phase: launch, date: "2024-07-25", t: "Epic Games Store で公開した（運営は「正式ローンチ」と呼んだ）。", k: fact, s: [src-illuvium-decrypt-launch, src-illuvium-bg-openbeta]}
  channels:
    - {id: token-incentive, t: "ゲームの公開前から ILV のステーキングに年 40〜80%、流動性提供に数百 % の利回りを付けて保有者を集めた。", k: fact, s: [src-illuvium-cointelegraph-2021]}
    - {id: existing-community, t: "AXS・SNX など他プロジェクトのトークンを預けられる flash pool を開き、それらの保有者を呼び込んだ。", k: fact, s: [src-illuvium-cointelegraph-2021]}
    - {id: invite-gating, t: "200 万超の登録者から非公開ベータの参加者を段階的に選び、3 万人から 7.5 万人へ広げた。", k: fact, s: [src-illuvium-techbullion-2022, src-illuvium-dailycoin-2023]}
    - {id: community-server, t: "非公開ベータは最初の 3 万人の後、Discord コミュニティに段階的に開放すると告知した。", k: claim, who: "Illuvium（プレスリリース）", s: [src-illuvium-techbullion-2022]}
    - {id: platform-distribution, t: "2023-11 に Epic Games Store へ掲載し、2024-07 の公開も同ストアで行った。", k: fact, s: [src-illuvium-decrypt-preview, src-illuvium-decrypt-launch]}
    - {id: creator-stream, t: "2021 年に影響力のある人物向けの特製 NFT を作り、予告映像とともに期待を高めたと報じられた。", k: fact, s: [src-illuvium-cointelegraph-2021]}
  cost:
    - {t: "保有者の獲得はトークン放出（ステーキング報酬）で賄われ、土地購入者が 7,200 万ドル超を払った。そのうち 4,018 ETH はステーク中の ILV 保有者へ配られた。2024-03 には 1,200 万ドルのシリーズ A を発表した。", k: fact, s: [src-illuvium-cointelegraph-2021, src-illuvium-decrypt-land, src-illuvium-bg-openbeta]}
  after:
    - {t: "公開後の利用者数・継続率は公表されていない。2024-12 時点で ILV は高値から 98% 下落し、運営は支出削減と Overworld への集中を発表、2026 年には縮小した MMO が主な賭けになった。", k: fact, s: [src-illuvium-bg-2025, src-illuvium-cryptoslate-2026]}
  counter:
    - {t: "200 万超の「登録」は、報酬や将来のエアドロップを期待した登録を含む可能性があり、遊ぶ意思のある人数を示さない。非公開ベータの 3 万〜7.5 万人の実際のプレイ人数も公表されていない。", k: analysis, s: [src-illuvium-techbullion-2022, src-illuvium-dailycoin-2023]}
    - {t: "2021 年の ILV 保有者の急増は NFT・ゲーム系トークン全体の上昇期と重なり、記事自身も市場全体の好調を要因に挙げる。ステーキング施策の効果だけを取り出せない。", k: analysis, s: [src-illuvium-cointelegraph-2021]}
  lessons:
    - {t: "他トークン保有者向けのステーキング枠（flash pool）: 他コミュニティの資金を短期に集められるが、集まるのは利回りを求める資金で、ゲームのプレイヤーにはならない。利回りが下がれば去る。", k: analysis}
    - {t: "大規模事前登録から段階的に選ぶ非公開ベータ: サーバー負荷と品質を管理しながら熱を保てるが、進行が引き継がれないベータを長く続けると、登録者の熱が公開時まで持たない。", k: analysis}
  metrics: [m-illuvium-staking-apr-2021, m-illuvium-registered-2022, m-illuvium-beta-2022-12, m-illuvium-beta2-2023-05, m-illuvium-land-sale-2022]
  unknowns: ["ILV の 2021-03 のトークン販売（Balancer の流動性ブートストラップと報じられる）の一次資料と調達額", "非公開ベータ参加者の選び方（NFT・ILV 保有者の優遇の有無）と実際のプレイ人数", "公開後の利用者数"]

