id: illuvium
name: Illuvium
name_ja: イルビウム
aliases: ["Illuvium: Overworld", "Illuvium: Arena", "Illuvium: Zero", ILV]
kind: game
depth: index
updated: "2026-10-23"
chains: ["Ethereum（ILV、NFT）", "Immutable X / Immutable zkEVM（ゲーム内 NFT）"]
team: "Illuvium（オーストラリア、2020 年創業。CEO Kieran Warwick）"
summary: >-
  PC 向けオープンワールド収集 RPG（Overworld）と自動戦闘（Arena）、土地で資源を採る Zero からなる大型予算の Web3 ゲーム。
  2022-06 の土地販売で 7,200 万ドル超を集め、2024-07-25 に Epic Games Store でオープンベータを開始した。
  その後トークン ILV は高値から 98% 下落（2024-12 時点の報道）し、月約 90 万ドルの支出削減、賃金カットを経て、2026 年には縮小した MMO を主な賭けとしている。
selection_reason: >-
  ゲームの完成前にトークン・土地 NFT で巨額の資金を集める「資金調達先行型」の代表例で、リリース後の利用者定着が示されないまま支出削減に入った経過が追えるから。
  土地で資源を採る（Zero）という利用者の構想に近い要素を持ちながら、その要素が出荷されたかどうか自体が不明確な点も、反証側の材料になる。
categories:
