id: illuvium
name: Illuvium
name_ja: イルビウム
aliases: ["Illuvium: Overworld", "Illuvium: Arena", "Illuvium: Zero", ILV]
kind: game
depth: index
updated: "2026-10-23"
chains: ["Ethereum（ILV、NFT）", "Immutable X / Immutable zkEVM（ゲーム内 NFT）"]
team: "Illuvium（オーストラリア、2020 年創業。CEO Kieran Warwick）"
summary: >-
  PC 向けオープンワールド収集 RPG（Overworld）と自動戦闘（Arena）、土地で資源を採る Zero からなる大型予算の Web3 ゲーム。
  2022-06 の土地販売で 7,200 万ドル超を集め、2024-07-25 に Epic Games Store で公開した（運営は「正式ローンチ」と称し、事前報道は「オープンベータ」と呼んだ）。
  その後トークン ILV は高値から 98% 下落（2024-12 時点の報道）し、月約 90 万ドルの支出削減、賃金カットを経て、2026 年には縮小した MMO を主な賭けとしている。
selection_reason: >-
  ゲームの完成前にトークン・土地 NFT で巨額の資金を集める「資金調達先行型」の代表例で、リリース後の利用者定着が示されないまま支出削減に入った経過が追えるから。
  土地で資源を採る（Zero）という利用者の構想に近い要素を持ち、Decrypt は 2024-07 に Zero もモバイル・PC・Mac で公開されたと報じたが、その後の稼働・利用は確認できない点も、反証側の材料になる。
categories:
  - {id: assets, role: primary, reason: "土地・Illuvial などの NFT とトークン ILV が資金調達と経済の中心"}
  - {id: p2e, role: secondary, reason: "ILV のステーキング報酬と、土地販売の ETH をステーカーへ配分する仕組み"}
status:
  value: active
  as_of: "2026-08"
  note: "2026-08 の報道では、残る人員はほぼ MMO（2026-12 目標、範囲縮小）に集中し、外部スタジオがライセンスで Primal Tactica を開発中。Overworld・Arena の現在の稼働状況と利用者数は未確認。"
  s: [src-illuvium-cryptoslate-2026]
dates:
  launched: {date: "2024-07-25", s: [src-illuvium-decrypt-launch, src-illuvium-bg-openbeta], note: "Epic Games Store で公開。Decrypt（当日）は運営が「official game launch」と称し 3 作（Zero を含む）を出したとし、事前の BlockchainGamer.biz は Overworld と Arena のオープンベータ、Zero は後日とした"}

architecture:
  onchain:
    level: assets-only
    detail: "NFT（Illuvial 等）は Ethereum 上で Immutable の zkEVM を通じて統合される。ゲームの進行・戦闘はゲームクライアントとサーバー側で行われる（オンチェーンで判定される根拠は見つからなかった）。"
    s: [src-illuvium-bg-openbeta]
  offchain:
    - {item: "ゲーム本体と戦闘・探索の処理", s: [src-illuvium-bg-openbeta]}
  admin:
    level: significant
    detail: "2026 年の評議会議事録では、運営コスト・人員再編・金庫と収益分配の議論が NDA の下に置かれ、財務の内訳が公開されていないと報じられた。"
    s: [src-illuvium-cryptoslate-2026]
  open_source:
    level: unknown
    detail: "未確認。"
  extensibility:
    level: unknown
    detail: "未確認。外部スタジオが IP ライセンスで別作（Primal Tactica）を作る形の展開はある。"
    s: [src-illuvium-cryptoslate-2026]

compare:
  gameplay: {t: "Overworld で生物（Illuvial）を捕まえて育て、Arena で自動戦闘させる。Zero は土地で資源を集めるモバイル・PC 向けの別作として計画された。", k: fact, s: [src-illuvium-bg-openbeta]}
  necessity: {t: "チェーンは主に資金調達（土地販売、トークン）と NFT の所有に使われ、遊びの規則はクライアント・サーバー側にある。", k: analysis, s: [src-illuvium-bg-openbeta, src-illuvium-decrypt-land]}
  information: {t: "未確認。", k: unknown}
  persistence: {t: "NFT はチェーン上に残るが、遊ぶにはサーバーとクライアントが必要。", k: analysis, s: [src-illuvium-bg-openbeta]}
  extensibility: {t: "未確認。", k: unknown}
  money_flow: {t: "2022-06 の土地販売（2 万区画中 19,969 区画）で 7,200 万ドル超を集め、そのうち 4,018 ETH をステーク中の ILV 保有者へ配り、239,388 sILV2 を焼却するとされた。CEO は 2024-12 に、ゲームがマイクロトランザクションに頼りすぎたと認めた。", k: fact, s: [src-illuvium-decrypt-land, src-illuvium-bg-2025]}
  entry_barrier: {t: "PC と Epic Games Store。NFT 取引にはウォレットが必要。", k: fact, s: [src-illuvium-bg-openbeta]}

concepts: [c-nft-asset, m-land, e-p2e]

article:
  counter_evidence:
    - {t: "「資金が尽きて縮小した」という読みへの留保: 2024-12 時点で運営は 7,000 万ドル超相当の ILV を金庫に持つと報じられ、2026-08 には削減で 12 か月超の運転資金を確保したと CEO が述べた。縮小は資金枯渇ではなく、トークン価格下落下での支出抑制の選択とも読める（現金残高は非公開）。", k: claim, who: "BlockchainGamer.biz / Kieran Warwick (CEO)", s: [src-illuvium-bg-2025, src-illuvium-cryptoslate-2026]}
    - {t: "大型予算のゲームであっても、リリース後の利用者数は公表されず、2 年足らずで支出削減と範囲縮小に入った。資金量は定着の代わりにならなかった。一方で、ゲームとしての評価や利用者数の一次データがないため、失敗の原因をオンチェーン要素に帰すこともできない。", k: analysis, s: [src-illuvium-bg-2025, src-illuvium-cryptoslate-2026]}

