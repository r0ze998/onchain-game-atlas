id: zkhunt
name: ZK Hunt
name_ja: ZK ハント
aliases: [zkHunt, ZK-Hunt]
kind: game
depth: index
updated: "2026-10-23"
links:
  github: https://github.com/FlynnSC/zk-hunt
chains: [ローカルの開発チェーン（anvil）のみ確認]
team: "Flynn Calcutt（GitHub: FlynnSC の表示名）。README は技術解説を 0xPARC ブログに置くと記す"
summary: >-
  MUD（v0.16 系）上に作られた、ZK 証明による秘匿移動と情報の非対称性を試す RTS 風 PvP の試作。平原では位置が公開され、ジャングルに入ると
  位置は Poseidon コミットメントとしてのみ保存され、移動の正当性は circom の回路で証明される。相手は「どこにいる可能性があるか」の集合しか追えない。
  槍による攻撃や「探索（search）」は、隠れた側に応答（ZK 証明）を求め、期限内に応答しなければ清算されるという、秘匿情報に応答義務を組み合わせた仕組みを持つ。
selection_reason: >-
  Dark Forest が「計算で晴れる霧」を作ったのに対し、ZK Hunt は「公開と秘匿を地形で切り替える」「秘匿側に応答義務と期限を課す」という別の秘匿情報メカニクスを、
  小規模なコードで示している。秘匿情報には応答できないプレイヤー（オフライン）をどう扱うかという、オンチェーン秘匿ゲーム全般の弱点が具体的に見える。
categories:
  - {id: zk, role: primary, reason: "ジャングル内の移動・被弾回避・探索への応答・潜在位置の公開を circom の ZK 回路で証明する"}
  - {id: onchain-rules, role: secondary, reason: "移動・攻撃・探索・清算の判定を MUD の System コントラクトで行う"}
status:
  value: archived
  as_of: "2026-10"
  note: "README は「試作（prototype）」と明記。リポジトリの最終コミットは 2023-10-10（README 更新）、実装上の最終変更は 2023-05。公開ネットワークで運営された記録は確認できなかった。"
  s: [src-zkhunt-repo]
dates:
  launched: {date: "2022-09", s: [src-zkhunt-repo], note: "リポジトリの初回コミットは 2022-09-22、平原・ジャングル移動の初期実装は 2022-09-28。公開ゲームとしての開始ではない"}

architecture:
  onchain:
    level: core-rules
    detail: >-
      MUD v0.16 の ECS（Component / System コントラクト）で、平原移動（PlainsMoveSystem）、ジャングルへの出入り、ジャングル内移動（JungleMoveSystem）、
      攻撃、探索・応答、清算（LiquidationSystem）を実装。ジャングル内の位置は Poseidon コミットメントで保存され、各移動は 1 マスの直交移動であることを
      証明する回路（jungleMove）の Solidity 検証器でチェックされる。秘匿探索ではチャレンジ対象のマス集合を暗号化して送り、応答側はナリファイアを出す。
    s: [src-zkhunt-repo, src-zkhunt-circuits, src-zkhunt-liquidation]
  offchain:
    - {item: "ZK 証明の生成（circom / snarkjs）と、相手の潜在位置集合の追跡はクライアント側", s: [src-zkhunt-repo]}
    - {item: "回路の準備（powers of tau の実行）を開発者がローカルで行う", s: [src-zkhunt-repo]}
  admin:
    level: unknown
    detail: "ComponentDevSystem という System（名前からは開発用と見られる）が存在する。公開ネットワークへの展開がないため運用上の管理権限は評価できない"
    s: [src-zkhunt-repo]
  open_source:
    level: full
    detail: "回路・コントラクト・クライアント一式を MIT ライセンスで公開（コントラクト個別ファイルには Unlicense 表記もある）"
    url: "https://github.com/FlynnSC/zk-hunt"
    s: [src-zkhunt-repo, src-zkhunt-liquidation]
  extensibility:
    level: none
    detail: "試作として公開されたコード。第三者がフォークして回路を改造した例として ETHOnline 2024 の提出作品がある"
    s: [src-zkhunt-ethglobal]

compare:
  gameplay: {t: "格子状の地図でユニットを動かす 2 人以上の PvP。平原では位置が見え、ジャングルでは位置が隠れる。槍で攻撃し、探索で隠れた相手の位置を問いただせる。", k: fact, s: [src-zkhunt-repo, src-zkhunt-circuits]}
  necessity: {t: "第三者の審判なしに「隠れたまま正しく動いた」「探索された位置にいない」ことを相手に検証させる点が、公開台帳と ZK を組み合わせる理由。試作であり、オンチェーンである必要性を実プレイで検証した記録はない。", k: analysis}
  information: {t: "ジャングル内の位置はコミットメントのみ公開。相手が見られるのは入った地点と可能性のある位置の集合で、移動ごとに広がり、ジャングルを出ると確定する。", k: fact, s: [src-zkhunt-circuits, src-zkhunt-ethresearch]}
  persistence: {t: "公開ネットワークでの展開を確認できず、遊ぶにはローカルで構築する必要がある。", k: fact, s: [src-zkhunt-repo]}
  extensibility: {t: "ソース公開による改造（フォーク）のみ。第三者の改造例が 1 件確認できる。", k: fact, s: [src-zkhunt-ethglobal]}
  money_flow: {t: "コントラクトにトークン・デポジット・賞金の実装はない（研究用の試作）。2023-05 時点の README の解説は、参加時にデポジットを置き、死亡時に一部を戦利品として落とし、応答しなければ全額没収（slash）される設計を説明していたが、実装された清算は当該プレイヤーの全ユニットを殺す処理である。", k: fact, s: [src-zkhunt-repo, src-zkhunt-readme-2023-05, src-zkhunt-liquidation]}
  entry_barrier: {t: "Rust・foundry・circom・snarkjs の導入、回路の準備、ローカルチェーンの起動が必要で、開発者向け。", k: fact, s: [src-zkhunt-repo]}

concepts: [c-zk-hidden-info, m-fog-of-war, c-commit-reveal, c-ecs-engine, c-onchain-rules]
proposed_concepts:
  - {id: m-challenge-response-liquidation, name: 応答義務と期限付き清算, desc: "秘匿状態を持つプレイヤーに、他者のチャレンジ（探索・攻撃）への ZK 応答を期限内に求め、応答がなければ不利な結果（清算）を確定させる。"}

article:
  principles:
    - {t: "地形で公開・秘匿を切り替える霧: 位置の秘匿を常時ではなく特定地形（ジャングル）に限ると、秘匿の証明コストを必要な場面に限定でき、出入りの瞬間が駆け引きになる。適用条件は公開状態から秘匿状態への出入りを公開イベントにできること。破綻条件は秘匿領域が狭く、潜在位置集合がすぐ絞り込まれる場合。", k: analysis, s: [src-zkhunt-circuits, src-zkhunt-ethresearch]}
    - {t: "応答義務つきの秘匿: 隠れた側に「探索されたマスにいない」ことを期限内に証明させ、応答がなければ清算する。適用条件は応答期限がネットワークの確定時間より十分長いこと。破綻条件は応答期限が短い（コード上の RESPONSE_PERIOD は 5 秒）か、プレイヤーがオフラインになりやすい場合で、秘匿の代償が「常時オンライン」になる。", k: analysis, s: [src-zkhunt-liquidation, src-zkhunt-circuits]}
  counter_evidence:
    - {t: "公開ネットワークでの運営やプレイヤー数の記録はなく、メカニクスが遊びとして成立するかは検証されていない。", k: fact, s: [src-zkhunt-repo]}
    - {t: "RESPONSE_PERIOD = 5 秒はローカルの開発チェーン（anvil）でのみ動かされたコードの値であり、公開ネットワーク向けに調整された値とは限らない。「応答期限が短すぎる」という評価をこの定数だけから下すのは早い。", k: analysis, s: [src-zkhunt-liquidation, src-zkhunt-readme-2023-05]}
    - {t: "応答しないと清算される設計は、秘匿情報を持つ側に常時オンラインと証明生成の負担を課す。秘匿の価値が操作負担を上回るかは不明。", k: analysis, s: [src-zkhunt-liquidation]}

