  - {t: "報酬改定による約 69% の急落を、BlockchainGamer.biz は 6 月中旬の Chapter 2（90 万超→25.2 万）とし、GamesTX は「5 月の報酬システム変更」で「100 万 DAUW の 69%」と記す", s: [src-pixels-bg-ch2-drop, src-pixels-gamestx-2m]}
  - {t: "RORS は whitepaper v3 で約 0.8、2026-03 の CEO インタビューで 3 対 1、同月の Stacked 発表報道では特定施策で 131% と、値が文脈で異なる", s: [src-pixels-wp-rors, src-pixels-bg-stacked, src-pixels-bitpinas-stacked]}
  - {t: "Ronin 稼働日はパッチノートでは 10/30、Ronin ブログでは 10/31", s: [src-pixels-help-updates, src-pixels-ronin-live]}
  - {t: "出金に必要な評判は、記事「Reputation Limits」では 2,000、2024-10 のパッチノートの新閾値では 1,500", s: [src-pixels-help-rep-limits, src-pixels-help-updates]}
  - {t: "2025-06 に日次アクティブウォレット 4 万超（自社ブログ）、2026-03 の報道では 100 万 DAU（運営発表）", s: [src-pixels-post-stabilized, src-pixels-bitpinas-stacked]}
  - {t: "BlockchainGamer.biz の Chapter 2 記事は見出しで「69% 減」とするが、本文の「90 万超→25.2 万」から計算すると約 72% 以上の減少になる。69% は 100 万前後を起点にした GamesTX の記述と整合し、起点の値が資料間で一致しない", s: [src-pixels-bg-ch2-drop, src-pixels-gamestx-2m]}
  - {t: "開始年を Decrypt は 2021 年、BlockchainGamer.biz の CEO インタビュー導入文は「2022 年リリース」とし、Ronin 移転も同記事は 2023-11 と書く（Ronin ブログは 10/31）", s: [src-pixels-decrypt-airdrop, src-pixels-bg-one-year, src-pixels-ronin-live]}

