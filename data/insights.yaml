    縮小（Fomo3D・Eternum・Conquest.eth）はラウンド制以外の要因（相場、運営の資金、設計変更）とも重なる。
  alternative: >-
    回ごとの縮小はラウンド制の性質ではなく相場の下落や運営資金の縮小と同時期のもので、ラウンド制はむしろ少ない費用で小さな集団を保つ手段だった可能性がある（Dark Forest は回を追って参加者が増えた）。
  experiment:
    design: >-
      2 回のラウンドを続けて開き、前回の参加者を「持ち越し要素あり（称号・次回の先行枠・自作ツールの引き継ぎ）」と「なし」の 2 群に分けて同じ通知を送る。新規向けの告知は別に出す。
    signal: 群ごとの再参加率（アカウントではなく連絡先で照合）、2 回目の参加者に占める再参加者の割合。
    kill: 持ち越し要素ありでも再参加率が 30% 未満なら、ラウンド制は「毎回新規を集める」前提で設計し、獲得の費用を回ごとに見積もる。
    cost: 小
