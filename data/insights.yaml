# インサイト: 主張・支持事例・反例・成立条件・確信度・次の小さな実験
# evidence[].stance: support | counter | context。support/counter は出典必須（出典はエントリ側の source id）
# gap_type: unsolved-gap（未解決の空白）| no-demand（需要が確認されていない）| chain-unnecessary（チェーン不要の可能性）| now-feasible（今なら成立し得る）| established（確立した知見）

- id: ins-permissionless-ext-unused
  title: 許可不要の拡張機構は、他人に使われる拡張を自動的には生まない
  gap_type: no-demand
  claim: >-
    コントラクトを誰でも追加できる世界（Biomes、Downstream、Primodium、PixeLAW、Sky Strife）では、拡張の「仕組み」は詳細に作られたが、
    第三者が作り、さらに別のプレイヤーが使った拡張の実例はほとんど確認できなかった。確認できた拡張の多くは運営チーム自身の作で、Downstream の外部作例 3 件（作者は Playmint 外、うち 1kx はシード投資家）も運営のリポジトリに取り込まれて配布され、本番で他のプレイヤーに使われた記録は見つからなかった。
    一方で、第三者の拡張が実際に広く使われたのは、拡張が「作った本人の勝利や効率」に直結する場合（Dark Forest のプラグイン・ボット）と、
    資産の参照が無料で配布が広い場合（Loot の派生）だった。
  conditions: >-
    他人の拡張が使われる条件として事例から読めるのは、(1) 拡張がプレイヤー自身の競争力を上げる道具である、(2) 使う側が鍵や資産を預けずに済む、
    (3) 拡張の作者に作る動機（勝利・報酬・名声）がある、(4) 使う側が十分な人数いる、の重なり。(4) を欠く小規模な世界では (1)〜(3) があっても使われない可能性がある。
  evidence:
    - {game: biomes, stance: support, note: "エクスペリエンス用リポジトリの PR は全 34 件が同一の開発者（dhvanipa）によるもので、唯一見つかった第三者の PR（Biocash）は未マージのまま open。", s: [src-biomes-experience-prs, src-biomes-biocash-pr]}
    - {game: downstream, stance: support, note: "外部作例 3 件の元の作者は Playmint 外（うち 1kx はシード投資家。Tonk・RockawayX との関係は未確認）だが、Playmint が公式リポジトリに取り込んで配布し、元リポジトリの最終更新はメインネット公開前だった。本番で他のプレイヤーに使われた記録は見つからない。", s: [src-downstream-advanced-tutorials, src-downstream-commits]}
    - {game: primodium, stance: support, note: "World Extension の文書は詳しいが、第三者が本番 World に登録した拡張の実例は確認できず、作例は自チームのもの。", s: [src-primodium-world-ext, src-primodium-bounty-example]}
    - {game: pixelaw, stance: support, note: "公開アプリは主に中核メンバーの作で、アプリ間の相互作用の実例も少ない。", s: [src-pixelaw-examples]}
    - {game: sky-strife, stance: support, note: "第三者拡張として挙がる大会・ダッシュボード・賭け市場の多くはオフチェーンのツールや人手の運営で、許可不要のオンチェーン拡張でしか成立しない例は特定できなかった。", s: [src-sky-strife-mainnet-blog]}
    - {game: dark-forest, stance: counter, note: "プラグインはコンテスト等を通じて多数作られ共有され、Lobbies で第三者が独自の宇宙を展開した。ただし主用途は自分の自動化・UI 改善で、他人のプラグインは鍵リスクのため公式が使用を戒めた。", s: [src-df-plugins-repo, src-df-plugins-contest, src-df-lobbies]}
    - {game: loot, stance: counter, note: "許可不要・無料参照の最小資産から約 1 か月で 100 を超える派生・ツールが生まれた（NonFungible。コミュニティ一覧には 95 件）。ただし派生は相互に接続せず、1 年後も主要な派生ゲームは開発・提案段階だった（Decrypt）。", s: [src-loot-nonfungible-2022, src-loot-resources, src-loot-decrypt-2022]}
    - {game: cryptokitties, stance: context, note: "KittyVerse の第三者拡張は、運営が規約変更と資金提供で促す必要があった。", s: [src-ck-betakit-kittyverse]}
  confidence: medium
  confidence_reason: >-
    「使われなかった」ことの証拠は主に GitHub の作者構成と公開事例の欠如で、利用回数の計測値はどの事例にもない（Redstone 停止でチェーンデータも参照困難）。
    観測できないだけの可能性があるため「高」にはしない。一方、5 つの独立した世界で同じ傾向が出ているため「低」でもない。
  alternative: >-
    拡張が使われなかったのは拡張機構のせいではなく、そもそも各世界のプレイヤー数が小さかった（あるいは運営母体の資金が尽きた）ためかもしれない。
    その場合、十分な人数がいる世界では同じ機構でも使われる可能性がある。
  experiment:
    design: >-
      既存のプロトタイプ（オフチェーンで可）に「他人が作った施設を使う」導線を 1 つだけ作る（例: 他プレイヤーの工場に原料を送って加工してもらう、手数料は作者へ）。
      作者側 3〜5 人・利用側 20〜30 人で 1〜2 週間回す。
    signal: 利用側プレイヤーのうち、自分で作れる状況でも他人の施設を 1 回以上使った割合と、その再利用率。作者が価格や仕様を変えた回数。
    kill: 他人の施設の再利用率が 10% 未満、または利用が作者の知人間に閉じる場合、「他人の機能の再利用」を中核に置く設計を見直す。
    cost: 小（オフチェーンの試作で可能。チェーンは不要）
  hypotheses: [hyp-owner-scoped-facilities, hyp-automation-league]

- id: ins-trust-boundary
  title: 他人のコードを使う障害は「信頼の境界」で、所有範囲・サンドボックス・ゲーム内コストで律する設計が試された
  gap_type: unsolved-gap
  claim: >-
    他者の拡張を使うとき問題になったのは、鍵や資産への権限、後からの仕様差し替え、悪意ある実装による妨害だった。
    これに対して、拡張の効力を作者の所有範囲に閉じる（Downstream）、UI 拡張をサンドボックス化する（Downstream）、拡張の防御をゲーム内の電池で維持させ他者が削れるようにする（Biomes）、
    相互作用を既定拒否のフックで調停する（PixeLAW）、操作権を取り消し可能な委任で貸す（Primodium）、という異なる解が並行して試された。どれが利用を増やしたかを示すデータはない。
  conditions: >-
    所有範囲に閉じる方式は他者への害を防ぐ代わりに「区画が孤立した部屋の集まり」になりやすい。既定拒否は安全だが後発の拡張が既存拡張の改修なしに参加できない。
    委任は柔軟だが取り消し可能性のため相手方が履行を信頼できない。信頼の問題と相互運用の広さはトレードオフになっている。
  evidence:
    - {game: dark-forest, stance: support, note: "プラグインが秘密鍵へアクセスできる設計で、公式リポジトリは自分か完全に信頼できる人のもの以外使うなと警告した。", s: [src-df-plugins-repo]}
    - {game: downstream, stance: support, note: "建物種別の所有者だけが実装を変えられ、UI プラグインは WebAssembly の JS エンジン内で動かす設計。", s: [src-downstream-plugin-rule, src-downstream-sandbox]}
    - {game: biomes, stance: support, note: "チップの取り外し拒否は電池が残る間だけ有効で、他者が叩いて電池を削れる。妨害されたくない行動では第三者コードを固定ガスで呼ぶ。", s: [src-biomes-chipsystem-2024, src-biomes-hitchip]}
    - {game: pixelaw, stance: support, note: "他アプリからの書き込みは既定で拒否し、名前で許可する。後発アプリは既存アプリの改修なしに相互作用できない。", s: [src-pixelaw-paint-app, src-pixelaw-core-pixel]}
    - {game: primodium, stance: support, note: "システム単位の委任で操作権を第三者コントラクトに貸せるが、委任はいつでも取り消せ、名前空間アクセスを渡すと資金引き出しの危険がある。", s: [src-primodium-access-control, src-primodium-footguns]}
    - {game: biomes, stance: counter, note: "運営は ROOT 権限でユーザーのフックを一括削除しワールドを作り直しており、最終的な信頼の置き場は運営だった。", s: [src-biomes-adminhook]}
    - {game: downstream, stance: counter, note: "報道は「god mode がない」と CEO の考えを地の文で言い換え、CEO 自身の寄稿も「digital physics are immutable」と書いたが、コード上 owner は Rule の追加と状態書き込み権の付与を保持していた。", s: [src-downstream-game-contract]}
    - {game: pixelaw, stance: counter, note: "呼び出し元アプリは呼び出し側が渡す値から読まれ、呼び出し元検査も実質的に働いていないように見えるため、名前で許可するフックが悪意ある呼び出しへの境界として働かない可能性がある（コード読解による推定。実行未確認）。", s: [src-pixelaw-core-actions, src-pixelaw-core-pixel]}
  confidence: medium
  confidence_reason: 設計上の解が複数存在することはコードで確認できる（事実）。どれが有効かは利用データがなく判定できないため、ここでの主張は「空白がある」ことに留める。
  experiment:
    design: >-
      同じ「他人の施設を使う」導線を 2 方式で作り比べる。A: 作者がいつでも仕様を変えられる（変更は通知のみ）。B: 仕様はバージョン固定で、利用者が明示的に新版へ移る。
      プレイヤーを 2 群に分けて 1 週間。
    signal: 他人の施設の利用率、利用継続率、作者による仕様変更の頻度、不満の報告数。
    kill: A と B で利用率に差がなければ、信頼の境界は当面の律速段階ではない（需要側の問題）と判断する。
    cost: 小〜中
  hypotheses: [hyp-owner-scoped-facilities]

- id: ins-host-dependency
  title: 「オンチェーンだから永続する」は、ホストチェーン・運営資金・外部依存の範囲でしか成り立たなかった
  gap_type: established
  claim: >-
    Redstone（Lattice が運営する L2）は Lattice の事業終了に伴い 2026-05-15 に停止し（告知は 2026-04-14 の X 投稿）、その上の Sky Strife と Downstream の世界は、移行の記録がないことから、ゲームの設計とは別に失われたとみられる（両ゲームの終了を明言した一次資料はない）。
    同じ Redstone 上の DUST（Biomes の後継）は運営が別チェーンへ移したが、「消せない」と掲げつつ移行先の自前チェーンの停止も告知した。逆に CryptoKitties の交配コントラクトは Ethereum 上で 2026 年も動いているが、
    外見の解釈・画像・UI はサーバー依存で、遺伝子計算は非公開の別コントラクトに差し替えられている。永続するのは「チェーンが残り、外部依存が要らない部分」に限られる。
  conditions: >-
    永続性を設計目標にするなら、(1) 運営と独立に存続する汎用チェーンを選ぶ、(2) 遊ぶのに必要なクライアント・インデクサ・乱数・アセットを誰でも再構築できる形で公開する、
    (3) 管理者の差し替え権限を放棄または限定する、の 3 つが揃う必要がある。専用 L2/L3 は手数料と性能の利点と引き換えにこの条件を弱める。
  evidence:
    - {game: sky-strife, stance: support, note: "Lattice の Winding Down 告知（2026-04）は Redstone の 2026-05-15 停止を告げたが、Sky Strife の扱いには触れていない。World が Redstone 上にあり、配信中のクライアントは参照日に応答しない Redstone の RPC を参照しているため、世界は失われたと判断される（推論。別チェーンへの移行の有無は未確認）。", s: [src-sky-strife-winding-down, src-sky-strife-redstone-claim, src-sky-strife-play-client]}
    - {game: downstream, stance: support, note: "メインネットの展開先は Redstone のみ（リポジトリの deployments）で、Redstone の停止（2026-05-15）後、世界と拡張は失われたとみられる。状態を別チェーンへ移した記録は見つからなかった。", s: [src-downstream-lattice-x, src-downstream-l2beat-redstone, src-downstream-repo]}
    - {game: biomes, stance: support, note: "「Can't be wiped」と掲げる同じページで DUST Chain の停止を告知。", s: [src-biomes-dust-site]}
    - {game: pirate-nation, stance: support, note: "専用チェーン（L3）の運営費を理由にチェーンを停止したと報じられた（月額は報道で食い違うが、1 チェーンあたりと合計の違いで説明し得る）。", s: [src-pn-bcg-kill, src-pn-bcg-shutdown-date]}
    - {game: loot-survivor, stance: support, note: "ルールが完全にオンチェーンでも、価格オラクル・VRF・インデクサ・ウォレットの外部依存が残り、価格が取れなければゲーム開始が失敗する。", s: [src-ls-code-lib15]}
    - {game: cryptokitties, stance: counter, note: "交配を含むトランザクションが 2026-10 にも確認でき、汎用チェーン上のコントラクトは運営の関心が薄れても動き続けている。", s: [src-ck-etherscan-txs]}
    - {game: biomes, stance: context, note: "DUST は Redstone 停止前の 2026-04-06 に、同じワールドアドレスのまま DUST Chain へ移行した。チェーン停止で世界が失われるかは、移行を担う運営がいるかに左右される（ただし移行先も 2026-12-31 の停止を告知）。", s: [src-biomes-migration-2026, src-biomes-worlds-json, src-biomes-dust-site]}
    - {game: conquest-eth, stance: context, note: "汎用チェーン（Gnosis Chain）上で 2022 年から版を重ね、コントラクトは残っている。ただし 2025-1 版のイベントログは 2025-10 以降ほぼゼロで（dormant）、「残る」ことと「遊ばれ続ける」ことは別だった。", s: [src-conquest-repo, src-conquest-gnosis-logs]}
    - {game: dark-forest, stance: context, note: "公式開発が休止しても、コードと Lobbies により第三者が遊び場を作れる状態が残った。", s: [src-df-lobbies, src-df-summer-break]}
  confidence: high
  confidence_reason: >-
    ホストチェーンの停止・停止告知（Redstone、DUST Chain、Pirate Nation の L3）は一次資料で複数確認でき、反例も「汎用チェーン＋外部依存の少ない部分」という条件で説明できる。
    ただし Sky Strife・Downstream の世界が失われたこと自体は、移行記録がないことからの推論で、ゲーム側の終了告知はない。
  experiment:
    design: >-
      自分の設計について「運営が明日いなくなったら何が残るか」の依存表を作る（チェーン、シーケンサ、インデクサ、乱数、クライアント、アセット、管理鍵、AI 推論）。
      各項目に「第三者が再構築できるか」「必要な費用」を書き、1 つの項目を実際に第三者（または別マシン）で再構築してみる。
    signal: 再構築できた項目の割合と所要時間。
    kill: 永続性を売りにする場合、再構築できない必須項目が 1 つでも残るなら、その主張を外すか設計を変える。
    cost: 小
  hypotheses: [hyp-offchain-first]

- id: ins-public-state-automation
  title: 公開状態＋換金可能な報酬の組み合わせは、自動化・計算資源・熟練集団の競争に収束する
  gap_type: established
  claim: >-
    状態が公開され、報酬が換金できるとき、最適化は人間の判断よりボットと計算資源に有利になった。Huntercoin では数千体規模のボット軍団の衝突が証言され、
    Dark Forest では GPU による地図探索と自動化を持つ集団が上位を占め続け、Fomo3D はブロック詰めで決着し、Sunflower Land と Pixels はボット対策を経済設計の中心に置いた。
  conditions: >-
    成り立つ条件は「状態の公開」「換金可能性」「自動化の費用 < 報酬」の 3 つ。どれか 1 つを外すと弱まる: 秘匿（ZK）は計算力の競争に置き換わるだけだった一方、
    換金不能化や換金直前の本人性ゲートはボットの採算を下げた。逆に Dark Forest のように自動化を公認して「ツール作り」を遊びにする道もある。
  evidence:
    - {game: huntercoin, stance: support, note: "開発者は 2 人のプレイヤーがそれぞれ数千体規模のボット軍団を戦わせていたと述べた。", s: [src-huntercoin-bgamer-2018]}
    - {game: dark-forest, stance: support, note: "GPU 探索・地図データの売買が現れ、同一集団（orden_gg 系）が複数ラウンドで上位を占めた。", s: [src-df-r3-wrapup, src-df-r5-wrapup]}
    - {game: fomo3d, stance: support, note: "第 1 ラウンドは時間切れ直前のブロック空間の占有で決着したと Solmaz のブロック単位の分析が解釈し、SoK 論文も攻撃として分類した（SoK は Solmaz・SECBIT 等を引用しており独立の分析ではない）。", s: [src-fomo3d-solmaz, src-fomo3d-sok-frontrunning]}
    - {game: sunflower-land, stance: support, note: "前身 Sunflower Farmers の 2022-01 の Polygon 混雑はボットの大量取引と重なったと報じられた（旧作が「ほぼ全行動を取引」とする資料と「ローカル状態を定期同期」とする Naavik で設計の記述が食い違う）。", s: [src-sunflower-land-w3igg, src-sunflower-land-decrypt-polygon]}
    - {game: pixels, stance: support, note: "報酬対象を絞った直後に日次ウォレットが約 7 割減り（見出しは 69%、本文の数値では約 72%）、運営 CMO はボット除去と説明した。その後の回復はボットの適応と GamesTX が推測している。", s: [src-pixels-bg-ch2-drop, src-pixels-gamestx-2m]}
    - {game: dark-forest, stance: counter, note: "自動化を禁止せず、得点規則をラウンドごとに変えることで、ツール作りそのものを競技として受け入れた。", s: [src-df-gameplay-policy]}
    - {game: loot-survivor, stance: counter, note: "乱数の予測可能性を隠さず、先読みをパズルとして公認した（ただし入力を操作できると破綻し修正された）。", s: [src-ls-commit-prescience]}
    - {game: dark-forest, stance: counter, note: "v0.6 R1 の 2 位はほぼ手動で、外交により地図データと同盟を集めたと公式は記す。上位が自動化と計算資源だけで決まったわけではない。", s: [src-df-r1-wrapup]}
  confidence: high
  confidence_reason: >-
    時代・チェーン・ジャンルの異なる 5 事例で一次資料（開発者証言、公式報告、コード、運営の対策）が揃っている。反例は条件の外し方として説明できる。
    ただし Fomo3D の分析は相互に引用し合っており、Sunflower Land の旧作の設計は資料間で食い違う。
  experiment:
    design: >-
      試作の 1 シーズンで、公式のボット API を公開し「ボット部門」と「人間部門」を分ける。報酬は換金不能のランキングのみ。
    signal: ボット部門の参加者数、人間部門の離脱率、両部門をまたぐプレイヤーの割合。
    kill: 人間部門の離脱が初週で過半なら、公開状態で人間とボットを同じ盤面に置く設計は再考。
    cost: 小
  hypotheses: [hyp-automation-league]

- id: ins-reward-metrics-misread
  title: 換金可能な報酬がある期間の DAU・ウォレット数は、遊びの需要を測っていない
  gap_type: established
  claim: >-
    Axie Infinity では運営自身がアカウント分割が効率的だったと書き、Pixels では報酬改定の直後に日次ウォレットが約 7 割減った。STEPN でも第三者推定（Dune）の月間利用者数が数か月で 9 割以上減った。
    報酬がある期間の利用指標は、遊びの需要と報酬目的の参加・多重アカウント・ボットの和であり、改定前後の差でしか上限が推定できない。
