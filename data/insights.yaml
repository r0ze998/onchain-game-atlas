  experiment:
    design: 試作の 2 シーズン目に、1 シーズン目の上位者と新規参加者の成績差を測る。新規向けの別ランキングを入れた版と入れない版を比べる。
    signal: 新規参加者の上位 10% 入り率、2 シーズン目の新規の離脱率。
