- id: ins-long-season-shrinks
  title: 長期の永続世界・文明 MMO は、短いラウンドや試合形式に縮んでいった
  gap_type: unsolved-gap
  claim: >-
    Realms: Eternum は数週間のシーズンを掲げたが S0 は開始から 2 週間余りで優勝が発表され、S1 もコミット履歴から 3 週間程度で決着したとみられ、その後 60 分の Blitz と日替わり形式へ移った。
    Primodium のチームは予測市場型の短いラウンド（Empires）へ、Sky Strife は試合型だが試合の供給が課題だった。長期の世界で新規参入者が遊び続けられる設計は、オンチェーンでは未解決のままである。
  conditions: 到達型の勝利条件と集団間格差がある世界では、決着が早まり後発・少数の遊ぶ期間が短くなる。逆に勝利条件を持たないサンドボックス（Sunflower Land、DUST）では長期継続の例がある。
  evidence:
    - {game: realms-eternum, stance: support, note: "S0 は 2024-12-11 開始・12-27 に優勝発表、S1 はコミット履歴から 3 週間程度で終了したとみられる（S1 の公式終了告知は未確認）。以後長期形式の公開シーズンは確認できず、運営は 60 分の Blitz と日替わりの Frontier に移った。", s: [src-realms-eternum-x-s0-champions, src-realms-eternum-git-history, src-realms-eternum-readme]}
    - {game: primodium, stance: support, note: "チームはより単純なターン制・予測市場型の Empires と、オンチェーンゲーム以外の製品へ移った。", s: [src-primodium-empires-docs]}
    - {game: sky-strife, stance: support, note: "無料試合が出るまで何時間も待つという不満に告知自体が触れており、試合の供給が課題だった可能性。", s: [src-sky-strife-autonomous]}
    - {game: conquest-eth, stance: support, note: "終わりのない「無限ゲーム」を掲げたが、2025-1 版のイベントログは公開直後に集中し、2025-10 以降はほぼゼロになった。", s: [src-conquest-repo, src-conquest-gnosis-logs]}
    - {game: sunflower-land, stance: counter, note: "勝利条件のない農業サンドボックスとして 2021 年から 2026 年までリリースが続いている。", s: [src-sunflower-land-git-history]}
    - {game: axie-infinity, stance: counter, note: "Origins の 60 日ごとの競技シーズンが 2026-09 の Season 19 まで続いている（世界の永続ではなくシーズン制の継続）。", s: [src-axie-blog-origins-s19]}
    - {game: dark-forest, stance: context, note: "1〜2 週間のラウンド制で運営し、ラウンドごとに得点規則を変えた。", s: [src-df-gameplay-policy]}
  confidence: medium
  confidence_reason: 形式の縮小は一次資料で確認できるが、その理由（需要・費用・運営判断）は事例ごとに十分に説明されていない。
  alternative: 縮小は需要ではなく、チェーンの費用・負荷や運営の資金事情による可能性がある。
  experiment:
    design: 同じルールで「2 時間」「3 日」「2 週間」の 3 つの長さのシーズンを試作し、後発参加者（開始から 30% 経過後に参加）の体験を比べる。
    signal: 後発参加者の完走率、上位との差の推移、再参加意向。
    kill: 2 週間形式で後発参加者の完走率が 2 時間形式の半分未満なら、長期形式には追い上げ機構が必須。
    cost: 中
  hypotheses: [hyp-short-season-civ]

- id: ins-minimal-primitive
  title: 最小限の資産を公開すると派生は速く集まるが、つながらず、価値は「語彙」に残った
  gap_type: unsolved-gap
  claim: >-
    Loot は統計値も絵もルールもない 8 語の袋を無料請求で配り、約 1 か月で 100 を超える派生を集めた。しかし派生は相互に接続せず、月間取引高は 2021-09 から翌月に 95% 減った（同時期に NFT 市場全体も冷え込んだ）。
    後に作られた派生ゲームの Loot Survivor は Ethereum 上の袋の保有を参加条件にせず、装備体系を Starknet で再実装した。再利用されたのはコントラクトよりも世界観の語彙だった可能性がある。
  conditions: 派生がつながるには意味の合意（ステータスの解釈、共通の進行）を調停する仕組みが要る。無料の参照と広い初期配布は派生の数を増やすが、深さは保証しない。
  evidence:
    - {game: loot, stance: support, note: "許可不要の最小資産から 100 超の派生・ツール（NonFungible、2022-01）。コミュニティ一覧には 95 件（未監査）。", s: [src-loot-nonfungible-2022, src-loot-resources]}
    - {game: loot, stance: support, note: "1 年後の振り返りでも Realms: Eternum はテスト段階の手前、Loot 2 は提案段階で、派生の各利用者数は示されていない。", s: [src-loot-decrypt-2022]}
    - {game: loot-survivor, stance: support, note: "Loot の装備語彙を Starknet のコントラクトで再実装し、参加料は LORDS で払う（Ethereum 上の袋の保有は参加条件ではない）。", s: [src-ls-code-lib15]}
    - {game: loot, stance: counter, note: "保有ウォレット数は 2022-01 の 2541 から 2026-10 の 2326 へと大きく減っておらず、収集・記念として残る層がいる。", s: [src-loot-nonfungible-2022, src-loot-etherscan-token]}
    - {game: loot, stance: counter, note: "同じ 2021-09 に CryptoPunks・BAYC・Art Blocks でも週次取引高が 44〜82% 減っており、取引高の急減は最小プリミティブの設計ではなく市場全体の冷え込みでも説明できる。", s: [src-loot-theblock-2021-09]}
  confidence: medium
  confidence_reason: 派生の数と取引の減少は資料で確認できるが、派生が「つながらなかった」原因の切り分けは分析で、取引高の減少には市場全体の要因も重なる。
  experiment:
    design: "自分のゲームの 1 つの要素（例: 資源の種類と名前だけ）を公開仕様として出し、外部の 2〜3 人に別の小さな遊びを作ってもらう（チェーン不要）。"
    signal: 作られた派生が元のゲームの状態を読むか、名前を借りるだけか。
    kill: 名前を借りるだけなら、状態の共有ではなく世界観の公開で十分。
    cost: 小
  hypotheses: [hyp-owner-scoped-facilities]

- id: ins-ownership-layer-only
  title: 多くの事例でチェーンが必要だったのは「所有・換金」の層だけで、遊びはサーバー側に戻った
  gap_type: chain-unnecessary
  claim: >-
    Pixels はソフト通貨をオフチェーンに置き、2026 年には報酬を中央集権的な仕組みに移して法定通貨やギフトカードで換金させる方針を CEO が示した。Sunflower Land の遊びの大半はウォレットなしで成立し、
    ボット対策・季節トークン・手数料設計はすべてサーバー側にある。CryptoKitties の運営は Ethereum の制約から別チェーン（Flow）を作り、次の主力製品はカストディ型だった。
    これらでは、チェーンは主に換金経路として働き、その換金経路がボットを呼ぶ原因にもなっていた。
  conditions: ルールの検証可能性・運営不在での継続・第三者の許可不要の参加が価値の中心でないなら、チェーンは所有・決済の層に限るか、不要と判断できる。
  evidence:
    - {game: pixels, stance: support, note: "CEO は報酬を中央集権的な Stacked に移し、USDC・ギフトカード・PayPal で換金できるポイントにすると述べた（予定）。新作は当初 web3 資産なしと報じられた。", s: [src-pixels-bg-stacked]}
    - {game: sunflower-land, stance: support, note: "遊びの大半はウォレット不要で、出金にだけ顔認証と評判段階を課す。", s: [src-sunflower-land-docs-collectibles]}
    - {game: cryptokitties, stance: support, note: "運営は Ethereum では規模に耐えないとして Flow を作った。", s: [src-ck-cointelegraph-flow-2020]}
    - {game: gods-unchained, stance: support, note: "カードの所有はチェーン上だが、対戦のルールはサーバーで処理される。", s: [src-gu-mittr-2019]}
    - {game: dark-forest, stance: counter, note: "ルールがコントラクトにあったことで、誰でも Lobbies で自分の宇宙を展開できた。", s: [src-df-lobbies]}
    - {game: loot-survivor, stance: counter, note: "参加料の分配・大会の精算・保守処理を誰でも呼べる関数にし、運営サーバーなしでゲームが進む構造を作った。", s: [src-ls-code-lib15]}
  confidence: high
  confidence_reason: 運営自身の方針転換と、ゲームの仕組みがサーバー側にあることが一次資料・コードで確認できる。
  experiment:
    design: 自分の設計の機能一覧に「チェーンでなければ成立しない理由」を 1 行ずつ書き、理由が書けない機能をすべてオフチェーンに移した版を作る。
    signal: 移した後に失われた遊びがあるか（プレイテストで確認）。
    kill: 失われるものがなければ、チェーンは所有・決済・公開ログの層に限定する。
    cost: 小
  hypotheses: [hyp-offchain-first]

- id: ins-veteran-concentration
  title: 公開された競争世界では、同じ熟練集団が回をまたいで勝ち続けやすい
  gap_type: unsolved-gap
  claim: >-
