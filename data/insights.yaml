    - {game: loot-survivor, stance: support, note: "エントロピー更新を誰でも呼べる関数にしたが、呼び出しのタイミングで結果を選べる問題が論点になった。", s: [src-ls-commit-entropy-rotation]}
    - {game: fomo3d, stance: counter, note: "攻撃以前から購入意欲が落ちていたとする資料があり、決着の形式より構造の天井が先にあった可能性。", s: [src-fomo3d-inside]}
    - {game: conquest-eth, stance: context, note: "艦隊の移動をコミット・リビールで秘匿する無期限戦略ゲーム。", s: [src-conquest-handbook]}
